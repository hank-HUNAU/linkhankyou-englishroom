 called the Muisca.":"埃尔多拉多最初是一个人的名字，他是古代哥伦比亚社会穆伊斯卡人的统治者。","He covered himself in gold powder every day.":"他每天都会把金粉涂在身上。","There were legends in which people imagined that the whole city was made of gold.":"在一些传说里，人们想象整座城市都是黄金做的。","Our final mythical land is an island called Thule.":"我们要说的最后一个神话之地是一个叫图勒的岛。","The legend says that it is in the north of the Earth, somewhere between Norway and Iceland.":"传说它在地球北部，位于挪威和冰岛之间的某个地方。","This is an area of the world that is completely dark for a lot of the year.":"这是世界上一年中很多时间都完全黑暗的地区。","But the story goes that Thule is a place where a lot of delicious food grows and people are always happy.":"但故事里说，图勒是一个能长出很多美味食物、人们总是很快乐的地方。","The Roman poet Silius Italicus wrote about Thule.":"罗马诗人西利乌斯·伊塔利库斯写过图勒。","In his story, the people living there are painted blue.":"在他的故事里，住在那里的人都被涂成蓝色。"},"LEVEL":{},"TOPIC":{},"TRAP":{},"ENTITY":{},"ENTITYMULTI":{},"BASE":{},"TITLE_START":{},"SPE":{}};

/* ===== p69 听力对话 (无原文画像并入) ===== */
DB.ZH["Hi, Julia. It's me, Mike."]="嗨，朱莉娅。我是迈克。";
DB.ZH["Hi, Mike. How's it going?"]="嗨，迈克。你好吗？";
DB.ZH["Do you want to go cycling later today?"]="你今天晚些时候想去骑车吗？";
DB.ZH["Go cycling? Good idea. What time?"]="骑车？好主意。几点？";
DB.ZH["How about after lunch? Say, two o'clock?"]="午饭后怎么样？比如说两点？";
DB.ZH["Two o'clock? No, sorry, I can't. I've got a taekwondo lesson at two."]="两点？不了，抱歉，我去不了。我两点有跆拳道课。";
DB.ZH["OK, how about three o'clock?"]="好，那三点呢？";
DB.ZH["No, the lesson only finishes at half past three."]="不行，课要到三点半才结束。";
DB.ZH["OK, so how about four o'clock?"]="好，那四点呢？";
DB.ZH["I can't. Mum wants to give me a tennis lesson at four."]="我去不了。妈妈四点要给我上网球课。";
DB.ZH["Until what time?"]="到几点？";
DB.ZH["I'm not sure. Maybe about quarter to five?"]="我不确定。大概差一刻五点？";
DB.ZH["Really? But we can't go cycling then. It gets dark at half past four."]="真的吗？那我们就不能骑车了。四点半就天黑了。";
DB.ZH["Well, yes, you're right. Sorry."]="嗯，是啊，你说得对。抱歉。";
DB.ZH["So maybe we can go cycling before lunch?"]="那我们也许可以在午饭前去骑车？";
DB.ZH["Umm, I've got a school rugby match until about half past eleven."]="嗯，我有一场学校橄榄球比赛，要到十一点半左右。";
DB.ZH["What time does it start?"]="几点开始？";
DB.ZH["Ten o'clock."]="十点。";
DB.ZH["Julia, it's quarter to ten now."]="朱莉娅，现在已经十点差一刻了。";
DB.ZH["Really? I need to go. Let's go cycling tomorrow."]="真的吗？我得走了。我们明天去骑车吧。";
DB.ZH["OK. Call me in the morning. See you. Have a good match."]="好。早上给我打电话。再见。祝你比赛顺利。";

var BOOK={"12":{"u":"Unit 1","audio":"../assets/tk1_p012.mp3","title":"Quiz: Do you enjoy life?","arts":[["Do you enjoy life?","Do your parents always ask you to do housework?","Does your teacher give you homework every day?","Life is sometimes difficult because there are lots of things to do.","It's great to be busy, but it's important to look after yourself and have fun, too.","We all need to think about ourselves and do things we like, whether it is playing an instrument or taking photos.","But we also need to do things that keep us healthy and happy.","Here's our quiz.","Try it and find out: do you have lots of fun?"],["Do you laugh a lot?","Yes, I laugh all the time.","I only laugh when I'm happy.","My best friend says I don't laugh very often."],["How many hobbies do you have?","I have lots of hobbies.","One.","I don't have any hobbies."],["When do you listen to music?","In the morning, afternoon and evening.","I only listen to music when I have time.","I never listen to music.","I don't have time."],["How many hours do you sleep a night?","9-10 hours.","About 8 hours.","Less than 8 hours."],["Do you like doing exercise?","Yes, exercise is fun.","Some exercise is OK, but not everything.","I don't like exercise at all."],["Do you like word and number puzzles?","I like puzzles a lot.","Word puzzles are OK, but number puzzles are boring.","No, I don't like puzzles at all."],["Which of these activities do you do most?","Spend time with friends and family.","Message friends online or on my phone.","Watch TV or play games on my phone."],["Your score.","Mostly As: Wow! You know how to have fun and enjoy life.","Mostly Bs: Hmm, OK, but can you do more? Try and find more time for yourself.","Mostly Cs: Try and find more ways to have more fun."]]},"15":{"u":"Unit 1","audio":"../assets/tk1_p015.mp3","title":"1.04","arts":[["Ben! Why don’t you have a rest and stop playing for a while? I’ve got homework. Ben!","What’s up, Sally?","I’ve got English and Geography homework. And you’re playing the guitar – badly!","Well, it’s my hobby and I have a good time when I practise. I love it.","Sure. But right now?","Well, yes! I’m practising now, then I can do my homework later.","Well, can you do your homework now, please? The same time as me? And then practise the guitar later?","Erm … well, yes, why not? But help me with my Maths homework, OK?","Oh, all right!"],["Mum, can I take judo lessons?","Judo? Really? What for?","Well … it’s good exercise, and some of my friends are learning judo, too.","I think it’s a great idea.","Really? Judo for girls?","Mum!!","Yes, a friend of mine at work does judo. She loves it and she says it’s very good for making her strong and keeping her healthy.","That’s right, Dad. And maybe I can make some new friends, too.","Oh. Well. OK.","Thanks, Mum! Thanks, Dad!"],["Jade! I think that’s kung fu, not judo!","Harry! It’s time for dinner.","Come on, Harry. Dinner’s ready.","Just a minute, Mum. I’m finishing something.","Harry, it’s dinnertime. Come and eat, we’re having dinner!","OK, Mum.","You’re always on your phone. Playing games.","No, not games, Mum. Puzzles. I’m doing a crossword.","A crossword? Oh, I hate crosswords. They’re too difficult.","I love them. They’re great exercise for my brain.","Are they? Well, OK. You know, you have to look after your brain, right?","That’s right. Just like you look after me, Mum."]]},"16":{"u":"Unit 1","audio":"../assets/tk1_p016.mp3","title":"Blog: What do you do in your free time?","arts":[["What do you do in your free time?","OK, we know you all like watching TV and playing computer games, but we want to know some of the other things you do when you've got some free time.","Right, and let us know."],["Hermione.","I love cats!","I like watching cat videos on YouTube every day.","I love taking photos of them, too, cats that I see when I'm outside - I try to get photos of lots of different kinds.","And I collect things with cats on them - you know, cards or notebooks or T-shirts, things like that.","But we can't have cats at home because my dad can't stand them!"],["Andy.","I can't stand having nothing to do - for example, when I wait for the bus or in the queue at the fast food place - so I always have my puzzle app on my mobile.","Sometimes it's Sudoku, sometimes a crossword or different word game, but it doesn't matter - I just love doing puzzles.","And it's great because I never get bored."],["Natalie.","I'm usually busy, but occasionally I've got a bit of free time, especially in the evening after I do my homework.","My favourite thing is looking at maps online.","I like using 'street view' and I imagine myself walking in a street somewhere.","My dream is to go to New York, so I often 'walk' in the streets there.","I try and visit a different place in the world at least once a week."],["Lucy.","I don't really like sport - I hate running and doing exercise and all that - but I'm crazy about the New Zealand rugby team, the All Blacks.","It's because my uncle and aunt live there and they love rugby, so I watch the games and collect anything I can about them!","I have a book that I put photos and newspaper articles in.","Once a week my uncle and I talk on the internet about the All Blacks - I love that!"]]},"20":{"u":"Unit 2","audio":"../assets/tk1_p020.mp3","title":"Messages: Mike and Hannah","arts":[["Hi, Hannah. What are you up to?","Hey, Mike. Nothing much. I’m at home.","I’m watching some TV, but it’s not very good.","I don’t want to do my homework!","How about you?","I’m in town. Shopping.","I’m looking for a new jacket. Do you like this one? It’s £20.","Erm. It’s OK. It looks a bit old-fashioned though.","Which shop are you in?","Tell me you’re not looking for clothes in that old place in Green Street.","Hah! Of course I am!","You know I always like to buy my clothes here.","But their clothes are all second-hand.","And that means they’re old-fashioned.","I like the clothes here – they’re really cool and they’re cheap.","I’m not rich like you, you know!"],["Me? Rich? You’re joking of course. Hahaha.","Go to Barker’s next to the big chemist’s in Market Street.","They’ve got a sale on.","They’re selling everything at 30% off the original price!","And their stuff’s really nice.","I’m wearing one of their T-shirts now. Only £9.99!","Yeah, that’s cool. And 30% off? Brilliant.","OK, I’m going there now. Oh no!","Now it’s raining and I haven’t got an umbrella.","OK, it’s not far. Five minutes and I’m there."],["Moments later.","OK, here I am in Barker’s.","The shop’s really crowded. It’s because of the sale, I guess.","Maybe my mum’s there. She’s doing some shopping at the moment.","So … anything nice?","Yeah! Look at this shirt! Only £25! I want it!","Mike, are you crazy? It’s awful.","No, it’s not.","I love wearing bright colours.","They make me feel happy. It’s perfect for a rainy day.","I think you’re wasting your money and my time.","Anyway – are you looking for a jacket or a shirt?","Oh yes, you’re right. You’re better at clothes than me.","Come and help me. You’re not doing anything, are you?","That sounds like a bad idea. It’s raining – remember?"]]},"23":{"u":"Unit 2","audio":"../assets/tk1_p023.mp3","title":"Listening: Shopping conversations","arts":[["Hello. Can I help you?","Hi. Yes, where can I find toothbrushes?","They’re just there on your right.","Oh yes. I didn’t see them. OK, I’ll take this one.","Is that all?","No, there’s this toothpaste, too.","OK. So that’s £4.30.","Here you are.","And that’s 70p change. Have a nice day.","Thank you."],["Are you all right there?","Yes, thanks. I just want a cover for my new phone. Have you got this one in red?","Sorry, only black.","OK, black’s fine. I’ll take it.","Right. That’s twelve ninety-nine please.","Can I pay with my contactless card?","Of course. Just place it over here.","OK.","Great. That’s gone through. Would you like your receipt?","No, it’s OK."],["Do you need any help?","Hi. These trousers – can I try them on, please?","Sure. What size do you take?","Not sure. 28 or 30.","And do you want them in red? We’ve got other colours, too.","Yes, I saw them but it’s the red ones I’m interested in.","No problem. So why don’t you try both sizes? The changing rooms are in the corner.","Thanks!"],["Can I help you?","Yeah. These football socks. How much are they? I can’t find the price.","Just a moment. They’re eight ninety-nine.","Fine. I’ll take them.","OK, is that cash or card?","Cash.","That’s great and here’s your change and receipt.","Thanks."]]},"24":{"u":"Unit 2","audio":"../assets/tk1_p024.mp3","title":"Web forum: It’s Sunday afternoon","arts":[["It’s Sunday afternoon. What can I do?","Annie 7 May","It’s Sunday afternoon. The last hours of the weekend before school starts again.","This time is valuable, but I’m sitting here with nothing to do and no money to spend!","So I need ideas for things to do.","Important: they need to be fun and free.","I’m asking for help because time is running out!"],["Austin08 (Five minutes ago)","Go for a walk. I always go for a walk on Sunday. I like going on my own.","It’s the perfect time to think about all the things I don’t normally have time to think about and I never think about things I need to do.","I like forgetting all about them just for a few hours every week."],["MonsterMunch4342 (20 minutes ago)","I’m writing my weekly poetry blog post. Well, I was – now I’m writing to you.","I upload a post every Sunday.","At the moment, I’m finishing poem number 15. Five more to go!","Maybe you don’t want to write a poem or even a blog, so try a story.","Go on – use your imagination!"],["Cool656Carl (25 minutes ago)","I’m lucky. I live in Liverpool and we have the best museums and they’re all free.","They’re too big for just one visit, so one Sunday every month I go and check out a different room.","Today it’s the insect room – I want to see what unusual bugs they have!"],["SillyMilly (32 minutes ago)","Read something. Sunday is my reading day.","I read for at least four hours on a Sunday – books, magazines, websites, newspapers – anything.","It’s free and best of all – you can do it anywhere.","And sometimes, when I’m really lucky, Dad brings me a drink, too."]]},"26":{"u":"Unit 2","audio":"../assets/tk1_p026.mp3","title":"Culture: Banknotes","arts":[["These days, we use credit cards more and more and they all look almost identical.","But money is still with us, in coins and banknotes.","The designs are different and all over the world we can see examples of really interesting and beautiful banknotes.","The designs usually celebrate the country – its history, its geography, its animals and birds.","Here are some examples of banknotes from different parts of the world."],["Mexico","In Mexico the currency is the peso.","The smallest banknote is 20 pesos, and the biggest is 1,000 pesos.","One side always has the face of a famous person from Mexican history and the other side has well-known places in the country.","On the $500 note there is a portrait of the famous Mexican artist Frida Kahlo."],["Europe","Many countries in Europe use the euro, but the banknotes are exactly the same for each country.","On one side, there is a picture of a gate, window or entrance, and on the other side, a bridge.","The pictures represent different kinds of architecture from all over Europe."],["Turkey","In Turkey the currency is the Turkish lira, and there are six different banknotes.","Each one shows Kemal Atatürk, the founder of the Turkish republic, on the front side, and another famous figure from Turkish history on the other side."],["Brazil","The currency in Brazil is the real (plural, reais).","The notes are in different colours, but they all have a picture of the Effigy of the Republic (a national symbol of Brazil) on one side, and various animals, birds and fish on the other side.","One of the most beautiful is perhaps the R$50 note, which has a picture of a jaguar."]]},"30":{"u":"Unit 3","audio":"../assets/tk1_p030.mp3","title":"Online article: Creepy crawlies","arts":[["The number of people in the world is growing fast – every year there are about 70 million more people.","So, we've got two questions that need answers: Have we got enough space on our planet for so many people? And how can we make sure they've all got enough food to live?"],["Many people eat too much meat – steaks, beef burgers, sausages, etc.","That's not good for us and we need big farms to produce all that meat.","The farms already use 30% of all the world's land: they create greenhouse gases and use a lot of water and energy."],["However, we can do something to help.","We can eat meat only one or two days a week, for example, and eat more vegetables – that's healthy.","We can also eat some different types of meat – creepy-crawlies!","That's right, grasshoppers, worms, flies and lots of other insects.","They're the superfood of the future."],["They've got a lot of protein.","Protein is very important for our health, and it's good for our hair and our skin.","Protein keeps our muscles and bones in good condition, too.","There are two more reasons why insects are good food options: insect farms don't need so much water and energy.","Also, they don't use so much space."],["For some people in countries in Asia and Latin America, eating insects is not unusual.","But for people in Europe and many other countries, it seems very strange.","What about you?","Do you eat any healthy food?","How much meat do you eat in a week?"],["Perhaps you think you don't eat insects?","But maybe you're wrong!","Why's that?","Because the red food colouring that is in many things that we eat comes from … an insect called the 'cochineal beetle'!","Thank you for watching."]]},"33":{"u":"Unit 3","audio":"../assets/tk1_p033.mp3","title":"Listening: In a café ordering food","arts":[["Hello. Can I help you?","Yes, I’d like a cheese and tomato roll, please.","Do you want the roll hot?","Yes, please.","Would you like something to drink?","Yes, I’d like an apple juice, please.","So that’s a roll and an apple juice. Is that all?","Er, I’d like some carrot cake, too.","OK, that’s £8 altogether.","Here you are.","And that’s £2 change. The roll will be a few minutes. We’ll bring it to your table.","Thank you."],["Enjoy your meal. And what can I get for you?","I’d like the chicken and mushroom soup, please, and an apple juice.","OK. Anything else?","No, I think that’s all.","What! No cake? But you said …","I’m trying to be good. I only buy cake at the weekends.","Really?","Yes, I’m being careful with what I eat. Have you got a problem with that?","No, not at all."],["OK, that’s £6.50.","Can I pay by card?","Of course. Just put it in here.","It’s done.","Thanks. We’ll bring the soup over in a minute or two.","Could you bring me a fork with it, too?","Sure.","A fork? What do you need a fork for? You can’t eat soup with a fork.","I’ve got my reasons. Don’t you worry about it."],["Moments later …","Well, you’re right. This is a good roll. How’s the soup?","Delicious. Would you like to try some?","No, I’m OK. My cake looks fantastic, doesn’t it?","Yes, it does. Mmmmm … it tastes fantastic, too!"],["Hey, what are you doing?","Mmmmm. That is a good cake!","But you said, cake only at the weekends.","I said I only buy cake at the weekends.","And?","Well, you bought this cake. I’ve got no problem eating your cake.","And that explains the fork.","Yes, it does. Now hurry up and finish your roll before I eat all your cake."]]},"34":{"u":"Unit 3","audio":"../assets/tk1_p034.mp3","title":"Online blog: Eating around the world","arts":[["Hello, I'm Matt Silver, and this is an article from our new series 'Eating around the world'.","I'm writing this from Kulusuk, an Inuit village in Greenland.","It's a pleasant place in summer, with mild temperatures and fantastic views of the icebergs on the sea just in front of the village.","It's a popular place for tourists in those months.","But winters are long and hard, and the life for the 250 people in the village isn't easy at all."],["The roads are covered in ice, and the sea is frozen, too.","The Inuits don't have a lot of choices for food.","The summer is too short and not long enough for the Inuits to grow vegetables.","They sometimes find berries during the warmer months.","And they eat seaweed.","But there are no other vegetables, so they don't eat enough greens.","There is a shop in the village, but during the winter it doesn't get any fresh vegetables."],["This is why the Inuits eat lots of raw and boiled meat.","They eat sea animals – seals, whales and fish – and they eat reindeer and other land animals.","These animals have a lot of fat on them because it keeps them warm in the freezing temperatures."],["Do the Inuits eat too much fat?","Isn't that very dangerous?","Well, here's the surprise: in the western world, people say 'Don't eat too much fat!'","But the Inuits eat a lot of animal fat and they are healthy, perhaps because they eat boiled rather than fried meat.","Life for the people from Kulusuk can be difficult but they are healthy.","Maybe we can learn a lot from them!"]]},"38":{"u":"Unit 4","audio":"../assets/tk1_p038.mp3","title":"Blog: Old films, great families","arts":[["I love old films and my family loves them, too.","My mum and dad always talk about a really old film called Swiss Family Robinson, also a book, about a Swiss family who find themselves on a desert island when their boat sinks.","And do you know what?","I like it, too.","So guys – here’s today’s topic.","Old films about families.","So you know my opinion, what about yours?"],["How about the Home Alone films in the 1990s, all about 8-year-old Kevin McCallister?","The first one is definitely the best.","Kevin’s parents forget to take him on the family Christmas holiday.","Kevin is happy at first because he’s got the whole house to himself and his brothers and sisters aren’t there to annoy him.","He has lots of fun stopping two silly criminals from robbing the family home.","But he starts to miss his family and on Christmas morning he gets the best present of all – everyone comes back home!","It was funny then and it’s still funny now."],["Whose favourite family is the Parrs in The Incredibles?","Remember them?","The Parrs are like most families.","You know, they fight and argue and have fun.","But they’re also a family of superheroes.","Dad is super strong.","Mum is super stretchy.","Violet, their eldest child, can turn invisible, and then nobody can see her.","Her younger brother Dash is super fast and her baby brother Jack-Jack has laser eyes.","I think those films are great, old or not."],["I like your comments, Max and Emma.","And here is mine.","The Addams Family!","They’re a really strange family who live in a normal town.","They all wear black.","They live in a huge old house.","Other families think they’re a little bit scary, but the Addams family don’t care.","The parents, Gomez and Morticia, and their children, Wednesday and Pugsley, are happy being different.","And there’s Cousin It, too.","He (or she – no one is sure) is covered in fur.","And finally there is Uncle Fester, Gomez’s brother.","They’re one of the best loved screen families of all time – in my house, anyway!"]]},"41":{"u":"Unit 4","audio":"../assets/tk1_p041.mp3","title":"Listening: Permission and family plans","arts":[["What are you doing, Lori?","I’m looking for my T-shirt.","Your T-shirt?","You’ve got lots!","Which one are you looking for?","The red one with the flower on it.","I can’t find it anywhere and I’ve got to go out in five minutes.","Where are you going?","To the cinema with Lucy and Darcy.","I want to look nice.","Oh, I can’t find it!","Do you want to borrow one of mine?","Can I?","Thanks, Olivia, you’re the best.","Sure.","Just get one from my room but don’t make a mess.","Don’t worry.","No mess, I promise."],["Can I borrow your red boots, too?","You mean my new ones?","No, you can’t.","Oh no, really?","Why not?","They’re really cool!","I know I am the world’s best sister, Lori, but there are some times when I have to say ‘no’!"],["Mum?","Have we got any plans this weekend?","I don’t think so.","Why?","There’s a party at Nathan’s place.","Can I go?","Well, that depends …","When is it?","Saturday night.","8 o’clock.","Sure.","That’s fine."],["Where does Nathan live?","He’s out in Foxton.","His family have got an amazing house.","Foxton?","That’s five kilometres from here.","And I guess there are no buses at that time of night.","Umm, no, I don’t think so.","Well, no actually, there aren’t any buses, no.","Right.","So come on.","Let’s hear the next question, Tom.","Any chance of a lift, Mum?","Of course, but I need to pick you up by midnight at the latest.","I need my sleep, you know.","No problem, Mum.","Thanks so much!"]]},"42":{"u":"Unit 4","audio":"../assets/tk1_p042.mp3","title":"News article: Suzie saves her mum","arts":[["One day Suzie McCash went shopping with her mum in Tynemouth, England.","Suzie was four years old.","Her mum didn’t feel very well at the shops, so they went home."],["In the house, Suzie’s mum went to lie on the sofa.","She was there for a long time.","Her eyes were shut and it wasn’t easy for her to breathe.","Suzie was worried.","Was her mum really ill?","Suzie went to the house next door, but the neighbours weren’t there.","So she phoned 999 – the emergency telephone number for the police."],["The police officer was very kind and Suzie was calm.","‘What’s your mummy doing now?’","‘Um, she’s just sitting on the sofa and she’s doing nothing.’","‘Are her eyes open?’","‘No, they’re shut.’","And later…","‘Can you open the door?","Can you be a big girl?’"],["Soon the police were at their house and an ambulance was there, too.","About an hour later, Suzie’s mum was OK again.","A doctor said: ‘Her mummy was very sick.","Without Suzie’s phone call, her mummy might be dead now.’","Suzie’s story was in the newspapers and people were surprised and happy about it.","She was a very brave girl and, a year later, she was in the news again because she was named a Child of Courage at the Pride of Britain Awards for helping her mother."]]},"44":{"u":"Unit 4","audio":"../assets/tk1_p044.mp3","title":"Culture: Family traditions around the world","arts":[["The idea of the family is important all over the world and many countries have special occasions to celebrate it.","Let’s look at a few."],["In Germany, the first day at school is a very important time for all children.","There is a special event called an Einschulung.","Everyone in the family meets to give the child presents, like pens and books, for their new school life.","For the first day of school, parents give their children a large paper cone called a Schultüte.","Inside there are things for school and sweets."],["In traditional Japanese houses you often find a butsudan.","A butsudan is a special place where you go to remember your dead relatives.","People usually put things on the butsudan for their ancestors: a book, some flowers or a bowl of rice, for example.","Adults also tell stories about these people to their children so they are not forgotten."],["Pets are popular in many cultures around the world.","Looking after an animal helps a child learn how to be responsible.","Every year in India there is a Hindu festival called Thai Pongal.","During the festival families feed cows and birds to give thanks for these animals.","Children also learn that all living things are connected and must share the world together."],["In the Netherlands people celebrate the winter holiday on the 5th December.","This holiday is called Sinterklaas.","People give each other presents, but they also have a very special tradition.","Each member of the family writes their name on a piece of paper and puts it in a hat.","Everyone then takes a name from the hat and writes a poem about this person.","Everyone sits in a circle and reads out their poems."]]},"48":{"u":"Unit 5","audio":"../assets/tk1_p048.mp3","title":"Magazine article: The 21st century caveman","arts":[["In 2007, Angelo Mastropietro was in the woods in Worcestershire, UK when it started to rain.","He looked for a place to keep dry and he discovered a cave house!","The cave house was 800 years old.","People lived in the rock-house for hundreds of years, but from about 1962, no one lived there and the house stayed empty."],["Angelo liked the rock-house very much.","He looked into the possibility of buying it.","It was for sale and in 2010 he decided to get it.","After that, he started to cut into the rock and to rebuild and modernise the house."],["Angelo (who is English, even though his name is Italian) finished the house in nine months.","He was a businessman before he started the house, and before 2007 he was quite ill, so he wanted a place where it was possible for him to live in a happy and healthy way.","He realised that he didn’t need to live in a huge apartment and that being closer to nature could help him feel better."],["He worked for over a thousand hours from beginning to end, and he used £160,000 to buy the house and all the things that he needed.","He planned everything himself, he moved about 80 tons of rock himself and he painted the house.","Angelo tried to make a comfortable place to live."],["The house has electricity, hot water and wi-fi, and there is heating under the floors of the rooms.","Angelo opened a deep hole 80 metres under the house to get natural water."],["The house is not huge.","It is about 65 m2, with one bedroom, a living room, a kitchen and a bathroom with a shower.","Angelo doesn’t live there all the time, but he uses the house as a place to go to sometimes, to get away from his busy city life.","It’s also possible to rent the house and to stay there for a weekend or more.","This means that other people are able to enjoy Angelo’s happy house and maybe escape from their busy lives for a few days, too."]]},"51":{"u":"Unit 5","audio":"../assets/tk1_p051.mp3","title":"Listening: Radio show – favourite rooms","arts":[["So today we have a question for listeners, and it is: what’s your favourite room, and why?","Our first caller is … hello.","What’s your name?"],["Hi there! My name’s Jo.","OK Jo, so tell us, what’s your favourite room?","It’s my grandfather’s playroom.","Your grandfather’s got a playroom? Really?","Yeah.","It’s the room with his model trains.","My grandad still lives in the house he lived in when he was a boy.","And he has a little room with his trains.","I love looking at his trains.","OK. And why is it special for you?","Because he’s so happy there, and we sit and talk, and I feel very relaxed.","It’s lovely."],["It sounds great, Jo.","Thank you.","Now who’s next? What’s your name and what’s your favourite room?"],["Hi.","I’m Andrew and my favourite room is the music room at my school.","OK, Andrew. And why’s that?","It’s because I love playing the drums, but I can’t have drums at home, so I go into the music room at school and practise there.","After school.","No one cares.","I have a lot of fun!"],["Sounds good to me! Thanks, Andrew.","Next caller please! Hello!"],["Hello, I’m Paula.","My favourite room is our kitchen at home.","I love it there because that’s where all of us sit and have our breakfast and dinner, and we’re a family together.","It makes me feel really nice and warm.","Nice and warm. That’s a good reason.","Yeah, and kind of … I don’t know, safe."],["Excellent, Paula, thank you.","And now we have … hello?"],["Hi. Tom here.","I don’t know if it’s really my favourite room, but the best room in my whole life was in a hotel.","Oh right. That’s interesting! Tell us more!","We all went to Brazil last year, and we got to the hotel in Rio de Janeiro very early in the morning and it was still quite dark.","But then the day started and I opened the window to see Copacabana beach.","Brilliant!","I loved that room.","We were there for five days and …","Thanks, Tom. I’m sorry, there’s no more time.","OK, now let’s … ."]]},"52":{"u":"Unit 5","audio":"../assets/tk1_p052.mp3","title":"Holiday blog: Our holiday castle","arts":[["We’re still in Ireland.","We arrived in Dublin four days ago.","My sister and I liked it a lot – it was great – we weren’t bored at all!","Then yesterday, after lunch, Dad hired a car and we travelled to the west of Ireland – it didn’t take very long, just about two and a half hours, but that was a bit boring."],["But, after two hours, Dad turned round to us and said: ‘We’ve got a surprise for you.","Tonight our hotel is a castle! How exciting is that!’","A joke, right? Wrong!","We didn’t think he was serious, but he was!"],["At the end of the journey, we stopped outside a real castle.","A nice lady welcomed us and started to show us around.","What an amazing place!","Can you believe that we walked up fifty stone steps to get to the living room?","The castle is over 600 years old, but it had everything we needed.","There was a bedroom for our parents and we each had a bedroom, too.","But I didn’t sleep very well last night – I was so excited to be in a real castle!"],["This morning we had breakfast and then we climbed up to the top of the castle.","We were amazed at the beautiful countryside around us.","Then it started to rain and there was a fantastic rainbow – I love rainbows!"],["The place was so great, we didn’t want to leave.","This afternoon we want to go to Limerick, so we’re packing our bags again!","Can it be as good as a castle? Let’s see."]]},"56":{"u":"Unit 6","audio":"../assets/tk1_p056.mp3","title":"Web article: A special friendship","arts":[["This is the story of Joe and Fonzie.","It’s a story about a friendship that started more than 20 years ago.","It’s also a story about a friendship that saved a life and started a new kind of help for people with problems."],["‘Joe’ is Joe Hoagland, who was three years old when the story began.","And ‘Fonzie’ is a 3-metre-long, 275 kilogram dolphin."],["When Joe was born, he had a problem with his heart and doctors had to operate on him.","When he was three, he had another operation.","This operation didn’t go well and he became paralysed – he couldn’t move the left side of his body.","The doctors at the hospital didn’t think he could get better.","Deena, Joe’s mother, took him to different places for therapy, but it wasn’t very successful."],["Then the family moved to Florida.","Joe liked being in the water and Deena thought swimming could help him.","First, they went to swimming pools in hotels, but some hotel guests didn’t like them being there.","Then one day she went with Joe to a place in Key Largo called Dolphin Plus, where people swam with dolphins.","Joe met Fonzie there and the story really began."],["Soon, Joe wanted to see Fonzie every day.","He loved playing with him and feeding him.","Every time that Joe arrived, Fonzie came to see him.","Joe’s mother told him always to feed Fonzie using his left hand, so Joe used his left side more and more.","Slowly, he got better and better.","He’s now over 30 years old and very well."],["Deena saw that Joe’s friendship with Fonzie helped him a lot, and she knew it was a good idea for other people, too.","So, she and her family worked to open a place called Island Dolphin Care.","It’s next to Dolphin Plus and many people with health problems come to spend time with the dolphins."],["Sadly, Fonzie died in 2004 when Joe was 17.","He wrote: ‘Fonzie was a great friend to me; he and I shared a lot of good times.","He always put a smile on my face.’"]]},"59":{"u":"Unit 6","audio":"../assets/tk1_p059.mp3","title":"Listening: Jack and his mum – friendship advice","arts":[["Hi, Jack. How was school?","Oh, fine."],["Mum, can I bring some friends round tomorrow?","Sure.","Who?","Oh, probably Rachel and Steve, maybe Leo.","OK. Not Markus?","Er, no.","Oh? Why not?"],["Well, we’re not really friends any more.","Seriously? I thought you two were best friends.","Yeah, we were.","But you know, we had an argument – he said something I didn’t like – so he’s not my friend any more.","And what did he say?","Well, he called me silly.","Friends don’t do that."],["Jack, do you remember Mrs Gordon? Janice? She’s a friend of mine.","Yes, I remember.","She was your friend at school too, wasn’t she?","Yes, and we’re still friends now, 20 years later.","Her mother was a friend of my mother’s."],["Anyway, one day at school, well, we had an argument and I said something really horrible to her.","What?","It doesn’t matter.","But she walked away and said, ‘I never want to see you again.’","I was really upset about that and I shouted, ‘Same here!’ or something."],["Then the next day, at school, she came up to me with a big smile and said, ‘Hi, Jenny, you OK?’","Really?","Yes, I was completely surprised and I asked her, I said, ‘Aren’t you angry with me?’","And she said something I still remember.","She said: ‘Well, yes, I was angry but last night I thought of all the nice things you always say to me and the nice things you do.","I want to think about that, not something you said because you were angry.’","And those words of hers, well, they almost made me cry.","And here we are, twenty years later, still friends."],["Wow.","Cool story, Mum."],["So I think it’s a real shame that after such a long time, you can’t still be friends with Markus.","You’re right.","Wow, so many times he helped me with my homework, listened to me when I had a problem.","That’s right.","So he called you silly one time? So what?","And you know, sometimes you are stupid – just like everyone else."],["Yes. Mum, I’m going out.","Round to Markus’ place, OK?","Good idea, Jack, and why don’t you take him a present to say sorry?"]]},"60":{"u":"Unit 6","audio":"../assets/tk1_p060.mp3","title":"Magazine article: Life stories – Pen pals for years","arts":[["This week, Paul (from Brisbane, Australia) and Annette (from Toulouse, France) tell us about their friendship on different sides of the world."],["When and how did your friendship start?","Fifteen years ago! We were both fourteen.","My school in Australia and her school in France started a virtual exchange programme for people to write to each other over the internet.","I wanted to improve my English and he wanted to improve his French, so we contacted each other."],["Did you become friends immediately?","Not really.","I thought he was OK but not special.","He made lots of mistakes in his French! Haha.","We corrected each other’s mistakes.","But I made more than her! She corrected everything, too!","Paul always helped me to improve my English, but you know, after a few months, we stopped worrying about writing in perfect English or French and just wrote to each other and talked about ourselves.","I began to see that he was a very nice guy, easy-going and cheerful."],["Did you feel the same way, Paul?","Yes, I did.","She often made jokes that made me laugh.","She’s really funny.","And we saw that we had a lot of things in common – books we liked, films we liked, things like that.","He’s also very intelligent."],["So, when did you actually meet face-to-face?","Last year.","We met in Singapore.","That’s right.","We wanted to meet up, but it’s a long way and the plane tickets are expensive.","So we decided to meet halfway.","We had a really great time together for about five days."],["Which language did you speak?","Haha! Good question.","English, almost all the time.","Her English is really good!","He’s just being kind! But yes, we had a great time."],["I think we’re going to be friends for life.","I hope we can meet up again soon."]]},"62":{"u":"Unit 6","audio":"../assets/tk1_p062.mp3","title":"Culture: Friends in literature","arts":[["Is there anyone who doesn’t know about those great friends Harry, Hermione and Ron in the Harry Potter books?","JK Rowling’s stories are world famous and part of their success is because of the friendship between those three main characters."],["But there are many examples of great friends in literature.","Let’s look at some more."],["In 1844 French writer Alexandre Dumas wrote The Three Musketeers.","The story is about a young man called D’Artagnan who goes to Paris to join the Musketeers, special soldiers who protect the king.","He meets Athos, Aramis and Porthos, three friends who are the greatest Musketeers in France, and they have many adventures together.","They often say ‘one for all and all for one’, which shows their strong friendship."],["The Jungle Book, 1894 by Rudyard Kipling is a story about animals who are very like people.","Some good, some not so good.","But there is also Mowgli, a small human boy who grows up in the Indian jungle.","Many animals want to find him because he knows how to make fire.","Mowgli’s great friend and guardian is a bear called Baloo and also a black panther called Bagheera, who help him to escape from the tiger, Shere Khan."],["The Lord of the Rings, 1937 to 1949 by JRR Tolkien is a fantasy story about Frodo who gets a ring from his uncle Bilbo Baggins.","Frodo lives in a place called the Shire in Middle Earth and has a friend, Sam.","When Frodo leaves the Shire on a long journey with the ring, Sam as well as some other friends goes with him.","Sam’s friendship is very important for Frodo as he faces many dangerous situations; Sam is always there to help him."],["A more modern book is My Brilliant Friend, 2011 by Elena Ferrante.","It is the first of a series of four novels.","The story begins in Naples in the 1950s.","Elena and Lila are friends at school but they have a lot of arguments, too.","As they grow up life takes them away from each other, but when they are both old things happen that bring them together again."]]},"66":{"u":"Unit 7","audio":"../assets/tk1_p066.mp3","title":"Web article: '… just because I didn’t want to take a bath.'","arts":[["Ludwick Marishane, a young man from South Africa, was with his friends in Limpopo when they started talking about inventing something to put on your skin so you don’t have to take a bath.","Ludwick thought that this was a great idea.","He used his mobile to do some research on the internet, and he found some shocking facts."],["Millions of people around the world haven’t got clean water.","This is a huge problem because dirty water can create terrible illnesses.","One of them is trachoma: thousands of people all over the world get trachoma every year.","They wash their faces with dirty water, get an infection and sometimes become blind.","To stop trachoma, people don’t have to take expensive medication.","They don’t have to take pills.","They don’t have to have injections.","They have to wash their faces with clean water.","That’s it."],["Ludwick started thinking.","He wanted to make something to help people in parts of the world where it’s difficult to find clean water.","He did more research on his mobile, and he did more thinking."],["Ludwick had a plan.","He wanted to make a gel for people to put on their skin so they don’t have to take a bath.","He wrote the formula for the gel on his mobile phone.","When he was at university, he never stopped thinking about his invention.","He started to talk to other people about it, and three years later the dream came true."],["He made the gel and called it ‘DryBath’.","It looks like any other gel, but it isn’t.","This gel saves lives!"],["Ludwick Marishane is the winner of lots of prizes.","People call him ‘one of the brightest young men in the world’.","He is very happy about his success.","DryBath is helping people to be healthy.","And DryBath also helps to save water.","That’s important in many parts of the world where it’s difficult to find clean water.","Now he wants to invent other things, and he wants to help other young people to become inventors, too."]]},"69":{"u":"Unit 7","audio":"../assets/tk1_p069.mp3","title":"Radio programme: advice for young inventors","arts":[["… and some people think that only older people – like me – can be inventors.","But they’re wrong, you know?"],["Here’s one example – a young man in South Africa, only 17 years old, saw a problem with water quality and he invented a gel that people can use to wash, to have a bath, even if there is no water.","He was only 17!","So, you guys out there, you shouldn’t wait.","Just go ahead and do it, OK?","So now, we don’t have much time, any questions?"],["Did the boy in South Africa get rich?","I really don’t know.","I hope so!"],["But that’s not the point.","He invented something that made other people’s lives better.","He didn’t think: how can I get rich?","He thought: how can I help people?","And that’s the place you should start.","You should start with an idea to help other people.","To make lives easier and, hopefully, better."],["I’ve got lots of ideas for inventions.","Oh? Like what?","Well, I don’t want to say."],["Good for you!","Be very careful.","You should only talk to people that you trust, OK?","But another thing: you say you’ve got lots of ideas, and that’s great.","But don’t try to work on all of them at the same time.","You should say to yourself: which idea is the best one?","And then you should try to work more on that idea."],["And should I forget the other ones?","No, no, no!","Absolutely not.","I mean, I’m sure you won’t forget them anyway."],["Yes, another question?","Is being an inventor a job?","I mean, should I leave school and just start inventing things?"],["Hahaha, it sounds like a good idea, right?","But to start, when you leave school, I think you should get a job and invent things as a hobby.","Why?","Well, you have to live, don’t you?","And maybe your first invention isn’t successful, so where is the money for you to live?","No, you should make sure that you’ve got a job and then see if the inventions work out."],["And, look, I’m afraid we’re out of time, we have to stop now.","I hope the talk was interesting for you all.","Good luck and goodbye!"]]},"70":{"u":"Unit 7","audio":"../assets/tk1_p070.mp3","title":"Website: Gadget reviews (year 2066)","arts":[["Are you tired of choosing a cool outfit to wear for special occasions?","Well, now you don’t have to!"],["The all-new Trendy-wise is easy to use and you don’t have to be trendy to use it.","However, before you can use it, you have to take photos of all the clothes in your wardrobe.","And you mustn’t forget to take photos of all your shoes and socks, too.","Then all you have to do is click on a photo of, for example, a blue T-shirt.","The Trendy-wise selects photos of trousers or skirts, shoes, socks, etc., from your wardrobe to go with this T-shirt.","Each time it creates a different outfit for you and the outfits are all very trendy."],["Oh, I almost forgot!","You also have to type in the kind of event/occasion, for example: a concert or a birthday party."],["Do you sometimes have bad dreams?","Do you wake up scared or unhappy?","Yes?","Then you should buy the DreamCatcher."],["This is how it works:","Put the machine on your head before you go to bed.","Tell it what you want or don’t want by speaking into the microphone – for example: ‘I want dreams where I win a singing competition’ or ‘I don’t want dreams about falling.’","When you are asleep, DreamCatcher will follow your dreams and make sure you get what you want."],["Imagine that in your dream you do something dangerous.","DreamCatcher will make sure you’re safe.","Here’s an example.","Let’s say you start to climb a high mountain.","You don’t have to worry because the DreamCatcher will make you walk back down again."],["But you mustn’t use the machine every night.","It will only work every three days."]]},"74":{"u":"Unit 8","audio":"../assets/tk1_p074.mp3","title":"Magazine article: The world’s greatest sporting achievements","arts":[["The world of sport is full of wonderful moments.","Here are our top three."],["The starting gun went off.","Suddenly, eight athletes were flying down the track in Rio de Janeiro’s Olympic Stadium.","Less than 20 seconds later the race was over."],["Usain Bolt was walking around the stadium with the Jamaican flag over his shoulders – he was a double Olympic champion … again!","Four years earlier, at the 2012 London Olympics, he became the first man to win a gold medal in both the 100m and 200m sprint at a second Olympic Games (he won them both at the 2008 Beijing Olympics, too).","In Rio, he did it for a third time.","As well as his eight Olympic gold medals (he won the other two in relay races with other teammates), Bolt also won 11 world championships and currently holds the world record for the 100m and 200m.","He is one of the greatest sprinters in history."],["Everyone was looking at 15-year-old Romanian gymnast Nadia Comaneci as she left the bars, flew through the air and landed perfectly on the ground.","She turned round.","The crowd was cheering.","Everyone was waiting nervously for the judges’ score.","Then it came."],["The scoreboard was showing ‘1.00’.","The crowd was confused.","But then the organisers explained.","The makers of the scoreboards thought it was impossible to get a perfect score of 10.","The boards were not able to show ‘10.00’.","So, on 18 July 1976, at the Montreal Olympics, Nadia made history when she became the first gymnast ever to get a perfect ten.","She got six more ‘perfect scores’ at the games and won three gold medals, making her one of the best athletes in her sport of all time."],["It was the final lap.","Roger Bannister was running fast, but could he really become the first person to run a mile in under four minutes?","A minute later, he was lying exhausted on the ground.","Then, there was an announcement of his time: ‘3 minutes, 59.4 seconds.’","The crowd went crazy."],["Before 6 May 1954, experts said that a four-minute mile was impossible to run.","Roger showed them that they were wrong.","He planned to stop running after the 1952 Summer Olympics, but there he only came in fourth place.","Without a medal, Roger wanted to show how good he was.","In 1954, he did exactly that."]]},"77":{"u":"Unit 8","audio":"../assets/tk1_p077.mp3","title":"Listening: Teens talking about sport","arts":[["Gemma, how do you feel about sport?","I’m not interested in sport.","I really don’t like it."],["I mean, I like exercise so I go for walks and I like swimming, oh I run a lot too, that’s great – but I just don’t like sport, you know, the idea where you try to win, to beat other people.","And I hate sport on TV – I leave the room!","And I don’t go to sports events like football matches – why do people pay so much money to watch 22 men run after a ball?"],["Andy, how do you feel about sport?","Well, I like running a lot."],["At school I play football but that’s because I have to, all the boys play football, and it’s OK, I mean I don’t hate it, but I don’t really like team games and sports very much."],["I like doing things alone and I think that’s why I love running, it’s just me and not other people.","I’m not a very good runner but I just love trying to run a little faster than the last time, do you know what I mean?"],["Tracey, how do you feel about sport?"],["Well, I absolutely love skateboarding, of course!","It’s just the best thing in the world."],["Some of my family say it isn’t really a sport but they don’t know anything.","I spend hours practising moves.","There’s a skate-park with a really good ramp, it’s not far from where I live.","I’m there all the time.","It’s the only sport I like really.","I mean, I kind of like football but really that’s only because some of my friends are into it.","But skateboarding, that’s my thing."],["Paul, how do you feel about sport?"],["When I was a kid I didn’t like any sports at all.","I thought: ‘I’m just not good at things like running and jumping’ but about a year ago I saw some gymnastics on TV and now I love it."],["There’s a sports centre in my town where I can do gymnastics.","I can’t do it at school because they haven’t got anywhere, but I go to the sports centre every weekend and some evenings too, to do as much gymnastics as I can."],["Ryan, how do you feel about sport?"],["Sport? Wonderful!","I’m a real sports fanatic.","I mean, I think about sport all the time.","I watch almost everything on TV – football, tennis, swimming, everything."],["And I do a lot of sport too – my favourite’s football, of course, and I’m really not bad at football.","I’m in the school team too.","And I’m also learning to ski.","My family went to Italy last year.","We went skiing – it was fantastic and I want to do more."]]},"78":{"u":"Unit 8","audio":"../assets/tk1_p078.mp3","title":"Web forum: Sporting fails","arts":[["Professional athletes need their bodies to be in excellent condition.","They train hours every day to achieve this.","Sometimes it only takes one small mistake to spoil all that hard work."],["In 2011, for example, French golfer Thomas Levet won the French Open.","He was so happy that he jumped in a lake and broke his leg.","And American skier Lindsey Vonn cut her hand badly while she was opening a glass bottle to celebrate winning at the 2009 World Championships."],["We know you’re not professionals, but we want you to tell us all about your silliest sporting accidents."],["Last year, I was playing volleyball for my school team.","I jumped up high and hit the ball really hard.","At first, I thought it was a really good shot, but I soon found out it wasn’t.","The ball hit the post at the side of the net: then it hit me in the face and knocked me to the floor.","I had a big purple bruise on my face and I couldn’t play the rest of the game."],["When I was 13, I played for the school rugby team and we won the schools championship.","A few days later, there was a big celebration.","All the students were there to watch as we walked on to the stage to get medals from the headmistress.","I got my medal, but when I was leaving the stage, I tripped and fell down the steps.","Luckily, I wasn’t hurt, but I was really, really embarrassed."],["A few days ago I was skateboarding down my road when I saw my best friend.","I shouted to him and started waving.","While I was waving, I rode into a lamppost and fell off.","My leg was hurting really badly and I couldn’t move.","After ten minutes, my friend called an ambulance.","Finally, they took me to hospital.","The doctor there told me my leg was broken.","Now I can’t skateboard for at least six months, and I have to miss the local championships."]]},"80":{"u":"Unit 8","audio":"../assets/tk1_p080.mp3","title":"Culture: The wonderful world of sport","arts":[["Sports such as football, tennis and golf are popular all over the world with millions of people playing them or watching them on TV.","But there are also many unusual sports that are not so well known.","Here are four interesting examples."],["Every year, on a small Chinese island, thousands of people arrive to celebrate a very special event: the Cheung Chau bun festival.","The highlight of the festival is a race to the top of a very strange mountain.","The mountain is made of metal and covered with a type of traditional Chinese bun.","Spectators watch as three teams compete to see how many buns they can take from the mountain.","The climb can be quite dangerous and people who want to take part must take a special training course."],["Camel racing is a popular sport in many countries around the world, including Mongolia and Australia.","But it is especially popular in the Middle East and each year, from late October to early April, many big races take place in countries such as the United Arab Emirates.","As many as 70 camels race along sandy desert tracks for up to 16 km.","The owners of the camels drive by the side of the animals shouting at them to run faster and cross the finish line before the others."],["Bossaball is a very modern sport that was first played in 2005.","It started in Spain, but it was the idea of a Belgian man called Filip Eyckmans.","He wanted to create a sport that mixed together football, gymnastics, volleyball and the Brazilian music of bossa nova.","There are two trampolines with a net between them.","The idea is for one team to hit the ball over the net and the other team to try and hit it back.","The trampolines let the players jump very high, making the sport very exciting to watch.","The sport is already popular in many countries around the world, including Brazil, Mexico, Turkey, Singapore and Saudi Arabia."],["Chess boxing was the invention of Dutch artist Iepe Rubingh.","His original idea was to create a piece of performance art, but it was so popular that it soon became a sport played in countries all over the world.","The game is quite simple.","Two contestants compete against each other at chess and boxing.","Each round of chess is followed by a round of boxing with a break of a minute between each round to give the players time to put on or take off their gloves.","The first person to win either the chess match or the boxing match wins the game."]]},"84":{"u":"Unit 9","audio":"../assets/tk1_p084.mp3","title":"Magazine article: The wild side of life","arts":[["More and more people think that life is better in the city than the countryside.","For the first time in history more than 50% of the world’s population lives in urban areas.","However, there are still many groups of people who live in some of the wildest places on the planet."],["The Kalahari is a large area of bush land in southern Africa.","It has two parts.","The south part is drier than the north and plants do not grow there very well.","Every year at the end of summer it rains and the land becomes more beautiful than at other times of the year.","But the grass and the bushes soon get dry and turn brown again.","Life there is difficult."],["The San are a group of people who live in the Kalahari.","They live in huts, eat wild animals – even lions – plants and berries.","They are very good with bows and arrows, and use them for hunting."],["Up in the mountains of central Papua New Guinea is the Chimbu Province.","This jungle area is one of the world’s most remote places.","It is also home to Mt Wilhelm, the highest mountain on the island.","Several different tribes live in the valleys between the mountains.","One of these is the Chimbu skeleton dancers.","They paint skeletons onto their bodies.","This makes them look scarier and it frightens other people away from their land."],["The Yamal Peninsula in northern Siberia is one and a half times bigger than France.","It is frozen for much of the year and temperatures can reach -50°C in the winter.","But this area is home to a tribe of about 10,000 people called the Nenets.","The Nenets are nomadic, meaning they frequently move from one place to another.","Each year around 300,000 reindeer move around the land and the Nenets always go with them.","The recent discovery of gas in the area means more people than before are visiting the Yamal.","So the Nenets now have more contact with the outside world."],["The Bayan-Ölgii Province is the highest part of Mongolia.","It is a wild area with many mountains, lakes, forests and rivers.","It is also home to the Kazakh golden eagle hunters.","These people travel around the mountains and use eagles to hunt for foxes and other small animals.","When boys turn 13, they can become golden eagle hunters.","However, they have to be stronger than most boys their age because they have to show that they can carry the weight of an eagle.","There are about 100,000 Kazakh people, but only around 250 of them are golden eagle hunters."]]},"87":{"u":"Unit 9","audio":"../assets/tk1_p087.mp3","title":"Interview with a Kalahari bushman","arts":[["You know so much about the wildlife here, PK.","How come?"],["My family are San, bush people, and I learned about nature from the time when I was a child.","I was born in the Kalahari.","And you grew up and found your wife here?","Yes, finding a wife here was very interesting."],["Tell us more."],["Yes, let’s say a young man wants to marry a girl.","So he has to ask her father and he says before you can marry my daughter, you have to do a task.","OK.","So what type of task does the young man have to do, PK?"],["Well, for example, he has to show that he can take a kill away from a lion.","What do you mean ‘take a kill away from a lion’?"],["Well, imagine a lion kills an antelope or another large animal.","The young man has to find that lion and get the meat, so he can show that he has courage.","That’s important for his future family."],["Wow, but how can you do that?","How can you find a lion and its kill?"],["You have to look.","You have to look for the big birds, the vultures.","They are watching the lion because they want some of the meat."],["OK, so let’s say you find the lion and its kill.","How can you then get the meat?","Isn’t that dangerous?"],["Yes, of course the lion is dangerous.","You mustn’t take the meat away from the lion at night.","You have to do that during the day."],["Why’s that?"],["During the day it’s very hot.","And the big cats can’t run fast when it’s hot.","A man can run even when it’s very hot, but lions can’t."],["No?","No, they can’t.","When they eat some meat, they feel very, very hot and get very tired.","So they often just lie around and they sleep all the time during the day."],["At night they are more dangerous because they don’t sleep.","And at night their eyes are better than your eyes.","So you can’t get the kill from the lion at night."],["OK, so you have to do that during the day.","But what do you do to get the kill from the lion?"],["OK.","So let’s say the lion is sleeping.","You hold your spear in your hand."],["You have to be very quiet.","And you go up to that lion."],["Do you attack him with your spear?","Kill him?"],["No, no, no, no.","You just go up to him and shout, ‘Arrrrggggghhhhh!’","You mustn’t hurt him or kill him, just surprise him, shock him, so he runs away."],["Wow!"]]},"88":{"u":"Unit 9","audio":"../assets/tk1_p088.mp3","title":"Web blog: Extreme nature!","arts":[["At 7.30 am on 22 January 1943, the people of Spearfish in South Dakota, US woke up to find the temperature outside was a freezing -20°C.","Two minutes later, thermometers were showing a much warmer 7°C – a rise of 27°C in 120 seconds.","But it didn’t stop there.","The temperature continued to go up and by 9 am it was 12°C.","Just as the people started to think about enjoying a warm winter’s day, the temperature fell 16°C in just under half an hour back down to -4°C and the residents had to put their coats back on!","It was the most dramatic temperature change in the history of American weather."],["The village of Capracotta is in the mountains near the Adriatic coast of Italy.","It gets a lot of snow in the winter.","But on 5 March 2015 its 1,000 inhabitants saw 256 cm of snowfall in 18 hours.","It was the biggest snowfall ever in a day.","One photo taken on the day shows a woman in a house shaking hands through the window with her neighbour in the street.","The neighbour is standing on top of the snow.","The woman is on the second floor of her home!"],["Do you like long sunny days?","Then the best city in the world to live in is Reykjavik.","21 June is the longest day of the year in the northern hemisphere and the Icelandic capital gets 21 hours and 45 minutes of daylight.","The sun hardly ever goes down.","However, Reykjavik could also be the worst place to be.","On the shortest day of the year, 21 December, the sun hardly rises there and people get only four hours and seven minutes of daylight.","But during winter nights, you can often see the Northern Lights – one of the world’s most beautiful natural events."]]},"92":{"u":"Unit 10","audio":"../assets/tk1_p092.mp3","title":"Emails: Experiences in foreign countries","arts":[["Hi Mum,"],["It’s Day Two and I’m already in love with New York.","It’s amazing.","The first day, we were pretty tired from the flight, but we did a bit of sightseeing in the afternoon.","We went to see the Statue of Liberty and I wasn’t disappointed.","We had a guided tour and learned all about its history.","It really is a powerful symbol of peace."],["Today, we’re going to explore Central Park and Manhattan.","In the evening, we’re going to watch the New York Jets.","They’re playing at MetLife Stadium.","It’s my first game of American football and I’m looking forward to it.","(I think – I’m quite nervous!)"],["The big concert we’re playing in is tomorrow and we’re all getting quite excited.","Just imagine, I’m going to play my trombone in Carnegie Hall, probably the most famous concert hall in the US.","Mr Davis is even more excited.","He’s going to conduct us in the concert.","He keeps telling us it’s his dream come true.","His wife’s going to record the performance.","She’s going to send us all the link so you can see the greatest moment of my musical career so far!","There are going to be bands from all over the world, from about 20 different countries.","I can’t wait!","Hope you’re well and not missing me too much!","Love, Ryan"],["Hi Abigail,"],["Sorry I didn’t write yesterday, but it was such a busy day I just didn’t get the time.","We played our second volleyball match of the trip.","It was against the under-15 Beijing champions and they won easily.","I also hurt my hand quite badly.","The sports centre where we played was fantastic.","Really modern and much better than ours back home."],["Anyway, I’ve got ten minutes to write to you quickly, then I’m going to the bus station to catch a bus to Luanping.","I’m so excited because we’re going to visit the Great Wall.","It was probably the one thing I wanted to do most on this trip, after playing volleyball, of course!"],["We’re going to explore the Jinshanling section of the wall.","It’s in the mountains and it’s quite a walk to get up to it.","But the views are spectacular.","I’m going to take loads of photos."],["Luanping is about 130 km away, so we’re going to spend the night there.","Then we’re going back to Beijing for our last day in the city."],["Our last match is in the afternoon, but I’m not going to play because of my hand.","I can’t believe the trip is almost over.","China is amazing and the Chinese people are so friendly.","I want to stay longer.","Lots of love, Bettina"]]},"95":{"u":"Unit 10","audio":"../assets/tk1_p095.mp3","title":"Listening: Teens making plans","arts":[["Hey Connor.","What are you doing this weekend?","Hi!"],["I’m quite busy actually.","Why?","Well, it’s just that we’ve got that History test coming up."],["Do you want to study together?","That would be great!","But, let me see."],["Saturday morning is no good.","I’m playing football.","It’s the cup final and I can’t miss that.","Of course not."],["OK, so what about Friday night?","I’m sorry. I can’t.","I’m busy.","Dad’s taking me to the sports centre to watch the basketball game, but it doesn’t finish until 10 pm.","Yeah, that’s a bit late."],["OK, how about Saturday afternoon.","Any chance?","Saturday afternoon, Saturday afternoon."],["It’s my brother’s birthday, so we’re going to the restaurant to celebrate.","You know, that new American diner on the high street.","Oh, yeah, I’ve heard it’s very good.","What time do you think you’ll finish there?"],["Probably about 5 pm, but then I’m meeting Nathan.","We’re going to see the new Spider-Man film at the cinema.","Hey, would you like to come?","Hmmm, Spider-Man – not really my thing."],["So thanks but no thanks.","I guess that just leaves Sunday."],["Yeah, Sunday.","Hmmmm, that’s a problem, too.","Why?"],["Well, my grandparents are coming over and we’re taking them to that outdoor museum.","Oh, the one with all the cool old buildings?","That’s right.","My grandad loves that sort of stuff.","I’d invite you, but I’m really sorry, we haven’t got any room in the car."],["I don’t want to see old buildings, Connor.","I want to study for the test.","Yeah, of course."],["Sunday evening maybe, but only after 8 pm.","I’ve got a piano lesson from 7 to 8 and we won’t be back from the museum much before 6 pm.","No, that’s too late."],["What about next weekend?","I’ve got loads of free time next weekend.","I’d love to!","But there’s a problem.","What’s that?"],["The test is on Monday.","This Monday.","First thing in the morning!"]]},"96":{"u":"Unit 10","audio":"../assets/tk1_p096.mp3","title":"Letters to a local government website: How can we improve our town?","arts":[["As you probably know, the town council have got £1 million to spend on improving the town’s facilities for young people and we’re looking for great ideas on how to spend the money well.","Post your ideas in the forum below and let us know how we can make life better for you."],["There’s nothing for teenagers to do in this town, especially at night.","Can we use the money to build a youth club?","Somewhere with a pool table and a table tennis table, perhaps.","We need somewhere to play happily and hang out safely in the evenings."],["As I’m only 14, I can’t drive, so I go everywhere on my bike.","But the roads are dangerous and many motorists drive too fast.","How about spending the money on building more cycle lanes?","We could also put in more speed cameras and zebra crossings, too.","This will make life safer for all our citizens, not just the young people."],["I think the best use for the money is to build a playground in the town park.","It should have lots of rides for the young kids but also stuff for teenagers, too.","I’d like to see a graffiti wall and a skateboard park for a start and maybe if there is enough money, we can have a climbing wall, too."],["Our high street is full of empty shops because everyone just shops at the new shopping centre outside of town or online.","Why don’t we use the money to turn some of these empty shops into an arts centre?","It can have studios where we can draw and paint or learn how to make films.","We could also have a music studio where local bands can record music cheaply."],["How about a big billboard at the entrance to the town that reads, ‘TEEN WARNING – there’s nothing to do here!’"],["This probably sounds like a boring idea, but can’t we use some of the money to buy more litter bins?","I feel ashamed of our town when I see all the litter on the ground.","We need to tidy up our town quickly!"]]},"98":{"u":"Unit 10","audio":"../assets/tk1_p098.mp3","title":"Culture: Mythical places around the world","arts":[["There are very few places on Earth that are undiscovered and we have satellite photos of the most remote places on the planet.","But people are always interested in mythical lands, places that people say exist but no one has ever found."],["Perhaps the most famous mythical place of all is Atlantis.","Some people say it is a city, others say it is an island and others call it a continent.","But whatever it is exactly, there is one thing that everyone agrees on: it is underneath the sea.","The Greek philosopher Plato was the first person to describe it and he suggested that one time, its people attacked Athens.","No one is sure exactly where Atlantis is.","Because of its name, some people think it is somewhere in the Atlantic Ocean.","Others say it’s in the Mediterranean Sea or in the Caribbean."],["Agartha is another mythical place that is not on the land.","The legend says that it’s at the centre of our planet.","Like Atlantis, it is famous for its culture and educated society.","It was the inspiration for Jules Verne’s novel Journey to the Centre of the Earth.","It tells the story of a group of travellers who go on an exciting adventure underground.","Many people have tried to find the entrance to Agartha, which they think is somewhere in Antarctica."],["Some people believe that somewhere in South America there is a famous city of gold: El Dorado.","Many people tried to find it, but they weren’t successful.","El Dorado was originally the name of a person, a ruler of the ancient Colombian society called the Muisca.","He covered himself in gold powder every day.","There were legends in which people imagined that the whole city was made of gold."],["Our final mythical land is an island called Thule.","The legend says that it is in the north of the Earth, somewhere between Norway and Iceland.","This is an area of the world that is completely dark for a lot of the year.","But the story goes that Thule is a place where a lot of delicious food grows and people are always happy.","The Roman poet Silius Italicus wrote about Thule.","In his story, the people living there are painted blue."]]},"102":{"u":"Unit 11","audio":"../assets/tk1_p102.mp3","title":"Magazine article: Changing bodies","arts":[["A long time ago, people were very different from the way we are now.","For example, if you find a really old house somewhere, you’ll see that the doors are usually much lower than they are today.","Why?","Because hundreds of years ago, people were shorter.","Over time, the human body changes to adapt to a new way of life.","Can we expect the human body to change in the future?","For sure.","And the main reason is that we have more and more technology, and it is changing how we live.","What kind of changes can we expect?","Well, no one can be 100 percent sure, but here are some possibilities."],["Let’s start with the example above.","Humans are now ten centimetres taller than 150 years ago.","So, in the future, people will probably be even taller.","Most of us now have much better food than people in the past – and so we grow more."],["We’ll get weaker in more than one way.","The most important way is that our muscles will not be as strong as now because we won’t do a lot of physical work."],["We are already using our feet less, and our hands more (think about computers and tablets and so on).","So we can expect that our legs will get shorter and our feet smaller, and at the same time, our fingers will get longer.","And our fingers and our eyes will both get better because they’ll have to do more work together."],["Now, what about the mouth?","It’ll get smaller, perhaps, because technological improvements will mean that we don’t need to talk so much – and also because our teeth will get smaller (so mouths don’t need to be so big to keep them in).","Here’s a good one – it’s very possible that people will have four toes, not five.","The little toe really isn’t needed anymore (people who lose them don’t miss them), so it will probably disappear sometime in the future.","And last but not least – people won’t have as much hair on their bodies as now, as we don’t need it to keep ourselves warm anymore."],["Will all these things happen?","And if so, when?","These are questions that no one can answer for sure."]]},"105":{"u":"Unit 11","audio":"../assets/tk1_p105.mp3","title":"Listening: Conversations about physical problems","arts":[["Are you all right, Lydia?","No, I’m not, Dad.","I’m not well at all."],["What’s the matter with you?","I’ve got a really bad stomach ache."],["Do you think it was something you ate?","No, not just one thing.","She ate loads."],["Don’t be mean, Liam.","Your sister doesn’t feel great.","He’s right, Dad."],["I think I was too hungry.","I didn’t have any lunch at school today."],["I think you need to just go and lie down for a while.","I’m sure you’ll feel better soon."],["OK, Dad.","I will.","I’ll just try and rest."],["And don’t worry about the washing-up.","I’m sure your brother will do that."],["What?","Me??!!"],["Come in, Tim.","Take a seat.","Thank you, Doctor."],["So how can I help you today?"],["It’s my elbow.","It’s really painful.","Look.","Hmm, yes, it does look a bit bruised."],["So what happened?","Well, it’s a bit of a silly story really."],["I got home from school yesterday and I didn’t have my key with me.","I left it in my locker at school so I tried to open the door with my elbow.","Oh, I see.","And it didn’t open?","No, it didn’t."],["Well, I don’t think it’s anything too serious.","You need to put some ice on it, and take some painkillers if it hurts too much."],["So, it’s not broken?","No, it isn’t.","You’re able to move it so I’m not too worried."],["But next time you forget your key, just wait for your parents to get home.","OK, Doctor.","I will."],["Hello, John.","What can I do for you?"],["It’s my neck.","OK.","And what’s the problem with it?"],["Does it hurt?","Yes, it does.","I can hardly move it.","Oh dear."],["What happened?","I’m not sure.","I went to bed last night and when I woke up it was really hurting."],["Did you do any sport yesterday?","No, I didn’t.","But I did sleep with the window open.","My grandmother thinks the cold air made it hurt but I’m not so sure."],["No, I don’t think there’s any connection there.","OK, well, let’s have a look at it."],["Can you take your shirt off for me, please?","Sure."]]},"106":{"u":"Unit 11","audio":"../assets/tk1_p106.mp3","title":"Blog: Old Wives’ Tales","arts":[["Old Wives’ Tales are those ‘helpful’ things that your grandparents say that are probably not true.","They are things like, ‘If you watch a lot of TV, you’ll get square eyes’, ‘If you eat carrots, you’ll see well in the dark’, or ‘If you eat cheese at night, you’ll have bad dreams’.","But are they nonsense or is there sometimes a little bit of truth in them?","We decided to investigate more."],["Let’s start with a famous one: ‘An apple a day keeps the doctor away’.","My grandma said this all the time.","Well, of course everyone knows that fruit is an important part of a healthy diet.","But can one apple really make a difference?","A medical study from 2013 says ‘yes’.","It found that if people over 50 eat an apple a day, their chances of a heart attack are much smaller than people who don’t."],["What about ‘Gain a child, lose a tooth’?","They say that when a woman has a child, a tooth will fall out.","Researchers at the New York University College of Dentistry studied more than 2,600 women between the ages of 18 and 64 with one or more children.","And guess what?","They found they had more problems with their teeth than women with no children, although they couldn’t say exactly why."],["My great uncle was a big believer that ‘fish is brain food’.","He ate it all the time and he was a clever man, too.","It looks like he might be right.","Fish have a lot of omega-3 and omega-6 fats in their oil.","Some scientists from Oxford studied 120 primary school children, and they discovered that the children who ate omega-3 and omega-6 made big improvements in their schoolwork.","If you eat fish oil, it will help to prevent heart problems, too.","It seems like eating fish is a good idea."],["Finally, what about those carrots?","Can they really help your night vision?","I’ve eaten them all my life, but I still walk into things when I get up in the night.","Unfortunately, I can’t find anything to prove if this is right or wrong.","I’ll keep looking and I’ll let you know as soon as I find out."]]},"110":{"u":"Unit 12","audio":"../assets/tk1_p110.mp3","title":"Newspaper article: A world record breaker","arts":[["She’s taken over 255 flights.","She’s filled five passports, she’s planted trees, has spoken to students in over 40 different countries, and she’s funded all $110,000 through sponsors and investors.","Now, her amazing adventure has finished and 29-year-old Cassie De Pecol has done it: she’s broken two Guinness World records.","After 18 months and 10 days, Cassie has become the fastest person to visit every country in the world, and the first woman on record to do so, in half the old record time."],["Back in 2014, Cassie decided to leave her job because she wasn’t doing what she really wanted to do.","What she really wanted to do was to see the world, and she started making plans for her great journey.","She started saving all the money she could, and in July 2015, she left home to start her travels.","Just over a year and a half later, on 2 February 2017, she arrived in Yemen, the 196th and last country on her (very!) long list."],["Of course, she didn’t have much time to see each country, but she made sure to use her time well.","She spent an average of two to fiv
