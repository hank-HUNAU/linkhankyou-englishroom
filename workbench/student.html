<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef1f8">
<title>TH!NK · 学生学习工作台</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%2310B981'/><text x='50' y='72' font-size='58' font-family='sans-serif' font-weight='900' fill='white' text-anchor='middle'>T</text></svg>">
<style>
:root{
  --p:#10B981; --p-d:#059669; --v:#7C3AED; --vk:#EC4899; --cy:#06B6D4; --or:#F97316; --ye:#FACC15;
  --ink:#1d1d1f; --ink2:#1e1b4b; --mut:#64748b; --mut2:#94a3b8;
  --line:rgba(0,0,0,.075); --line2:rgba(0,0,0,.12);
  --bg:#eef1f8; --card:#ffffff;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:24px; --r-pill:999px;
  --sh-card:0 18px 36px -26px rgba(31,41,55,.34);
  --sh-pop:0 30px 60px -30px rgba(124,58,237,.42);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --grad-p:linear-gradient(135deg,#059669,#10B981);
  --grad-v:linear-gradient(135deg,#6D28D9,#7C3AED);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.55;
     padding-bottom:calc(26px + env(safe-area-inset-bottom));}
.bg-blobs{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.bg-blobs span{position:absolute; border-radius:50%; filter:blur(90px);}
.bg-blobs .b1{width:420px;height:420px;left:-4%;top:-6%;background:#10B981;opacity:.24;}
.bg-blobs .b2{width:400px;height:400px;right:-2%;top:2%;background:#7C3AED;opacity:.22;}
.bg-blobs .b3{width:460px;height:460px;left:24%;bottom:-14%;background:#06B6D4;opacity:.14;}
.hide{display:none !important;}

/* ---------- 登录门 ---------- */
.gate{position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:20px;
      background:linear-gradient(180deg,rgba(238,241,248,.96),rgba(238,241,248,.99));}
.gate-card{width:100%; max-width:390px; background:var(--card); border:1px solid var(--line);
      border-radius:var(--r-xl); box-shadow:var(--sh-pop); padding:26px 24px 22px; text-align:center;}
.gate-mark{width:52px;height:52px;border-radius:16px;background:var(--grad-p);display:grid;place-items:center;margin:0 auto 14px;
      box-shadow:0 14px 26px -12px rgba(16,185,129,.9);}
.gate-mark svg{width:26px;height:26px;}
.gate h1{margin:0 0 5px; font-size:21px; font-weight:900; color:var(--ink2); letter-spacing:-.02em;}
.gate p{margin:0 0 18px; font-size:13px; font-weight:700; color:var(--mut);}
.gate input{width:100%; font-family:inherit; font-size:16px; font-weight:700; color:var(--ink); text-align:center;
      padding:13px 14px; border:1.5px solid var(--line2); border-radius:var(--r-sm); background:#fff; margin-bottom:10px;
      -webkit-appearance:none; appearance:none;}
.gate input:focus{outline:none; border-color:rgba(16,185,129,.6); box-shadow:0 0 0 3px rgba(16,185,129,.16);}
.gate-btn{width:100%; appearance:none; border:0; cursor:pointer; font-family:inherit; font-weight:900; font-size:15px;
      color:#fff; background:var(--grad-p); min-height:50px; border-radius:var(--r-sm);
      box-shadow:0 14px 26px -12px rgba(16,185,129,.9); transition:all .2s;}
.gate-btn:hover{transform:translateY(-1px);}
.gate-btn:disabled{opacity:.55; transform:none;}
.gate-err{min-height:18px; margin-top:10px; font-size:12.5px; font-weight:800; color:#b91c1c;}
.gate-hint{margin-top:6px; font-size:11.5px; font-weight:700; color:var(--mut2);}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
      padding:10px 18px; background:rgba(238,241,248,.86); backdrop-filter:saturate(1.6) blur(14px);
      -webkit-backdrop-filter:saturate(1.6) blur(14px); border-bottom:1px solid var(--line);}
.me{display:flex; align-items:center; gap:10px; cursor:pointer; border:0; background:transparent; font-family:inherit;
      padding:4px 8px 4px 4px; border-radius:var(--r-pill); transition:background .18s; text-align:left;}
.me:hover{background:rgba(0,0,0,.045);}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;flex:0 0 auto;}
.me-txt b{display:block; font-size:14.5px; font-weight:900; color:var(--ink2); line-height:1.2;}
.me-txt i{display:block; font-style:normal; font-size:11px; font-weight:800; color:var(--mut2);}
.spacer{flex:1 1 auto;}
.sync{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:var(--r-pill);
      background:rgba(255,255,255,.8); border:1px solid var(--line); font-size:12px; font-weight:800; color:var(--mut);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut2);}
.sync.ok .dot{background:var(--p); box-shadow:0 0 0 3px rgba(16,185,129,.18);}
.sync.busy .dot{background:var(--ye); animation:pulse 1s infinite;}
.sync.off .dot{background:var(--or);}
@keyframes pulse{50%{opacity:.3;}}

.wrap{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:16px 18px 8px;}

/* ---------- 今日主线 ---------- */
.hero{background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl); box-shadow:var(--sh-card);
      overflow:hidden; margin-bottom:16px;}
.hero-top{display:flex; align-items:center; gap:14px; padding:15px 18px 4px;}
.hero-top h2{margin:0; font-size:16.5px; font-weight:900; color:var(--ink2); letter-spacing:-.01em;}
.hero-top p{margin:2px 0 0; font-size:12px; font-weight:700; color:var(--mut);}
.ring{margin-left:auto; flex:0 0 auto; width:64px; height:64px;}
.hero-stage{padding:10px 14px 16px;}
.stage{border:1px solid var(--line); border-radius:var(--r-lg); background:#fcfdff; padding:14px 15px;}
.stage.due{border-color:#fde68a; background:#fffdf5;}
.stage.over{border-color:#fecaca; background:#fff5f5;}
.stage-hd{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; font-weight:800; color:var(--mut);}
.stage-t{font-size:17px; font-weight:900; color:var(--ink); margin-top:7px; letter-spacing:-.01em;}
.stage-d{font-size:12.5px; font-weight:700; color:var(--mut); margin-top:5px;}
.stage-m{font-size:11.5px; font-weight:700; color:var(--mut2); margin-top:7px;}
.stage-a{display:flex; align-items:center; gap:10px; margin-top:13px; flex-wrap:wrap;}
.stage-done{text-align:center; padding:22px 14px;}
.stage-done .big{font-size:34px; font-weight:900; letter-spacing:-.03em;
      background:var(--grad-p); -webkit-background-clip:text; background-clip:text; color:transparent;}
.stage-done p{margin:6px 0 0; font-size:13px; font-weight:800; color:var(--mut);}
.levels{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
.lv{flex:1 1 0; min-width:92px; appearance:none; cursor:pointer; font-family:inherit; font-weight:900; font-size:13.5px;
      min-height:56px; border-radius:var(--r-md); border:2px solid transparent; transition:all .18s; color:#fff;}
.lv:hover{transform:translateY(-2px);}
.lv small{display:block; font-size:10.5px; font-weight:800; opacity:.85; margin-top:1px;}

/* ---------- 卡片栅格：两栏 + 整行 ---------- */
.cols{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:stretch;}
.cols > .card{min-width:0;}
.span2{grid-column:1 / -1;}
@media (max-width:1024px){ .cols{grid-template-columns:1fr;} }
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl); box-shadow:var(--sh-card); padding:15px;}
.ch{display:flex; align-items:center; gap:10px; margin-bottom:11px;}
.ch .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;}
.ch .ico.g{background:rgba(16,185,129,.12); color:var(--p-d);}
.ch .ico.v{background:rgba(124,58,237,.12); color:#6D28D9;}
.ch .ico.c{background:rgba(6,182,212,.14); color:#0e7490;}
.ch svg{width:17px;height:17px;}
.ch h3{margin:0; font-size:14.5px; font-weight:900; color:var(--ink2);}
.ch .sub{font-size:11.5px; color:var(--mut2); font-weight:700; margin-top:1px;}
.ch .cnt{margin-left:auto; font-size:12px; font-weight:800; color:var(--mut); background:rgba(0,0,0,.045);
      padding:4px 10px; border-radius:var(--r-pill);}

.pill{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:var(--r-pill);
      font-size:11px; font-weight:800; background:rgba(124,58,237,.09); color:#6D28D9;}
.pill.g{background:rgba(16,185,129,.12); color:var(--p-d);}
.pill.o{background:rgba(249,115,22,.13); color:#c2410c;}
.pill.r{background:rgba(239,68,68,.12); color:#b91c1c;}
.pill.c{background:rgba(6,182,212,.13); color:#0e7490;}
.pill.gray{background:rgba(0,0,0,.055); color:var(--mut);}

.task{display:flex; align-items:center; gap:11px; padding:11px; border-radius:var(--r-md);
      border:1px solid var(--line); background:#fcfdff; margin-bottom:8px; cursor:pointer; transition:all .16s;}
.task:last-child{margin-bottom:0;}
.task:hover{border-color:rgba(124,58,237,.34);}
.task.now{border-color:rgba(124,58,237,.55); background:linear-gradient(180deg,rgba(124,58,237,.07),rgba(124,58,237,.01));}
.task.done{background:#f6fefb; border-color:rgba(16,185,129,.28);}
.task.over{border-color:#fecaca; background:#fff5f5;}
.task.soon{border-color:#fde68a; background:#fffdf5;}
.task .bar{width:4px; align-self:stretch; border-radius:99px; background:var(--mut2); flex:0 0 auto;}
.task.over .bar{background:#ef4444;}
.task.soon .bar{background:var(--or);}
.task.done .bar{background:var(--p);}
.task .info{flex:1 1 auto; min-width:0;}
.task .t1{font-size:13.5px; font-weight:800; color:var(--ink); overflow:hidden; text-overflow:ellipsis;}
.task .t2{font-size:11.5px; font-weight:700; color:var(--mut); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.task .go{flex:0 0 auto; font-size:11.5px; font-weight:900; color:#6D28D9;}
.empty{padding:20px 10px; text-align:center; color:var(--mut2); font-size:13px; font-weight:700;}

.btn{appearance:none; border:0; cursor:pointer; font-family:inherit; font-weight:900; font-size:14px;
      padding:0 20px; min-height:46px; border-radius:var(--r-sm); transition:all .2s; white-space:nowrap;}
.btn-p{background:var(--grad-p); color:#fff; box-shadow:0 12px 22px -11px rgba(16,185,129,.9);}
.btn-v{background:var(--grad-v); color:#fff; box-shadow:0 12px 22px -11px rgba(124,58,237,.9);}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:.55; cursor:default; transform:none; box-shadow:none;}
.link{appearance:none; border:0; background:transparent; cursor:pointer; font-family:inherit;
      font-weight:800; font-size:12.5px; color:var(--mut2); padding:8px 4px; text-decoration:underline;}
.link:hover{color:var(--mut);}

/* ---------- 成就画像（整行） ---------- */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.stat{border:1px solid var(--line); border-radius:var(--r-md); padding:12px 13px; background:#fcfdff;}
.stat .sk{font-size:11.5px; font-weight:800; color:var(--mut2);}
.stat .sv{font-size:24px; font-weight:900; color:var(--ink2); letter-spacing:-.03em; line-height:1.3;}
.stat .sv em{font-style:normal; font-size:13px; font-weight:900; color:var(--mut); margin-left:2px;}
.stat .ss{font-size:11px; font-weight:700; color:var(--mut); margin-top:1px;}
.stat .sb{display:block; height:8px; border-radius:99px; background:rgba(0,0,0,.06); overflow:hidden; margin-top:9px;}
.stat .sb .fill{display:block; height:100%; width:0; border-radius:99px; transition:width .5s cubic-bezier(.2,.8,.2,1);}
.stat.me{background:linear-gradient(180deg,rgba(124,58,237,.09),rgba(124,58,237,.02)); border-color:rgba(124,58,237,.28);}
.stat.me .sv{color:#6D28D9;}
.panels2{display:grid; grid-template-columns:1.15fr 1fr; gap:12px; margin-top:12px;}
.sub{border:1px solid var(--line); border-radius:var(--r-md); padding:12px 13px; background:#fcfdff; min-width:0;}
.sub h4{margin:0 0 10px; font-size:11.5px; font-weight:900; color:var(--ink2);}
.mini7{display:flex; align-items:flex-end; gap:4px; height:40px;}
.mini7 i{flex:1 1 0; background:rgba(16,185,129,.28); border-radius:3px; min-height:3px;}
.mini7 i.on{background:var(--p);}
.mini7cap{font-size:11px; font-weight:800; color:var(--mut2); margin-top:8px;}
.awards{max-height:150px; overflow-y:auto;}
.award{display:flex; align-items:center; gap:8px; padding:6px 2px; font-size:12px; border-bottom:1px dashed var(--line);}
.award:last-child{border-bottom:0;}
.award .ck{color:var(--p-d); font-weight:900; flex:0 0 auto;}
.award .tx{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700;}
.award .dt{color:var(--mut2); font-weight:800; flex:0 0 auto; font-size:11px;}
@media (max-width:1024px){ .stats{grid-template-columns:1fr 1fr;} .panels2{grid-template-columns:1fr;} }
@media (max-width:560px){ .stats{grid-template-columns:1fr;} }

footer{text-align:center; color:var(--mut2); font-size:11px; font-weight:700; padding:16px 4px 4px;}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translate(-50%,20px);
      background:var(--ink2); color:#fff; font-size:13.5px; font-weight:900; padding:12px 20px; border-radius:var(--r-pill);
      box-shadow:var(--sh-pop); opacity:0; pointer-events:none; transition:all .25s; z-index:70; max-width:88vw; text-align:center;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.toast.err{background:#b91c1c;}
.toast.ok{background:var(--p-d);}

@media (max-width:520px){
  .wrap{padding:12px 13px 8px;}
  .topbar{padding:9px 13px;}
  .hero-top{padding:13px 14px 2px;}
  .hero-stage{padding:8px 11px 13px;}
  .ring{width:56px;height:56px;}
  .stage-t{font-size:15.5px;}
  .lv{min-width:80px; min-height:52px; font-size:12.5px;}
  .task .go{display:none;}
}
</style>
</head>
<body>
<div class="bg-blobs"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h11a1 1 0 0 1 1 1v15"/><path d="M6 17h12"/><path d="M9 8h5"/></svg>
    </div>
    <h1>欢迎回来</h1>
    <p>输入学号进入你的学习空间</p>
    <input type="text" id="gateSid" placeholder="学号，例如 S2026001" autocomplete="off">
    <input type="text" id="gateName" placeholder="忘记学号？也可以输入姓名" autocomplete="off">
    <button type="button" class="gate-btn" id="gateGo">进入</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-hint">找不到学号？联系你的英语老师</div>
  </div>
</div>

<div class="app hide" id="app">
  <header class="topbar">
    <button type="button" class="me" id="meBox" title="点开可退出登录">
      <span class="ava" id="meAva">·</span>
      <span class="me-txt"><b id="meName">—</b><i id="meClass">—</i></span>
    </button>
    <div class="spacer"></div>
    <div class="sync" id="syncBadge"><i class="dot"></i><span id="syncText">连接中</span></div>
  </header>

  <div class="wrap">
    <main>
      <div id="modeBanner" style="display:none; align-items:center; gap:10px; margin-bottom:14px; padding:11px 14px; border-radius:var(--r-md); background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; font-size:13px; font-weight:700;">
        <span>当前为演示数据 · 未连接资料库。</span>
      </div>

      <section class="hero">
        <div class="hero-top">
          <div>
            <h2>今日主线</h2>
            <p id="heroSub">先完成今天的预习，再清理到期的复习</p>
          </div>
          <div class="ring" id="ringBox"></div>
        </div>
        <div class="hero-stage" id="heroStage"></div>
      </section>

      <div class="cols">
        <section class="card">
          <div class="ch">
            <div class="ico g">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
            </div>
            <div>
              <h3>老师推送的预习</h3>
            </div>
            <div class="cnt"><span id="prepCount">0</span> 项</div>
          </div>
          <div id="prepList"></div>
        </section>

        <section class="card">
          <div class="ch">
            <div class="ico v">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 4-6"/></svg>
            </div>
            <div>
              <h3>待复习 · 遗忘曲线</h3>
            </div>
            <div class="cnt"><span id="reviewCount">0</span> 项</div>
          </div>
          <div id="reviewList"></div>
        </section>

        <section class="card span2">
          <div class="ch">
            <div class="ico c">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="11" r="4"/><path d="M8 15l-2 7 6-3 6 3-2-7"/></svg>
            </div>
            <div>
              <h3>我的成就</h3>
            </div>
          </div>
          <div class="stats">
            <div class="stat me">
              <div class="sk">连续学习</div>
              <div class="sv"><span id="meStreak" data-sp-bindable="database" data-sp-database-id="qKJybtlu4NrEqJ7yUPTduo">0</span><em>天</em></div>
              <div class="ss" id="meStreakSub">今天还没开始</div>
            </div>
            <div class="stat">
              <div class="sk">今日完成</div>
              <div class="sv"><span id="gaugeTodayNum" data-sp-bindable="database" data-sp-database-id="qKJybtlu4NrEqJ7yUPTduo">0/0</span></div>
              <span class="sb"><span class="fill" id="gaugeToday" style="background:linear-gradient(90deg,#7C3AED,#6D28D9)"></span></span>
            </div>
            <div class="stat">
              <div class="sk">掌握进度</div>
              <div class="sv"><span id="gaugeMasteryNum">0/0</span></div>
              <span class="sb"><span class="fill" id="gaugeMastery" style="background:linear-gradient(90deg,#10B981,#059669)"></span></span>
            </div>
            <div class="stat">
              <div class="sk">平均正确率</div>
              <div class="sv"><span id="gaugeAccNum">0%</span></div>
              <span class="sb"><span class="fill" id="gaugeAcc" style="background:linear-gradient(90deg,#06B6D4,#0e7490)"></span></span>
            </div>
          </div>
          <div class="panels2">
            <div class="sub">
              <h4>近 7 天学习节奏</h4>
              <div class="mini7" id="mini7"></div>
              <div class="mini7cap" id="mini7Cap">—</div>
            </div>
            <div class="sub">
              <h4>最近完成</h4>
              <div class="awards" id="awards"></div>
            </div>
          </div>
        </section>
      </div>

      <footer>TH!NK Foundation · 学生学习工作台 · 数据云端同步，多设备自动同步</footer>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

/* ============ 后端配置 ============
   Supabase 建好后：enabled 改 true，填入 Project URL + anon public key。
   CDN 加载失败或 enabled=false 时自动回落资料库 SDK；两者皆无则演示模式。 */
var SUPA_CONFIG = {
  enabled: true,
  url: 'https://zwatrfbqkrvxpqtypdgx.supabase.co',
  anonKey: 'sb_publishable_mnkBBrHF70guvwfUNXuhBg_sIok8eBc'
};
var SUPA_TABLES = {
  'M2BiG1J9hhkYDOcdZFWi3s': 'prep_tasks',
  'qKJybtlu4NrEqJ7yUPTduo': 'learning_records',
  'iRti0RoXNhXFoekVY9y4Cf': 'resources',
  'PUQ5oUZJNDYWKBBMpIijgw': 'classes',
  '2OjdhXTwUccUa71i4R2wBx': 'students'
};
function makeSupaAdapter(){
  var client = window.supabase.createClient(SUPA_CONFIG.url, SUPA_CONFIG.anonKey);
  function tableOf(databaseId){
    var t = SUPA_TABLES[databaseId];
    if(!t) throw new Error('未知数据库: ' + databaseId);
    return t;
  }
  function outVal(v){
    if(v === null || v === undefined) return null;
    if(typeof v === 'object'){
      if(v.url && v.url.link) return v.url.link;
      if(v.text !== undefined) return v.text;
      if(v.select !== undefined) return v.select;
      if(v.number !== undefined) return v.number;
      if(v.date !== undefined) return v.date;
    }
    return v;
  }
  function patchOf(properties){
    var out = {}, k;
    for(k in properties){ if(Object.prototype.hasOwnProperty.call(properties, k)) out[k] = outVal(properties[k]); }
    return out;
  }
  function rowOf(r, databaseId){
    var row = { _id: r.id }, k;
    for(k in r){
      if(k === 'id' || k === 'created_at') continue;
      if(databaseId === 'iRti0RoXNhXFoekVY9y4Cf' && k === '链接'){
        row['链接'] = r[k] ? [{ text: r['资源名称'] || '打开', link: r[k] }] : [];
        continue;
      }
      row[k] = (r[k] === null) ? '' : r[k];
    }
    return row;
  }
  function query(opts){
    var sorts = opts.sorts || [];
    var page = parseInt(opts.startCursor, 10) || 0;
    var size = Math.min(opts.pageSize || 200, 1000);
    var q = client.from(tableOf(opts.databaseId)).select('*');
    for(var i = 0; i < sorts.length; i++){
      q = q.order(sorts[i].property, { ascending: sorts[i].direction !== 'descending' });
    }
    q = q.range(page * size, page * size + size - 1);
    return q.then(function(res){
      if(res.error) throw res.error;
      var rows = [], i;
      for(i = 0; i < (res.data || []).length; i++) rows.push(rowOf(res.data[i], opts.databaseId));
      var more = rows.length === size;
      return { results: rows, hasMore: more, nextCursor: more ? String(page + 1) : undefined };
    });
  }
  return {
    query: query,
    getSchema: function(){ return Promise.resolve({ properties: [] }); },
    addRecord: function(opts){
      return client.from(tableOf(opts.databaseId)).insert(patchOf(opts.properties))
        .then(function(res){ if(res.error) throw res.error; return res.data; });
    },
    updateRecord: function(opts){
      return client.from(tableOf(opts.databaseId)).update(patchOf(opts.properties)).eq('id', opts.recordId)
        .then(function(res){ if(res.error) throw res.error; return res.data; });
    },
    deleteRecord: function(opts){
      return client.from(tableOf(opts.databaseId)).delete().eq('id', opts.recordId)
        .then(function(res){ if(res.error) throw res.error; return res.data; });
    }
  };
}

/* ---------------- storage ---------------- */
function cacheGet(key){
  try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function cacheSet(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
function cacheClear(key){
  try { localStorage.removeItem(key); } catch(e){}
}

/* ---------------- dates ---------------- */
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function toKey(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function parseDate(iso){ if(!iso) return null; var d = new Date(iso); return isNaN(d.getTime()) ? null : d; }
function fmtDate(iso){ var d = parseDate(iso); return d ? ((d.getMonth()+1) + '月' + d.getDate() + '日') : '—'; }
function dayDiff(iso){
  var d = parseDate(iso);
  if(!d) return 9999;
  var t = new Date();
  var a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((a - b) / 86400000);
}
function addDaysISO(n){ var d = new Date(); d.setDate(d.getDate() + n); return toKey(d); }
function todayISO(){ return toKey(new Date()); }
function intervalDays(times, mastery){
  var n = Math.max(1, Number(times) || 1);
  var base = INTERVALS[Math.min(n - 1, INTERVALS.length - 1)];
  if(mastery === '陌生') base = 1;
  else if(mastery === '模糊') base = Math.max(1, Math.round(base / 2));
  else if(mastery === '掌握') base = Math.round(base * 1.6);
  return base;
}
function levelKeyOf(mastery){
  if(mastery === '陌生') return '不认识';
  if(mastery === '模糊') return '有点难';
  if(mastery === '熟悉' || mastery === '掌握') return '会了';
  return '—';
}
function avaColor(name){
  var h = 0;
  for(var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 9973;
  return AVA_COLORS[h % AVA_COLORS.length];
}

/* ---------------- identity ---------------- */
function myAccount(){
  if(!state.me) return null;
  for(var i = 0; i < state.accounts.length; i++){
    if(state.accounts[i]['学号'] === state.me.sid) return state.accounts[i];
  }
  return null;
}
function meName(){ return state.me ? state.me.name : ''; }
function myRecords(){ return state.records.filter(function(r){ return r['学生'] === meName(); }); }

function targetNames(t){
  var s = t['推送对象'] || '';
  return s.split(/[、,，;；|]+/).filter(function(x){ return !!x; });
}
function taskVisible(t){
  if(t['任务状态'] === '已撤回') return false;
  var mode = t['推送方式'] || '全班';
  if(mode === '全班') return true;
  var acc = myAccount();
  var klass = (acc && acc['所属班级']) || '';
  var list = targetNames(t);
  if(mode === '按班级') return list.indexOf(klass) >= 0;
  if(mode === '按个人') return list.indexOf(meName()) >= 0;
  return true;
}
function prepKey(t){ return '预习：' + t['任务标题']; }
function isPrepDone(t){
  var key = prepKey(t);
  return myRecords().some(function(r){ return r['记录类型'] === '预习' && r['学习内容'] === key; });
}
function myPrepTasks(){ return state.prep.filter(taskVisible); }

/* ---------------- 今日主线 ---------------- */
function prepToday(){
  var out = [], i;
  var tasks = myPrepTasks();
  for(i = 0; i < tasks.length; i++){
    var t = tasks[i];
    if(isPrepDone(t)) continue;
    var pushedToday = dayDiff(t['推送时间']) === 0;
    var due = dayDiff(t['截止日期']) <= 0;
    if(pushedToday || due) out.push(t);
  }
  out.sort(function(a, b){ return dayDiff(a['截止日期']) - dayDiff(b['截止日期']); });
  return out;
}
function dueReviews(){
  var list = myRecords().filter(function(r){ return dayDiff(r['下次复习']) <= 0; });
  list.sort(function(a, b){ return dayDiff(a['下次复习']) - dayDiff(b['下次复习']); });
  return list;
}
function upReviews(){
  var list = myRecords().filter(function(r){ return dayDiff(r['下次复习']) > 0; });
  list.sort(function(a, b){ return dayDiff(a['下次复习']) - dayDiff(b['下次复习']); });
  return list;
}
function mainQueue(){
  var q = [], i;
  var preps = prepToday();
  for(i = 0; i < preps.length; i++){
    if(state.skipped['p:' + preps[i]._id]) continue;
    q.push({ kind:'prep', id: preps[i]._id, task: preps[i] });
  }
  var dues = dueReviews();
  for(i = 0; i < dues.length; i++){
    if(state.skipped['r:' + dues[i]._id]) continue;
    q.push({ kind:'review', id: dues[i]._id, rec: dues[i] });
  }
  return q;
}
function currentItem(q){
  var i;
  if(state.focusId){
    for(i = 0; i < q.length; i++){ if(q[i].id === state.focusId) return q[i]; }
  }
  return q.length ? q[0] : null;
}
function doneTodayCount(){
  var today = todayISO(), n = 0;
  var recs = myRecords();
  for(var i = 0; i < recs.length; i++){
    var d = parseDate(recs[i]['日期']);
    if(d && toKey(d) === today) n++;
  }
  return n;
}

/* ---------------- rendering helpers ---------------- */
function esc(s){
  var v = String(s === null || s === undefined ? '' : s);
  return v.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\u0022/g, '&quot;');
}
function sanitizeHtml(html){
  var v = String(html === null || html === undefined ? '' : html);
  return v.replace(/<\s*script[\s\S]*?<\s*\/\s*script\s*>/gi, '')
          .replace(/\son[a-z]+\s*=\s*[^\s>]*/gi, '')
          .replace(/javascript:/gi, '');
}
function pill(text, tone){ return '<span class="pill ' + (tone || '') + '">' + esc(text) + '</span>'; }
function setText(id, text){ var el = document.getElementById(id); if(el) el.textContent = text; }
function setHTML(id, html){ var el = document.getElementById(id); if(el) el.innerHTML = sanitizeHtml(html); }
function setWidth(id, pct){
  var el = document.getElementById(id);
  if(el) el.style.width = Math.max(0, Math.min(100, pct)) + '%';
}
function duePill(days){
  if(days < 0) return pill('逾期 ' + Math.abs(days) + ' 天', 'r');
  if(days === 0) return pill('今天到期', 'o');
  return pill('还剩 ' + days + ' 天', 'gray');
}
function ringSVG(done, total){
  var pct = total ? (done / total) : 1;
  var r = 26, c = 2 * Math.PI * r;
  var off = c * (1 - Math.max(0, Math.min(1, pct)));
  return '<svg viewBox="0 0 64 64" width="100%" height="100%" role="img" aria-label="今日完成进度">'
    + '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="7"/>'
    + '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="#7C3AED" stroke-width="7" stroke-linecap="round"'
    + ' stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 32 32)"/>'
    + '<text x="32" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#1e1b4b" dominant-baseline="central">' + done + '</text>'
    + '<text x="32" y="45" text-anchor="middle" font-size="9.5" font-weight="700" fill="#94a3b8">共 ' + total + '</text>'
    + '</svg>';
}

function heroPrep(cur){
  var t = cur.task;
  var dd = dayDiff(t['截止日期']);
  var cls = dd < 0 ? 'stage over' : (dd === 0 ? 'stage due' : 'stage');
  return '<div class="' + cls + '">'
    + '<div class="stage-hd">' + pill('预习', 'g') + '<span>' + esc(t['单元'] || '') + '</span>' + duePill(dd) + '</div>'
    + '<div class="stage-t">' + esc(t['任务标题'] || '') + '</div>'
    + (t['任务说明'] ? '<div class="stage-d">' + esc(t['任务说明']) + '</div>' : '')
    + '<div class="stage-m">预计 ' + (Number(t['预计用时']) || 0) + ' 分钟 · 完成后自动排入复习曲线</div>'
    + '<div class="stage-a">'
    + '<button type="button" class="btn btn-p" data-act="do-prep" data-id="' + esc(cur.id) + '">完成这项预习</button>'
    + '<button type="button" class="link" data-act="skip" data-id="' + esc(cur.id) + '">跳过</button>'
    + '</div></div>';
}
function heroReview(cur){
  var r = cur.rec;
  var dd = dayDiff(r['下次复习']);
  var cls = dd < 0 ? 'stage over' : (dd === 0 ? 'stage due' : 'stage');
  var last = r['掌握度'] ? ('上次自评：' + levelKeyOf(r['掌握度'])) : '第一次复习';
  var head = '<div class="' + cls + '">'
    + '<div class="stage-hd">' + pill('复习', '') + '<span>' + esc(r['单元'] || '') + '</span>' + duePill(dd) + '</div>'
    + '<div class="stage-t">' + esc(r['学习内容'] || '复习项') + '</div>'
    + '<div class="stage-m">已复习 ' + (Number(r['复习次数']) || 0) + ' 次 · ' + esc(last) + '</div>';
  if(state.openId === cur.id){
    var btns = '';
    for(var i = 0; i < LEVELS.length; i++){
      var L = LEVELS[i];
      btns += '<button type="button" class="lv" data-act="rate" data-id="' + esc(cur.id) + '" data-k="' + esc(L.k) + '"'
        + ' style="background:' + L.c + '">' + esc(L.k) + '<small>' + esc(L.s) + '</small></button>';
    }
    head += '<div class="levels">' + btns + '</div>'
      + '<div class="stage-a"><button type="button" class="link" data-act="skip" data-id="' + esc(cur.id) + '">跳过这一项</button></div>';
  } else {
    head += '<div class="stage-a">'
      + '<button type="button" class="btn btn-v" data-act="open-review" data-id="' + esc(cur.id) + '">开始复习</button>'
      + '<button type="button" class="link" data-act="skip" data-id="' + esc(cur.id) + '">跳过</button>'
      + '</div>';
  }
  head += '</div>';
  return head;
}

/* ---------------- render: lists ---------------- */

  var tasks = myPrepTasks().slice();
  tasks.sort(function(a, b){ return dayDiff(a['截止日期']) - dayDiff(b['截止日期']); });
  var q = mainQueue();
  var cur = q.length ? currentItem(q) : null;
  var nowId = (cur && cur.kind === 'prep') ? cur.id : '';
  var left = 0, i;
  for(i = 0; i < tasks.length; i++){ if(!isPrepDone(tasks[i])) left++; }
  setText('prepCount', String(left));
  if(!tasks.length){ setHTML('prepList', '<div class="empty">老师还没有推送预习任务</div>'); return; }
  var html = '';
  for(i = 0; i < tasks.length; i++){
    var t = tasks[i];
    var done = isPrepDone(t);
    var dd = dayDiff(t['截止日期']);
    var cls = done ? 'done' : (dd < 0 ? 'over' : (dd === 0 ? 'soon' : ''));
    if(!done && nowId === t._id) cls += ' now';
    html += '<div class="task ' + cls + '" data-pick="prep" data-id="' + esc(t._id || '') + '">'
      + '<span class="bar"></span>'
      + '<div class="info"><div class="t1">' + esc(t['任务标题'] || '') + '</div>'
      + '<div class="t2">' + pill(t['内容类型'] || '任务') + '<span>' + esc(t['单元'] || '') + '</span>'
      + '<span>预计 ' + (Number(t['预计用时']) || 0) + ' 分钟</span>'
      + (done ? pill('已完成', 'g') : duePill(dd)) + '</div></div>'
      + '<span class="go">' + (done ? '完成' : '去做 →') + '</span>'
      + '</div>';
  }
  setHTML('prepList', html);
}
function renderReview(){
  var dues = dueReviews(), ups = upReviews();
  var q = mainQueue();
  var cur = q.length ? currentItem(q) : null;
  var nowId = (cur && cur.kind === 'review') ? cur.id : '';
  setText('reviewCount', String(dues.length));
  if(!dues.length && !ups.length){ setHTML('reviewList', '<div class="empty">暂无复习排期，先完成一次预习吧</div>'); return; }
  var html = '', i, r, dd, cls;
  for(i = 0; i < dues.length; i++){
    r = dues[i]; dd = dayDiff(r['下次复习']);
    cls = dd < 0 ? 'over' : 'soon';
    if(nowId === r._id) cls += ' now';
    html += '<div class="task ' + cls + '" data-pick="review" data-id="' + esc(r._id || '') + '">'
      + '<span class="bar"></span>'
      + '<div class="info"><div class="t1">' + esc(r['学习内容'] || '复习项') + '</div>'
      + '<div class="t2">' + pill(r['单元'] || '') + '<span>已复习 ' + (Number(r['复习次数']) || 0) + ' 次</span>'
      + pill(r['掌握度'] ? ('上次 ' + levelKeyOf(r['掌握度'])) : '未复习', 'gray')
      + duePill(dd) + '</div></div>'
      + '<span class="go">去复习 →</span>'
      + '</div>';
  }
  if(ups.length){
    html += '<div style="font-size:11.5px; font-weight:900; color:var(--ink2); margin:13px 0 8px;">排期中 · 按遗忘曲线自动安排</div>';
    for(i = 0; i < ups.length; i++){
      r = ups[i]; dd = dayDiff(r['下次复习']);
      html += '<div class="task">'
        + '<span class="bar"></span>'
        + '<div class="info"><div class="t1" style="font-weight:700;color:var(--mut)">' + esc(r['学习内容'] || '复习项') + '</div>'
        + '<div class="t2">' + pill(r['单元'] || '') + pill(dd === 1 ? '明天' : (dd + ' 天后'), 'g')
        + pill(r['掌握度'] ? levelKeyOf(r['掌握度']) : '—', 'gray') + '</div></div>'
        + '</div>';
    }
  }
  setHTML('reviewList', html);
}

/* ---------------- render: 成就画像 ---------------- */
function renderProfile(){
  var recs = myRecords();
  var i, j, r;
  var daySet = {}, minutes = 0, accSum = 0, accN = 0, mastered = 0;
  for(i = 0; i < recs.length; i++){
    r = recs[i];
    var d = parseDate(r['日期']);
    if(d) daySet[toKey(d)] = true;
    minutes += Number(r['用时分钟']) || 0;
    if(r['正确率'] !== null && r['正确率'] !== undefined && r['正确率'] !== ''){ accSum += Number(r['正确率']) || 0; accN++; }
    if(levelKeyOf(r['掌握度']) === '会了') mastered++;
  }
  var streak = 0;
  var probe = new Date();
  if(!daySet[toKey(probe)]){
    probe.setDate(probe.getDate() - 1);
    if(!daySet[toKey(probe)]) probe = null;
  }
  while(probe && daySet[toKey(probe)]){ streak++; probe.setDate(probe.getDate() - 1); }
  setText('meStreak', String(streak));
  setText('meStreakSub', daySet[toKey(new Date())] ? '今天已经学过了，保持住' : '今天还没开始');

  var done = doneTodayCount();
  var todayTotal = done + mainQueue().length;
  var todayPct = todayTotal ? Math.round((done / todayTotal) * 100) : 100;
  setWidth('gaugeToday', todayPct);
  setText('gaugeTodayNum', done + '/' + todayTotal);

  var total = recs.length || 1;
  var mPct = Math.round((mastered / total) * 100);
  setWidth('gaugeMastery', mPct);
  setText('gaugeMasteryNum', mastered + '/' + recs.length);

  var acc = accN ? Math.round(accSum / accN) : 0;
  setWidth('gaugeAcc', acc);
  setText('gaugeAccNum', acc + '%');

  var buckets = [];
  var today = new Date();
  for(i = 0; i < 7; i++){
    var dd = new Date(today.getFullYear(), today.getMonth(), today.getDate() - (6 - i));
    buckets.push({ key: toKey(dd), m: 0 });
  }
  for(i = 0; i < recs.length; i++){
    var rd = parseDate(recs[i]['日期']);
    if(!rd) continue;
    var k = toKey(rd);
    for(j = 0; j < buckets.length; j++){ if(buckets[j].key === k) buckets[j].m += Number(recs[i]['用时分钟']) || 0; }
  }
  var maxM = 1;
  for(i = 0; i < buckets.length; i++){ if(buckets[i].m > maxM) maxM = buckets[i].m; }
  var bars = '';
  for(i = 0; i < buckets.length; i++){
    var h = Math.max(3, Math.round(34 * (buckets[i].m / maxM)));
    bars += '<i class="' + (buckets[i].m > 0 ? 'on' : '') + '" style="height:' + h + 'px"></i>';
  }
  setHTML('mini7', bars);
  setText('mini7Cap', '近 7 天共 ' + minutes + ' 分钟 · 平均正确率 ' + acc + '%');

  var sorted = recs.slice().sort(function(a, b){
    var da = parseDate(a['日期']), db2 = parseDate(b['日期']);
    return (db2 ? db2.getTime() : 0) - (da ? da.getTime() : 0);
  });
  var aw = '', limit = Math.min(sorted.length, 5);
  for(i = 0; i < limit; i++){
    aw += '<div class="award"><span class="ck">✓</span>'
      + '<span class="tx">' + esc(sorted[i]['学习内容'] || '') + '</span>'
      + '<span class="dt">' + fmtDate(sorted[i]['日期']) + '</span></div>';
  }
  setHTML('awards', aw || '<div class="empty" style="padding:12px 0">还没有完成记录，从今天的预习开始吧</div>');
}

/* ---------------- toast ---------------- */
var toastTimer = null;
function toast(msg, kind){
  var el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = 'toast' + (kind ? ' ' + kind : ''); }, 2300);
}

/* ---------------- 登录 ---------------- */
function showGate(msg){
  var g = document.getElementById('gate');
  var a = document.getElementById('app');
  if(g) g.classList.remove('hide');
  if(a) a.classList.add('hide');
  setText('gateErr', msg || '');
  var el = document.getElementById('gateSid');
  if(el && !msg) el.focus();
}
function hideGate(){
  var g = document.getElementById('gate');
  var a = document.getElementById('app');
  if(g) g.classList.add('hide');
  if(a) a.classList.remove('hide');
}
function findByInput(sid, name){
  var s = String(sid || '').trim().toUpperCase();
  var n = String(name || '').trim();
  var i, hits = [];
  for(i = 0; i < state.accounts.length; i++){
    var a = state.accounts[i];
    if(s && String(a['学号'] || '').toUpperCase() === s) return { acc: a, err: '' };
    if(!s && n && a['姓名'] === n) hits.push(a);
  }
  if(s) return { acc: null, err: '没有找到这个学号，检查一下或联系老师' };
  if(hits.length === 1) return { acc: hits[0], err: '' };
  if(hits.length > 1) return { acc: null, err: '有多个同名同学，请输入学号' };
  return { acc: null, err: '请输入学号或姓名' };
}
function inputVal(id){
  var el = document.getElementById(id);
  return el ? String(el.value || '') : '';
}
function doLogin(){
  var res = findByInput(inputVal('gateSid'), inputVal('gateName'));
  if(!res.acc){ setText('gateErr', res.err); return; }
  if(res.acc['账户状态'] === '停用'){ setText('gateErr', '这个账号已停用，请联系老师'); return; }
  state.me = { sid: res.acc['学号'] || '', name: res.acc['姓名'] || '', klass: res.acc['所属班级'] || '' };
  cacheSet(LS_ME, state.me);
  state.skipped = {}; state.focusId = ''; state.openId = '';
  hideGate();
  refreshAll();
  toast('欢迎回来，' + state.me.name, 'ok');
}
function logout(){
  cacheClear(LS_ME);
  state.me = null;
  state.skipped = {}; state.focusId = ''; state.openId = '';
  var s = document.getElementById('gateSid');
  var n = document.getElementById('gateName');
  if(s) s.value = '';
  if(n) n.value = '';
  showGate('已退出登录');
}
function resolveMe(){
  var saved = cacheGet(LS_ME);
  if(!saved || !saved.sid){ showGate(''); return; }
  var res = findByInput(saved.sid, saved.name || '');
  if(!res.acc){ showGate('账号信息已变化，请重新登录'); return; }
  if(res.acc['账户状态'] === '停用'){ showGate('这个账号已停用，请联系老师'); return; }
  state.me = { sid: res.acc['学号'] || '', name: res.acc['姓名'] || '', klass: res.acc['所属班级'] || '' };
  cacheSet(LS_ME, state.me);
  hideGate();
}

/* ---------------- actions ---------------- */
function completePrep(itemId){
  if(state.busy) return;
  var task = null, i;
  var tasks = myPrepTasks();
  for(i = 0; i < tasks.length; i++){ if(tasks[i]._id === itemId) task = tasks[i]; }
  if(!task) return;
  var key = prepKey(task);
  if(SDK){
    state.busy = true; renderSync();
    var properties = {};
    properties['学生'] = { text: meName() };
    properties['记录类型'] = { select: '预习' };
    properties['学习内容'] = { text: key };
    properties['单元'] = { text: task['单元'] || '' };
    properties['用时分钟'] = { number: Number(task['预计用时']) || 0 };
    properties['掌握度'] = { select: '掌握' };
    properties['复习次数'] = { number: 0 };
    properties['日期'] = { date: todayISO() };
    properties['下次复习'] = { date: addDaysISO(1) };
    db.addRecord({ databaseId: 'qKJybtlu4NrEqJ7yUPTduo', properties: properties })
      .then(function(){
        state.focusId = ''; state.openId = '';
        toast('预习完成，已排入复习曲线', 'ok');
        loadAll();
      })
      .catch(function(err){
        console.error('[workbench] 预习写入失败', err);
        state.busy = false; renderSync();
        toast('保存失败，请稍后重试', 'err');
      });
  } else {
    state.records.push({ _id:'local-' + Date.now(), '学生':meName(), '记录类型':'预习', '学习内容':key,
      '单元':task['单元'] || '', '用时分钟':Number(task['预计用时']) || 0, '正确率':null,
      '掌握度':'掌握', '复习次数':0, '日期':todayISO(), '下次复习':addDaysISO(1), '备注':'' });
    state.focusId = ''; state.openId = '';
    toast('预习完成（演示模式）', 'ok');
    refreshAll();
  }
}
function openReview(itemId){
  state.openId = itemId;
  state.focusId = itemId;
  refreshAll();
}
function rateReview(itemId, levelKey){
  if(state.busy) return;
  var rec = null, i;
  var recs = myRecords();
  for(i = 0; i < recs.length; i++){ if(recs[i]._id === itemId) rec = recs[i]; }
  if(!rec) return;
  var lv = null;
  for(i = 0; i < LEVELS.length; i++){ if(LEVELS[i].k === levelKey) lv = LEVELS[i]; }
  if(!lv) return;
  var times = (Number(rec['复习次数']) || 0) + 1;
  var gap = intervalDays(times, lv.v);
  var next = addDaysISO(gap);
  if(SDK){
    state.busy = true; renderSync();
    var properties = {};
    properties['掌握度'] = { select: lv.v };
    properties['复习次数'] = { number: times };
    properties['日期'] = { date: todayISO() };
    properties['下次复习'] = { date: next };
    db.updateRecord({ databaseId: 'qKJybtlu4NrEqJ7yUPTduo', recordId: itemId, properties: properties })
      .then(function(){
        state.openId = ''; state.focusId = '';
        toast('「' + levelKey + '」已记录，' + gap + ' 天后再见', 'ok');
        loadAll();
      })
      .catch(function(err){
        console.error('[workbench] 复习写入失败', err);
        state.busy = false; renderSync();
        toast('保存失败，请稍后重试', 'err');
      });
  } else {
    rec['掌握度'] = lv.v; rec['复习次数'] = times; rec['日期'] = todayISO(); rec['下次复习'] = next;
    state.openId = ''; state.focusId = '';
    toast('「' + levelKey + '」已记录（演示模式）', 'ok');
    refreshAll();
  }
}
function skipItem(itemId){
  var kind = '', i;
  var preps = myPrepTasks();
  for(i = 0; i < preps.length; i++){ if(preps[i]._id === itemId) kind = 'prep'; }
  if(!kind){
    var dues = dueReviews();
    for(i = 0; i < dues.length; i++){ if(dues[i]._id === itemId) kind = 'review'; }
  }
  if(!kind) return;
  state.skipped[(kind === 'prep' ? 'p:' : 'r:') + itemId] = true;
  if(state.focusId === itemId) state.focusId = '';
  if(state.openId === itemId) state.openId = '';
  toast('已跳到下一项');
  refreshAll();
}
function focusItem(kind, id){
  var i;
  if(kind === 'review'){
    var dues = dueReviews();
    for(i = 0; i < dues.length; i++){
      if(dues[i]._id === id){ state.focusId = id; state.openId = ''; refreshAll(); return; }
    }
    toast('这一项还没到复习时间');
    return;
  }
  var preps = myPrepTasks();
  for(i = 0; i < preps.length; i++){
    if(preps[i]._id === id){
      if(isPrepDone(preps[i])){ toast('这项已经完成了'); return; }
      state.focusId = id; state.openId = ''; refreshAll();
      if(window.scrollTo) window.scrollTo(0, 0);
      return;
    }
  }
}

/* ---------------- data loading ---------------- */
function loadPrepTable(onDone){
  var acc = [];
  var sorts = [{ property: '推送时间', direction: 'descending' }];
  (function step(cursor, guard){
    if(guard > 20){ onDone(acc); return; }
    db.query({ databaseId: 'M2BiG1J9hhkYDOcdZFWi3s', sorts: sorts, pageSize: 200, startCursor: cursor })
      .then(function(r){
        var rows = (r && r.results) || [];
        acc = acc.concat(rows);
        if(r && r.hasMore && r.nextCursor && r.nextCursor !== cursor && rows.length){ step(r.nextCursor, guard + 1); }
        else { onDone(acc); }
      })
      .catch(function(err){ console.error('[workbench] 预习任务读取失败', err); onDone(null); });
  })(undefined, 0);
}

        var rows = (r && r.results) || [];
        acc = acc.concat(rows);
        if(r && r.hasMore && r.nextCursor && r.nextCursor !== cursor && rows.length){ step(r.nextCursor, guard + 1); }
        else { onDone(acc); }
      })
      .catch(function(err){ console.error('[workbench] 学习记录读取失败', err); onDone(null); });

}

    if(guard > 20){ onDone(acc); return; }
    db.query({ databaseId: '2OjdhXTwUccUa71i4R2wBx', sorts: sorts, pageSize: 200, startCursor: cursor })
      .then(function(r){

        else { onDone(acc); }
      })
      .catch(function(err){ console.error('[workbench] 学生账户读取失败', err); onDone(null); });
  })(undefined, 0);
}

var PART_MAP = {
  prep: { key: LS_CACHE_PREP, target: 'prep' },
  rec:  { key: LS_CACHE_REC,  target: 'records' },
  acc:  { key: LS_CACHE_ACC,  target: 'accounts' }
};
var loaded = { prep:false, rec:false, acc:false };
function onPartLoaded(which, rows){
  var meta = PART_MAP[which];
  if(rows){ state[meta.target] = rows; cacheSet(meta.key, rows); }
  else {
    state.offline = true;
    var cached = cacheGet(meta.key);
    if(cached) state[meta.target] = cached;
  }
  loaded[which] = true;
  if(loaded.prep && loaded.rec && loaded.acc){
    state.busy = false;
    resolveMe();
    refreshAll();
  }
}
function loadAll(){
  if(!SDK) return;
  state.busy = true;
  renderSync();
  loadPrepTable(function(rows){ onPartLoaded('prep', rows); });
  loadRecordTable(function(rows){ onPartLoaded('rec', rows); });
  loadAccountTable(function(rows){ onPartLoaded('acc', rows); });
}

/* ---------------- events ---------------- */
function bindEvents(){
  var go = document.getElementById('gateGo');
  if(go) go.addEventListener('click', doLogin);
  var sid = document.getElementById('gateSid');
  var nm = document.getElementById('gateName');
  if(sid) sid.addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
  if(nm) nm.addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });

  var me = document.getElementById('meBox');
  if(me){
    me.addEventListener('click', function(){
      var name = meName();
      if(!name) return;
      if(window.confirm('退出登录？（' + name + '）')) logout();
    });
  }

  document.addEventListener('click', function(e){
    var t = e.target;
    var pick = t.closest ? t.closest('[data-pick]') : null;
    if(pick){
      focusItem(pick.getAttribute('data-pick'), pick.getAttribute('data-id'));
      return;
    }
    var btn = t.closest ? t.closest('button[data-act]') : null;
    if(!btn) return;
    var act = btn.getAttribute('data-act');
    var id = btn.getAttribute('data-id');
    if(act === 'do-prep') completePrep(id);
    else if(act === 'open-review') openReview(id);
    else if(act === 'rate') rateReview(id, btn.getAttribute('data-k'));
    else if(act === 'skip') skipItem(id);
  });
}

/* ---------------- boot ---------------- */
function boot(){
  bindEvents();
  if(SDK){
    showGate('');
    loadAll();
  } else {
    demoRows();
    resolveMe();
    refreshAll();
  }
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
