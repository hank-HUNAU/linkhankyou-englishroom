<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef1f8">
<title>TH!NK · 教师教学工作台</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237C3AED'/><text x='50' y='72' font-size='58' font-family='sans-serif' font-weight='900' fill='white' text-anchor='middle'>T</text></svg>">
<style>
:root{
  --p:#10B981; --p-d:#059669; --v:#7C3AED; --vk:#EC4899; --cy:#06B6D4; --or:#F97316; --ye:#FACC15;
  --ink:#1d1d1f; --ink2:#1e1b4b; --mut:#64748b; --mut2:#94a3b8;
  --line:rgba(0,0,0,.075); --line2:rgba(0,0,0,.12);
  --bg:#eef1f8; --card:#ffffff;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:24px; --r-pill:999px;
  --sh-card:0 18px 36px -26px rgba(31,41,55,.34);
  --sh-pop:0 30px 60px -30px rgba(124,58,237,.42);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --grad-p:linear-gradient(135deg,#059669,#10B981);
  --grad-v:linear-gradient(135deg,#6D28D9,#7C3AED);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0; height:100%; overflow:hidden; overscroll-behavior:none;}
body{background:var(--bg); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; line-height:1.55;
     height:100vh; height:100dvh;
     padding:max(0px, env(safe-area-inset-top)) max(0px, env(safe-area-inset-right))
             max(0px, env(safe-area-inset-bottom)) max(0px, env(safe-area-inset-left));}
.bg-blobs{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.bg-blobs span{position:absolute; border-radius:50%; filter:blur(90px);}
.bg-blobs .b1{width:420px;height:420px;left:-4%;top:-6%;background:#7C3AED;opacity:.26;}
.bg-blobs .b2{width:400px;height:400px;right:-2%;top:2%;background:#10B981;opacity:.24;}
.bg-blobs .b3{width:460px;height:460px;left:24%;bottom:-14%;background:#EC4899;opacity:.14;}

.brandbox{display:flex; align-items:center; gap:10px;}
.mark{width:36px;height:36px;border-radius:11px;background:var(--grad-v);display:grid;place-items:center;
      box-shadow:0 10px 20px -10px rgba(124,58,237,.9); flex:0 0 auto;}
.mark svg{width:20px;height:20px;display:block;}
.btitle{font-weight:900; font-size:17px; letter-spacing:-.02em; color:var(--ink2); line-height:1.1;}
.bsub{font-size:10.5px; font-weight:700; letter-spacing:.14em; color:var(--mut2); text-transform:uppercase;}
.spacer{flex:1 1 auto;}
.seg{display:flex; gap:4px; padding:4px; background:rgba(255,255,255,.72); border:1px solid var(--line);
     border-radius:var(--r-pill); box-shadow:inset 0 1px 0 #fff;}
.seg button{appearance:none; border:0; background:transparent; cursor:pointer; font-family:inherit;
  font-weight:800; font-size:13px; color:var(--mut); padding:8px 14px; border-radius:var(--r-pill);
  transition:all .2s; white-space:nowrap; min-height:36px;}
.seg button.on{background:var(--grad-v); color:#fff; box-shadow:0 10px 18px -10px rgba(124,58,237,.9);}
.sync{display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:var(--r-pill);
      background:rgba(255,255,255,.8); border:1px solid var(--line); font-size:12px; font-weight:800; color:var(--mut);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut2);}
.sync.ok .dot{background:var(--p); box-shadow:0 0 0 3px rgba(16,185,129,.18);}
.sync.busy .dot{background:var(--ye); animation:pulse 1s infinite;}
.sync.off .dot{background:var(--or);}
@keyframes pulse{50%{opacity:.3;}}

.banner{display:none; align-items:center; gap:10px; margin:0 0 14px; padding:11px 14px; border-radius:var(--r-md);
        background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; font-size:13px; font-weight:700;}
.banner.show{display:flex;}
.banner svg{width:17px;height:17px;flex:0 0 auto;}

.hero{background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl); box-shadow:var(--sh-card);
      overflow:hidden; margin-bottom:16px;}
.hero-top{display:flex; align-items:center; gap:12px; padding:16px 18px 12px;}
.hero-ico{width:38px;height:38px;border-radius:12px;background:var(--grad-v);display:grid;place-items:center;
          box-shadow:0 12px 22px -12px rgba(124,58,237,.9); flex:0 0 auto;}
.hero-ico svg{width:19px;height:19px;}
.hero .hint{margin:1px 0 0; font-size:12px; color:var(--mut); font-weight:600;}
.hero-count{margin-left:auto; text-align:right;}
.hero-count b{display:block; font-size:26px; font-weight:900; letter-spacing:-.04em; line-height:1;
              background:var(--grad-v); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero-count span{font-size:11px; font-weight:700; color:var(--mut2);}
.hero-list{padding:0 12px 12px;}

.task{display:flex; align-items:center; gap:12px; padding:12px; border-radius:var(--r-md);
      border:1px solid var(--line); background:#fcfdff; margin-bottom:8px;}
.task:last-child{margin-bottom:0;}
.task.warn{border-color:#fecaca; background:#fff5f5;}
.task.soon{border-color:#fde68a; background:#fffdf5;}
.task .bar{width:4px; align-self:stretch; border-radius:99px; background:var(--mut2); flex:0 0 auto;}
.task.warn .bar{background:#ef4444;}
.task.soon .bar{background:var(--or);}
.task.ok .bar{background:var(--p);}
.task .info{flex:1 1 auto; min-width:0;}
.task .t1{font-size:14px; font-weight:800; color:var(--ink);}
.task .t2{font-size:11.5px; font-weight:700; color:var(--mut); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.pill{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:var(--r-pill);
      font-size:11px; font-weight:800; background:rgba(124,58,237,.09); color:#6D28D9;}
.pill.g{background:rgba(16,185,129,.12); color:var(--p-d);}
.pill.o{background:rgba(249,115,22,.13); color:#c2410c;}
.pill.r{background:rgba(239,68,68,.12); color:#b91c1c;}
.pill.c{background:rgba(6,182,212,.13); color:#0e7490;}
.empty{padding:22px 12px; text-align:center; color:var(--mut2); font-size:13px; font-weight:700;}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl); box-shadow:var(--sh-card); padding:16px;}
.card.full{grid-column:1 / -1;}
.ch{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.ch .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;}
.ch .ico.g{background:rgba(16,185,129,.12); color:var(--p-d);}
.ch .ico.v{background:rgba(124,58,237,.12); color:#6D28D9;}
.ch .ico.c{background:rgba(6,182,212,.14); color:#0e7490;}
.ch svg{width:17px;height:17px;}
.ch h3{margin:0; font-size:14.5px; font-weight:900; color:var(--ink2);}
.ch .sub{font-size:11.5px; color:var(--mut2); font-weight:700; margin-top:1px;}
.ch .cnt{margin-left:auto; font-size:12px; font-weight:800; color:var(--mut); background:rgba(0,0,0,.045);
         padding:4px 10px; border-radius:var(--r-pill);}

.field{margin-bottom:11px;}
.field label{display:block; font-size:12px; font-weight:800; color:var(--ink2); margin-bottom:5px;}
.field label i{color:#ef4444; font-style:normal;}
.field input,.field select,.field textarea{
  width:100%; font-family:inherit; font-size:16px; font-weight:600; color:var(--ink);
  padding:11px 12px; border:1.5px solid var(--line2); border-radius:var(--r-sm); background:#fff;
  -webkit-appearance:none; appearance:none; transition:border-color .18s, box-shadow .18s;
}
.field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat; background-position:right 11px center; background-size:16px; padding-right:34px;}
.field textarea{min-height:74px; resize:vertical; line-height:1.5;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:rgba(124,58,237,.55); box-shadow:0 0 0 3px rgba(124,58,237,.14);}
.f2{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
@media (max-width:520px){ .f2{grid-template-columns:1fr;} }
.btn{appearance:none; border:0; cursor:pointer; font-family:inherit; font-weight:800; font-size:13px;
  padding:0 16px; min-height:46px; border-radius:var(--r-sm); transition:all .2s; white-space:nowrap; width:100%;}
.btn-p{background:var(--grad-p); color:#fff; box-shadow:0 12px 22px -11px rgba(16,185,129,.9);}
.btn-v{background:var(--grad-v); color:#fff; box-shadow:0 12px 22px -11px rgba(124,58,237,.9);}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:.55; cursor:default; transform:none; box-shadow:none;}

.row{display:flex; gap:11px; align-items:flex-start; padding:11px; border-radius:var(--r-md);
     border:1px solid var(--line); background:#fcfdff; margin-bottom:8px;}
.row:last-child{margin-bottom:0;}
.row .main{flex:1 1 auto; min-width:0;}
.row .nm{font-size:13.5px; font-weight:800; color:var(--ink);}
.row .meta{font-size:11.5px; font-weight:700; color:var(--mut); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.row .act{flex:0 0 auto;}
.rlink{font-size:12px; font-weight:800; color:#6D28D9; text-decoration:none;}
.rlink:hover{text-decoration:underline;}

.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:11px; margin-bottom:16px;}
@media (max-width:620px){ .kpis{grid-template-columns:1fr 1fr;} }
.kpi{border:1px solid var(--line); border-radius:var(--r-md); padding:12px 13px; background:#fcfdff;}
.kpi .k{font-size:11px; font-weight:800; color:var(--mut2);}
.kpi b{display:block; font-size:23px; font-weight:900; letter-spacing:-.03em; color:var(--ink2); line-height:1.25;}
.kpi b em{font-style:normal; font-size:12px; font-weight:800; color:var(--mut); margin-left:2px;}
.kpi.hl{background:linear-gradient(180deg,rgba(124,58,237,.09),rgba(124,58,237,.02)); border-color:rgba(124,58,237,.28);}
.kpi.hl b{color:#6D28D9;}

.mem{display:flex; gap:5px; flex-wrap:wrap; margin-top:9px;}
.mtrack{width:74px; height:7px; border-radius:99px; background:rgba(0,0,0,.07); overflow:hidden; display:inline-block; vertical-align:middle;}
.mfill{height:100%; border-radius:99px; display:block;}
.tag{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:var(--r-pill);
     background:rgba(16,185,129,.11); color:var(--p-d); font-size:11px; font-weight:800;}
.tag.off{background:rgba(0,0,0,.06); color:var(--mut2);}
.mini{appearance:none; border:0; cursor:pointer; font-family:inherit; font-weight:800; font-size:12px;
      padding:0 12px; min-height:36px; border-radius:var(--r-sm); background:rgba(0,0,0,.055); color:var(--ink2); transition:all .18s;}
.mini:hover{background:rgba(0,0,0,.1);}
.mini.p{background:rgba(16,185,129,.14); color:var(--p-d);}
.mini.d{background:rgba(239,68,68,.11); color:#b91c1c;}
.arow{display:flex; align-items:center; gap:8px; padding:10px 11px; border-radius:var(--r-md); flex-wrap:wrap;
      border:1px solid var(--line); background:#fcfdff; margin-bottom:8px;}
.arow:last-child{margin-bottom:0;}
.arow.off{opacity:.62;}
.arow .who{flex:1 1 150px; min-width:0;}
.picker{display:flex; gap:6px; flex-wrap:wrap; padding:8px; border:1.5px dashed var(--line2);
        border-radius:var(--r-sm); background:#fbfcff; min-height:46px; align-items:center;}
.picker .ph{font-size:12px; font-weight:700; color:var(--mut2);}
.chipx{appearance:none; border:1.5px solid var(--line2); background:#fff; cursor:pointer; font-family:inherit;
  font-size:12px; font-weight:800; color:var(--mut); padding:6px 12px; border-radius:var(--r-pill);
  min-height:36px; transition:all .18s;}
.chipx:hover{border-color:rgba(124,58,237,.42); color:#6D28D9;}
.chipx.on{background:var(--grad-v); border-color:transparent; color:#fff;}
.fhint{font-size:11px; font-weight:700; color:var(--mut2); margin-top:5px;}
form.editing{background:rgba(249,115,22,.05); border-radius:var(--r-md); padding:10px; margin:0 -10px;}
.arow .who b{font-size:13px; font-weight:900; color:var(--ink);}
.arow .who .sid{font-size:11px; font-weight:800; color:var(--mut2); margin-left:6px;}
.arow .who .m{font-size:11.5px; font-weight:700; color:var(--mut); margin-top:2px;}
footer{flex:0 0 auto; text-align:center; color:var(--mut2); font-size:11px; font-weight:700;
  padding:8px 4px calc(6px + env(safe-area-inset-bottom));}

.toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translate(-50%,20px);
  background:var(--ink2); color:#fff; font-size:13px; font-weight:800; padding:11px 18px; border-radius:var(--r-pill);
  box-shadow:var(--sh-pop); opacity:0; pointer-events:none; transition:all .25s; z-index:50; max-width:88vw; text-align:center;}
.toast.show{opacity:1; transform:translate(-50%,0);}
.toast.err{background:#b91c1c;}
@media (max-width:520px){ .side{padding:7px 10px;} .bsub{display:none;} }
/* ---------- 外壳：左导航 + 右内容（视口锁定 App 外壳，页面零滚动） ---------- */
.app{position:relative; z-index:1; display:grid; grid-template-columns:224px minmax(0,1fr); height:100%;}
.side{position:relative; align-self:stretch; height:100%; display:flex; flex-direction:column; gap:14px;
  padding:16px 13px; background:rgba(255,255,255,.74); border-right:1px solid var(--line);
  backdrop-filter:saturate(1.5) blur(12px); -webkit-backdrop-filter:saturate(1.5) blur(12px);}
.side-brand{display:flex; align-items:center; gap:9px; padding:0 3px;}
.side-brand .btitle{font-size:15px;}
.side-brand .bsub{font-size:9.5px;}
.side-nav{display:flex; flex-direction:column; gap:4px; flex:1 1 auto; overflow-y:auto; min-height:0;}
.side-nav button{appearance:none; border:0; background:transparent; cursor:pointer; font-family:inherit;
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:10px 11px; min-height:44px;
  border-radius:var(--r-sm); font-weight:800; font-size:13.5px; color:var(--mut); transition:all .18s; flex:0 0 auto;}
.side-nav button:hover{background:rgba(0,0,0,.045); color:var(--ink2);}
.side-nav button.on{background:var(--grad-v); color:#fff; box-shadow:0 10px 20px -12px rgba(124,58,237,.9);}
.side-nav svg{width:17px; height:17px; flex:0 0 auto;}
.side-foot{display:flex; flex-direction:column; gap:8px; flex:0 0 auto;}
.side-foot .sync{justify-content:center;}
.body{display:flex; flex-direction:column; min-width:0; height:100%; min-height:0; overflow:hidden;}
.topbar{position:relative; z-index:20; flex:0 0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:11px 20px; background:rgba(238,241,248,.86); backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px); border-bottom:1px solid var(--line);}
.tb-title{font-size:15.5px; font-weight:900; color:var(--ink2); letter-spacing:-.01em; line-height:1.2;}
.tb-sub{font-size:11.5px; font-weight:700; color:var(--mut2);}
/* main 不再滚动：它是视图容器，滚动发生在每个视图内部 */
main{flex:1 1 auto; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; padding:0 20px;}

.view{display:none;}
/* 普通视图：填满剩余高度，自己滚 */
.view.on{display:block; flex:1 1 auto; min-height:0; width:100%; max-width:1280px; margin:0 auto;
  padding:16px 0 20px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.view.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl); box-shadow:var(--sh-card); padding:16px;}
/* 分栏视图：填满不滚，滚动交给 pane 内部 */
.view.split{grid-template-columns:minmax(260px,320px) minmax(0,1fr); gap:14px;}
.view.split.on{display:grid; overflow:hidden; padding:14px 0; grid-template-rows:minmax(0,1fr);}
.banner{width:100%; max-width:1280px; margin:14px auto 0; flex:0 0 auto;}
/* 推送页双栏：左表单（低频）右管理（高频），窄屏折单列表单在上 */
.push-grid{display:grid; grid-template-columns:5fr 7fr; gap:18px; align-items:start;}
.push-col{min-width:0;}
@media (max-width:1024px){ .push-grid{grid-template-columns:1fr;} }
.m7bars{display:flex; gap:6px; align-items:flex-end; height:56px; padding:8px 10px;
  border:1px solid var(--line); border-radius:var(--r-sm); background:#fcfdff;}
.m7bars .m7col{flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  gap:3px; height:100%;}
.m7bars .m7col i{display:block; width:100%; max-width:20px; background:var(--grad-v); border-radius:3px; min-height:3px;}
.m7bars .m7col em{font-style:normal; font-size:11px; font-weight:800; color:var(--mut2); line-height:1;}

.pane{border:1px solid var(--line); border-radius:var(--r-lg); background:var(--card); box-shadow:var(--sh-card);
  display:flex; flex-direction:column; overflow:hidden; min-height:0; height:100%;}
.pane-hd{display:flex; align-items:center; gap:8px; padding:0 13px; height:44px; flex:0 0 auto;
  border-bottom:1px solid var(--line); font-size:12.5px; font-weight:900; color:var(--ink2);}
.pane-hd .cnt{margin-left:auto; font-size:11.5px; font-weight:800; color:var(--mut);
  background:rgba(0,0,0,.045); padding:3px 10px; border-radius:var(--r-pill);}
.pane-bd{padding:11px 12px; overflow-y:auto; flex:1 1 auto; min-height:0;}
.pane-back{display:none; appearance:none; border:0; background:rgba(124,58,237,.10); color:#6D28D9; cursor:pointer;
  font-family:inherit; font-weight:800; font-size:11.5px; padding:6px 10px; min-height:32px; border-radius:var(--r-sm); margin-right:2px; align-items:center;}

.prow{appearance:none; border:1px solid var(--line); background:#fcfdff; cursor:pointer; font-family:inherit;
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:10px 11px; min-height:52px;
  border-radius:var(--r-md); margin-bottom:7px; transition:all .16s;}
.prow:last-child{margin-bottom:0;}
.prow:hover{border-color:rgba(124,58,237,.34);}
.prow.on{border-color:rgba(124,58,237,.55); background:linear-gradient(180deg,rgba(124,58,237,.07),rgba(124,58,237,.01));}
.prow-main{flex:1 1 auto; min-width:0;}
.prow-main b{display:block; font-size:13px; font-weight:900; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.prow-main i{display:block; font-style:normal; font-size:11px; font-weight:700; color:var(--mut); margin-top:2px;}
.prow.off{opacity:.62;}

.dhead{display:flex; align-items:center; gap:8px; margin-bottom:11px;}
.dhead b{font-size:16px; font-weight:900; color:var(--ink2);}
.dgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;}
.dgrid > div{border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 10px; background:#fcfdff;}
.dgrid span{display:block; font-size:10.5px; font-weight:800; color:var(--mut2);}
.dgrid b{display:block; font-size:13px; font-weight:900; color:var(--ink); margin-top:2px;}
.dh{font-size:11.5px; font-weight:900; color:var(--ink2); margin:0 0 7px;}
.dnote{font-size:11.5px; font-weight:700; color:var(--mut); background:rgba(0,0,0,.035); border-radius:var(--r-sm);
  padding:8px 10px; margin-bottom:12px;}
.dactions{display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 4px;}
.xform{margin-top:14px; border-top:1px dashed var(--line); padding-top:10px;}
.xform summary{cursor:pointer; font-size:12.5px; font-weight:800; color:#6D28D9; padding:4px 0;}
.xform[open] summary{margin-bottom:8px;}
/* 宽屏下表单不过度拉伸：推送/资源表单限宽，字段保持可扫读的长度 */
.view.card form{max-width:760px;}
.kpis.mini{grid-template-columns:1fr 1fr; gap:8px; margin-bottom:11px;}
.kpis.mini .kpi{padding:9px 10px;}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  'use strict';

  /* ============ 后端配置 ============
     Supabase 建好后：enabled 改 true，填入 Project URL + anon public key。
     CDN 加载失败或 enabled=false 时自动回落资料库 SDK；两者皆无则演示模式。 */
  var SUPA_CONFIG = {
    enabled: true,
    url: 'https://zwatrfbqkrvxpqtypdgx.supabase.co',
    anonKey: 'sb_publishable_mnkBBrHF70guvwfUNXuhBg_sIok8eBc'
  };
  var SUPA_TABLES = {
    'M2BiG1J9hhkYDOcdZFWi3s': 'prep_tasks',
    'qKJybtlu4NrEqJ7yUPTduo': 'learning_records',
    'iRti0RoXNhXFoekVY9y4Cf': 'resources',
    'PUQ5oUZJNDYWKBBMpIijgw': 'classes',
    '2OjdhXTwUccUa71i4R2wBx': 'students'
  };
  function makeSupaAdapter(){
    var client = window.supabase.createClient(SUPA_CONFIG.url, SUPA_CONFIG.anonKey);
    function tableOf(databaseId){
      var t = SUPA_TABLES[databaseId];
      if(!t) throw new Error('未知数据库: ' + databaseId);
      return t;
    }
    function outVal(v){
      if(v === null || v === undefined) return null;
      if(typeof v === 'object'){
        if(v.url && v.url.link) return v.url.link;
        if(v.text !== undefined) return v.text;
        if(v.select !== undefined) return v.select;
        if(v.number !== undefined) return v.number;
        if(v.date !== undefined) return v.date;
      }
      return v;
    }
    function patchOf(properties){
      var out = {}, k;
      for(k in properties){ if(Object.prototype.hasOwnProperty.call(properties, k)) out[k] = outVal(properties[k]); }
      return out;
    }
    function rowOf(r, databaseId){
      var row = { _id: r.id }, k;
      for(k in r){
        if(k === 'id' || k === 'created_at') continue;
        if(databaseId === 'iRti0RoXNhXFoekVY9y4Cf' && k === '链接'){
          row['链接'] = r[k] ? [{ text: r['资源名称'] || '打开', link: r[k] }] : [];
          continue;
        }
        row[k] = (r[k] === null) ? '' : r[k];
      }
      return row;
    }
    function query(opts){
      var sorts = opts.sorts || [];
      var page = parseInt(opts.startCursor, 10) || 0;
      var size = Math.min(opts.pageSize || 200, 1000);
      var q = client.from(tableOf(opts.databaseId)).select('*');
      for(var i = 0; i < sorts.length; i++){
        q = q.order(sorts[i].property, { ascending: sorts[i].direction !== 'descending' });
      }
      q = q.range(page * size, page * size + size - 1);
      return q.then(function(res){
        if(res.error) throw res.error;
        var rows = [], i;
        for(i = 0; i < (res.data || []).length; i++) rows.push(rowOf(res.data[i], opts.databaseId));
        var more = rows.length === size;
        return { results: rows, hasMore: more, nextCursor: more ? String(page + 1) : undefined };
      });
    }
    return {
      query: query,
      getSchema: function(){ return Promise.resolve({ properties: [] }); },
      addRecord: function(opts){
        return client.from(tableOf(opts.databaseId)).insert(patchOf(opts.properties))
          .then(function(res){ if(res.error) throw res.error; return res.data; });
      },
      updateRecord: function(opts){
        return client.from(tableOf(opts.databaseId)).update(patchOf(opts.properties)).eq('id', opts.recordId)
          .then(function(res){ if(res.error) throw res.error; return res.data; });
      },
      deleteRecord: function(opts){
        return client.from(tableOf(opts.databaseId)).delete().eq('id', opts.recordId)
          .then(function(res){ if(res.error) throw res.error; return res.data; });
      }
    };
  }

  /* 后端选择：Supabase（启用且库加载成功）→ 资料库 SDK → null（演示模式） */
  var SDK = (function(){
    var supa = null;
    if(SUPA_CONFIG.enabled && typeof window.supabase !== 'undefined' && window.supabase.createClient){
      try { supa = makeSupaAdapter(); }
      catch(e){ console.error('[workbench] Supabase 初始化失败，回落资料库 SDK', e); }
    }
    var lib = (typeof window !== 'undefined' && window.__SMART_PAGE__ && window.__SMART_PAGE__.database) ? window.__SMART_PAGE__.database : null;
    return supa || lib;
  })();
  var db = SDK;

  /* ---------------- storage ---------------- */
  function cacheGet(key){
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
  }
  function cacheSet(key, val){
    try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
  }
  function cacheClear(key){
    try { localStorage.removeItem(key); } catch(e){}
  }

  /* ---------------- dates ---------------- */
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function toKey(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function parseDate(iso){ if(!iso) return null; var d = new Date(iso); return isNaN(d.getTime()) ? null : d; }
  function fmtDate(iso){ var d = parseDate(iso); return d ? ((d.getMonth()+1) + '月' + d.getDate() + '日') : '—'; }
  function dayDiff(iso){
    var d = parseDate(iso);
    if(!d) return 9999;
    var t = new Date();
    var a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var b = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((a - b) / 86400000);
  }
  function todayISO(){ return toKey(new Date()); }
  function addDaysISO(n){ var d = new Date(); d.setDate(d.getDate() + n); return toKey(d); }

  /* ---------------- derived data ---------------- */
  function classNames(){
    var out = [], i;
    for(i = 0; i < state.classes.length; i++){
      if(state.classes[i]['班级名称']) out.push(state.classes[i]['班级名称']);
    }
    return out;
  }
  function accountOf(name){
    for(var i = 0; i < state.accounts.length; i++){
      if(state.accounts[i]['姓名'] === name) return state.accounts[i];
    }
    return null;
  }
  function classOf(name){
    var a = accountOf(name);
    return (a && a['所属班级']) ? a['所属班级'] : '未分班';
  }
  function inScope(name){
    if(state.scope === '全部') return true;
    return classOf(name) === state.scope;
  }
  function allStudents(){
    var seen = {}, out = [], i;
    for(i = 0; i < state.accounts.length; i++){
      var a = state.accounts[i];
      if(a['姓名'] && !seen[a['姓名']]){ seen[a['姓名']] = true; out.push(a['姓名']); }
    }
    for(i = 0; i < state.records.length; i++){
      var n = state.records[i]['学生'];
      if(n && !seen[n]){ seen[n] = true; out.push(n); }
    }
    return out.sort();
  }
  function visibleStudents(){ return allStudents().filter(inScope); }
  function studentRecords(name){
    return state.records.filter(function(r){ return r['学生'] === name; });
  }
  function classMembers(className){
    return state.accounts.filter(function(a){ return a['所属班级'] === className; });
  }
  function classActiveCount(className){
    return classMembers(className).filter(function(a){ return a['账户状态'] !== '停用'; }).length;
  }
  function studentStats(name){
    var recs = studentRecords(name);
    var accSum = 0, accN = 0, overdue = 0, due = 0, minutes = 0, latest = null;
    for(var i = 0; i < recs.length; i++){
      var r = recs[i];
      minutes += Number(r['用时分钟']) || 0;
      if(r['正确率'] !== null && r['正确率'] !== undefined && r['正确率'] !== ''){
        accSum += Number(r['正确率']) || 0; accN++;
      }
      var d = dayDiff(r['下次复习']);
      if(d <= 0) due++;
      if(d < 0) overdue++;
      var rd = parseDate(r['日期']);
      if(rd && (!latest || rd > latest)) latest = rd;
    }
    return { name: name, klass: classOf(name), count: recs.length,
             acc: accN ? Math.round(accSum / accN) : 0, overdue: overdue, due: due,
             minutes: minutes, latest: latest, idleDays: latest ? Math.round((new Date() - latest) / 86400000) : 99 };
  }
  function targetLabel(t){
    var mode = t['推送方式'] || '全班';
    if(mode === '全班') return '全班';
    return mode + '：' + (t['推送对象'] || '未指定');
  }
  function activeTasks(){
    return state.prep.filter(function(t){ return t['任务状态'] !== '已撤回'; });
  }
  function findTask(recId){
    for(var i = 0; i < state.prep.length; i++){ if(state.prep[i]._id === recId) return state.prep[i]; }
    return null;
  }
  function targetNamesOf(t){
    var s = t['推送对象'] || '';
    return s.split(/[、,，;；|]+/).filter(function(x){ return !!x; });
  }
  function isoDay(iso){
    var d = parseDate(iso);
    if(!d) return '';
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function taskDoneCount(title){
    var key = '预习：' + title, n = 0, seen = {};
    for(var i = 0; i < state.records.length; i++){
      var r = state.records[i];
      if(r['记录类型'] === '预习' && r['学习内容'] === key && !seen[r['学生']]){
        seen[r['学生']] = true; n++;
      }
    }
    return n;
  }

  /* ---------------- rendering ---------------- */
  function esc(s){
    var v = String(s === null || s === undefined ? '' : s);
    return v.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\u0022/g, '&quot;');
  }
  /* 二次防线：所有动态文本均已用 esc() 转义，这里再剥离脚本/内联事件等危险片段 */
  function sanitizeHtml(html){
    var v = String(html === null || html === undefined ? '' : html);
    return v.replace(/<\s*script[\s\S]*?<\s*\/\s*script\s*>/gi, '')
            .replace(/\son[a-z]+\s*=\s*[^\s>]*/gi, '')
            .replace(/javascript:/gi, '');
  }
  function pill(text, tone){ return '<span class="pill ' + (tone || '') + '">' + esc(text) + '</span>'; }
  function setText(id, text){ var el = document.getElementById(id); if(el) el.textContent = text; }
  function setHTML(id, html){ var el = document.getElementById(id); if(el) el.innerHTML = sanitizeHtml(html); }

  function renderFocus(){
    var items = [];
    var names = visibleStudents();
    var allCount = allStudents().length;
    var i, j;

    for(i = 0; i < names.length; i++){
      var st = studentStats(names[i]);
      if(st.overdue > 0){
        items.push({ days: -1, cls: 'warn', act: 'goto-acc', name: st.name, title: st.name + ' · 有 ' + st.overdue + ' 项复习已逾期',
          meta: '累计学习 ' + st.minutes + ' 分钟 · 平均正确率 ' + st.acc + '%' });
      }
      if(st.idleDays >= 2 && st.count > 0){
        items.push({ days: 0, cls: 'soon', act: 'goto-acc', name: st.name, title: st.name + ' 已 ' + st.idleDays + ' 天没有学习记录',
          meta: '最近学习：' + (st.latest ? fmtDate(st.latest) : '—') });
      }
    }
    var tasks = activeTasks();
    for(i = 0; i < tasks.length; i++){
      var t = tasks[i];
      var dd = dayDiff(t['截止日期']);
      if(dd <= 1){
        var done = taskDoneCount(t['任务标题']);
        items.push({ days: dd, cls: dd <= 0 ? 'warn' : 'soon', act: 'goto-task', id: t._id,
          title: t['任务标题'],
          meta: (dd <= 0 ? '已截止 · ' : '明天截止 · ') + '完成 ' + done + '/' + (allCount || 0) + ' 人' });
      }
    }
    items.sort(function(a, b){ return a.days - b.days; });

    setText('focusCount', String(items.length));
    if(!items.length){
      setHTML('focusList', '<div class="empty">当前没有需要特别关注的学情事项</div>');
      setText('focusHint', '逾期复习 · 今日截止 · 长时间未学习');
      return;
    }
    var k = 0;
    for(i = 0; i < items.length; i++){ if(items[i].cls === 'warn') k++; }
    setText('focusHint', k ? ('有 ' + k + ' 项需要优先处理') : '共 ' + items.length + ' 项待关注');

    var html = '';
    for(i = 0; i < items.length; i++){
      var it = items[i];
      html += '<div class="task ' + it.cls + '">'
        + '<span class="bar"></span>'
        + '<div class="info"><div class="t1">' + esc(it.title) + '</div>'
        + '<div class="t2">' + pill(it.cls === 'warn' ? '优先' : '关注', it.cls === 'warn' ? 'r' : 'o')
        + '<span>' + esc(it.meta) + '</span></div></div>'

        + '>去处理</button>'
        + '</div>';
    }
    setHTML('focusList', html);
  }

  function retractTask(recId){
    if(state.busy) return;
    var t = findTask(recId);
    if(!t) return;
    var off = t['任务状态'] === '已撤回';
    var next = off ? '已推送' : '已撤回';
    if(SDK){
      state.busy = true; renderSync();
      var properties = {};
      properties['任务状态'] = { select: next };
      db.updateRecord({ databaseId: 'M2BiG1J9hhkYDOcdZFWi3s', recordId: recId, properties: properties })
        .then(function(){ toast(off ? '任务已重新推送' : '任务已撤回，学生端不再显示'); loadAll(); })
        .catch(function(err){
          console.error('[workbench] 任务状态更新失败', err);
          state.busy = false; renderSync();
          toast('操作失败，请稍后重试', true);
        });
    } else {
      t['任务状态'] = next;
      toast(off ? '任务已重新推送（演示模式）' : '任务已撤回（演示模式）');
      refreshAll();
    }
  }

  /* ---------------- form cache ---------------- */
  function formValues(form){
    var out = {}, els = form.querySelectorAll('input,select,textarea');
    for(var i = 0; i < els.length; i++){
      var el = els[i];
      if(!el.name || el.type === 'password' || el.hasAttribute('data-no-cache')) continue;
      out[el.name] = el.value;
    }
    return out;
  }
  function restoreForm(form, key){
    var saved = cacheGet(key);
    if(!saved) return;
    for(var k in saved){
      if(!Object.prototype.hasOwnProperty.call(saved, k)) continue;
      var el = form.querySelector('[name="' + k + '"]');
      if(el && el.value === '') el.value = saved[k];
    }
  }
  var draftTimers = {};
  function bindFormCache(form, key){
    var handler = function(){
      if(draftTimers[key]) clearTimeout(draftTimers[key]);
      draftTimers[key] = setTimeout(function(){ cacheSet(key, formValues(form)); }, 300);
    };
    form.addEventListener('input', handler);
    form.addEventListener('change', handler);
  }
  function clearDraft(key){ cacheClear(key); }

    if(form) form.className = recId ? 'editing' : '';
    if(btn) btn.textContent = recId ? '保存修改' : '创建班级';
    if(cancel) cancel.style.display = recId ? '' : 'none';
    if(sum) sum.textContent = recId ? ('正在修改：' + ((cur && cur['班级名称']) || '')) : '＋ 新建班级';
    var det = document.getElementById('clsDetails');
    if(det && recId) det.open = true;
  }
  function startEditClass(recId){
    var c = findClass(recId);
    if(!c) return;
    fillForm(document.getElementById('clsForm'), {
      '班级名称': c['班级名称'] || '', '学段': c['学段'] || '', '授课教师': c['授课教师'] || '',
      '计划人数': c['计划人数'], '班级状态': c['班级状态'] || '', '备注': c['备注'] || ''
    });
    setClassEditMode(recId);
    refreshAll();
    toast('正在修改班级信息');
  }
  function cancelEditClass(){
    var form = document.getElementById('clsForm');
    if(form) form.reset();
    setClassEditMode('');
    refreshAll();
  }
  function deleteClass(recId, name){
    if(state.busy) return;
    if(SDK){
      state.busy = true; renderSync();
      db.deleteRecord({ databaseId: 'PUQ5oUZJNDYWKBBMpIijgw', recordId: recId })
        .then(function(){ toast('已删除班级「' + name + '」'); loadAll(); })
        .catch(function(err){ console.error('[workbench] 删除班级失败', err); state.busy = false; renderSync(); toast('删除失败，请稍后重试', true); });
    } else {
      state.classes = state.classes.filter(function(c){ return c._id !== recId; });
      toast('已删除班级（演示模式）');
      refreshAll();
    }
  }
  function submitClass(){
    if(state.busy) return;
    var form = document.getElementById('clsForm');
    var name = form.querySelector('[name="班级名称"]').value.trim();
    if(!name){ toast('请填写班级名称', true); return; }
    var level = form.querySelector('[name="学段"]').value.trim();
    var teacher = form.querySelector('[name="授课教师"]').value.trim();
    var cap = form.querySelector('[name="计划人数"]').value;
    var st = form.querySelector('[name="班级状态"]').value;
    var note = form.querySelector('[name="备注"]').value.trim();
    var btn = document.getElementById('cfSubmit');
    var editing = state.editingClassId;

    if(SDK){
      state.busy = true; renderSync();
      if(btn){ btn.disabled = true; btn.textContent = editing ? '保存中…' : '创建中…'; }
      var properties = {};
      properties['班级名称'] = { text: name };
      properties['学段'] = { text: level };
      properties['授课教师'] = { text: teacher };
      properties['计划人数'] = { number: Number(cap) || 0 };
      properties['班级状态'] = { select: st || '进行中' };
      properties['备注'] = { text: note };
      var job;
      if(editing){
        job = db.updateRecord({ databaseId: 'PUQ5oUZJNDYWKBBMpIijgw', recordId: editing, properties: properties });
      } else {
        properties['创建时间'] = { date: todayISO() };
        job = db.addRecord({ databaseId: 'PUQ5oUZJNDYWKBBMpIijgw', properties: properties });
      }
      job.then(function(){
        clearDraft(LS_DRAFT_CLS);
        form.reset();
        if(editing){ setClassEditMode(''); toast('班级信息已更新'); }
        else { toast('班级已创建'); }
        loadAll();
      }).catch(function(err){
        console.error('[workbench] 班级保存失败', err);
        state.busy = false; renderSync();
        toast('保存失败，请稍后重试', true);
      });
      setTimeout(function(){ if(btn){ btn.disabled = false; btn.textContent = state.editingClassId ? '保存修改' : '创建班级'; } }, 800);
    } else {
      if(editing){
        var t = findClass(editing);
        if(t){
          t['班级名称'] = name; t['学段'] = level; t['授课教师'] = teacher;
          t['计划人数'] = Number(cap) || 0; t['班级状态'] = st || '进行中'; t['备注'] = note;
        }
        setClassEditMode('');
        toast('班级信息已更新（演示模式）');
      } else {
        state.classes.unshift({ _id:'local-' + Date.now(), '班级名称':name, '学段':level, '授课教师':teacher,
          '计划人数':Number(cap) || 0, '班级状态':st || '进行中', '创建时间':todayISO(), '备注':note });
        toast('班级已创建（演示模式）');
      }
      form.reset();
      refreshAll();
    }
  }

  function setAccEditMode(recId){
    state.editingAccId = recId || '';
    var cur = recId ? findAccount(recId) : null;
    var form = document.getElementById('accForm');
    var btn = document.getElementById('afSubmit');
    var cancel = document.getElementById('afCancel');
    var sum = document.getElementById('accSummary');
    if(form) form.className = recId ? 'editing' : '';
    if(btn) btn.textContent = recId ? '保存修改' : '创建账户';
    if(cancel) cancel.style.display = recId ? '' : 'none';
    if(sum) sum.textContent = recId ? ('正在修改：' + ((cur && cur['姓名']) || '')) : '＋ 新建学生账户';
    var det = document.getElementById('accDetails');
    if(det && recId) det.open = true;
  }
  function startEditAccount(recId){
    var a = findAccount(recId);
    if(!a) return;
    fillForm(document.getElementById('accForm'), {
      '姓名': a['姓名'] || '', '学号': a['学号'] || '', '所属班级': a['所属班级'] || '',
      '账户状态': a['账户状态'] || '', '备注': a['备注'] || ''
    });
    setAccEditMode(recId);
    refreshAll();
    toast('正在修改账户信息');
  }
  function cancelEditAccount(){
    var form = document.getElementById('accForm');
    if(form) form.reset();
    setAccEditMode('');
    refreshAll();
  }
  function deleteAccount(recId, name){
    if(state.busy) return;
    if(SDK){
      state.busy = true; renderSync();
      db.deleteRecord({ databaseId: '2OjdhXTwUccUa71i4R2wBx', recordId: recId })
        .then(function(){ toast('已删除账户「' + name + '」'); loadAll(); })
        .catch(function(err){ console.error('[workbench] 删除账户失败', err); state.busy = false; renderSync(); toast('删除失败，请稍后重试', true); });
    } else {
      state.accounts = state.accounts.filter(function(a){ return a._id !== recId; });
      toast('已删除账户（演示模式）');
      refreshAll();
    }
  }
  function submitAccount(){
    if(state.busy) return;
    var form = document.getElementById('accForm');
    var name = form.querySelector('[name="姓名"]').value.trim();
    if(!name){ toast('请填写姓名', true); return; }
    var sid = form.querySelector('[name="学号"]').value.trim();
    var klass = form.querySelector('[name="所属班级"]').value.trim();
    var st = form.querySelector('[name="账户状态"]').value;
    var note = form.querySelector('[name="备注"]').value.trim();
    var btn = document.getElementById('afSubmit');
    var editing = state.editingAccId;

    if(SDK){
      state.busy = true; renderSync();
      if(btn){ btn.disabled = true; btn.textContent = editing ? '保存中…' : '创建中…'; }
      var properties = {};
      properties['姓名'] = { text: name };
      properties['学号'] = { text: sid };
      properties['所属班级'] = { text: klass };
      properties['账户状态'] = { select: st || '在读' };
      properties['备注'] = { text: note };
      var job;
      if(editing){
        job = db.updateRecord({ databaseId: '2OjdhXTwUccUa71i4R2wBx', recordId: editing, properties: properties });
      } else {
        properties['加入时间'] = { date: todayISO() };
        job = db.addRecord({ databaseId: '2OjdhXTwUccUa71i4R2wBx', properties: properties });
      }
      job.then(function(){
        clearDraft(LS_DRAFT_ACC);
        form.reset();
        if(editing){ setAccEditMode(''); toast('账户信息已更新'); }
        else { toast('账户已创建'); }
        loadAll();
      }).catch(function(err){
        console.error('[workbench] 账户保存失败', err);
        state.busy = false; renderSync();
        toast('保存失败，请稍后重试', true);
      });
      setTimeout(function(){ if(btn){ btn.disabled = false; btn.textContent = state.editingAccId ? '保存修改' : '创建账户'; } }, 800);
    } else {
      if(editing){
        var t = findAccount(editing);
        if(t){
          t['姓名'] = name; t['学号'] = sid; t['所属班级'] = klass;
          t['账户状态'] = st || '在读'; t['备注'] = note;
        }
        setAccEditMode('');
        toast('账户信息已更新（演示模式）');
      } else {
        state.accounts.unshift({ _id:'local-' + Date.now(), '姓名':name, '学号':sid, '所属班级':klass,
          '账户状态':st || '在读', '加入时间':todayISO(), '备注':note });
        toast('账户已创建（演示模式）');
      }
      form.reset();
      refreshAll();
    }
  }

  function toggleAccount(recordId){
    if(state.busy) return;
    var target = findAccount(recordId);
    if(!target) return;
    var next = target['账户状态'] === '停用' ? '在读' : '停用';
    if(SDK){
      state.busy = true; renderSync();
      var properties = {};
      properties['账户状态'] = { select: next };
      db.updateRecord({ databaseId: '2OjdhXTwUccUa71i4R2wBx', recordId: recordId, properties: properties })
        .then(function(){ toast(next === '在读' ? '账户已恢复' : '账户已停用'); loadAll(); })
        .catch(function(err){ console.error('[workbench] 账户状态更新失败', err); state.busy = false; renderSync(); toast('操作失败，请稍后重试', true); });
    } else {
      target['账户状态'] = next;
      toast(next === '在读' ? '账户已恢复（演示模式）' : '账户已停用（演示模式）');
      refreshAll();
    }
  }

  /* ---------------- events ---------------- */
  function confirmThen(btn, fn){
    if(btn.getAttribute('data-confirm') === '1'){ fn(); return; }
    btn.setAttribute('data-confirm', '1');
    btn.textContent = '确认删除？';
    setTimeout(function(){
      if(btn.getAttribute('data-confirm') === '1'){ btn.removeAttribute('data-confirm'); btn.textContent = '删除'; }
    }, 4000);
  }
  function bindEvents(){
    var nav = document.getElementById('sideNav');
    if(nav){
      nav.addEventListener('click', function(e){
        var btn = e.target.closest ? e.target.closest('button[data-view]') : null;
        if(!btn) return;
        setView(btn.getAttribute('data-view'));
      });
    }
    var cb = document.getElementById('clsBack');
    if(cb) cb.addEventListener('click', closeDetail);
    var ab = document.getElementById('accBack');
    if(ab) ab.addEventListener('click', closeDetail);
    var sb = document.getElementById('stuBack');
    if(sb) sb.addEventListener('click', closeDetail);
    var head = document.getElementById('classSwitch');
    if(head){
      head.addEventListener('click', function(e){
        var btn = e.target.closest ? e.target.closest('button[data-g]') : null;
        if(!btn) return;
        state.scope = btn.getAttribute('data-g');
        cacheSet(LS_SCOPE, state.scope);
        refreshAll();
      });
    }
    var pf = document.getElementById('pushForm');
    if(pf){ pf.addEventListener('submit', function(e){ e.preventDefault(); submitPush(); }); bindFormCache(pf, LS_DRAFT_PUSH); }
    var rf = document.getElementById('resForm');
    if(rf){ rf.addEventListener('submit', function(e){ e.preventDefault(); submitResource(); }); bindFormCache(rf, LS_DRAFT_RES); }
    var cf = document.getElementById('clsForm');
    if(cf){ cf.addEventListener('submit', function(e){ e.preventDefault(); submitClass(); }); bindFormCache(cf, LS_DRAFT_CLS); }
    var af = document.getElementById('accForm');
    if(af){ af.addEventListener('submit', function(e){ e.preventDefault(); submitAccount(); }); bindFormCache(af, LS_DRAFT_ACC); }
    var pm = document.getElementById('pf-mode');
    if(pm){
      pm.addEventListener('change', function(){
        state.pushMode = pm.value || '全班';
        state.pushTargets = {};
        renderPushPicker();
      });
    }
    var cfc = document.getElementById('cfCancel');
    if(cfc) cfc.addEventListener('click', cancelEditClass);
    var afc = document.getElementById('afCancel');
    if(afc) afc.addEventListener('click', cancelEditAccount);
    var pfc = document.getElementById('pfCancel');
    if(pfc) pfc.addEventListener('click', cancelEditTask);
    var rfc = document.getElementById('rfCancel');
    if(rfc) rfc.addEventListener('click', cancelEditRes);
    document.addEventListener('click', function(e){
      var t = e.target;
      var pick = t.closest ? t.closest('button[data-pick]') : null;
      if(pick){
        var kind = pick.getAttribute('data-pick');
        var pid = pick.getAttribute('data-id');
        if(kind === 'class'){ state.selClass = pid; renderClassList(); renderClassDetail(); }
        else if(kind === 'acc'){ state.selAcc = pid; renderAccList(); renderAccDetail(); }
        else if(kind === 'stu'){ state.selStu = pid; renderInsightList(); renderInsightDetail(); }
        openDetail();
        return;
      }
      var btn = t.closest ? t.closest('button[data-act]') : null;
      if(!btn) return;
      var act = btn.getAttribute('data-act');
      var id = btn.getAttribute('data-id');
      var nm = btn.getAttribute('data-name');
      if(act === 'scope-class'){
        state.scope = (state.scope === nm) ? '全部' : nm;
        cacheSet(LS_SCOPE, state.scope);
        refreshAll();
      } else if(act === 'pick-target'){
        if(isPicked(nm)) delete state.pushTargets[nm];
        else state.pushTargets[nm] = true;
        renderPushPicker();
      } else if(act === 'toggle-acc'){
        toggleAccount(id);
      } else if(act === 'edit-class'){
        startEditClass(id);
      } else if(act === 'edit-acc'){
        startEditAccount(id);
      } else if(act === 'del-class'){
        confirmThen(btn, function(){ deleteClass(id, nm); });
      } else if(act === 'del-acc'){
        confirmThen(btn, function(){ deleteAccount(id, nm); });
      } else if(act === 'edit-task'){
        startEditTask(id);
      } else if(act === 'retract-task'){
        retractTask(id);
      } else if(act === 'del-task'){
        confirmThen(btn, function(){ deleteTask(id, nm); });
      } else if(act === 'edit-res'){
        startEditRes(id);
      } else if(act === 'del-res'){
        confirmThen(btn, function(){ deleteResource(id, nm); });
      } else if(act === 'goto-acc'){
        var acc = accountOf(nm);
        if(acc && acc._id) state.selAcc = acc._id;
        /* 对齐班级筛选：否则该生可能被当前筛选排除，列表里没有高亮行 */
        if(acc){
          var kls = classOf(nm);
          if(state.scope !== '全部' && kls !== state.scope){
            state.scope = (kls === '未分班') ? '全部' : kls;
            cacheSet(LS_SCOPE, state.scope);
          }
        }
        setView('accounts');
        refreshAll();
        openDetail();
        toast('已定位到「' + nm + '」的账户详情');
      } else if(act === 'goto-task'){
        setView('push');
        startEditTask(id);
      }
    });
  }

  /* ---------------- boot ---------------- */
  function boot(){
    var savedScope = cacheGet(LS_SCOPE);
    if(savedScope) state.scope = savedScope;
    var savedView = cacheGet(LS_VIEW);
    if(savedView && VIEWS[savedView]) state.view = savedView;
    bindEvents();
    renderNav();
    loadSchemaOptions();
    if(SDK){
      refreshAll();
      loadAll();
    } else {
      demoRows();
      refreshAll();
    }
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
