$('tabDictate').onclick=function(){ setFlow('dictate'); };
$('backBtn').onclick=function(){ location.href='../index.html'; };

/* ═══════════ 流程① 逐句听 ═══════════ */
function renderSents(){
  $('sentList').innerHTML = SEGS.map(function(s,i){
    var zh=ZHm[s.t]?'<div class="zh">'+esc(ZHm[s.t])+'</div>':'';
    return '<div class="sent'+(i===state.idx?' cur':'')+(state.played[i]?' played':'')+'" data-i="'+i+'">'
      + '<span class="idx">'+(i+1)+' / '+SEGS.length+' · 段'+(s.p+1)+'</span>'
      + '<div class="en">'+esc(s.t)+'</div>'+zh+'</div>';
  }).join('');
  $('sentList').querySelectorAll('.sent').forEach(function(row){
    row.addEventListener('click',function(){ setIdx(parseInt(row.dataset.i,10)); playCur(); });
  });
  refreshDone();
}
function setIdx(i){
  state.idx=Math.max(0,Math.min(SEGS.length-1,i));
  $('sentList').querySelectorAll('.sent').forEach(function(row,k){
    row.classList.toggle('cur',k===state.idx);
    row.classList.toggle('played',!!state.played[k]);
  });
  var cur=$('sentList').querySelector('.sent.cur');
  if(cur&&cur.scrollIntoView) cur.scrollIntoView({block:'nearest',behavior:'smooth'});
  updatePos();
}
function updatePos(){
  $('posTxt').textContent='第 '+(state.idx+1)+' / '+SEGS.length+' 句 · 段'+(SEGS[state.idx]?SEGS[state.idx].p+1:1);
  $('progBar').style.width=((state.idx+1)/SEGS.length*100)+'%';
}
function playCur(){
  var iv=TLx[state.idx]; if(!iv){ toast('本句暂无时间轴'); return; }
  seekingTo=iv[0];
  try{ audio.currentTime=iv[0]; aplay(); }catch(e){}
  setPlayIc(true);
}
var seekingTo=null;
audio.addEventListener('seeked',function(){ if(seekingTo!==null){ try{ aplay(); }catch(e){} seekingTo=null; } });
audio.addEventListener('timeupdate',function(){
  if(state.flow!=='listen') return;
  var iv=TLx[state.idx]; if(!iv) return;
  if(audio.currentTime>=iv[1]-0.03&&!audio.paused){
    audio.pause(); markPlayed(state.idx);
    if(state.auto){
      if(state.idx<SEGS.length-1){ setIdx(state.idx+1); setTimeout(playCur,350); }
      else toast('已播到最后一句');
    }
  }
});
function setPlayIc(on){ $('playBtn').textContent=on?'⏸':'▶'; }
$('playBtn').onclick=function(){
  if(audio.paused){ var iv=TLx[state.idx];
    if(audio.currentTime<iv[0]||audio.currentTime>=iv[1]-0.03){ seekingTo=iv[0]; try{ audio.currentTime=iv[0]; }catch(e){} }
    aplay(); setPlayIc(true);
  } else { audio.pause(); setPlayIc(false); }
};
$('prevBtn').onclick=function(){ setIdx(state.idx-1); playCur(); };
$('nextBtn').onclick=function(){ setIdx(state.idx+1); playCur(); };
$('autoTog').onclick=function(){ state.auto=!state.auto; this.textContent='连播 '+(state.auto?'开':'关'); this.classList.toggle('on',state.auto); };
$('zhTog').onclick=function(){ state.zh=!state.zh; document.body.classList.toggle('zh-on',state.zh); this.textContent='中文 '+(state.zh?'开':'关'); this.classList.toggle('on',state.zh); };
function markPlayed(i){
  state.played[i]=1;
  var row=$('sentList').querySelector('.sent[data-i="'+i+'"]'); if(row) row.classList.add('played');
  var all=SEGS.every(function(_,k){ return state.played[k]; });
  if(all&&!STAGE.listen){ STAGE.listen=true; stageSave(); }
  refreshDone();
}
function refreshDone(){
  $('listenDone').innerHTML = STAGE.listen
    ? '<span class="done-pill">✓ 逐句听已完成（进度已记录）</span>' : '';
}

/* ═══════════ 流程② 逐句听写 ═══════════ */
var D={ mode:'rand', count:10, paras:{}, queue:[], qi:0, checked:false, slow:false,
        stat:{ tgt:0, hit:0 } };
function renderParaChips(){
  $('paraChips').innerHTML = PARA.map(function(p){
    return '<button class="chip'+(D.paras[p.i]?' on':'')+'" data-p="'+p.i+'" type="button">段'+p.i+' · '+p.n+'句</button>';
  }).join('');
  $('paraChips').querySelectorAll('.chip').forEach(function(ch){
    ch.addEventListener('click',function(){
      var pi=parseInt(ch.dataset.p,10);
      D.paras[pi]=!D.paras[pi]; ch.classList.toggle('on',D.paras[pi]); paraHint();
    });
  });
  paraHint();
}
function paraHint(){
  var n=0; for(var k in D.paras) if(D.paras[k]) n+=PARA[k-1].n;
  $('paraHint').textContent = n? ('已选 '+n+' 句') : '尚未选择段落';
}
$('modeRand').onclick=function(){ D.mode='rand'; this.classList.add('on'); $('modePara').classList.remove('on'); $('randOpts').classList.remove('hide'); $('paraOpts').classList.add('hide'); };
$('modePara').onclick=function(){ D.mode='para'; this.classList.add('on'); $('modeRand').classList.remove('on'); $('paraOpts').classList.remove('hide'); $('randOpts').classList.add('hide'); renderParaChips(); };
$('countSel').onchange=function(){ D.count=this.value==='all'?'all':parseInt(this.value,10); };
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
$('startBtn').onclick=function(){
  var idxs=SEGS.map(function(_,i){ return i; });
  if(D.mode==='rand'){
    var n=D.count==='all'?idxs.length:Math.min(D.count,idxs.length);
    D.queue=shuffle(idxs.slice()).slice(0,n);
  } else {
    var sel=[]; for(var k in D.paras) if(D.paras[k]) sel.push(parseInt(k,10));
    if(!sel.length){ toast('请先选择至少一个段落'); return; }
    D.queue=idxs.filter(function(i){ return sel.indexOf(SEGS[i].p+1)>=0; });
  }
  if(!D.queue.length){ toast('没有可听写的句子'); return; }
  D.qi=0; D.stat={tgt:0,hit:0};
  $('dSetup').classList.add('hide'); $('dSummary').classList.add('hide'); $('dRunner').classList.remove('hide');
  renderQ();
};
function renderQ(){
  D.checked=false;
  var i=D.queue[D.qi], s=SEGS[i];
  $('dPos').textContent='第 '+(D.qi+1)+' / '+D.queue.length+' 句 · 段'+(s.p+1);
  $('dHint').textContent='听音频后输入你听到的句子（第 '+(i+1)+' 句 / 全篇 '+SEGS.length+' 句）';
  $('dInput').value=''; $('dInput').disabled=false;
  $('dRes').classList.remove('on');
  $('dSubmit').classList.remove('hide'); $('dNext').classList.add('hide');
  playD(i,false);
}
function playD(i,slow){
  var iv=TLx[i]; if(!iv){ toast('本句暂无时间轴'); return; }
  audio.playbackRate=slow?0.75:1;
  seekingTo=iv[0];
  try{ audio.currentTime=iv[0]; aplay(); }catch(e){}
}
$('dPlay').onclick=function(){ playD(D.queue[D.qi],D.slow); };
$('dSlow').onclick=function(){ D.slow=!D.slow; this.textContent=D.slow?'1×':'0.75×'; this.classList.toggle('on',D.slow); };
$('dInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(!D.checked) $('dSubmit').click(); else $('dNext').click(); }
});
$('dSubmit').onclick=function(){
  if(D.checked) return;
  var i=D.queue[D.qi], target=SEGS[i].t;
  var tt=tokens(target), ut=tokens($('dInput').value);
  /* LCS 对齐：目标词被说出=g，漏掉=m */
  var dp=[], ui, ti;
  for(ui=0;ui<=ut.length;ui++){ dp[ui]=[ui]; }
  for(ti=1;ti<=tt.length;ti++) dp[0][ti]=ti;
  for(ui=1;ui<=ut.length;ui++) for(ti=1;ti<=tt.length;ti++){
    dp[ui][ti]=Math.min(dp[ui-1][ti]+1, dp[ui][ti-1]+1, dp[ui-1][ti-1]+(normTok(ut[ui-1])===normTok(tt[ti-1])?0:1));
  }
  /* 回溯标记 */
  var tmark=new Array(tt.length).fill('m'), umark=new Array(ut.length).fill('b');
  ui=ut.length; ti=tt.length;
  while(ui>0||ti>0){
    if(ui>0&&ti>0&&dp[ui][ti]===dp[ui-1][ti-1]+(normTok(ut[ui-1])===normTok(tt[ti-1])?0:1)){
      if(normTok(ut[ui-1])===normTok(tt[ti-1])){ tmark[ti-1]='g'; umark[ui-1]='g'; }
      else { tmark[ti-1]='m'; umark[ui-1]='b'; }
      ui--; ti--;
    } else if(ui>0&&dp[ui][ti]===dp[ui-1][ti]+1){ umark[ui-1]='b'; ui--; }
    else { tmark[ti-1]='m'; ti--; }
  }
  var hit=tmark.filter(function(x){return x==='g';}).length;
  D.stat.tgt+=tt.length; D.stat.hit+=hit;
  var pct=tt.length?Math.round(hit/tt.length*100):0;
  var v=$('dVerdict');
  v.textContent = pct===100?'✓ 完全正确！':('词正确 '+hit+' / '+tt.length+'（'+pct+'%）');
  v.className='ok '+(pct===100?'good':(pct>=60?'':'bad'));
  $('dWords').innerHTML = tt.map(function(w,k){
    return '<span class="wc '+(tmark[k]==='g'?'g':'m')+'">'+esc(w)+'</span>';
  }).join('');
  var extras=ut.filter(function(w,k){ return umark[k]==='b'; });
  $('dWords').innerHTML += extras.length? '<div style="margin-top:6px;font-size:13px;color:var(--ink3)">多写/写错：'+
    extras.map(function(w){ return '<span class="wc b">'+esc(w)+'</span>'; }).join('') + '</div>' : '';
  $('dZh').textContent = ZHm[target] ? '译文：'+ZHm[target] : '';
  $('dRes').classList.add('on');
  $('dInput').disabled=true;
  D.checked=true;
  $('dSubmit').classList.add('hide'); $('dNext').classList.remove('hide');
};
$('dNext').onclick=function(){
  if(D.qi<D.queue.length-1){ D.qi++; renderQ(); $('dInput').focus(); }
  else finishDict();
};
$('dQuit').onclick=function(){ try{audio.pause();}catch(e){} $('dRunner').classList.add('hide'); $('dSetup').classList.remove('hide'); };
function finishDict(){
  try{audio.pause();}catch(e){}
  var pct=D.stat.tgt?Math.round(D.stat.hit/D.stat.tgt*100):0;
  var el=$('sumPct');
  el.textContent=pct+'%';
  el.className='big '+(pct>=90?'good':pct>=60?'mid':'bad');
  $('sumTxt').textContent='本次听写 '+D.queue.length+' 句 · 词正确 '+D.stat.hit+' / '+D.stat.tgt;
  $('dRunner').classList.add('hide'); $('dSummary').classList.remove('hide');
  STAGE.dictate=true; STAGE.lastPct=pct; stageSave();
}
$('againBtn').onclick=function(){ $('dSummary').classList.add('hide'); $('dSetup').classList.remove('hide'); };
$('finishBtn').onclick=function(){ $('dSummary').classList.add('hide'); $('dSetup').classList.remove('hide'); };

/* ── 启动 ── */
(function boot(){
  if(!B){ document.body.innerHTML='<div style="padding:40px;text-align:center;color:#8e8e93">本篇章数据缺失（pg='+PG+'）</div>'; return; }
  audio.src = B.audio;
  run();
  if(window.TLF && window.TLF.load){
    window.TLF.load(PG, TLx).then(function(t){ if(t&&t.length){ TLx=t; } }).catch(function(){});
  }
  function run(){
    $('tSub').textContent = B.u + ' · p' + PG + ' · ' + SEGS.length + ' 句 · ' + PARA.length + ' 段';
    renderSents(); setIdx(0); updatePos(); renderParaChips();
    if(STAGE.listen){ state.played={}; refreshDone(); }
    var m=(location.search||'').match(/[?&]flow=(listen|dictate)/);
    if(m&&m[1]==='dictate') setFlow('dictate'); else setFlow('listen');
  }
})();
</script>
</body></html>
