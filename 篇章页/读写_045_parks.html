<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>课文 p045 · 逐句听 / 逐句听写</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --ink:#1c1c1e; --ink2:#3c3c43; --ink3:#8e8e93;
  --blue:#0a84ff; --blue-deep:#0b6ce0; --green:#34c759; --green-bg:#e6f7ea;
  --orange:#ff9f0a; --red:#ff453a; --line:rgba(60,60,67,.14);
  --rad:16px; --rad-lg:22px;
  --font:"-apple-system","SF Pro Text","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
  --fnum:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{height:100dvh;display:flex;flex-direction:column}
header.top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px 10px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-bottom:.5px solid var(--line)}
.back{flex:none;width:34px;height:34px;border-radius:10px;border:none;background:#e9e9ee;color:var(--ink);cursor:pointer;font-size:16px}
.titles{min-width:0;flex:1}
.titles h1{font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles .sub{font-size:11.5px;color:var(--ink3);font-family:var(--fnum)}
.tabs{flex:none;display:flex;gap:6px}
.tab{border:none;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;background:#e9e9ee;color:var(--ink2);cursor:pointer}
.tab.on{background:var(--blue);color:#fff}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 90px}
.wrap{max-width:760px;margin:0 auto}

/* ── 流程① 逐句听 ── */
.playerbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--rad);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.pbtn{flex:none;width:44px;height:44px;border-radius:50%;border:none;background:var(--blue);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px}
.pbtn.sm{width:38px;height:38px;background:#e9e9ee;color:var(--ink);font-size:14px}
.pbtn:disabled{opacity:.35;cursor:default}
.pinfo{flex:1;min-width:0;text-align:center}
.pinfo .n{font-family:var(--fnum);font-size:12.5px;color:var(--ink3)}
.pinfo .bar{height:4px;border-radius:2px;background:#e5e5ea;margin-top:5px;overflow:hidden}
.pinfo .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
.togs{display:flex;gap:6px;flex-wrap:wrap}
.tog{border:none;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;background:#e9e9ee;color:var(--ink2);cursor:pointer}
.tog.on{background:#dcead2;color:#1f6b2e;background:var(--green-bg)}
.sents{display:flex;flex-direction:column;gap:8px}
.sent{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:12px 14px;cursor:pointer;transition:border .15s, box-shadow .15s}
.sent.cur{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.15)}
.sent.played{border-left:4px solid var(--green)}
.sent .idx{font-family:var(--fnum);font-size:11px;color:var(--ink3)}
.sent .en{font-size:17.5px;line-height:1.6;margin-top:2px}
.sent .zh{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:14px;color:var(--ink2)}
body.zh-on .sent .zh{display:block}
.listen-done{margin-top:14px;text-align:center}
.done-pill{display:inline-flex;align-items:center;gap:8px;background:var(--green-bg);color:#1f6b2e;border-radius:999px;padding:10px 18px;font-weight:800;font-size:13.5px}

/* ── 流程② 逐句听写 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad-lg);padding:18px;margin-bottom:12px}
.card h3{font-size:15.5px;font-weight:800;margin-bottom:10px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;border:none;border-radius:12px;padding:11px 0;font-size:13.5px;font-weight:800;background:#e9e9ee;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.lbl{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.04em;margin:10px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:none;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;background:#e9e9ee;color:var(--ink2);cursor:pointer;font-family:var(--fnum)}
.chip.on{background:var(--blue);color:#fff}
select.big{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:700;background:#fff;color:var(--ink)}
.cta{width:100%;margin-top:14px;border:none;border-radius:14px;padding:15px 0;font-size:15.5px;font-weight:900;background:var(--blue);color:#fff;cursor:pointer}
.cta:disabled{opacity:.4}
.cta.green{background:#28a745}
.dtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dtop .n{font-family:var(--fnum);font-size:12.5px;color:var(--ink3)}
.dops{display:flex;gap:6px}
.dbtn{border:none;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:800;background:var(--blue);color:#fff;cursor:pointer}
.dbtn.ghost{background:#e9e9ee;color:var(--ink)}
.dsent{font-size:12.5px;color:var(--ink3);margin-bottom:8px}
.din{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16.5px;line-height:1.7;font-family:var(--font);resize:vertical}
.din:focus{outline:none;border-color:var(--blue)}
.dres{margin-top:12px;display:none}
.dres.on{display:block}
.dres .ok{font-weight:900;font-size:14px;margin-bottom:6px}
.dres .ok.good{color:#1f6b2e}.dres .ok.bad{color:#b3261e}
.wline{font-size:17px;line-height:1.9}
.wc{padding:1px 3px;border-radius:5px;margin-right:4px;display:inline-block}
.wc.g{background:var(--green-bg);color:#1f6b2e}
.wc.b{background:#ffe9e7;color:#b3261e;text-decoration:line-through}
.wc.m{background:#fff3e0;color:#a15c00}
.dzh{margin-top:8px;padding:10px 12px;background:#f7f7fa;border-radius:12px;font-size:14px;color:var(--ink2)}
.dnav{display:flex;gap:8px;margin-top:12px}
.dnav .dbtn{flex:1;padding:13px 0;font-size:14.5px}
.sum{text-align:center;padding:8px 0}
.sum .big{font-size:44px;font-weight:900;font-family:var(--fnum)}
.sum .big.good{color:#1f6b2e}.sum .big.mid{color:#a15c00}.sum .big.bad{color:#b3261e}
.sum .sub2{color:var(--ink3);font-size:13px;margin-top:4px}
.hint{font-size:12.5px;color:var(--ink3);margin-top:8px}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(12px);background:rgba(28,28,30,.9);color:#fff;font-size:13px;padding:9px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
@media (max-width:560px){ .sent .en{font-size:16px} .titles h1{font-size:15px} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="back" id="backBtn" title="返回主站">←</button>
    <div class="titles">
      <h1 id="tTitle">课文 p045</h1>
      <div class="sub" id="tSub"></div>
    </div>
    <div class="tabs">
      <button class="tab on" id="tabListen" type="button">逐句听</button>
      <button class="tab" id="tabDictate" type="button">逐句听写</button>
    </div>
  </header>
  <main><div class="wrap">

    <section id="viewListen">
      <div class="playerbar">
        <button class="pbtn sm" id="prevBtn" title="上一句">◀</button>
        <button class="pbtn" id="playBtn" title="播放本句">▶</button>
        <button class="pbtn sm" id="nextBtn" title="下一句">▶▶</button>
        <div class="pinfo">
          <div class="n" id="posTxt">第 1 / N 句</div>
          <div class="bar"><i id="progBar"></i></div>
        </div>
        <div class="togs">
          <button class="tog" id="autoTog" type="button">连播 关</button>
          <button class="tog" id="zhTog" type="button">中文 关</button>
        </div>
      </div>
      <div class="sents" id="sentList"></div>
      <div class="listen-done" id="listenDone"></div>
    </section>

    <section id="viewDictate" class="hide">
      <div id="dSetup">
        <div class="card">
          <h3>选择听写范围</h3>
          <div class="seg">
            <button id="modeRand" class="on" type="button">随机抽句</button>
            <button id="modePara" type="button">按段落</button>
          </div>
          <div id="randOpts">
            <div class="lbl">抽几句</div>
            <select class="big" id="countSel">
              <option value="5">随机 5 句</option>
              <option value="10" selected>随机 10 句</option>
              <option value="15">随机 15 句</option>
              <option value="all">全部句子</option>
            </select>
          </div>
          <div id="paraOpts" class="hide">
            <div class="lbl">点选段落（可多选）</div>
            <div class="chips" id="paraChips"></div>
            <div class="hint" id="paraHint"></div>
          </div>
          <div class="lbl">提示</div>
          <div class="hint">听本句音频（可反复听、可 0.75× 慢速）→ 键盘输入 → 提交后逐词标对错。提交完成全部句子即记听写完成。</div>
          <button class="cta" id="startBtn" type="button">开始听写</button>
        </div>
      </div>
      <div id="dRunner" class="hide">
        <div class="card">
          <div class="dtop">
            <span class="n" id="dPos">第 1 / N 句</span>
            <div class="dops">
              <button class="dbtn ghost" id="dSlow" type="button">0.75×</button>
              <button class="dbtn" id="dPlay" type="button">▶ 听本句</button>
            </div>
          </div>
          <div class="dsent" id="dHint">听音频后输入你听到的句子</div>
          <textarea class="din" id="dInput" rows="3" placeholder="输入你听到的句子…" autocomplete="off" spellcheck="false"></textarea>
          <div class="dres" id="dRes">
            <div class="ok" id="dVerdict"></div>
            <div class="wline" id="dWords"></div>
            <div class="dzh" id="dZh"></div>
          </div>
          <div class="dnav">
            <button class="dbtn ghost" id="dQuit" type="button">结束本次</button>
            <button class="dbtn" id="dSubmit" type="button">提交</button>
            <button class="dbtn green hide" id="dNext" type="button">下一句 →</button>
          </div>
        </div>
      </div>
      <div id="dSummary" class="hide">
        <div class="card sum">
          <div class="big" id="sumPct">--</div>
          <div class="sub2" id="sumTxt"></div>
          <button class="cta" id="againBtn" type="button">再来一组</button>
          <button class="cta green" id="finishBtn" type="button">完成，返回设置</button>
        </div>
      </div>
    </section>

  </div></main>
</div>
<audio id="audio" preload="auto"></audio>

var DB={"ZH":{"Nikolai Kutsenko, from Ukraine, can do amazing things with a football.":"来自乌克兰的尼古拉·库岑科能用足球做出令人惊叹的花样。","He can kick a ball well … but he can also keep the ball in the air with his feet, legs and head.":"他踢球踢得很好……但他也能用脚、腿和头让球一直保持在空中。","Lots of footballers can do this.":"很多足球运动员都能做到这一点。","But can they do it for 24 hours and 30 minutes without stopping?":"但他们能不停地做24小时30分钟吗？","Nikolai can and it's a world record!":"尼古拉能做到，而且这是世界纪录！","Sloan Henderson, from Utah, is a really good snowboarder – and she's only 14 months old!":"来自犹他州的斯隆·亨德森是一名非常棒的单板滑雪选手——而且她只有14个月大！","Her mother and father take her to the mountains, and they put her on a snowboard – and there she goes!":"她的爸爸妈妈带她去山上，把她放到滑雪板上——然后她就滑起来了！","Sloan loves to be on the board.":"斯隆很喜欢待在滑雪板上。","People are often surprised when they see her because she doesn't fall over!":"人们看到她时常感到很惊讶，因为她不会摔倒！","American rock-climber Maureen 'Mo' Beck was born without her left hand and only part of her left arm, but she can climb really well.":"美国攀岩运动员莫琳·'莫'·贝克出生时就没有左手，左臂也仅有短短一截，但她攀岩攀得很好。","She is the winner of two climbing World Championships for disabled athletes, and five national championships.":"她是两届残障运动员攀岩世锦赛和五届全国锦标赛的冠军。","She has her own special way of climbing, but Maureen thinks she is just the same as any other climber.":"她有自己独特的攀岩方式，但莫琳觉得自己和其他任何攀岩者一样。","Goatee can't talk or write, but she can surf!":"戈蒂不会说话也不会写字，但它会冲浪！","Why is this special?":"这有什么特别的呢？","Because Goatee is a goat!":"因为戈蒂是一只山羊！","She surfs with her owner, Dana McGregor.":"它和它的主人达娜·麦格雷戈一起冲浪。","Dana helps Goatee to stand on the board and together they ride the waves in California.":"达娜帮戈蒂站上冲浪板，然后他们一起在加利福尼亚乘风破浪。","Goatee wears a yellow life-jacket because she can't swim very well!":"戈蒂穿着一件黄色的救生衣，因为它不太会游泳！","And now there is a children's book about her, too – Dana is the author.":"现在还有一本关于它的儿童绘本呢——达娜就是作者。","It's 15th February at Greece Athena High School, New York.":"2月15日，在纽约的希腊镇雅典娜高中。","Jason McElwain is an 18-year-old student.":"杰森·麦克尔温是一名18岁的学生。","Jason is autistic.":"杰森患有自闭症。","He loves basketball and he helps with the school basketball team.":"他热爱篮球，并协助学校的篮球队。","Jason practises hard every day, but he never plays in the team.":"杰森每天刻苦训练，但他从不在队里上场比赛。","Tonight is the last game of the season.":"今晚是这个赛季的最后一场比赛。","It's Jason's last chance to play a game with the team, but for 44 minutes, he sits on the bench and watches.":"这是杰森跟球队一起打球的最后机会，但在44分钟里，他只是坐在替补席上观看。","It's four minutes before the end.":"距比赛结束还有四分钟。","The team is winning, so the coach tells Jason to go out and play.":"球队正在领先，于是教练让杰森上场打球。","The team and the crowd are very happy, because everyone knows Jason and likes him.":"球队和观众都非常高兴，因为每个人都认识并喜欢杰森。","Jason tries to score a basket, but he misses.":"杰森试着投篮得分，但没有投中。","But suddenly he hits a 3-point basket.":"但突然间，他命中了一记三分球。","The crowd goes crazy.":"观众沸腾了。","Jason hits another 3-pointer, then another and another – he hits six 3-pointers (it's a record for the team) and scores twenty points altogether.":"杰森又命中一记三分球，接着一记、又一记——他共命中六个三分球（这是全队的纪录），总共得了二十分。","The team wins, and Jason is a real hero.":"球队获胜了，杰森成为了真正的英雄。","It's an amazing night for him!":"对他来说，这是一个不可思议的夜晚！","Soon Jason starts to become famous.":"不久，杰森开始出名了。","People in his town know who he is.":"他镇里的人都知道他是谁。","The US president comes to Jason's town to meet him.":"美国总统来到杰森的小镇与他见面。","Jason writes a book and some people want to make a film about him.":"杰森写了一本书，有些人想拍一部关于他的电影。","He becomes assistant coach to the high school basketball team.":"他成为了这所高中篮球队的助理教练。","Now Jason works hard to help other autistic people.":"如今杰森努力工作，去帮助其他自闭症患者。","He travels across the US to help get money for autism research.":"他奔波于美国各地，为自闭症研究筹集资金。"},"TITLE_START":{"p067":6.27,"p070":5.91},"ENTITY":{"67":{"goatee":{"t":"PER","s":1},"dana":{"t":"PER","s":1},"maureen":{"t":"PER","s":1},"nikolai":{"t":"PER","s":1},"sloan":{"t":"PER","s":1},"california":{"t":"GPE","s":1},"ukraine":{"t":"GPE","s":1},"utah":{"t":"GPE","s":1}},"70":{"jason":{"t":"PER","s":1},"jason's":{"t":"PER", DB.ZH["Hi, Julia. It's me, Mike."]="嗨，朱莉娅。我是迈克。";
DB.ZH["Hi, Mike. How's it going?"]="嗨，迈克。你好吗？";
DB.ZH["Do you want to go cycling later today?"]="你今天晚些时候想去骑车吗？";
DB.ZH["Go cycling? Good idea. What time?"]="骑车？好主意。几点？";
DB.ZH["How about after lunch? Say, two o'clock?"]="午饭后怎么样？比如说两点？";
DB.ZH["Two o'clock? No, sorry, I can't. I've got a taekwondo lesson at two."]="两点？不了，抱歉，我去不了。我两点有跆拳道课。";
DB.ZH["OK, how about three o'clock?"]="好，那三点呢？";
DB.ZH["No, the lesson only finishes at half past three."]="不行，课要到三点半才结束。";
DB.ZH["OK, so how about four o'clock?"]="好，那四点呢？";
DB.ZH["I can't. Mum wants to give me a tennis lesson at four."]="我去不了。妈妈四点要给我上网球课。";
DB.ZH["Until what time?"]="到几点？";
DB.ZH["I'm not sure. Maybe about quarter to five?"]="我不确定。大概差一刻五点？";
DB.ZH["Really? But we can't go cycling then. It gets dark at half past four."]="真的吗？那我们就不能骑车了。四点半就天黑了。";
DB.ZH["Well, yes, you're right. Sorry."]="嗯，是啊，你说得对。抱歉。";
DB.ZH["So maybe we can go cycling before lunch?"]="那我们也许可以在午饭前去骑车？";
DB.ZH["Umm, I've got a school rugby match until about half past eleven."]="嗯，我有一场学校橄榄球比赛，要到十一点半左右。";
DB.ZH["What time does it start?"]="几点开始？";
DB.ZH["Ten o'clock."]="十点。";
DB.ZH["Julia, it's quarter to ten now."]="朱莉娅，现在已经十点差一刻了。";
DB.ZH["Really? I need to go. Let's go cycling tomorrow."]="真的吗？我得走了。我们明天去骑车吧。";
DB.ZH["OK. Call me in the morning. See you. Have a good match."]="好。早上给我打电话。再见。祝你比赛顺利。";

DB.ZH = Object.assign(DB.ZH||{}, {"Our lives move very fast today, especially in big cities.":"如今我们的生活节奏非常快，尤其是在大城市里。","But many years ago, that was different.":"但很多年前，情况并非如此。","People couldn't jump on a bus or take the tube to work.":"人们无法跳上公交车，也无法坐地铁去上班。","They walked.":"他们只能步行。","For a long time, the fastest way of travelling was by horse or boat.":"在很长一段时间里，最快的出行方式是骑马或乘船。","That changed with the steam engine in the 18th century.":"这一状况在18世纪随着蒸汽机的问世而改变。","Then came cars, motorcycles and, of course, airplanes.":"接着出现了汽车、摩托车，当然还有飞机。","So what's new and popular today?":"那么，如今什么又新又流行呢？","E-scooters!":"电动滑板车！","Electric scooter sharing is the new way to get around.":"电动滑板车共享出行是一种新兴的出行方式。","They are taking over the world's big cities.":"它们正在席卷世界各地的大城市。","They are fun and easy to use.":"它们既有趣又容易使用。","You don't have to buy one.":"你不必花钱买一辆。","You rent one.":"租一辆即可。","All you need is to log on to an app and then, off you go.":"你只需登录一个应用程序，就可以出发了。","They are cheaper than taxis.":"它们比出租车便宜。","You can get around traffic jams.":"你还可以绕过交通拥堵。","And you don't have to do any hard work, like on a bike.":"而且你不必像骑自行车那样费力。","They aren't bad for the environment either.":"它们对环境的危害也不大。","But is that true?":"但真是这样吗？","Well, these e-scooters don't last very long.":"嗯，这些电动滑板车用不了多久就会坏。","In Paris, some e-scooters break after one month.":"在巴黎，有些电动滑板车一个月后就坏了。","Many people are unhappy because there are too many e-scooters.":"很多人不开心，因为电动滑板车太多了。","They block the pavements and drive into people.":"它们堵住人行道，还会撞到人。","Because people are angry about e-scooters, they throw them into rivers or break them.":"由于人们对电动滑板车很恼火，就把它扔进河里或砸坏。","Is that the answer?":"这就是解决办法吗？","What do you think of e-scooters?":"你怎么看待电动滑板车？","Do you like them?":"你喜欢它们吗？","A lot of big cities, like London, have got many traffic problems.":"许多大城市，比如伦敦，都存在很多交通问题。","Sometimes a journey of a few kilometres can take more than an hour.":"有时几公里的路程要花上一个多小时。","So what's the best way to get across London?":"那么，穿越伦敦的最佳方式是什么呢？","For a very short journey, it's probably a good idea to walk.":"对于非常短的路程，步行可能是个好主意。","But what happens when you want to go further?":"但如果你想走得更远，又会怎样呢？","The presenters of a popular TV show about cars decided to find out.":"一档关于汽车的知名电视节目的主持人决定一探究竟。","Each of the presenters chose a different type of transport to make the same 27-kilometre journey.":"每位主持人选择了一种不同的交通工具，来完成相同的27公里路程。","One presenter went by bike.":"一位主持人骑自行车。","One went by car.":"一位开车。","Another chose public transport – the underground and bus – and the last one travelled by speedboat up the River Thames.":"另一位选择公共交通——地铁和公交车——最后一位则乘快艇沿泰晤士河而上。","They all started at the same time and the same place in West London, but who got to City Airport in East London first?":"他们都在伦敦西部的同一时间同一地点出发，但谁先到达伦敦东部的城市机场呢？","The results were a surprise.":"结果出人意料。","The bike came first.":"自行车最先到达。","In second place was the speedboat.":"第二名是快艇。","Public transport came third and the car was last.":"公共交通名列第三，汽车垫底。","So the presenters had an answer.":"于是主持人有了答案。","The bike was quicker than all the other types of transport and the car was slower.":"自行车比所有其他交通工具都快，而汽车最慢。","They weren't very happy with the result because they wanted the car to win.":"他们对这一结果不太高兴，因为他们希望汽车获胜。","They made a joke and said the bike wasn't a real winner because it was more dangerous.":"他们开玩笑说，自行车算不上真正的赢家，因为它更危险。","But, of course, the bike is the real winner.":"但当然啦，自行车才是真正的赢家。","It's the best way to get about.":"它是四处出行的最佳方式。","It's cheaper than public transport and it is healthier than going by car.":"它比公共交通便宜，也比开车更健康。","It's also better for our cities because bikes don't make the air dirty.":"它对我们的城市也更有利，因为自行车不会弄脏空气。","So next time you need to travel around, think before you and your parents get into the car – 'Can we make this journey by bike?'":"所以，下次你需要出行时，在你和父母上车前先想一想：“这段路我们可以骑自行车吗？”"});

DB.ZH = Object.assign(DB.ZH||{}, {"Right! Have we got everything? Tennis rackets, balls …?":"对啊！东西都带齐了吗？网球拍、球……？","Yes, I think so. And we've got some food – sandwiches, fruit and stuff – and some water. So, let's go.":"是的，我觉得齐了。我们还带了些吃的——三明治、水果什么的——还有一些水。那我们走吧。","Just a minute! Oh, no! It's raining!":"等一等！哦，不！下雨了！","Now what do we do?":"现在咱们怎么办？","You're right. We can't play outside in the rain.":"你说得对。下雨天我们不能在外面打。","Why don't we go to the sports centre in town? They've got an indoor court.":"我们不如去镇上的体育中心吧？那里有室内球场。","No, it's always very busy. I'm sure we can't play there today.":"不去了，那里总是很拥挤。我确定今天咱们在那边打不了。","Maybe you're right. It's a bit expensive, too.":"也许你说得对。那边也有点贵。","OK, so we can't play today. It's no big deal. We can play tomorrow, perhaps.":"好吧，那我们今天没法打了。没什么大不了的。我们也许可以明天打。","Yes. But I'm a bit sad now.":"嗯。但让我有点难过。","Me, too. But what can we do? It's raining, and that's that.":"我也是。可我们能怎么办呢？天下着雨，就是这样。","I know! How about watching some old tennis games on the internet?":"我有主意了！不如在网上看一些以前的网球比赛吧？","Good idea. I like watching really good players.":"好主意。我喜欢看高水平的选手比赛。","And we can eat our food.":"而且我们可以吃带来的东西。","Let's go and switch the computer on.":"那我们走吧，把电脑打开。"});

/* ===== p117 文化 Transport Around the World (第12单元) ===== */
DB.ZH = Object.assign(DB.ZH||{}, {"Transport around the world.":"世界各地的交通工具。","The Amfibus, the Netherlands.":"荷兰的两栖巴士。","The big, blue Amfibus certainly makes a big splash!":"这辆庞大的蓝色两栖巴士确实激起了不小的水花！","It's in Rotterdam, and it takes people on tours of the city.":"它在鹿特丹，载着人们游览这座城市。","It's cool.":"它很酷。","It can travel on land and in the water.":"它既能在陆地上行驶，也能在水里航行。","It is more expensive than water taxis, but it is more exciting, too.":"它比水上出租车更贵，但也更刺激。","It is slower in the water than on land.":"它在水中比在陆地上行驶得慢。","It goes at 8 kilometres per hour in the water and 96 kilometres per hour on land.":"它在水中的时速是8公里，在陆地上的时速是96公里。","The tour lasts for an hour, and it costs 27.50 euros.":"这趟游览持续一个小时，票价27.50欧元。","Moving walkways and escalators, Hong Kong.":"香港的自动扶梯和电动步道。","The Central-Mid-Levels Escalator is 800 metres long.":"中央-半山自动扶梯长达800米。","Escalators are usually inside a shopping centre or an airport, but not this one!":"自动扶梯通常位于购物中心或机场内，但这座不是！","It's outside.":"它在室外。","It's a great way to travel round this city of hills.":"这是游遍这座山城的好办法。","And it's free!":"而且免费！","There are 14 places where you can get on and off.":"有14个可以上下的地方。","The escalators travel down the hill from 6am to 10am, so people can travel to work.":"自动扶梯每天上午6点到10点向下运行，方便人们上班出行。","They travel up the hill from 10am to midnight.":"上午10点到午夜它们向上运行。","The urban cable car, Turkey.":"土耳其的城市缆车。","Ankara's cable car is cheaper than other forms of public transport.":"安卡拉的缆车比其他公共交通方式更便宜。","It is healthier because it doesn't pollute the air.":"它更健康，因为它不污染空气。","It is also easier and quicker than travelling by car, because there are no traffic jams in the sky!":"它也比驾车出行更轻松、更快捷，因为空中不会有交通堵塞！","It travels 60 metres above the ground, and passengers can get great views of the city.":"它在距地面60米的高处运行，乘客可以饱览城市美景。","Submarines, Lanzarote and Tenerife.":"兰萨罗特岛和特内里费岛的观光潜艇。","Now you can travel in a submarine!":"现在你还能乘坐潜艇出行！","This submarine carries tourists.":"这种潜艇载着游客。","It is a safe and comfortable way to see the colourful fish and the plants and rocks under our seas.":"它是观赏海里五颜六色的鱼以及水下植物和岩石的一种安全又舒适的方式。","The submarine can carry 48 people, and it has 11 large windows on each side.":"这种潜艇可载48人，每侧有11扇大窗户。","It travels down 60 metres under the sea.":"它可下潜到海面下60米。"});

/* ===== p202 文化视频 Ways to Get Around (第12单元 Culture) ===== */
DB.ZH = Object.assign(DB.ZH||{}, {"People use different types of transport to get from one place to the next.":"人们用各种各样的交通工具从一个地方到另一个地方。","In Wuppertal, a city in Germany, the 'Schwebebahn' or suspension railway is very special.":"德国有一座城市叫伍珀塔尔，那里有一种叫 Schwebebahn 的悬挂铁路，非常特别。","The first track opened in 1901.":"第一条轨道于1901年通车。","It is the oldest electric elevated railway with hanging cars in the world.":"它是全世界最古老的电动高架悬挂铁路。","More than 85,000 passengers use it every day.":"每天有超过8.5万名乘客乘坐它。","There are lots of special cars in Cuba, especially in Havana.":"在古巴，尤其是在哈瓦那，有许多特别的车。","Most of them are very old.":"其中大多数都非常老旧。","But these yellow taxis are much newer.":"但这些黄色的出租车要新得多。","They are called cocotaxis because they look like coconuts.":"它们被称为 cocotaxi（椰子车），因为它们看起来像椰子。","They are a great way of getting around.":"它们是四处出游的好方式。","Tourists love them!":"游客们非常喜欢它们！","Tourists also like riding down the hills in Madeira, Portugal, on the Monte Toboggan.":"游客们还喜欢在葡萄牙马德拉岛的蒙特山乘坐木滑车沿山坡滑下来。","Originally, people used these sledges to transport food and other things.":"最初，人们用这些雪橇运送食物和其他物品。","Today, they transport people.":"如今，它们运送的是乘客。","Two 'carreiros', or sledge drivers, run next to the sledge and keep it on the street.":"两名 carreiros（即雪橇驾驶员）在雪橇旁奔跑，让它保持在路中央。","They wear special shoes.":"他们穿着特制的鞋子。","When the ride gets too fast, the drivers can use their shoes to slow it down.":"当滑行速度太快时，驾驶员就能用他们的鞋来减速。","This strange form of transportation is called zorbing or globe-riding.":"这种奇特的交通方式被称为”翻滚球“（zorbing），也叫作“人球骑行”。","And yes, a person is inside!":"没错，人就待在球里面！","The first zorbing site was in New Zealand.":"第一个翻滚球场地在新西兰。","But now you can go zorbing all over the world.":"但现在，你在世界各地都能玩翻滚球。","Even on water.":"甚至在水上也可以。","What's a popular way of getting around in your city?":"在你所在的城市，有什么流行的出行方式呢？"});

/* ===== p73 播客 Stay Positive (第7单元 vlog · LIFE COMPETENCIES) ===== */
DB.ZH = Object.assign(DB.ZH||{}, {"Oh, hello. It's you. Sorry, I'm not feeling great.":"哦，你好。是你啊。抱歉，我现在不太舒服。","Why? This is why. And I have a geography test tomorrow.":"为什么？就是这个原因。而且我明天有地理考试。","I like geography, but there's just so much information to learn.":"我喜欢地理，可需要记的内容实在太多了。","How can I stay positive today?":"我今天怎么才能保持积极呢？","But that's not the only problem.":"可这还不是唯一的问题。","Because I have a geography test tomorrow, I can't do all the things I really want to do today.":"因为我明天有地理考试，今天没法做所有我真正想做的事了。","I can't play tennis with Tyler.":"我没法和泰勒一起打网球了。","I can't go to see a movie with Tyler.":"我没法和泰勒一起去看电影了。","I can't watch baseball with Tyler.":"我没法和泰勒一起看棒球赛了。","I can't go for an ice cream with Tyler.":"我没法和泰勒一起去吃冰淇淋了。","How can I be positive?":"我怎么才能积极起来呢？","I can't do anything.":"我什么事都做不了。","Or can I?":"又或许，我真的还能行？","It's Tyler!":"是泰勒！","Hi, Tyler!":"嗨，泰勒！","Really?":"真的吗？","Good idea!":"好主意！","Of course!":"当然啦！","Now?":"现在？","Amazing!":"太棒了！","See you soon!":"一会儿见！","Tyler has a geography test tomorrow too, and Tyler's great at geography.":"泰勒明天也要考地理，而且泰勒地理学得特别好。","He's coming over to help me, and he's bringing popcorn.":"他要过来帮我，还带了爆米花。","See, stay positive.":"你看，保持积极就好。","That's what I always say, because if you stay positive, you can find an answer to any problem.":"这是我常说的话：只要你保持积极，任何难题你都能找到答案。","Message from Tyler.":"泰勒发来消息。","Find your street. Help.":"找到你的街道。救命！","Maybe Tyler's gonna give you a geography test.":"说不定泰勒还要考考你地理呢。","Just relax.":"放松就好。","See you next time!":"下次见！"});

/* ===== p66 纪录片 LIVING FOR SPORT (第7单元 纪录片视频 · Unit_07.1) ===== */
DB.ZH = Object.assign(DB.ZH||{}, {"A slam dunk and the crowds cheer!":"一记暴扣，全场欢呼！","A game of sports can be so exciting.":"一场比赛可以如此激动人心。","All over the world, people love watching sports, talking about sports and playing sports.":"全世界的人都爱看体育、谈体育、参与体育。","Can you guess why?":"你能猜到为什么吗？","Ball sports are very popular.":"球类运动非常受欢迎。","For example, football.":"比如，足球。","Half of the world loves football.":"全世界有一半的人热爱足球。","That's almost four billion people.":"那几乎是四十亿人。","Volleyball is another popular ball sport.":"排球是另一种受欢迎的球类运动。","You probably know it.":"你很可能对它很熟悉。","But here in Laos they don't play volleyball with their hands and arms.":"但在老挝，人们不用手和手臂打排球。","They play it with their feet, head and knees.":"他们用脚、头和膝盖来打。","This game is called Sepak takraw – kick volleyball.":"这项运动叫藤球——踢式排球。","People love playing it in southeast Asia.":"在东南亚，人们都很喜欢玩这项运动。","Dodgeball is another great ball game.":"躲避球是另一种很棒的打球游戏。","Do you play it at school?":"你在学校玩过吗？","You have to be very good at throwing and catching the ball.":"你必须非常擅长投球和接球。","Bowling uses a different kind of ball – a very hard ball.":"保龄球用的是另一种球——一个非常硬的球。","You can't kick it.":"你不能踢它。","You roll it and try to knock over the pins at the end of the lane.":"你把它滚出去，努力击倒球道尽头的球瓶。","Young and old people can play this game.":"老人和小孩都能玩这项运动。","Do you know squash?":"你了解壁球吗？","Lots of people like playing it.":"很多人都喜欢打壁球。","Usually, it's a game between two players but you can also play in a team.":"通常这是两人对打，但也可以组队来玩。","Players hit the ball against four walls, and it's a very quick sport!":"球员把球打向四面墙，这是一项非常快的运动！","But you have to be careful so you don't get hit.":"但你要小心，别被球砸到。","What's your favourite sport?":"你最喜欢的运动是什么？"});

 67:{u:"Unit 7", audio:"../assets/p067.mp3", title:"SPORT WONDERS!", arts:[
   ["Nikolai Kutsenko, from Ukraine, can do amazing things with a football.",
    "He can kick a ball well ... but he can also keep the ball in the air with his feet, legs and head.",
    "Lots of footballers can do this.",
    "But can they do it for 24 hours and 30 minutes without stopping?",
    "Nikolai can and it's a world record!"],
   ["Sloan Henderson, from Utah, is a really good snowboarder – and she's only 14 months old!",
    "Her mother and father take her to the mountains, and they put her on a snowboard – and there she goes!",
    "Sloan loves to be on the board.",
    "People are often surprised when they see her because she doesn't fall over!"],
   ["American rock-climber Maureen 'Mo' Beck was born without her left hand and only part of her left arm, but she can climb really well.",
    "She is the winner of two climbing World Championships for disabled athletes, and five national championships.",
    "She has her own special way of climbing, but Maureen thinks she is just the same as any other climber."],
   ["Goatee can't talk or write, but she can surf!",
    "Why is this special?",
    "Because Goatee is a goat!",
    "She surfs with her owner, Dana McGregor.",
    "Dana helps Goatee to stand on the board and together they ride the waves in California.",
    "Goatee wears a yellow life-jacket because she can't swim very well!",
    "And now there is a children's book about her, too – Dana is the author."]]},
 70:{u:"Unit 7", audio:"../assets/p070.mp3", title:"An Amazing Last Four Minutes", arts:[
   ["It's 15th February at Greece Athena High School, New York.",
    "Jason McElwain is an 18-year-old student.",
    "Jason is autistic.",
    "He loves basketball and he helps with the school basketball team.",
    "Jason practises hard every day, but he never plays in the team."],
   ["Tonight is the last game of the season.",
    "It's Jason's last chance to play a game with the team, but for 44 minutes, he sits on the bench and watches."],
   ["It's four minutes before the end.",
    "The team is winning, so the coach tells Jason to go out and play.",
    "The team and the crowd are very happy, because everyone knows Jason and likes him.",
    "Jason tries to score a basket, but he misses.",
    "But suddenly he hits a 3-point basket.",
    "The crowd goes crazy.",
    "Jason hits another 3-pointer, then another and another – he hits six 3-pointers (it's a record for the team) and scores twenty points altogether.",
    "The team wins, and Jason is a real hero.",
    "It's an amazing night for him!"],
   ["Soon Jason starts to become famous.",
    "People in his town know who he is.",
    "The US president comes to Jason's town to meet him.",
    "Jason writes a book and some people want to make a film about him.",
    "He becomes assistant coach to the high school basketball team."],
   ["Now Jason works hard to help other autistic people.",
    "He travels across the US to help get money for autism research."]]},
  69:{u:"Unit 7", audio:"../assets/p069.mp3", title:"Dialogue: Planning a Bike Ride", dialog:1, spk:DB.SPE["69"], arts:[
  ["Hi, Julia. It's me, Mike."],
  ["Hi, Mike. How's it going?"],
  ["Do you want to go cycling later today?"],
  ["Go cycling? Good idea. What time?"],
  ["How about after lunch? Say, two o'clock?"],
  ["Two o'clock? No, sorry, I can't. I've got a taekwondo lesson at two."],
  ["OK, how about three o'clock?"],
  ["No, the lesson only finishes at half past three."],
  ["OK, so how about four o'clock?"],
  ["I can't. Mum wants to give me a tennis lesson at four."],
  ["Until what time?"],
  ["I'm not sure. Maybe about quarter to five?"],
  ["Really? But we can't go cycling then. It gets dark at half past four."],
  ["Well, yes, you're right. Sorry."],
  ["So maybe we can go cycling before lunch?"],
  ["Umm, I've got a school rugby match until about half past eleven."],
  ["What time does it start?"],
  ["Ten o'clock."],
  ["Julia, it's quarter to ten now."],
  ["Really? I need to go. Let's go cycling tomorrow."],
  ["OK. Call me in the morning. See you. Have a good match."] ]}
,72:{u:"Unit 7", audio:"../assets/p072.mp3", title:"Rainy Day: Nina & Dave", dialog:1, spk:DB.SPE["72"], arts:[["Right! Have we got everything? Tennis rackets, balls …?"], ["Yes, I think so. And we've got some food – sandwiches, fruit and stuff – and some water. So, let's go."], ["Just a minute! Oh, no! It's raining!", "Now what do we do?"], ["You're right. We can't play outside in the rain."], ["Why don't we go to the sports centre in town? They've got an indoor court."], ["No, it's always very busy. I'm sure we can't play there today."], ["Maybe you're right. It's a bit expensive, too."], ["OK, so we can't play today. It's no big deal. We can play tomorrow, perhaps."], ["Yes. But I'm a bit sad now."], ["Me, too. But what can we do? It's raining, and that's that."], ["I know! How about watching some old tennis games on the internet?"], ["Good idea. I like watching really good players."], ["And we can eat our food."], ["Let's go and switch the computer on."]]},117:{u:"Unit 12", audio:"../assets/p117.mp3", title:"Transport Around the World", arts:[["Transport around the world."], ["The Amfibus, the Netherlands.", "The big, blue Amfibus certainly makes a big splash!", "It's in Rotterdam, and it takes people on tours of the city.", "It's cool.", "It can travel on land and in the water.", "It is more expensive than water taxis, but it is more exciting, too.", "It is slower in the water than on land.", "It goes at 8 kilometres per hour in the water and 96 kilometres per hour on land.", "The tour lasts for an hour, and it costs 27.50 euros."], ["Moving walkways and escalators, Hong Kong.", "The Central-Mid-Levels Escalator is 800 metres long.", "Escalators are usually inside a shopping centre or an airport, but not this one!", "It's outside.", "It's a great way to travel round this city of hills.", "And it's free!", "There are 14 places where you can get on and off.", "The escalators travel down the hill from 6am to 10am, so people can travel to work.", "They travel up the hill from 10am to midnight."], ["The urban cable car, Turkey.", "Ankara's cable car is cheaper than other forms of public transport.", "It is healthier because it doesn't pollute the air.", "It is also easier and quicker than travelling by car, because there are no traffic jams in the sky!", "It travels 60 metres above the ground, and passengers can get great views of the city."], ["Submarines, Lanzarote and Tenerife.", "Now you can travel in a submarine!", "This submarine carries tourists.", "It is a safe and comfortable way to see the colourful fish and the plants and rocks under our seas.", "The submarine can carry 48 people, and it has 11 large windows on each side.", "It travels down 60 metres under the sea."]]},202:{u:"Unit 12", audio:"../assets/p202.mp3", title:"Ways to Get Around", arts:[["People use different types of transport to get from one place to the next.", "In Wuppertal, a city in Germany, the 'Schwebebahn' or suspension railway is very special.", "The first track opened in 1901.", "It is the oldest electric elevated railway with hanging cars in the world.", "More than 85,000 passengers use it every day."], ["There are lots of special cars in Cuba, especially in Havana.", "Most of them are very old.", "But these yellow taxis are much newer.", "They are called cocotaxis because they look like coconuts.", "They are a great way of getting around.", "Tourists love them!"], ["Tourists also like riding down the hills in Madeira, Portugal, on the Monte Toboggan.", "Originally, people used these sledges to transport food and other things.", "Today, they transport people.", "Two 'carreiros', or sledge drivers, run next to the sledge and keep it on the street.", "They wear special shoes.", "When the ride gets too fast, the drivers can use their shoes to slow it down."], ["This strange form of transportation is called zorbing or globe-riding.", "And yes, a person is inside!", "The first zorbing site was in New Zealand.", "But now you can go zorbing all over the world.", "Even on water.", "What's a popular way of getting around in your city?"]]},};
/* ===== p114 阅读B My Favourite Journey (第12单元) ===== */
DB.ZH = Object.assign(DB.ZH||{}, {"My favourite journey. We all love going on a journey.":"我最喜欢的旅程。我们大家都喜欢去旅行。","Here are some of your favourites. Thank you for sharing them!":"这里有一些你们最喜欢的旅程。感谢大家的分享！","Adam. I love boats and my favourite boat journey is the one by ferry across the Danube River.":"亚当：我喜欢船，我最喜欢的乘船旅程是乘渡船横渡多瑙河的那一段。","My grandma lives in Budapest.":"我奶奶住在布达佩斯。","When I visit her, we often go on it together.":"我去看她时，我们常常一起乘坐这条渡船。","It's not a long journey.":"这趟旅程并不长。","It's only ten minutes.":"只需十分钟。","The ferry just takes you across the river to the other side of the city.":"渡船只是把你送到河对岸，也就是城市的另一边。","We don't get off the boat.":"我们不下船。","We just go there and back again.":"我们只是坐过去，再坐回来。","Rose!":"罗斯：","I really love steam trains.":"我真的很喜欢蒸汽火车。","There's one in Scotland.":"苏格兰就有一列。","It goes from Fort William to Mallaig on the west coast, and it's called the Jacobite Steam Train.":"它从西海岸的威廉堡驶往马莱格，被称为“詹姆斯党号”蒸汽火车。","It's the famous one you see in the Harry Potter films.":"它就是你在《哈利·波特》电影里看到的那一列著名的火车。","The one that takes Harry and his classmates to Hogwarts. But that's not why I like it.":"就是送哈利和他的同学们去霍格沃茨的那一列。但我喜欢它并非因为这个原因。","I like the sound it makes and I like the view from the window.":"我喜欢它发出的声响，也喜欢窗外的景色。","It travels past lakes and mountains and beautiful beaches.":"它沿途经过湖泊、山峦和美丽的海滩。","What's my favourite journey?":"我最喜欢的旅程是什么呢？","My journey to school.":"是我上学的那段路。","We live in a village and my school is in the next village.":"我们住在一个村子里，我的学校在下一个村子。","Every morning, I walk across the fields and then along the river until I'm at school.":"每天早晨，我穿过田野，再沿着河边走，直到到达学校。","It's a really beautiful walk.":"这段路程真是美极了。","I love looking for birds.":"我喜欢寻找小鸟。","There are some lovely ones.":"那儿有几只可爱的小鸟。","And sometimes, if I'm lucky, I see a rabbit.":"有时，如果我运气好，还能看到一只兔子。","I love my walk to school.":"我喜欢去学校的那段路。","But I love the walk home more!":"但我更喜欢回家那段路！","Max. My favourite journey is a very fast bike ride.":"马克斯：我最喜欢的旅程是一次极速的骑行。","My grandparents have a house in the mountains. There is a road down the mountain to the town.":"我的祖父母在山里有一栋房子。有一条路从山上通向小镇。","It goes down very fast, and it goes through a big forest.":"下山的路非常快，途中还会经过一大片森林。","Every morning, we ride down to the town to get bread.":"每天早晨，我们骑车下到镇上买面包。","It only takes ten minutes to ride down, but it takes a lot longer to ride back up again!":"骑车下去只需十分钟，可再骑回山上却要久得多！"});

DB.ZH = Object.assign(DB.ZH||{}, {"Good morning.":"早上好。","How can I help you?":"有什么可以帮您？","Hello.":"你好。","I want to go to Windsor.":"我想去温莎。","What time's the next train?":"下一趟火车几点开？","There's one in five minutes.":"五分钟后就有一趟。","It's a fast train.":"那是一趟快车。","It only stops at Clapham Junction and Windsor.":"它只在克拉珀姆交汇站和温莎停靠。","You can catch that one.":"您可以搭那一趟。","And the one after that?":"那下一趟呢？","There's one at half past ten, but that's a slower train.":"十点半有一趟，但那是慢车。","It stops at every station.":"它每站都停。","That's OK.":"没关系。","I'm not in a hurry, and I don't want to run.":"我不赶时间，也不想跑着赶车。","What time does that one arrive in Windsor?":"那趟车几点到温莎？","At half past eleven.":"十一点半到。","It takes an hour.":"要行驶一个小时。","And how often are the trains to Windsor?":"去温莎的火车多久一班？","They're every half hour.":"每半小时一班。","Great!":"太好了！","And how much is a ticket?":"车票多少钱一张？","Do you want a single or a return?":"您要单程票还是往返票？","A return, please.":"请给我一张往返票。","Are you returning today?":"您是今天返回吗？","Yes, I am.":"是的。","Then you can get an off-peak day return ticket for £12.70.":"那么您可以买一张非高峰时段当日往返票，票价12.70英镑。","It's cheaper than the anytime day return.":"它比任何时段都适用的当日往返票更便宜。","That's £19.90.":"那种票价是19.90英镑。","Right.":"好的。","I'd like the off-peak day return one then.":"那我就买非高峰时段当日往返票。","OK.":"好的。","That's £12.70, please.":"请付12.70英镑。","What platform does the train leave from?":"火车从哪个站台发车？","It leaves from platform 15.":"从15号站台发车。","And what platform does it arrive at in Windsor?":"那在温莎从哪个站台到站呢？","My friend wants to meet me there.":"我的朋友要在那里接我。","Platform 1.":"在1号站台。","But Windsor is a very small station, a lot smaller than Waterloo.":"不过温莎是个很小的车站，比滑铁卢站小得多。","There are only two platforms at Windsor.":"温莎站只有两个站台。","OK, then that's not a problem.":"好吧，那就不成问题了。","Thank you.":"谢谢。","Have a good journey.":"祝您旅途愉快。"});
Object.assign(DB.ZH||{}, {"I'm leaving home.":"我要出门了。","We're on our way to the station.":"我们正在去车站的路上。","I'm so excited!":"我太兴奋了！","We're standing on the platform waiting for the train to Delamere Forest.":"我们站在站台上，等着开往德拉梅尔森林的火车。","We're here!":"我们到啦！","What a fantastic place to see my favourite singer Jess Glynne right in the middle of a beautiful forest.":"在美丽的森林正中间看我最喜欢的歌手杰丝·格林妮，这地方太棒了！","I'm eating a hot dog.":"我在吃热狗。","It's very expensive, but it's not very good!":"贵得很，却不太好吃！","It's getting dark now.":"天渐渐黑了。","The stage is completely black.":"舞台一片漆黑。","A few people are talking, but most people are quiet.":"有几个人在说话，但大多数人都很安静。","We're waiting for Jess.":"我们在等杰丝。","And here she comes!":"她来了！","Everyone is cheering!":"大家都在欢呼！","What a noise!":"好大的欢呼声！","Jess isn't on stage.":"杰丝不在台上。","Is the show over?":"演出结束了吗？","No way!":"才不会呢！","We're all shouting 'more'.":"我们都在喊'再来一个'。","Why are we shouting?":"我们为什么喊？","Because we want MORE!":"因为我们想要更多！","But don't worry.":"不过别担心。","She's walking back onto the stage.":"她正走回舞台。","We're on the train home.":"我们在回家的火车上。","We aren't sitting down.":"我们都没坐着。","I don't care.":"我不在乎。","There are so many people on the train and everybody's a Jess Glynne fan.":"火车上人特别多，而且人人都是杰丝·格林妮的歌迷。","We're all singing 'Hold my Hand'.":"我们都在唱《握住我的手》。","It's my favourite song.":"这是我最喜欢的歌。","It's exactly midnight and we're back home.":"正好午夜十二点，我们到家了。","I'm feeling tired but very happy.":"我很累，但非常开心。","I'm going straight upstairs to bed.":"我直接上楼睡觉去了。"});
Object.assign(DB.ZH||{}, {"Hello and welcome!":"大家好，欢迎收听！","Today we are talking about different music from around the world.":"今天我们聊一聊世界各地的不同音乐。","Is there a type of music that you really like?":"有没有一种你特别喜欢的音乐呢？","Phone and tell us.":"打电话告诉我们吧。","Our first caller is Liliana.":"第一位来电的是莉莉安娜。","OK Liliana, what's your favourite music?":"好的，莉莉安娜，你最喜欢什么音乐？","Hello! My mother is Mexican and we often go to Mexico.":"你好！我妈妈是墨西哥人，我们经常去墨西哥。","I love the mariachi music I see there.":"我喜欢在那里听到的墨西哥街头乐队音乐。","There's a group of men and sometimes women and they all stand up playing instruments like guitars, trumpets and violins.":"有一组男士，有时也有女士，他们都站着演奏吉他、小号和小提琴等乐器。","They also wear traditional Mexican hats.":"他们还戴着传统的墨西哥帽子。","I think they look fantastic.":"我觉得他们看起来棒极了。","Yes, thanks Liliana.":"好的，谢谢你，莉莉安娜。","And now here's Lewis.":"现在连线的刘易斯。","Hi Lewis, tell us what you like.":"嗨，刘易斯，说说你喜欢什么。","Hi there.":"你好。","Well in Indonesia there's this traditional musical performance called gamelan.":"在印度尼西亚，有一种叫加美兰的传统音乐表演。","They have these orchestras with some very unusual instruments.":"他们有配备非常独特乐器的乐队。","They make beautiful sounds and when they all play the musicians wear the same traditional clothes.":"乐声优美，合奏时乐手们都穿同样的传统服装。","Thanks Lewis.":"谢谢你，刘易斯。","And now let's talk to Jen.":"现在我们来连线珍。","I love African drumming.":"我喜欢非洲鼓乐。","I go to a lot of musical festivals and there's always some African drumming.":"我参加过很多音乐节，总有非洲鼓乐表演。","Is there any African country you like the drumming from most?":"有没有哪个非洲国家的鼓乐你最喜欢？","Well I like all African drumming but the drummers from Burundi are fantastic and they wear these really cool green, red and white clothes.":"嗯，非洲鼓乐我都喜欢，不过布隆迪的鼓手特别棒，他们穿着绿、红、白三色的超酷服装。","They're the colours of the Burundi flag.":"那正是布隆迪国旗的颜色。","Sometimes they also paint their drums in the same colours.":"有时他们还把鼓漆成同样的颜色。","Okay, thank you Jen.":"好的，谢谢你，珍。"});
Object.assign(DB.ZH||{}, {"Who are you?":"你是谁？","I'm Danny Boyd.":"我是丹尼·博伊德。","I'm 14 years old and I'm from Luton.":"我 14 岁，来自卢顿。","What do you do?":"你是做什么的？","I'm a student at school and at the weekends I work as a DJ.":"我是个学生，周末做 DJ。","Wow, that's interesting.":"哇，真有意思。","Can you tell us more?":"能多跟我们讲讲吗？","I'm a DJ at a local youth club.":"我在当地一家青年俱乐部做 DJ。","I play every Saturday from 6pm to 10pm.":"我每周六下午 6 点到晚上 10 点打碟。","There's usually about 100 people there.":"那里通常大约有 100 人。","It's great fun.":"特别好玩。","I also sometimes play for big crowds in the park and sometimes on the beach too.":"我有时也会在公园里给一大群人打碟，有时也在海滩上。","What do you like doing in your free time?":"空闲时你喜欢做什么？","I love listening to music and finding new songs to play.":"我喜欢听音乐，找新歌来播。","I like watching films and playing games on my VR headset but I hate dancing.":"我喜欢看电影、用 VR 头显玩游戏，但我讨厌跳舞。","I know that's a strange thing for a DJ to say.":"我知道对 DJ 来说这话说出来很奇怪。","I love watching other people dance but I never dance myself.":"我喜欢看别人跳舞，但自己从不跳。","What do you like wearing?":"你喜欢穿什么？","I like wearing jeans and a white T-shirt.":"我喜欢穿牛仔裤和白 T 恤。","I also wear a red cap.":"我还戴一顶红色的棒球帽。","I don't like wearing shirts and trousers.":"我不喜欢穿衬衫和长裤。","I wear those every day at school.":"那些我每天上学都得穿。","Thanks Danny and good luck.":"谢谢你，丹尼，祝你好运。","Thank you.":"谢谢。","Why don't you come to one of my shows one day?":"哪天来找我的一场演出怎么样？"});
Object.assign(DB.ZH||{}, {"The Tango is the national dance of Argentina, and every year on 11th December people in Buenos Aires celebrate the Day of the Tango.":"探戈是阿根廷的国舞，每年 12 月 11 日，布宜诺斯艾利斯的人们都会庆祝探戈日。","They do the tango in dance halls, parks and squares all over the city.":"全市的舞厅、公园和广场上人们都在跳探戈。","The dance is usually performed by a man and a woman.":"这种舞通常由一男一女共舞。","The man often wears smart trousers and a shirt.":"男士常穿笔挺的长裤和衬衫。","The woman often wears a beautiful dress.":"女士常穿漂亮的连衣裙。","The dance is often very interesting to watch.":"这种舞看起来常常非常有趣。","The Whirling Dervish is a dance from Turkey.":"旋转舞是一种源自土耳其的舞蹈。","There is a group of twelve men who dance.":"有一组十二位男士共舞。","They wear traditional costumes with big skirts.":"他们穿着带大裙摆的传统服装。","They often all wear white, but sometimes the skirts are different colours.":"他们通常全身白衣，但裙摆有时是不同颜色。","There is another group of twelve musicians.":"还有另一组十二位乐手。","They play traditional Turkish instruments.":"他们演奏传统的土耳其乐器。","As the music plays, the dancers spin around in circles, getting faster and faster.":"随着音乐，舞者们转圈旋转，越转越快。","The dance is very popular with tourists.":"这种舞很受游客欢迎。","There are lots of Irish dances, but perhaps the most famous one is the step dance.":"爱尔兰舞蹈很多，但最有名的也许要数踢踏舞。","One or more dancers perform the step dance.":"踢踏舞由一名或多名舞者表演。","The dancers only move their legs.":"舞者只动腿。","They move them very quickly.":"而且动得飞快。","The top half of the body doesn't move.":"上半身纹丝不动。","Dancers usually wear traditional Irish costumes.":"舞者通常穿传统的爱尔兰服装。","The music they dance to is played by an Irish folk band.":"伴奏由一支爱尔兰民谣乐队演奏。","They play instruments like the fiddle and the whistle.":"他们演奏菲德尔琴和哨笛等乐器。"});
Object.assign(DB.ZH||{}, {"Harry doesn't want to be a star chef when he's 20.":"哈里不是等到 20 岁才想当明星大厨。","He wants to be one now.":"他现在就想当。","This is why he's on the TV programme Kitchen Kids.":"所以他上了《厨房小孩》这档电视节目。","The ten-year-old New Yorker likes cooking.":"这个 10 岁的纽约孩子喜欢烹饪。","He can make fantastic soups and salads, excellent omelettes and the best cakes.":"他会做特别好喝的汤和沙拉、一流的煎蛋卷，还有最棒的蛋糕。","But there are many other children on the show, too.":"不过节目里还有许多其他孩子。","And they are all very good.":"而且他们都很厉害。","More and more young people are interested in cooking.":"越来越多的年轻人对烹饪感兴趣。","Many of them learn it from their parents.":"他们中很多人是跟父母学的。","Others watch special cooking videos for children on YouTube.":"还有些人在 YouTube 上看专为孩子做的烹饪视频。","In many cities, there are special cooking classes for young people.":"许多城市都有面向青少年的专门烹饪课。","Some of them are for children from the age of three!":"有些班甚至招收 3 岁起的孩子！","But what must you do to become a star chef?":"那么，要成为明星大厨必须做到什么呢？","Of course, it's important that you like cooking and are really good at it.":"当然，喜欢烹饪而且做得好很重要。","But there are some rules.":"但也有一些规矩。","You must be nine years old or more to be on Kitchen Kids.":"上《厨房小孩》必须年满 9 岁。","'We must wash our hands before we start cooking,' Harry says.":"'开始做菜前必须洗手，'哈里说。","'And of course we mustn't put them in our mouths.":"'当然也绝不能把手放进嘴里。","A chef doesn't do that!":"大厨可不这么干！","And we must be very careful with hot plates.'":"还有，端热盘子一定要非常小心。'","The show starts.":"节目开始了。","Harry is excited.":"哈里很兴奋。","He knows he's an excellent cook.":"他知道自己手艺出众。","This time he makes tomato soup, some salad, steak and carrot cake.":"这次他做番茄汤、一些沙拉、牛排和胡萝卜蛋糕。","The experts in the studio love Harry's food, and he stays on the show.":"演播室的评委们很喜欢哈里的菜，他留在了节目里。","It's 5 pm.":"下午 5 点。","The show is over.":"节目结束了。","Harry is happy, and a little tired.":"哈里很开心，也有点累。","He goes home.":"他回家了。","It's time to do his homework.":"该写作业了。"});
Object.assign(DB.ZH||{}, {"Can we make some sandwiches, Dad?":"爸爸，我们能做些三明治吗？","Of course you can. No problem.":"当然可以，没问题。","Would you like some help?":"需要帮忙吗？","No, we're OK, thanks.":"不用了，我们自己行，谢谢。","Can we use this cheese, Dad?":"爸爸，我们能用这块奶酪吗？","No, your mum wants that for the lasagne. Use this cheese.":"不行，你妈妈要拿它做千层面。用这块。","Okay.":"好吧。","We need some salad in the sandwiches. Have we got any?":"三明治里得加点沙拉菜，我们还有吗？","There's no cucumber, but there are some tomatoes.":"黄瓜没有了，不过还有些西红柿。","Let's have cheese and tomato sandwiches then.":"那就做奶酪西红柿三明治吧。","Cool.":"好嘞。","What are you doing, Dad?":"爸爸，你在干什么？","I'm putting some peanut butter on the bread. It's tastier than butter.":"我在往面包上抹花生酱，比黄油香。","Don't do that.":"别那样做。","Too late.":"已经抹上了。","The thing is, Sally is allergic to nuts.":"问题是，萨莉对坚果过敏。","Oh no. I'm sorry.":"哦不，对不起。","Never mind. I can eat these.":"没关系，这些我能吃。","And you can make some more.":"你们可以再做一些。","We can't make any more. We haven't got any more bread.":"做不了了，面包没有了。","I know. Can we go for fish and chips, Dad?":"我知道。爸爸，我们去吃炸鱼薯条行吗？","Mmm … OK. Yes, we can.":"嗯，好吧，可以。","Great.":"太好了。","And can Sally and Max come too?":"那萨莉和麦克斯也能一起去吗？","Yes, of course they can.":"当然可以。","But first, we must clean up this mess.":"但首先，得把这堆乱摊子收拾干净。","Oh, Dad. We're hungry now. Can we do that later?":"哦爸爸，我们现在就饿了，能等会儿再收拾吗？","No, we can't.":"不行。"});
Object.assign(DB.ZH||{}, {"Hello. Can I help you?":"您好，请问需要点什么？","Hi, yes. We'd like a table for two, please.":"你好，我们想要一张两人桌。","Here are the menus.":"这是菜单。","Thanks.":"谢谢。","What would you like to drink?":"想喝点什么？","I'd like an orange juice.":"我要一杯橙汁。","And I'd like water, please.":"我要水。","Great.":"很棒。","Are you ready to order now?":"现在可以点餐了吗？","Yes. I'd like the pizza with salad.":"可以。我要披萨配沙拉。","Any starters?":"要开胃菜吗？","No thanks.":"不用了，谢谢。","Would you like any extra toppings on the pizza? Onion, peppers, or tomatoes?":"披萨上要加配料吗？洋葱、彩椒还是西红柿？","Some peppers, please.":"请加些彩椒。","And what would you like?":"那您要什么？","I'd like the chicken and chips.":"我要鸡肉配薯条。","Okay. Is that everything?":"好的。就这些了吗？","Yes. Thank you.":"是的，谢谢。","Would you like a dessert?":"要甜品吗？","Yes, please. I'd like the fruit salad with vanilla ice cream.":"要，我要水果沙拉配香草冰淇淋。","Me, too.":"我也是。","How are your desserts?":"甜品好吃吗？","Would you like any more drinks?":"还要加饮品吗？","No, thanks. We'd like the bill, please.":"不用了，谢谢。请给我们结账。","Of course.":"好的。","Thank you.":"谢谢。"});
Object.assign(DB.ZH||{}, {"Wow! What a great smell!":"哇！好香啊！","Thanks, Mum! It's lasagna. It's in the oven and it's almost ready.":"谢谢妈妈！是千层面，在烤箱里，马上就好。","Lasagna from the shop?":"是店里买的千层面吗？","No, Mum. It's my lasagna.":"不是，妈，是我自己做的。","It's got meat, pepper, mushrooms, cheese, onion, everything.":"有肉、彩椒、蘑菇、奶酪、洋葱，什么都有。","And we can eat it with a bit of salad.":"还可以配点沙拉一起吃。","Oh, right! But we? Who's coming for lunch?":"哦，这样！不过'我们'？谁要来吃午饭？","Mark and Chloe. We want to study together this afternoon and have lunch together first.":"马克和克洛伊。我们下午想一起学习，先一起吃午饭。","That's okay, right?":"可以的吧？","Of course, Joe. But...":"当然可以，乔。不过……","But what, Mum?":"不过什么，妈？","Well, the thing is, I'd like a nice quiet afternoon.":"是这样，我想要个安静点的下午。","Oh, don't worry, Mum. After lunch, we plan to study upstairs in my room.":"哦别担心，妈。午饭过后我们打算上楼在我房间里学习。","Oh! It's ready!":"哦！好了！","Be careful, Joe. It's very hot. Can I help you?":"小心，乔，很烫。要我帮忙吗？","It's okay, Mum. I can just... Oh, no! My lasagna! It's all over the floor!":"没事，妈，我就……哦不！我的千层面！全洒在地上了！","Now what?":"现在怎么办？","Well, first, let's clean it all up. And then, do you and your friends want to go to the new sandwich shop?":"这样，先把它清理干净。然后，你和朋友们想去新开的三明治店吗？","Not really. But I've got an idea, Mum. We can just have the salad.":"不太想去。不过我有个主意，妈，我们就吃沙拉吧。","Okay. And you and I can make some chocolate-covered bananas so your friends can have some dessert, too.":"好。然后咱俩做些巧克力香蕉，让你的朋友们也有甜品吃。","Thanks, Mum. You're the best!":"谢谢妈！你是最棒的！"});
Object.assign(DB.ZH||{}, {"Valentina Tereshkova was born in Russia on 6th March 1937.":"瓦莲京娜·捷列什科娃 1937 年 3 月 6 日出生于俄罗斯。","Her father was a driver and her mother worked in a factory.":"她父亲是司机，母亲在工厂做工。","Valentina was a worker in a factory, too.":"瓦莲京娜也是一名工厂工人。","Her hobby was skydiving and it was her dream to be an astronaut and to go into space.":"她的爱好是跳伞，当宇航员进入太空是她的梦想。","In 1962, there was a big competition to find new astronauts.":"1962 年，举行了一场大规模的选拔赛来寻找新宇航员。","There were 400 people interested in going to space.":"有 400 人想上太空。","The training programme wasn't very easy, but Tereshkova was hardworking.":"训练计划并不轻松，但捷列什科娃非常刻苦。","And she was the lucky one.":"而她就是那个幸运儿。","Tereshkova's big day was on 16th June 1963, and she was just 26.":"捷列什科娃的大日子是 1963 年 6 月 16 日，当时她只有 26 岁。","The next year, she married Andrian Nikolayev, and Tereshkova was the first woman in space.":"第二年她嫁给了安德里扬·尼古拉耶夫；捷列什科娃是第一位进入太空的女性。","The flight was very difficult because there were many technical problems and Tereshkova wasn't very well for most of the flight.":"飞行非常艰难，出现了许多技术故障，捷列什科娃在飞行的大部分时间里身体都不太舒服。","She was in space for three days.":"她在太空待了三天。","She is the only woman to fly into space alone.":"她是唯一独自身处太空的女性。","After that, she was very famous all over the world.":"此后她闻名全世界。","Her face was on stamps in many countries.":"许多国家的邮票上都印着她的面孔。","In the year 2000, there was a big celebration in London, and Valentina Tereshkova was named 'Woman of the Century'.":"2000 年，伦敦举行了一场盛大庆典，瓦莲京娜·捷列什科娃被评为'世纪女性'。","At the opening ceremony of the Winter Olympics in Russia in 2014, Valentina Tereshkova was one of the carriers of the Olympic flag.":"2014 年俄罗斯冬奥会开幕式上，瓦莲京娜·捷列什科娃是奥运旗手之一。","These were very important moments for her.":"这些对她都是非常重要的时刻。"});
Object.assign(DB.ZH||{}, {"Hi Will, how are you? Are you better?":"嗨威尔，你好吗？好些了吗？","Yes, thanks. I was ill yesterday and the day before but I'm OK now.":"好多了，谢谢。昨天和前天我病了，但现在没事了。","Good, I'm pleased.":"那就好，我很高兴。","So yesterday was the prize-giving at school, right? Was it good?":"昨天是学校的颁奖礼，对吧？办得好吗？","No, it wasn't. Well, not really. There weren't many parents there.":"不怎么样，呃，说不上好。去的家长不多。","Oh really? There were lots last year. Were all the teachers there?":"哦是吗？去年可去了好多。老师们都到了吗？","Of course! The teachers can't choose, can they?":"当然！老师们不能缺席，对吧？","No, and neither can the kids. Anyway, who were the big winners this year?":"是啊，孩子们也一样。对了，今年大奖都归谁了？","Well, the best student of the year for the whole school was Sandra Hammond.":"嗯，全校年度最佳学生是桑德拉·哈蒙德。","Sandra? Was she the best student last year too?":"桑德拉？她去年不也是最佳学生吗？","No, she wasn't. It was her brother Tom. This year Tom was the best sportsperson in the school.":"不是，去年是她哥哥汤姆。今年汤姆成了全校最佳运动员。","Oh, the Hammonds! They always win everything! Boring!":"哦，哈蒙德家的！什么奖都被他们拿光了！无聊！","I know but it's OK – they're leaving at the end of term, so next year, who knows? Maybe you!":"我知道，不过没关系。他们这学期末就走了，明年谁知道呢？说不定是你！","You're joking of course. I'm never the best at anything.":"你当然是开玩笑。我干什么都轮不到最好。","Well, anyway, guess who the best science student was?":"好吧，那你猜猜最佳科学奖得主是谁？","No idea. Andy Clarkson?":"不知道。安迪·克拉克森？","No, me!":"不是，是我！","You? Really? Well done! That's fantastic! I'm proud of you. Was the prize something nice?":"你？真的吗？干得好！太棒了！我为你骄傲。奖品是什么好东西吗？","Yes, it was. A book about science. I really want to read it.":"是啊，一本关于科学的书，我特别想读。","Good for you, Alice. Well done! Thanks Will.":"真有你的，爱丽丝。干得好。谢谢你，威尔。"});
Object.assign(DB.ZH||{}, {"Yesterday, I was online and I learned about a woman called Amy who walked all round the UK to get money for charity.":"昨天我上网时了解到一位叫埃米的女子，她为慈善徒步走遍了英国。","And in winter!":"而且是在冬天！","When there was rain and snow!":"那时还下着雨和雪！","Do you know any other amazing stories like that?":"你还知道其他这样了不起的故事吗？","How about Dee Caffari?":"德伊·卡法里怎么样？","She sailed around the world, non-stop, three times!":"她不停站地环球航行了三次！","That’s right, three times.":"没错，三次。","Imagine the wind and the rain!":"想象一下那风雨吧！","Fantastic, eh?":"太了不起了，是吧？","OK, well there’s a boy called Jordan Romero, from the US – he climbed Mount Everest when he was 13 years old.":"嗯，有个叫乔丹·罗梅罗的美国男孩——他 13 岁就登上了珠穆朗玛峰。","It’s really cold up there, but he managed to get to the top.":"那上面真的非常冷，但他还是成功登顶了。","Only 13!":"才 13 岁啊！","Now that’s an achievement.":"这才叫成就呢。","My friend Corey Armstrong decided to run a marathon when he was 16.":"我朋友科里·阿姆斯特朗 16 岁时决定跑马拉松。","He finished in just over four hours.":"他用了四个多小时就跑完了。","He enjoyed it a lot, so then he decided to do the marathon in Death Valley in the US.":"他特别享受，于是决定去美国的死亡谷跑马拉松。","It’s so hot there – often more than 40 degrees Celsius.":"那里非常热——常常超过 40 摄氏度。","This time he was slower, almost five hours – but I still think it’s fantastic.":"这次他慢了些，将近五个小时——但我仍然觉得很了不起。","42 kilometres when it’s over 40 degrees!":"40 多度的高温下跑 42 公里！","I think he almost died!":"我觉得他差点撑不住了！","Before 1926, a lot of women tried to swim the cold water of the English Channel from England to France – but they all failed.":"1926 年前，许多女性尝试从英国游过寒冷的英吉利海峡到法国——但都失败了。","But in 1926, Gertrude Ederle (an Olympic gold medal swimmer) arrived on an English beach after 14 hours and 31 minutes.":"但在 1926 年，格特鲁德·埃德尔（奥运游泳金牌得主）用了 14 小时 31 分钟游到了英国的海滩。","She returned to her home in New York a hero!":"她作为英雄回到了纽约的家！","How about that!?":"多么了不起！？"});
Object.assign(DB.ZH||{}, {"There are many wonderful statues all over the world.":"世界上有许多了不起的雕像。","Many of them help us to remember the lives of great people.":"其中很多是为了让我们记住伟人的一生。","Rosa Parks":"罗莎·帕克斯","One day in 1965, a bus driver in Alabama in the US asked Rosa Parks to give a man her seat because he was white and she was black.":"1965 年的一天，美国亚拉巴马州的一位公交车司机让罗莎·帕克斯把座位让给一名男子，因为那人是白人而她是黑人。","She said no and the police decided to take her away.":"她拒绝了，警察便把她带走了。","It was a very important moment in the history of black people's rights in the US.":"这是美国黑人民权历史上非常重要的时刻。","The statue shows Rosa sitting on a rock wearing the same clothes as that day in 1965.":"雕像中的罗莎坐在一块岩石上，穿着与 1965 年那天相同的衣服。","Franz Kafka":"弗朗茨·卡夫卡","Franz Kafka was a writer from Prague.":"弗朗茨·卡夫卡是一位来自布拉格的作家。","He was born in 1883.":"他出生于 1883 年。","His books were in German.":"他的书都是用德语写的。","In his life, he was not very famous, but now he is.":"他在世时并不出名，现在却家喻户晓。","Many of his stories were very strange.":"他的许多故事都非常离奇。","There's a very unusual statue of him in Prague.":"布拉格有一座非常独特的他的雕像。","He's sitting on the shoulders of an empty suit.":"他坐在一套空西装的肩膀上。","Os Candango":"坎丹戈","The Candango were men who travelled from all over Brazil between 1956 and 1960 to build the new capital city of Brazil, Brasilia.":"坎丹戈们是 1956 到 1960 年间从巴西各地赶来建设新首都巴西利亚的人。","In 1956, 256 men arrived, but before long there were 30,000 who worked hard to build the city.":"1956 年来了 256 人，不久就有 3 万人辛勤建设这座城市。","Brasilia opened in 1960 and this 8 meter high statue to remember the Candango is in the 3 powers square.":"巴西利亚于 1960 年建成，这座 8 米高、纪念坎丹戈的雕像坐落在三权广场。","The two figures are holding digging tools.":"两座人像手持挖掘工具。","Suzanne Lenglen":"苏珊·朗格伦","At the Roland Garros tennis centre in Paris, there is a court called Suzanne Lenglen.":"巴黎罗兰·加洛斯网球中心有一座以苏珊·朗格伦命名的球场。","Lenglen was a famous French tennis player who played from 1914 to 1926.":"朗格伦是法国著名网球运动员，1914 到 1926 年间活跃于赛场。","She was the number one player for many years.":"她多年稳居头号选手。","In front of the court is this statue.":"球场前矗立着这座雕像。","Lenglen is jumping with a racket in her hand and she is wearing her famous white dress and headband.":"朗格伦手持球拍跃起，身穿她著名的白色裙装，系着发带。"});
Object.assign(DB.ZH||{}, {"Everyone knows that dolphins are very intelligent animals.":"人人都知道海豚是非常聪明的动物。","But did you know that many scientists believe there is a special connection between dolphins and humans?":"但你知道吗，许多科学家认为海豚和人类之间存在一种特殊的联系。","There are lots of stories about dolphins helping humans who are in danger.":"关于海豚救助危难中的人类，有很多故事。","Here are two of our favourites.":"这是我们最喜欢的两个。","14-year-old Davide Cecchi was in his father's boat off the southeast coast of Italy when he had an accident and fell into the water.":"14 岁的大卫·切基在意大利东南沿海父亲的船上出了事故，掉进了水里。","Davide didn't know how to swim, and his father didn't see him fall, so he didn't stop the boat.":"大卫不会游泳，父亲也没看见他落水，所以没有停船。","He shouted, but his dad didn't hear him.":"他大喊，但爸爸没有听见。","Davide got very worried.":"大卫非常着急。","Then, very quickly, a dolphin came to help him.":"这时，一只海豚飞快地游来救他。","It gave Davide a push back up to the top of the water, and the boy got on to the dolphin's back.":"它把大卫往水面上顶，男孩爬到了海豚背上。","The dolphin took him back to the boat.":"海豚把他驮回了船边。","When Davide's father saw his son, he pulled him from the water.":"大卫的爸爸看见儿子后，把他从水里拉了上来。","The dolphin saved Davide's life.":"海豚救了大卫一命。","In 2016, Adam Walker went to New Zealand to swim across the Cook Strait between the North and South Islands.":"2016 年，亚当·沃克去新西兰，要游过北岛与南岛之间的库克海峡。","He was swimming when he saw a large dark shape below him.":"他正游着，忽然看见身下一个巨大的黑色影子。","He knew that it was a great white shark and his life was in danger.":"他知道那是一条大白鲨，自己有生命危险。","Adam knew he didn't have a lot of time.":"亚当明白时间紧迫。","A few seconds later, a group of ten dolphins joined him and swam in a circle between him and the shark.":"几秒钟后，十只海豚游来围在他和鲨鱼之间绕圈。","The circle of dolphins kept Adam safe.":"海豚圈保护了亚当的安全。","After half an hour, the shark left, but the dolphins swam with him for another hour.":"半小时后鲨鱼走了，海豚又陪他游了一个小时。"});
Object.assign(DB.ZH||{}, {"Hey Josh, did you have a good holiday?":"嗨乔什，假期过得开心吗？","Hi Mandy, yes it was great.":"嗨曼迪，开心，棒极了。","Where did you go?":"你去哪儿了？","The Pantanal, it's in the east of Brazil. It's a really big wetland.":"潘塔纳尔，在巴西东部，是一片特别大的湿地。","Oh right, so why did you go there?":"哦这样，那你们为什么去那儿？","Because there are amazing animals and birds there.":"因为那里有超棒的动物和鸟类。","We all love animals in my family, especially my dad.":"我们全家都喜欢动物，尤其是我爸爸。","He's a bird watcher.":"他是个观鸟者。","Really? I didn't know that.":"真的吗？我还不知道呢。","Yes, he loves birds.":"是啊，他特别爱鸟。","So are you a big bird watcher too?":"那你也很爱观鸟吗？","Well I like them and we saw some really beautiful parrots and toucans, but I prefer the other animals.":"嗯，我喜欢鸟，我们也看到了特别漂亮的鹦鹉和巨嘴鸟，不过我更喜欢其他动物。","Did you see anything special?":"看到什么特别的了吗？","Yes, loads of stuff.":"有，好多呢。","There were lots of caiman.":"有好多凯门鳄。","Caiman, what are they?":"凯门鳄？那是什么？","They're like small crocodiles.":"就像小一号的鳄鱼。","Cool, what else did you see?":"酷，还看到什么了？","We saw an anaconda, you know one of those really big snakes, and then one night we heard a jaguar but we didn't see it.":"我们看到了一条森蚺，就是那种特别大的蛇；还有一天晚上我们听见了美洲豹的叫声，但没看见它。","Wow, were you scared?":"哇，你们害怕吗？","No, it was exciting, especially because it was so near our tent.":"不怕，反而很刺激，尤其它就在我们帐篷旁边。","Tent? Did you go camping?":"帐篷？你们去露营了？","Yes, but just for a few nights. Most of the time we were in small hotels.":"是啊，不过就住了几晚，大多数时候住小旅馆。","So how did you travel around? Did you have a guide?":"那你们怎么四处游览？有向导吗？","Yes, we did.":"有。","His name was Sergio.":"他叫塞尔希奥。","He knew where to find all the animals.":"他知道去哪儿能找到所有动物。","Did he speak English?":"他说英语吗？","Yes, he did. His English was good which was lucky because no one in my family can speak Portuguese.":"说，英语很好，真幸运——因为我家没人会说葡萄牙语。","It sounds like you had a great time.":"听起来你们玩得很开心。","We did. It was fantastic.":"是的，棒极了。"});
Object.assign(DB.ZH||{}, {"1.":"1.","The Great Auk":"大海雀","The Great Auk was a large seabird that lived in the North Atlantic.":"大海雀是一种生活在北大西洋的大型海鸟。","It was a bird but it couldn't fly.":"它是鸟，却不会飞。","It could swim underwater really well.":"它水下游泳游得非常好。","It caught and ate fish when it dived under the water.":"它潜到水下捕鱼吃。","Its feathers were very soft and people used them to make pillows for their beds.":"它的羽毛非常柔软，人们用它来做枕头。","Because of this people killed the birds.":"正因如此，人们大量捕杀这种鸟。","The last Great Auk died on the island of Eldey in 1835.":"最后一头大海雀 1835 年死在埃尔代伊岛上。","2.":"2.","The Tasmanian Tiger":"塔斯马尼亚虎（袋狼）","The Tasmanian Tiger was only found in Australia, Tasmania and New Guinea.":"塔斯马尼亚虎只在澳大利亚、塔斯马尼亚和新几内亚有分布。","It got its name because it had stripes like a tiger but it was not a member of the cat family.":"它因身上有像老虎一样的条纹而得名，但它并不属于猫科。","Farmers believed Tasmanian Tigers killed their sheep so they paid people to kill them.":"农民们相信塔斯马尼亚虎咬死了他们的羊，于是雇人捕杀。","Many of the tigers died after getting ill from diseases they caught from other animals.":"许多袋狼染上了其他动物传染的疾病后病死。","The last Tasmanian Tiger died in Hobart Zoo in 1936.":"最后一只塔斯马尼亚虎 1936 年死于霍巴特动物园。","3.":"3.","Steller's Sea Cow":"斯特勒海牛","Steller's Sea Cow was a large animal that lived in the cold Arctic waters around Alaska.":"斯特勒海牛是一种生活在阿拉斯加附近寒冷北极水域的大型动物。","It grew up to nine metres long.":"它体长可达 9 米。","Because it was so big it couldn't go under the water.":"因为体型太大，它无法潜到水下。","It ate the plants on top of the sea.":"它吃海面上的植物。","It wasn't a very dangerous animal.":"它并不是很危险的动物。","It was quite friendly.":"它相当友善。","Because of this it was very easy to kill.":"正因如此，它很容易被猎杀。","Europeans first found the sea cow in 1741.":"1741 年欧洲人首次发现这种海牛。","27 years later they killed the last one.":"27 年后，他们杀死了最后一头。"});
Object.assign(DB.ZH||{}, {"Hey Nathan, how are you? Did you have a good weekend?":"嗨内森，你好吗？周末过得好吗？","Well, sort of. I mean, it was okay.":"呃，还算好吧，就是说，还行。","You don't sound very sure. What happened?":"你听起来不太确定。发生什么了？","Yeah, come on, tell us.":"对啊，快说说。","Alright, well on Sundays we usually go for a walk, my family and I, but yesterday I went alone.":"好吧。周日我们一家人通常去散步，但昨天是我一个人去的。","Where did you go?":"你去哪儿了？","I went to the forest, you know, outside town. It's really nice there.":"我去了城外的那片森林，那里真的很不错。","And I started walking when suddenly...":"我正走着，忽然……","Yes, suddenly what?":"嗯，忽然怎么了？","Well, in front of me there was a snake.":"就在我面前有一条蛇。","Are there snakes in the forest? Are you sure?":"森林里有蛇？你确定吗？","Yes, I'm sure. It was on the path. I stopped. I didn't do anything. Then it just went away. I was afraid.":"确定。它就在小路上。我停住了，什么也没做，后来它自己游走了。我当时很害怕。","Poor you. I hate snakes too.":"真可怜。我也讨厌蛇。","Why were you afraid? It's just a snake. A snake can't kill you.":"你怕什么呀？不过是条蛇，蛇又咬不死人。","Some snakes can. Anyway, it's okay to be afraid sometimes.":"有些蛇会。再说，偶尔害怕也没什么。","Thanks Lena. Anyway, that's why my weekend was just okay.":"谢谢你，莉娜。总之，这就是我周末只能说'还行'的原因。"});

var BOOKU12={111:{u:"Unit 12", audio:"../assets/p111.mp3", title:"The Great Race", arts:[["A lot of big cities, like London, have got many traffic problems.", "Sometimes a journey of a few kilometres can take more than an hour.", "So what's the best way to get across London?"], ["For a very short journey, it's probably a good idea to walk.", "But what happens when you want to go further?"], ["The presenters of a popular TV show about cars decided to find out.", "Each of the presenters chose a different type of transport to make the same 27-kilometre journey.", "One presenter went by bike.", "One went by car."], ["Another chose public transport – the underground and bus – and the last one travelled by speedboat up the River Thames.", "They all started at the same time and the same place in West London, but who got to City Airport in East London first?", "The results were a surprise."], ["The bike came first.", "In second place was the speedboat.", "Public transport came third and the car was last."], ["So the presenters had an answer.", "The bike was quicker than all the other types of transport and the car was slower.", "They weren't very happy with the result because they wanted the car to win.", "They made a joke and said the bike wasn't a real winner because it was more dangerous."], ["But, of course, the bike is the real winner.", "It's the best way to get about.", "It's cheaper than public transport and it is healthier than going by car.", "It's also better for our cities because bikes don't make the air dirty.", "So next time you need to travel around, think before you and your parents get into the car – 'Can we make this journey by bike?'"]]},114:{u:"Unit 12", audio:"../assets/p114.mp3", title:"My Favourite Journey", arts:[["My favourite journey. We all love going on a journey.", "Here are some of your favourites. Thank you for sharing them!"], ["Adam. I love boats and my favourite boat journey is the one by ferry across the Danube River.", "My grandma lives in Budapest.", "When I visit her, we often go on it together.", "It's not a long journey.", "It's only ten minutes.", "The ferry just takes you across the river to the other side of the city.", "We don't get off the boat.", "We just go there and back again."], ["Rose!", "I really love steam trains.", "There's one in Scotland.", "It goes from Fort William to Mallaig on the west coast, and it's called the Jacobite Steam Train.", "It's the famous one you see in the Harry Potter films.", "The one that takes Harry and his classmates to Hogwarts. But that's not why I like it.", "I like the sound it makes and I like the view from the window.", "It travels past lakes and mountains and beautiful beaches."], ["What's my favourite journey?", "My journey to school.", "We live in a village and my school is in the next village.", "Every morning, I walk across the fields and then along the river until I'm at school.", "It's a really beautiful walk.", "I love looking for birds.", "There are some lovely ones.", "And sometimes, if I'm lucky, I see a rabbit.", "I love my walk to school.", "But I love the walk home more!"], ["Max. My favourite journey is a very fast bike ride.", "My grandparents have a house in the mountains. There is a road down the mountain to the town.", "It goes down very fast, and it goes through a big forest.", "Every morning, we ride down to the town to get bread.", "It only takes ten minutes to ride down, but it takes a lot longer to ride back up again!"]]},113:{u:"Unit 12", audio:"../assets/p113.mp3", title:"At the Train Station", dialog:1, spk:DB.SPE["113"], arts:[["Good morning.", "How can I help you?"], ["Hello.", "I want to go to Windsor.", "What time's the next train?"], ["There's one in five minutes.", "It's a fast train.", "It only stops at Clapham Junction and Windsor.", "You can catch that one."], ["And the one after that?"], ["There's one at half past ten, but that's a slower train.", "It stops at every station."], ["That's OK.", "I'm not in a hurry, and I don't want to run.", "What time does that one arrive in Windsor?"], ["At half past eleven.", "It takes an hour."], ["And how often are the trains to Windsor?"], ["They're every half hour."], ["Great!", "And how much is a ticket?"], ["Do you want a single or a return?"], ["A return, please."], ["Are you returning today?"], ["Yes, I am."], ["Then you can get an off-peak day return ticket for £12.70.", "It's cheaper than the anytime day return.", "That's £19.90."], ["Right.", "I'd like the off-peak day return one then."], ["OK.", "That's £12.70, please."], ["What platform does the train leave from?"], ["It leaves from platform 15."], ["And what platform does it arrive at in Windsor?", "My friend wants to meet me there."], ["Platform 1.", "But Windsor is a very small station, a lot smaller than Waterloo.", "There are only two platforms at Windsor."], ["OK, then that's not a problem.", "Thank you."], ["Have a good journey."]]}};
