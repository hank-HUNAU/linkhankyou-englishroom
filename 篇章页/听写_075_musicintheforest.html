<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>课文 p075 · 课文听写</title>
<link rel="stylesheet" href="../ui.css">
<script src="../ui.js"></script>
<style>
/* ============ AppleOS 扁平设计系统 ============ */
:root{
  --bg:#f2f2f7; --bg-soft:#f7f7fa; --bg-2:#e5e5ea;
  --card:#ffffff;
  --ink:#1c1c1e; --ink-2:#3c3c43; --ink-3:#8e8e93; --ink-4:#aeaeb2;
  --blue:#0a84ff; --blue-bg:#e8f1ff; --blue-deep:#0b6ce0;
  --green:#34c759; --green-bg:#e6f7ea; --green-deep:#1f9a45;
  --orange:#ff9f0a; --orange-bg:#fff3e0;
  --red:#ff453a; --red-bg:#ffe9e7;
  --line:rgba(60,60,67,.14); --line-soft:rgba(60,60,67,.08);
  --rad:16px; --rad-lg:22px; --rad-sm:10px;
  --glass:rgba(255,255,255,.72);
  --font:"-apple-system","SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",system-ui,sans-serif;
  --font-num:"SF Mono",ui-monospace,"Menlo",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);overflow:hidden;background:var(--bg);user-select:none;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.app{height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative}

/* ---------- 顶部玻璃栏 ---------- */
header.top{
  display:flex;align-items:center;gap:12px;padding:12px 18px 10px;
  background:var(--glass);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:0.5px solid var(--line);z-index:20;flex:none;
}
.top .meta{display:flex;flex-direction:column;min-width:0}
.top .u{font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.top .t{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tabs{display:flex;gap:8px}
.tab{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--rad-sm);border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s}
.tab .pno{font-family:var(--font-num);color:var(--ink-3);font-size:11px;font-weight:600}
.tab .tty{font-size:10px;line-height:1;font-weight:700;padding:4px 6px;border-radius:5px;letter-spacing:.02em}
.tab .tsep{font-style:normal;color:var(--ink-3);opacity:.55;font-weight:400}
.tab .tty.tt-rd{background:rgba(88,120,230,.10);color:#5a76d8}
.tab .tty.tt-ls{background:rgba(222,142,80,.12);color:#c97f3c}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab.on .pno{color:rgba(255,255,255,.85)}
.tab.on .tsep{color:rgba(255,255,255,.55)}
.tab.on .tty.tt-rd{background:rgba(255,255,255,.18);color:#fff}
.tab.on .tty.tt-ls{background:rgba(255,255,255,.18);color:#fff}

/* ---------- 流程步骤条 ---------- */
.flowbar{flex:none;display:flex;align-items:center;justify-content:center;gap:0;padding:12px 18px 4px;background:var(--bg)}
.steps{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line-soft);border-radius:30px;padding:6px 12px}
.step{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:20px;transition:.2s}
.step b{width:22px;height:22px;border-radius:50%;background:var(--bg-2);color:var(--ink-3);font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--font-num)}
.step span{font-size:13px;font-weight:600;color:var(--ink-3)}
.step.on{background:var(--blue-bg)}
.step.on b{background:var(--blue);color:#fff}
.step.on span{color:var(--blue-deep)}
.step.done b{background:var(--green);color:#fff}
.step.done span{color:var(--green-deep)}
.con{width:14px;height:1.5px;background:var(--ink-4)}

/* ---------- 主区 ---------- */
.stage{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.reader{flex:1;padding:14px 22px 250px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--ink-4) transparent}
.reader::-webkit-scrollbar{width:8px}
.reader::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:8px;background-clip:content-box;border:2px solid transparent}
.head-wrap{padding:6px 2px 14px;text-align:center}
.headline{font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1.15}

.para{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--rad-lg);padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.para:first-of-type{margin-top:2px}
.sent{font-size:18.5px;line-height:1.85;letter-spacing:.005em;color:var(--ink);cursor:pointer;border-radius:8px;padding:2px 3px;transition:background .2s;display:inline}
.sent:hover{background:rgba(10,132,255,.07)}
.sent.on{background:rgba(10,132,255,.06)}
.zh{display:block;margin-top:-2px;font-size:15.5px;color:var(--ink-3);line-height:1.7;border-left:2px solid var(--line);padding-left:10px;margin-left:2px}
.zh.hide{display:none}
.sent .zh{display:inline-block;vertical-align:middle;margin-left:10px;font-size:16px;color:var(--ink-3)}
.sent .zh.hide{display:none}
/* —— 对话按人物排版（p69 听力对话） —— */
body.dialog .para{background:transparent;border:none;box-shadow:none;padding:2px 8px;margin:9px 0}
body.dialog .sent{display:block;max-width:84%;padding:9px 15px 11px;border-radius:16px;line-height:1.6;font-size:18px;width:max-content}
body.dialog .sent .spk{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;margin-bottom:3px}
body.dialog .sent[data-spk="mike"]{margin-right:auto;background:#eef4fc;border:1px solid #d5e3f6}
body.dialog .sent[data-spk="mike"] .spk{color:#1971d2}
body.dialog .sent[data-spk="julia"]{margin-left:auto;background:#f6f3f9;border:1px solid #e5e0ee}
body.dialog .sent[data-spk="julia"] .spk{color:#9a5bd0}
body.dialog .sent .zh{display:block;margin:6px 0 0;border-left:none;padding-left:0;font-size:15px;color:var(--ink-3)}
body.dialog .sent .zh.hide{display:none}
body.dialog .sent:hover{background:rgba(10,132,255,.08)}
body.dialog .para:first-of-type{margin-top:2px}
.dict-zh.hide{display:none}

/* ---------- 沉浸跟读 · 一屏一句字幕巨幕 ---------- */
.fstage{display:none;flex:1;position:relative;align-items:center;justify-content:center;padding:8px 22px 228px;overflow:hidden}
body.follow .reader{display:none}
body.follow .fstage{display:flex}
.fs-card{max-width:min(780px,100%);width:100%;background:var(--card);border:1px solid var(--line-soft);border-radius:var(--rad-lg);padding:38px 44px;box-shadow:0 10px 34px rgba(0,0,0,.06);text-align:center}
.fs-txt{font-size:35px;line-height:2.0;letter-spacing:.01em;color:var(--ink)}
.fs-txt{position:relative}
.fol-w{border-radius:5px;transition:background .08s,color .08s,box-shadow .08s;padding:1px 1px}
.fol-w.cur{background:rgba(124,58,237,.14);box-shadow:inset 0 -3px 0 rgba(124,58,237,.85)}
.fol-w.shd{background:#ffd9a8;color:#7c2d12;font-weight:800}
/* 第2步：整篇信纸式滚动字幕 */
.fs-card.whole{max-width:min(880px,100%);text-align:left;padding:28px 36px 34px;max-height:min(58vh,520px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(156,39,176,.5) transparent}
.fs-card.whole::-webkit-scrollbar{width:8px}
.fs-card.whole::-webkit-scrollbar-thumb{background:rgba(156,39,176,.45);border-radius:8px;background-clip:content-box;border:2px solid transparent}
.fs-card.whole::-webkit-scrollbar-thumb:hover{background:rgba(156,39,176,.7)}
.fs-card.whole .fs-txt{font-size:24px;line-height:2.1}
.fs-card.whole .fs-num{display:inline-block;margin-left:.2em;color:var(--ink-4);font-size:.72em;font-family:var(--font-num)}
.fol-legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--ink-3)}
.fol-legend i{display:inline-flex;align-items:center;gap:6px;font-style:normal}
.fol-legend .k{display:inline-block;width:14px;height:14px;border-radius:4px}
.fol-legend .k1{background:rgba(124,58,237,.2);box-shadow:inset 0 -3px 0 rgba(124,58,237,.85)}
.fol-legend .k2{background:#ffd9a8}
.fs-hint{margin-top:18px;font-size:12.5px;color:var(--ink-3)}
.fol-legend{animation:none}
.fs-gap{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:rgba(242,242,247,.9);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:6}
.fs-gap.on{display:flex}
.fs-ring{width:96px;height:96px;border-radius:50%;border:4px solid var(--green-bg);border-top-color:var(--green);animation:fsring 1.8s ease-in-out infinite}
@keyframes fsring{0%{transform:rotate(0) scale(.96);opacity:.72}50%{transform:rotate(180deg) scale(1.05);opacity:1}100%{transform:rotate(360deg) scale(.96);opacity:.72}}
.fs-gap-msg{font-size:22px;font-weight:800;color:var(--green-deep);letter-spacing:.01em}
.fs-gapbar{width:min(300px,70%);height:5px;border-radius:5px;background:var(--line-soft);overflow:hidden}
.fs-gapbar-i{height:100%;width:100%;background:var(--green)}

/* ---------- 听写面板 ---------- */
.dict{display:none;flex:1;flex-direction:column;padding:16px 20px 250px;overflow-y:auto}
.dict.on{display:flex}
.dict-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.dict-tag{font-size:13px;font-weight:700;color:var(--ink)}
.dict-sub{font-size:11.5px;color:var(--ink-3);font-family:var(--font-num);margin-top:2px}
.dict-pass{font-size:12px;font-weight:700;color:var(--blue-deep);background:var(--blue-bg);padding:5px 12px;border-radius:16px;font-family:var(--font-num)}
.dict-card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--rad-lg);padding:20px 22px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.dt-line{font-size:22px;line-height:2.1;letter-spacing:.01em;color:var(--ink)}
.dt-w{white-space:nowrap}
.dt-anchor{color:var(--green-deep);font-weight:700;border-bottom:2px solid rgba(52,199,89,.45)}
.dt-hint{color:var(--ink-3)}
.dt-gsep{color:var(--ink-4);padding:0 2px}
.dt-blank{position:relative;display:inline-block}
.dt-blank .fst{font-weight:600}
.dt-blank.is-on b.fst{color:var(--blue-deep)}
.dt-in{font:inherit;text-align:center;color:transparent;caret-color:transparent;background:linear-gradient(180deg,transparent 78%,var(--blue) 78%,var(--blue) 100%);border:none;outline:none;margin:0 1px;border-radius:2px;text-transform:none;font-family:var(--font)}
.dt-blank.is-on .dt-in{caret-color:var(--blue);color:var(--ink);background:linear-gradient(180deg,transparent 78%,var(--ink-2) 78%,var(--ink-2) 100%)}
.dt-blank .dt-in:disabled{opacity:.45;color:transparent;background:linear-gradient(180deg,transparent 78%,var(--ink-4) 78%,var(--ink-4) 100%)}
.dt-r-ok{color:var(--green-deep);font-weight:800}
.dt-r-bad{color:var(--red);font-weight:700}
.dt-r-tip{color:var(--ink-3);font-size:13px;margin-left:5px}
.dict-zh{margin-top:14px;font-size:17px;color:var(--ink-3);line-height:1.75;border-left:2px solid var(--line);padding-left:10px}
.dict-desc{margin-top:10px;font-size:11.5px;color:var(--ink-4)}
.dict-act{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.dict-score{font-size:14px;font-weight:700;color:var(--green-deep)}
.dict-diag{display:none;margin-top:12px;background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:var(--rad);padding:14px 16px}
.dict-diag.on{display:block}
.ddq-row{font-size:14px;line-height:1.9;color:var(--ink)}
.ddq-row .lbl{color:var(--ink-3);font-size:12.5px}
.em1{font-size:13px;color:var(--blue-deep);font-weight:700}
.dt-blank.paper{color:var(--ink-3)}
.dt-blank.paper .fst{color:var(--blue-deep);font-weight:700}
.dt-blank.paper .ul{letter-spacing:2px}
.dt-blank.paper.revealed .ans{color:var(--green-deep);font-weight:800;letter-spacing:.02em}

/* ---------- 听写方式选择 ---------- */
.waypick{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(28,28,30,.3);backdrop-filter:saturate(120%) blur(6px);-webkit-backdrop-filter:saturate(120%) blur(6px);opacity:0;pointer-events:none;transition:.2s}
.waypick.on{opacity:1;pointer-events:auto}
.way-card{width:min(520px,92vw);background:var(--card);border-radius:24px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.16);text-align:left}
.way-card .w-head{font-size:18px;font-weight:700;letter-spacing:-.01em}
.way-card .w-sub{font-size:12.5px;color:var(--ink-3);margin:6px 0 16px}
.way-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--bg-soft);cursor:pointer;font-family:var(--font);transition:.15s}
.way-btn+.way-btn{margin-top:12px}
.way-btn:hover{border-color:var(--blue);background:var(--blue-bg)}
.way-btn:active{transform:scale(.985)}
.way-btn .wb-ic{width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex:none;color:var(--blue-deep)}
.way-btn .wb-t{display:flex;flex-direction:column;gap:3px}
.way-btn .wb-t b{font-size:15px;color:var(--ink)}
.way-btn .wb-t i{font-style:normal;font-size:12px;color:var(--ink-3)}

/* ---------- 聆听全文循环遍次 ---------- */
.lp-dots{display:flex;gap:6px}
.lp-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-4);transition:.2s}
.lp-dot.on{background:var(--blue)}
.fpass{display:flex;gap:3px;background:var(--bg-2);border-radius:8px;padding:2px}
.fpc{border:none;background:transparent;color:var(--ink-3);font-weight:600;font-size:11px;height:20px;padding:0 8px;border-radius:6px;cursor:pointer;font-family:var(--font);transition:.15s}
.fpc.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@keyframes gapfill{from{width:100%}to{width:0}}

/* 跟读环节禁用译文开关 */
.chip.off{opacity:.4;pointer-events:none}

/* ---------- 底部 dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;justify-content:center;gap:16px;padding:11px 20px calc(11px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:0.5px solid var(--line)}
.dgroup{display:flex;align-items:center;gap:10px}
.tbtn{width:40px;height:40px;border:none;border-radius:50%;background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;transition:.15s}
.tbtn:active{background:var(--bg-2)}
.big{width:46px;height:46px;border-radius:50%;border:none;color:#fff;display:grid;place-items:center;cursor:pointer;background:var(--blue);box-shadow:0 5px 14px rgba(10,132,255,.3),0 1px 3px rgba(0,0,0,.1);transition:.15s}
.big:active{transform:scale(.96)}
.big svg{width:20px;height:20px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s}
.chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-deep)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
.chip.on .dot{background:var(--blue)}
.cta{height:40px;padding:0 20px;border-radius:20px;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);box-shadow:0 4px 12px rgba(10,132,255,.3);transition:.15s}
.cta:active{transform:scale(.97)}
.cta:disabled{background:var(--ink-4);box-shadow:none;cursor:default}

/* 播放条内嵌：译文 + 跟读遍数（三个流程常驻） */
.dmid{display:flex;align-items:center;gap:10px}
.di{display:inline-flex;align-items:center;gap:4px;margin-right:1px;white-space:nowrap}
.di .lbl{font-size:11px;color:var(--ink-3);font-weight:600}
.di .num{font-family:var(--font-num);font-size:13px;font-weight:700;color:var(--ink)}
.di-dots{display:inline-flex;gap:4px;align-items:center;margin-right:1px;white-space:nowrap}
body.follow #dkDots .lp-dot.on{background:var(--green)}
.dlp{display:flex;align-items:center;gap:7px}
.dlp-t{font-size:11px;color:var(--ink-3);font-weight:600}
.dock .fpass{background:rgba(60,60,67,.08)}
.dock .fpc{color:var(--ink-3)}
.dock .fpc.on{background:var(--card);color:var(--blue-deep);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:128px;transform:translateX(-50%) translateY(12px);background:rgba(28,28,30,.9);color:#fff;font-size:13px;padding:9px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 分组目录面板 ---------- */
.tabs .tbtn{width:34px;height:34px}
.curtab{display:inline-flex;align-items:center;gap:7px;height:34px;max-width:300px;padding:0 13px;border-radius:var(--rad-sm);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s}
.curtab:hover{border-color:var(--blue)}
.curtab .curTt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.curtab .curArr{font-style:normal;color:var(--ink-3);font-size:9px;margin-left:1px}
.dir{position:fixed;inset:0;background:rgba(12,17,32,.35);backdrop-filter:blur(2px);display:none;z-index:80;padding:74px 18px 18px;justify-content:flex-end;align-items:flex-start}
.dir.on{display:flex}
.dir-panel{width:min(330px,88vw);max-height:calc(100vh - 96px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(10,15,30,.28);overflow:hidden;display:flex;flex-direction:column;animation:dirIn .16s ease}
@keyframes dirIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dir-head{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--line-soft);flex:none}
.dir-head b{font-size:15px}
.dir-head .du{font-size:10.5px;color:var(--ink-3);font-weight:600;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-head .x{margin-left:auto;width:28px;height:28px;border-radius:8px;border:none;background:var(--bg-2);color:var(--ink-2);font-size:14px;line-height:1;cursor:pointer;display:grid;place-items:center;flex:none}
.dir-body{overflow-y:auto;padding:4px 12px 14px}
.grp{margin-bottom:6px}
.grp-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ink-4);text-transform:uppercase;margin:12px 8px 5px}
.grp-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-family:var(--font);transition:.12s}
.grp-item:hover{background:var(--bg-soft)}
.grp-item.on{background:var(--blue)}
.grp-item .gi-ic{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex:none}
.grp-item .gi-t{min-width:0;display:flex;align-items:baseline;gap:7px}
.grp-item .gi-pg{font-family:var(--font-num);font-size:10.5px;color:var(--ink-3);font-weight:700}
.grp-item.on .gi-pg{color:#fff}
.grp-item .gi-tt{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-item.on .gi-tt{color:#fff}
.grp-empty{font-size:11.5px;color:var(--ink-4);padding:2px 10px 8px}

.toast{z-index:1400}

DB.ZH["Hi, Julia. It's me, Mike."]="嗨，朱莉娅。我是迈克。";
DB.ZH["Hi, Mike. How's it going?"]="嗨，迈克。你好吗？";
DB.ZH["Do you want to go cycling later today?"]="你今天晚些时候想去骑车吗？";
DB.ZH["Go cycling? Good idea. What time?"]="骑车？好主意。几点？";
DB.ZH["How about after lunch? Say, two o'clock?"]="午饭后怎么样？比如说两点？";
DB.ZH["Two o'clock? No, sorry, I can't. I've got a taekwondo lesson at two."]="两点？不了，抱歉，我去不了。我两点有跆拳道课。";
DB.ZH["OK, how about three o'clock?"]="好，那三点呢？";
DB.ZH["No, the lesson only finishes at half past three."]="不行，课要到三点半才结束。";
DB.ZH["OK, so how about four o'clock?"]="好，那四点呢？";
DB.ZH["I can't. Mum wants to give me a tennis lesson at four."]="我去不了。妈妈四点要给我上网球课。";
DB.ZH["Until what time?"]="到几点？";
DB.ZH["I'm not sure. Maybe about quarter to five?"]="我不确定。大概差一刻五点？";
DB.ZH["Really? But we can't go cycling then. It gets dark at half past four."]="真的吗？那我们就不能骑车了。四点半就天黑了。";
DB.ZH["Well, yes, you're right. Sorry."]="嗯，是啊，你说得对。抱歉。";
DB.ZH["So maybe we can go cycling before lunch?"]="那我们也许可以在午饭前去骑车？";
DB.ZH["Um, I've got a school rugby match until about half past eleven."]="嗯，我有一场学校橄榄球比赛，要到十一点半左右。";
DB.ZH["What time does it start?"]="几点开始？";
DB.ZH["Ten o'clock."]="十点。";
DB.ZH["Julia, it's quarter to ten now."]="朱莉娅，现在已经十点差一刻了。";
DB.ZH["Really? I need to go. Let's go cycling tomorrow."]="真的吗？我得走了。我们明天去骑车吧。";
DB.ZH["OK. Call me in the morning. See you. Have a good match."]="好。早上给我打电话。再见。祝你比赛顺利。";

DB.ZH = Object.assign(DB.ZH||{}, {"Our lives move very fast today, especially in big cities.":"如今我们的生活节奏非常快，尤其是在大城市里。","But many years ago, that was different.":"但很多年前，情况并非如此。","People couldn't jump on a bus or take the tube to work.":"人们无法跳上公交车，也无法坐地铁去上班。","They walked.":"他们只能步行。","For a long time, the fastest way of travelling was by horse or boat.":"在很长一段时间里，最快的出行方式是骑马或乘船。","That changed with the steam engine in the 18th century.":"这一状况在18世纪随着蒸汽机的问世而改变。","Then came cars, motorcycles and, of course, airplanes.":"接着出现了汽车、摩托车，当然还有飞机。","So what's new and popular today?":"那么，如今什么又新又流行呢？","E-scooters!":"电动滑板车！","Electric scooter sharing is the new way to get around.":"电动滑板车共享出行是一种新兴的出行方式。","They are taking over the world's big cities.":"它们正在席卷世界各地的大城市。","They are fun and easy to use.":"它们既有趣又容易使用。","You don't have to buy one.":"你不必花钱买一辆。","You rent one.":"租一辆即可。","All you need is to log on to an app and then, off you go.":"你只需登录一个应用程序，就可以出发了。","They are cheaper than taxis.":"它们比出租车便宜。","You can get around traffic jams.":"你还可以绕过交通拥堵。","And you don't have to do any hard work, like on a bike.":"而且你不必像骑自行车那样费力。","They aren't bad for the environment either.":"它们对环境的危害也不大。","But is that true?":"但真是这样吗？","Well, these e-scooters don't last very long.":"嗯，这些电动滑板车用不了多久就会坏。","In Paris, some e-scooters break after one month.":"在巴黎，有些电动滑板车一个月后就坏了。","Many people are unhappy because there are too many e-scooters.":"很多人不开心，因为电动滑板车太多了。","They block the pavements and drive into people.":"它们堵住人行道，还会撞到人。","Because people are angry about e-scooters, they throw them into rivers or break them.":"由于人们对电动滑板车很恼火，就把它扔进河里或砸坏。","Is that the answer?":"这就是解决办法吗？","What do you think of e-scooters?":"你怎么看待电动滑板车？","Do you like them?":"你喜欢它们吗？","A lot of big cities, like London, have got many traffic problems.":"许多大城市，比如伦敦，都存在很多交通问题。","Sometimes a journey of a few kilometres can take more than an hour.":"有时几公里的路程要花上一个多小时。","So what's the best way to get across London?":"那么，穿越伦敦的最佳方式是什么呢？","For a very short journey, it's probably a good idea to walk.":"对于非常短的路程，步行可能是个好主意。","But what happens when you want to go further?":"但如果你想走得更远，又会怎样呢？","The presenters of a popular TV show about cars decided to find out.":"一档关于汽车的知名电视节目的主持人决定一探究竟。","Each of the presenters chose a different type of transport to make the same 27-kilometre journey.":"每位主持人选择了一种不同的交通工具，来完成相同的27公里路程。","One presenter went by bike.":"一位主持人骑自行车。","One went by car.":"一位开车。","Another chose public transport – the underground and bus – and the last one travelled by speedboat up the River Thames.":"另一位选择公共交通——地铁和公交车——最后一位则乘快艇沿泰晤士河而上。","They all started at the same time and the same place in West London, but who got to City Airport in East London first?":"他们都在伦敦西部的同一时间同一地点出发，但谁先到达伦敦东部的城市机场呢？","The results were a surprise.":"结果出人意料。","The bike came first.":"自行车最先到达。","In second place was the speedboat.":"第二名是快艇。","Public transport came third and the car was last.":"公共交通名列第三，汽车垫底。","So the presenters had an answer.":"于是主持人有了答案。","The bike was quicker than all the other types of transport and the car was slower.":"自行车比所有其他交通工具都快，而汽车最慢。","They weren't very happy with the result because they wanted the car to win.":"他们对这一结果不太高兴，因为他们希望汽车获胜。","They made a joke and said the bike wasn't a real winner because it was more dangerous.":"他们开玩笑说，自行车算不上真正的赢家，因为它更危险。","But, of course, the bike is the real winner.":"但当然啦，自行车才是真正的赢家。","It's the best way to get about.":"它是四处出行的最佳方式。","It's cheaper than public transport and it is healthier than going by car.":"它比公共交通便宜，也比开车更健康。","It's also better for our cities because bikes don't make the air dirty.":"它对我们的城市也更有利，因为自行车不会弄脏空气。","So next time you need to travel around, think before you and your parents get into the car – 'Can we make this journey by bike?'":"所以，下次你需要出行时，在你和父母上车前先想一想：“这段路我们可以骑自行车吗？”"});

DB.ZH = Object.assign(DB.ZH||{}, {"Right! Have we got everything? Tennis rackets, balls …?":"对啊！东西都带齐了吗？网球拍、球……？","Yes, I think so. And we've got some food – sandwiches, fruit and stuff – and some water. So, let's go.":"是的，我觉得齐了。我们还带了些吃的——三明治、水果什么的——还有一些水。那我们走吧。","Just a minute! Oh, no! It's raining!":"等一等！哦，不！下雨了！","Now what do we do?":"现在咱们怎么办？","You're right. We can't play outside in the rain.":"你说得对。下雨天我们不能在外面打。","Why don't we go to the sports centre in town? They've got an indoor court.":"我们不如去镇上的体育中心吧？那里有室内球场。","No, it's always very busy. I'm sure we can't play there today.":"不去了，那里总是很拥挤。我确定今天咱们在那边打不了。","Maybe you're right. It's a bit expensive, too.":"也许你说得对。那边也有点贵。","OK, so we can't play today. It's no big deal. We can play tomorrow, perhaps.":"好吧，那我们今天没法打了。没什么大不了的。我们也许可以明天打。","Yes. But I'm a bit sad now.":"嗯。但让我有点难过。","Me, too. But what can we do? It's raining, and that's that.":"我也是。可我们能怎么办呢？天下着雨，就是这样。","I know! How about watching some old tennis games on the internet?":"我有主意了！不如在网上看一些以前的网球比赛吧？","Good idea. I like watching really good players.":"好主意。我喜欢看高水平的选手比赛。","And we can eat our food.":"而且我们可以吃带来的东西。","Let's go and switch the computer on.":"那我们走吧，把电脑打开。"});

DB.ZH = Object.assign(DB.ZH||{}, {"Transport around the world.":"世界各地的交通工具。","The Amfibus, the Netherlands.":"荷兰的两栖巴士。","The big, blue Amfibus certainly makes a big splash!":"这辆庞大的蓝色两栖巴士确实激起了不小的水花！","It's in Rotterdam, and it takes people on tours of the city.":"它在鹿特丹，载着人们游览这座城市。","It's cool.":"它很酷。","It can travel on land and in the water.":"它既能在陆地上行驶，也能在水里航行。","It is more expensive than water taxis, but it is more exciting, too.":"它比水上出租车更贵，但也更刺激。","It is slower in the water than on land.":"它在水中比在陆地上行驶得慢。","It goes at 8 kilometres per hour in the water and 96 kilometres per hour on land.":"它在水中的时速是8公里，在陆地上的时速是96公里。","The tour lasts for an hour, and it costs 27.50 euros.":"这趟游览持续一个小时，票价27.50欧元。","Moving walkways and escalators, Hong Kong.":"香港的自动扶梯和电动步道。","The Central-Mid-Levels Escalator is 800 metres long.":"中央-半山自动扶梯长达800米。","Escalators are usually inside a shopping centre or an airport, but not this one!":"自动扶梯通常位于购物中心或机场内，但这座不是！","It's outside.":"它在室外。","It's a great way to travel round this city of hills.":"这是游遍这座山城的好办法。","And it's free!":"而且免费！","There are 14 places where you can get on and off.":"有14个可以上下的地方。","The escalators travel down the hill from 6am to 10am, so people can travel to work.":"自动扶梯每天上午6点到10点向下运行，方便人们上班出行。","They travel up the hill from 10am to midnight.":"上午10点到午夜它们向上运行。","The urban cable car, Turkey.":"土耳其的城市缆车。","Ankara's cable car is cheaper than other forms of public transport.":"安卡拉的缆车比其他公共交通方式更便宜。","It is healthier because it doesn't pollute the air.":"它更健康，因为它不污染空气。","It is also easier and quicker than travelling by car, because there are no traffic jams in the sky!":"它也比驾车出行更轻松、更快捷，因为空中不会有交通堵塞！","It travels 60 metres above the ground, and passengers can get great views of the city.":"它在距地面60米的高处运行，乘客可以饱览城市美景。","Submarines, Lanzarote and Tenerife.":"兰萨罗特岛和特内里费岛的观光潜艇。","Now you can travel in a submarine!":"现在你还能乘坐潜艇出行！","This submarine carries tourists.":"这种潜艇载着游客。","It is a safe and comfortable way to see the colourful fish and the plants and rocks under our seas.":"它是观赏海里五颜六色的鱼以及水下植物和岩石的一种安全又舒适的方式。","The submarine can carry 48 people, and it has 11 large windows on each side.":"这种潜艇可载48人，每侧有11扇大窗户。","It travels down 60 metres under the sea.":"它可下潜到海面下60米。"});

DB.ZH = Object.assign(DB.ZH||{}, {"People use different types of transport to get from one place to the next.":"人们用各种各样的交通工具从一个地方到另一个地方。","In Wuppertal, a city in Germany, the 'Schwebebahn' or suspension railway is very special.":"德国有一座城市叫伍珀塔尔，那里有一种叫 Schwebebahn 的悬挂铁路，非常特别。","The first track opened in 1901.":"第一条轨道于1901年通车。","It is the oldest electric elevated railway with hanging cars in the world.":"它是全世界最古老的电动高架悬挂铁路。","More than 85,000 passengers use it every day.":"每天有超过8.5万名乘客乘坐它。","There are lots of special cars in Cuba, especially in Havana.":"在古巴，尤其是在哈瓦那，有许多特别的车。","Most of them are very old.":"其中大多数都非常老旧。","But these yellow taxis are much newer.":"但这些黄色的出租车要新得多。","They are called cocotaxis because they look like coconuts.":"它们被称为 cocotaxi（椰子车），因为它们看起来像椰子。","They are a great way of getting around.":"它们是四处出游的好方式。","Tourists love them!":"游客们非常喜欢它们！","Tourists also like riding down the hills in Madeira, Portugal, on the Monte Toboggan.":"游客们还喜欢在葡萄牙马德拉岛的蒙特山乘坐木滑车沿山坡滑下来。","Originally, people used these sledges to transport food and other things.":"最初，人们用这些雪橇运送食物和其他物品。","Today, they transport people.":"如今，它们运送的是乘客。","Two 'carreiros', or sledge drivers, run next to the sledge and keep it on the street.":"两名 carreiros（即雪橇驾驶员）在雪橇旁奔跑，让它保持在路中央。","They wear special shoes.":"他们穿着特制的鞋子。","When the ride gets too fast, the drivers can use their shoes to slow it down.":"当滑行速度太快时，驾驶员就能用他们的鞋来减速。","This strange form of transportation is called zorbing or globe-riding.":"这种奇特的交通方式被称为”翻滚球“（zorbing），也叫作“人球骑行”。","And yes, a person is inside!":"没错，人就待在球里面！","The first zorbing site was in New Zealand.":"第一个翻滚球场地在新西兰。","But now you can go zorbing all over the world.":"但现在，你在世界各地都能玩翻滚球。","Even on water.":"甚至在水上也可以。","What's a popular way of getting around in your city?":"在你所在的城市，有什么流行的出行方式呢？"});

/* ===== p73 播客 Stay Positive (第7单元 vlog · LIFE COMPETENCIES) ===== */
DB.ZH = Object.assign(DB.ZH||{}, {"Oh, hello. It's you. Sorry, I'm not feeling great.":"哦，你好。是你啊。抱歉，我现在不太舒服。","Why? This is why. And I have a geography test tomorrow.":"为什么？就是这个原因。而且我明天有地理考试。","I like geography, but there's just so much information to learn.":"我喜欢地理，可需要记的内容实在太多了。","How can I stay positive today?":"我今天怎么才能保持积极呢？","But that's not the only problem.":"可这还不是唯一的问题。","Because I have a geography test tomorrow, I can't do all the things I really want to do today.":"因为我明天有地理考试，今天没法做所有我真正想做的事了。","I can't play tennis with Tyler.":"我没法和泰勒一起打网球了。","I can't go to see a movie with Tyler.":"我没法和泰勒一起去看电影了。","I can't watch baseball with Tyler.":"我没法和泰勒一起看棒球赛了。","I can't go for an ice cream with Tyler.":"我没法和泰勒一起去吃冰淇淋了。","How can I be positive?":"我怎么才能积极起来呢？","I can't do anything.":"我什么事都做不了。","Or can I?":"又或许，我真的还能行？","It's Tyler!":"是泰勒！","Hi, Tyler!":"嗨，泰勒！","Really?":"真的吗？","Good idea!":"好主意！","Of course!":"当然啦！","Now?":"现在？","Amazing!":"太棒了！","See you soon!":"一会儿见！","Tyler has a geography test tomorrow too, and Tyler's great at geography.":"泰勒明天也要考地理，而且泰勒地理学得特别好。","He's coming over to help me, and he's bringing popcorn.":"他要过来帮我，还带了爆米花。","See, stay positive.":"你看，保持积极就好。","That's what I always say, because if you stay positive, you can find an answer to any problem.":"这是我常说的话：只要你保持积极，任何难题你都能找到答案。","Message from Tyler.":"泰勒发来消息。","Find your street. Help.":"找到你的街道。救命！","Maybe Tyler's gonna give you a geography test.":"说不定泰勒还要考考你地理呢。","Just relax.":"放松就好。","See you next time!":"下次见！"});

DB.ZH = Object.assign(DB.ZH||{}, {"A slam dunk and the crowds cheer!":"一记暴扣，全场欢呼！","A game of sports can be so exciting.":"一场比赛可以如此激动人心。","All over the world, people love watching sports, talking about sports and playing sports.":"全世界的人都爱看体育、谈体育、参与体育。","Can you guess why?":"你能猜到为什么吗？","Ball sports are very popular.":"球类运动非常受欢迎。","For example, football.":"比如，足球。","Half of the world loves football.":"全世界有一半的人热爱足球。","That's almost four billion people.":"那几乎是四十亿人。","Volleyball is another popular ball sport.":"排球是另一种受欢迎的球类运动。","You probably know it.":"你很可能对它很熟悉。","But here in Laos they don't play volleyball with their hands and arms.":"但在老挝，人们不用手和手臂打排球。","They play it with their feet, head and knees.":"他们用脚、头和膝盖来打。","This game is called Sepak takraw – kick volleyball.":"这项运动叫藤球——踢式排球。","People love playing it in southeast Asia.":"在东南亚，人们都很喜欢玩这项运动。","Dodgeball is another great ball game.":"躲避球是另一种很棒的打球游戏。","Do you play it at school?":"你在学校玩过吗？","You have to be very good at throwing and catching the ball.":"你必须非常擅长投球和接球。","Bowling uses a different kind of ball – a very hard ball.":"保龄球用的是另一种球——一个非常硬的球。","You can't kick it.":"你不能踢它。","You roll it and try to knock over the pins at the end of the lane.":"你把它滚出去，努力击倒球道尽头的球瓶。","Young and old people can play this game.":"老人和小孩都能玩这项运动。","Do you know squash?":"你了解壁球吗？","Lots of people like playing it.":"很多人都喜欢打壁球。","Usually, it's a game between two players but you can also play in a team.":"通常这是两人对打，但也可以组队来玩。","Players hit the ball against four walls, and it's a very quick sport!":"球员把球打向四面墙，这是一项非常快的运动！","But you have to be careful so you don't get hit.":"但你要小心，别被球砸到。","What's your favourite sport?":"你最喜欢的运动是什么？"});

 67:{u:"Unit 7", audio:"../assets/p067.mp3", title:"SPORT WONDERS!", arts:[
   ["Nikolai Kutsenko, from Ukraine, can do amazing things with a football.",
    "He can kick a ball well ... but he can also keep the ball in the air with his feet, legs and head.",
    "Lots of footballers can do this.",
    "But can they do it for 24 hours and 30 minutes without stopping?",
    "Nikolai can and it's a world record!"],
   ["Sloan Henderson, from Utah, is a really good snowboarder – and she's only 14 months old!",
    "Her mother and father take her to the mountains, and they put her on a snowboard – and there she goes!",
    "Sloan loves to be on the board.",
    "People are often surprised when they see her because she doesn't fall over!"],
   ["American rock-climber Maureen 'Mo' Beck was born without her left hand and only part of her left arm, but she can climb really well.",
    "She is the winner of two climbing World Championships for disabled athletes, and five national championships.",
    "She has her own special way of climbing, but Maureen thinks she is just the same as any other climber."],
   ["Goatee can't talk or write, but she can surf!",
    "Why is this special?",
    "Because Goatee is a goat!",
    "She surfs with her owner, Dana McGregor.",
    "Dana helps Goatee to stand on the board and together they ride the waves in California.",
    "Goatee wears a yellow life-jacket because she can't swim very well!",
    "And now there is a children's book about her, too – Dana is the author."]]},
 70:{u:"Unit 7", audio:"../assets/p070.mp3", title:"An Amazing Last Four Minutes", arts:[
   ["It's 15th February at Greece Athena High School, New York.",
    "Jason McElwain is an 18-year-old student.",
    "Jason is autistic.",
    "He loves basketball and he helps with the school basketball team.",
    "Jason practises hard every day, but he never plays in the team."],
   ["Tonight is the last game of the season.",
    "It's Jason's last chance to play a game with the team, but for 44 minutes, he sits on the bench and watches."],
   ["It's four minutes before the end.",
    "The team is winning, so the coach tells Jason to go out and play.",
    "The team and the crowd are very happy, because everyone knows Jason and likes him.",
    "Jason tries to score a basket, but he misses.",
    "But suddenly he hits a 3-point basket.",
    "The crowd goes crazy.",
    "Jason hits another 3-pointer, then another and another – he hits six 3-pointers (it's a record for the team) and scores twenty points altogether.",
    "The team wins, and Jason is a real hero.",
    "It's an amazing night for him!"],
   ["Soon Jason starts to become famous.",
    "People in his town know who he is.",
    "The US president comes to Jason's town to meet him.",
    "Jason writes a book and some people want to make a film about him.",
    "He becomes assistant coach to the high school basketball team."],
   ["Now Jason works hard to help other autistic people.",
    "He travels across the US to help get money for autism research."]]},
  69:{u:"Unit 7", audio:"../assets/p069.mp3", title:"Dialogue: Planning a Bike Ride", dialog:1, spk:DB.SPE["69"], arts:[
  ["Hi, Julia. It's me, Mike."],
  ["Hi, Mike. How's it going?"],
  ["Do you want to go cycling later today?"],
  ["Go cycling? Good idea. What time?"],
  ["How about after lunch? Say, two o'clock?"],
  ["Two o'clock? No, sorry, I can't. I've got a taekwondo lesson at two."],
  ["OK, how about three o'clock?"],
  ["No, the lesson only finishes at half past three."],
  ["OK, so how about four o'clock?"],
  ["I can't. Mum wants to give me a tennis lesson at four."],
  ["Until what time?"],
  ["I'm not sure. Maybe about quarter to five?"],
  ["Really? But we can't go cycling then. It gets dark at half past four."],
  ["Well, yes, you're right. Sorry."],
  ["So maybe we can go cycling before lunch?"],
  ["Um, I've got a school rugby match until about half past eleven."],
  ["What time does it start?"],
  ["Ten o'clock."],
  ["Julia, it's quarter to ten now."],
  ["Really? I need to go. Let's go cycling tomorrow."],
  ["OK. Call me in the morning. See you. Have a good match."] ]}
,72:{u:"Unit 7", audio:"../assets/p072.mp3", title:"Rainy Day: Nina & Dave", dialog:1, spk:DB.SPE["72"], arts:[["Right! Have we got everything? Tennis rackets, balls …?"], ["Yes, I think so. And we've got some food – sandwiches, fruit and stuff – and some water. So, let's go."], ["Just a minute! Oh, no! It's raining!", "Now what do we do?"], ["You're right. We can't play outside in the rain."], ["Why don't we go to the sports centre in town? They've got an indoor court."], ["No, it's always very busy. I'm sure we can't play there today."], ["Maybe you're right. It's a bit expensive, too."], ["OK, so we can't play today. It's no big deal. We can play tomorrow, perhaps."], ["Yes. But I'm a bit sad now."], ["Me, too. But what can we do? It's raining, and that's that."], ["I know! How about watching some old tennis games on the internet?"], ["Good idea. I like watching really good players."], ["And we can eat our food."], ["Let's go and switch the computer on."]]},117:{u:"Unit 12", audio:"../assets/p117.mp3", title:"Transport Around the World", arts:[["Transport around the world."], ["The Amfibus, the Netherlands.", "The big, blue Amfibus certainly makes a big splash!", "It's in Rotterdam, and it takes people on tours of the city.", "It's cool.", "It can travel on land and in the water.", "It is more expensive than water taxis, but it is more exciting, too.", "It is slower in the water than on land.", "It goes at 8 kilometres per hour in the water and 96 kilometres per hour on land.", "The tour lasts for an hour, and it costs 27.50 euros."], ["Moving walkways and escalators, Hong Kong.", "The Central-Mid-Levels Escalator is 800 metres long.", "Escalators are usually inside a shopping centre or an airport, but not this one!", "It's outside.", "It's a great way to travel round this city of hills.", "And it's free!", "There are 14 places where you can get on and off.", "The escalators travel down the hill from 6am to 10am, so people can travel to work.", "They travel up the hill from 10am to midnight."], ["The urban cable car, Turkey.", "Ankara's cable car is cheaper than other forms of public transport.", "It is healthier because it doesn't pollute the air.", "It is also easier and quicker than travelling by car, because there are no traffic jams in the sky!", "It travels 60 metres above the ground, and passengers can get great views of the city."], ["Submarines, Lanzarote and Tenerife.", "Now you can travel in a submarine!", "This submarine carries tourists.", "It is a safe and comfortable way to see the colourful fish and the plants and rocks under our seas.", "The submarine can carry 48 people, and it has 11 large windows on each side.", "It travels down 60 metres under the sea."]]},202:{u:"Unit 12", audio:"../assets/p202.mp3", title:"Ways to Get Around", arts:[["People use different types of transport to get from one place to the next.", "In Wuppertal, a city in Germany, the 'Schwebebahn' or suspension railway is very special.", "The first track opened in 1901.", "It is the oldest electric elevated railway with hanging cars in the world.", "More than 85,000 passengers use it every day."], ["There are lots of special cars in Cuba, especially in Havana.", "Most of them are very old.", "But these yellow taxis are much newer.", "They are called cocotaxis because they look like coconuts.", "They are a great way of getting around.", "Tourists love them!"], ["Tourists also like riding down the hills in Madeira, Portugal, on the Monte Toboggan.", "Originally, people used these sledges to transport food and other things.", "Today, they transport people.", "Two 'carreiros', or sledge drivers, run next to the sledge and keep it on the street.", "They wear special shoes.", "When the ride gets too fast, the drivers can use their shoes to slow it down."], ["This strange form of transportation is called zorbing or globe-riding.", "And yes, a person is inside!", "The first zorbing site was in New Zealand.", "But now you can go zorbing all over DB.ZH = Object.assign(DB.ZH||{}, {"My favourite journey. We all love going on a journey.":"我最喜欢的旅程。我们大家都喜欢去旅行。","Here are some of your favourites. Thank you for sharing them!":"这里有一些你们最喜欢的旅程。感谢大家的分享！","Adam. I love boats and my favourite boat journey is the one by ferry across the Danube River.":"亚当：我喜欢船，我最喜欢的乘船旅程是乘渡船横渡多瑙河的那一段。","My grandma lives in Budapest.":"我奶奶住在布达佩斯。","When I visit her, we often go on it together.":"我去看她时，我们常常一起乘坐这条渡船。","It's not a long journey.":"这趟旅程并不长。","It's only ten minutes.":"只需十分钟。","The ferry just takes you across the river to the other side of the city.":"渡船只是把你送到河对岸，也就是城市的另一边。","We don't get off the boat.":"我们不下船。","We just go there and back again.":"我们只是坐过去，再坐回来。","Rose!":"罗斯：","I really love steam trains.":"我真的很喜欢蒸汽火车。","There's one in Scotland.":"苏格兰就有一列。","It goes from Fort William to Mallaig on the west coast, and it's called the Jacobite Steam Train.":"它从西海岸的威廉堡驶往马莱格，被称为“詹姆斯党号”蒸汽火车。","It's the famous one you see in the Harry Potter films.":"它就是你在《哈利·波特》电影里看到的那一列著名的火车。","The one that takes Harry and his classmates to Hogwarts. But that's not why I like it.":"就是送哈利和他的同学们去霍格沃茨的那一列。但我喜欢它并非因为这个原因。","I like the sound it makes and I like the view from the window.":"我喜欢它发出的声响，也喜欢窗外的景色。","It travels past lakes and mountains and beautiful beaches.":"它沿途经过湖泊、山峦和美丽的海滩。","What's my favourite journey?":"我最喜欢的旅程是什么呢？","My journey to school.":"是我上学的那段路。","We live in a village and my school is in the next village.":"我们住在一个村子里，我的学校在下一个村子。","Every morning, I walk across the fields and then along the river until I'm at school.":"每天早晨，我穿过田野，再沿着河边走，直到到达学校。","It's a really beautiful walk.":"这段路程真是美极了。","I love looking for birds.":"我喜欢寻找小鸟。","There are some lovely ones.":"那儿有几只可爱的小鸟。","And sometimes, if I'm lucky, I see a rabbit.":"有时，如果我运气好，还能看到一只兔子。","I love my walk to school.":"我喜欢去学校的那段路。","But I love the walk home more!":"但我更喜欢回家那段路！","Max. My favourite journey is a very fast bike ride.":"马克斯：我最喜欢的旅程是一次极速的骑行。","My grandparents have a house in the mountains. There is a road down the mountain to the town.":"我的祖父母在山里有一栋房子。有一条路从山上通向小镇。","It goes down very fast, and it goes through a big forest.":"下山的路非常快，途中还会经过一大片森林。","Every morning, we ride down to the town to get bread.":"每天早晨，我们骑车下到镇上买面包。","It only takes ten minutes to ride down, but it takes a lot longer to ride back up again!":"骑车下去只需十分钟，可再骑回山上却要久得多！"});

  var sing=ENTITY[pg]||{};
  for(var i=0;i<n;i++){ if(!used[i]){ var lo=words[i].toLowerCase().replace(/'+$/,''); if(sing[lo]){ used[i]=true; entT[i]=sing[lo].t; entS[i]=sing[lo].s; } } }
  var wds=[];
  for(var i=0;i<n;i++){
    var w=words[i], lo=w.toLowerCase();
    var kind;
    if(used[i]) kind = (DT.spell && entS[i]) ? "blankE" : "anchor";
    else if(/^\d/.test(lo) || NUMB[lo]) kind="hint";
    else if(FUNCTION[lo]) kind="hint";
    else kind = dtBlankByDensity(lo) ? "blank" : "hint";
    wds.push({w:w, full:lo, kind:kind, etype:entT[i], espell:entS[i], wi:i});
  }
  var cells=[], wi=-1;
  toks.forEach(function(t){
    if(t.w!==undefined){ wi++; cells.push({kind:"wd", o:wds[wi]}); }
    else cells.push({kind:"sep", s:t.p});
  });
  return {wds:wds, cells:cells};

function dtGroups(rec){
  var blanks=[];

    var gs=[]; for(var i=0;i<blanks.length;i+=2) gs.push(blanks.slice(i,i+2)); return gs.length?gs:[[]];
  }
  if(blanks.length<=6) return [blanks.slice()];

function bindBlank(el){
  var inp=el.querySelector("input"); if(!inp) return;
  var full=el.dataset.full, gi=+el.dataset.gi, wi=+el.dataset.wi;
  var fst=(el.querySelector(".fst")||{}).textContent||"";
  var rest=full.length-fst.length;
  inp.addEventListener("input", function(){
    if(inp.value.length<rest) return;
    var grp=DT.groups[gi];
    var idx=grp.findIndex(function(b){return b.wi===wi;});
    if(idx<grp.length-1){ focusBlank(grp[idx+1]); }
    else dtSubmitGroup(gi);
  });
  inp.addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); dtSubmitGroup(gi); }
    else if(e.key==="Tab"){ e.preventDefault(); nxtToBlank(el,1,gi); }
  });
}
function focusBlank(b){
  var inp=document.querySelector('#dt-sheet [data-wi="'+b.wi+'"] input');
  if(inp&&!inp.disabled){ try{inp.focus();}catch(e){} }
}
function nxtToBlank(el,dir,gi){
  var grp=DT.groups[gi], i=grp.findIndex(function(b){return b.wi===+el.dataset.wi;});

  var j=i+dir;

function dtSubmitGroup(gi){
  if(gi!==DT.g) return;

    var el=document.querySelector('#dt-sheet [data-wi="'+b.wi+'"]'); if(!el) return;
    var inp=el.querySelector("input"); if(!inp) return;
    var fst=(el.querySelector(".fst")||{}).textContent||"";
    var typed=(fst+inp.value).trim().toLowerCase();
    if(!judge){ b.typed=typed; return; }        // 前3遍只记不判
    var ok=typed===b.full;
    var html= ok ? '<b class="dt-r-ok">'+esc(b.full)+'</b>'
                 : '<b class="dt-r-bad">'+esc(b.full)+'</b><span class="dt-r-tip">你写: '+esc(typed||"—")+'</span>';
    el.innerHTML=html;
    b.ok=ok; b.typed=typed;
  });
  DT.g++;
  if(DT.g>=DT.groups.length){
    if(judge){ dtFinish(); return; }
    nextDictatePass(); return;                  // 慢速试写两遍不计分 → 自动进下一遍

 called gamelan.", "They have these orchestras with some very unusual instruments.", "They make beautiful sounds and when they all play the musicians wear the same traditional clothes.", "Thanks Lewis.", "And now let's talk to Jen.", "I love African drumming.", "I go to a lot of musical festivals and there's always some African drumming.", "Is there any African country you like the drumming from most?", "Well I like all African drumming but the drummers from Burundi are fantastic and they wear these really cool green, red and white clothes.", "They're the colours of the Burundi flag.", "Sometimes they also paint their drums in the same colours.", "Okay, thank you Jen."]]}, "78": {"u": "Unit 8", "audio": "../assets/p078.mp3", "title": "A teenage DJ", "arts": [["Who are you?", "I'm Danny Boyd.", "I'm 14 years old and I'm from Luton.", "What do you do?", "I'm a student at school and at the weekends I work as a DJ.", "Wow, that's interesting.", "Can you tell us more?", "I'm a DJ at a local youth club.", "I play every Saturday from 6pm to 10pm.", "There's usually about 100 people there.", "It's great fun.", "I also sometimes play for big crowds in the park and sometimes on the beach too.", "What do you like doing in your free time?", "I love listening to music and finding new songs to play.", "I like watching films and playing games on my VR headset but I hate dancing.", "I know that's a strange thing for a DJ to say.", "I love watching other people dance but I never dance myself.", "What do you like wearing?", "I like wearing jeans and a white T-shirt.", "I also wear a red cap.", "I don't like wearing shirts and trousers.", "I wear those every day at school.", "Thanks Danny and good luck.", "Thank you.", "Why don't you come to one of my shows one day?"]]}, "80": {"u": "Unit 8", "audio": "../assets/p080.mp3", "title": "Dances around the world", "arts": [["The Tango is the national dance of Argentina, and every year on 11th December people in Buenos Aires celebrate the Day of the Tango.", "They do the tango in dance halls, parks and squares all over the city.", "The dance is usually performed by a man and a woman.", "The man often wears smart trousers and a shirt.", "The woman often wears a beautiful dress.", "The dance is often very interesting to watch.", "The Whirling Dervish is a dance from Turkey.", "There is a group of twelve men who dance.", "They wear traditional costumes with big skirts.", "They often all wear white, but sometimes the skirts are different colours.", "There is another group of twelve musicians.", "They play traditional Turkish instruments.", "As the music plays, the dancers spin around in circles, getting faster and faster.", "The dance is very popular with tourists.", "There are lots of Irish dances, but perhaps the most famous one is the step dance.", "One or more dancers perform the step dance.", "The dancers only move their legs.", "They move them very quickly.", "The top half of the body doesn't move.", "Dancers usually wear traditional Irish costumes.", "The music they dance to is played by an Irish folk band.", "They play instruments like the fiddle and the whistle."]]}, "85": {"u": "Unit 9", "audio": "../assets/p085.mp3", "title": "Kitchen Kids", "arts": [["Harry doesn't want to be a star chef when he's 20.", "He wants to be one now.", "This is why he's on the TV programme Kitchen Kids.", "The ten-year-old New Yorker likes cooking.", "He can make fantastic soups and salads, excellent omelettes and the best cakes.", "But there are many other children on the show, too.", "And they are all very good.", "More and more young people are interested in cooking.", "Many of them learn it from their parents.", "Others watch special cooking videos for children on YouTube.", "In many cities, there are special cooking classes for young people.", "Some of them are for children from the age of three!", "But what must you do to become a star chef?", "Of course, it's important that you like cooking and are really good at it.", "But there are some rules.", "You must be nine years old or more to be on Kitchen Kids.", "'We must wash our hands before we start cooking,' Harry says.", "'And of course we mustn't put them in our mouths.", "A chef doesn't do that!", "And we must be very careful with hot plates.'", "The show starts.", "Harry is excited.", "He knows he's an excellent cook.", "This time he makes tomato soup, some salad, steak and carrot cake.", "The experts in the studio love Harry's food, and he stays on the show.", "It's 5 pm.", "The show is over.", "Harry is happy, and a little tired.", "He goes home.", "It's time to do his homework."]]}, "87": {"u": "Unit 9", "audio": "../assets/p087.mp3", "title": "Cooking", "arts": [["Can we make some sandwiches, Dad?", "Of course you can. No problem.", "Would you like some help?", "No, we're okay, thanks.", "Can we use this cheese, Dad?", "No, your mum wants that for the lasagna. Use this cheese.", "Okay.", "We need some salad in the sandwiches. Have we got any?", "There's no cucumber, but there are some tomatoes.", "Let's have cheese and tomato sandwiches then.", "Cool.", "What are you doing, Dad?", "I'm putting some peanut butter on the bread. It's tastier than butter.", "Don't do that.", "Too late.", "The thing is, Sally is allergic to nuts.", "Oh no. I'm sorry.", "Never mind. I can eat these.", "And you can make some more.", "We can't make any more. We haven't got any more bread.", "I know. Can we go for fish and chips, Dad?", "Hmm, okay. Yes, we can.", "Great.", "And can Sally and Max come too?", "Yes, of course they can.", "But first, we must clean up this mess.", "Oh, Dad. We're hungry now. Can we do that later?", "No, we can't."]]}, "88": {"u": "Unit 9", "audio": "../assets/p088.mp3", "title": "In a restaurant", "arts": [["Hello. Can I help you?", "Hi, yes. We'd like a table for two, please.", "Here are the menus.", "Thanks.", "What would you like to drink?", "I'd like an orange juice.", "And I'd like water, please.", "Great.", "Are you ready to order now?", "Yes. I'd like the pizza with salad.", "Any starters?", "No thanks.", "Would you like any extra toppings on the pizza? Onion, peppers, or tomatoes?", "Some peppers, please.", "And what would you like?", "I'd like the chicken and chips.", "Okay. Is that everything?", "Yes. Thank you.", "Would you like a dessert?", "Yes, please. I'd like the fruit salad with vanilla ice cream.", "Me, too.", "How are your desserts?", "Great.", "Would you like any more drinks?", "No, thanks. We'd like the bill, please.", "Of course.", "Thank you."]]}, "90": {"u": "Unit 9", "audio": "../assets/p090.mp3", "title": "Offering and asking for help", "arts": [["Wow! What a great smell!", "Thanks, Mum! It's lasagna. It's in the oven and it's almost ready.", "Lasagna from the shop?", "No, Mum. It's my lasagna.", "It's got meat, pepper, mushrooms, cheese, onion, everything.", "And we can eat it with a bit of salad.", "Oh, right! But we? Who's coming for lunch?", "Mark and Chloe. We want to study together this afternoon and have lunch together first.", "That's okay, right?", "Of course, Joe. But...", "But what, Mum?", "Well, the thing is, I'd like a nice quiet afternoon.", "Oh, don't worry, Mum. After lunch, we plan to study upstairs in my room.", "Oh! It's ready!", "Be careful, Joe. It's very hot. Can I help you?", "It's okay, Mum. I can just... Oh, no! My lasagna! It's all over the floor!", "Now what?", "Well, first, let's clean it all up. And then, do you and your friends want to go to the new sandwich shop?", "Not really. But I've got an idea, Mum. We can just have the salad.", "Okay. And you and I can make some chocolate-covered bananas so your friends can have some dessert, too.", "Thanks, Mum. You're the best!"]]}, "92": {"u": "Unit 10", "audio": "../assets/p092.mp3", "title": "She was the first woman in space", "arts": [["Valentina Tereshkova was born in Russia on 6th March 1937.", "Her father was a driver and her mother worked in a factory.", "Valentina was a worker in a factory, too.", "Her hobby was skydiving and it was her dream to be an astronaut and to go into space.", "In 1962, there was a big competition to find new astronauts.", "There were 400 people interested in going to space.", "The training programme wasn't very easy, but Tereshkova was hardworking.", "And she was the lucky one.", "Tereshkova's big day was on 16th June 1963, and she was just 26.", "The next year, she married Andrian Nikolayev, and Tereshkova was the first woman in space.", "The flight was very difficult because there were many technical problems and Tereshkova wasn't very well for most of the flight.", "She was in space for three days.", "She is the only woman to fly into space alone.", "After that, she was very famous all over the world.", "Her face was on stamps in many countries.", "In the year 2000, there was a big celebration in London, and Valentina Tereshkova was named 'Woman of the Century'.", "At the opening ceremony of the Winter Olympics in Russia in 2014, Valentina Tereshkova was one of the carriers of the Olympic flag.", "These were very important moments for her."]]}, "95": {"u": "Unit 10", "audio": "../assets/p095.mp3", "title": "A prize-giving at school", "arts": [["Hi Will, how are you? Are you better?", "Yes, thanks. I was ill yesterday and the day before but I'm okay now.", "Good, I'm pleased.", "So yesterday was the prize-giving at school, right? Was it good?", "No, it wasn't. Well, not really. There weren't many parents there.", "Oh really? There were lots last year. Were all the teachers there?", "Of course! The teachers can't choose, can they?", "No, and neither can the kids. Anyway, who were the big winners this year?", "Well, the best student of the year for the whole school was Sandra Hammond.", "Sandra? Was she the best student last year too?", "No, she wasn't. It was her brother Tom. This year, Tom was the best sports person in the school.", "Oh, the Hammonds! They always win everything! Boring!", "I know, but it's okay. They're leaving at the end of term, so next year, who knows? Maybe you!", "You're joking of course. I'm never the best at anything.", "Well, anyway, guess who the best science student was?", "No idea. Andy Clarkson?", "No, me!", "You? Really? Well done! That's fantastic! I'm proud of you. Was the prize something nice?", "Yes, it was. A book about science. I really want to read it.", "Good for you, Alice. Well done. Thanks, Will."]]}, "96": {"u": "Unit 10", "audio": "../assets/p096.mp3", "title": "Sports achievers", "arts": [["Yesterday, I was online and I learned about a woman called Amy who walked all around the UK to get money for charity and in winter when there was rain and snow. Do you know any other amazing stories like that?", "How about Dee Caffari? She sailed around the world non-stop three times. That's right, three times. Imagine the wind and the rain. Fantastic, eh? Jenny.", "OK, well, there's a boy called Jordan Romero from the US. He climbed Mount Everest when he was 13 years old. It's really cold up there, but he managed to get to the top. Only 13. Now that's an achievement. Sam.", "My friend Corey Armstrong decided to run a marathon when he was 16. He finished in just over four hours. He enjoyed it a lot, so then he decided to do the marathon in Death Valley in the US. It's so hot there, often more than 40 degrees Celsius. This time he was slower, almost five hours, but I still think it's fantastic. 42 kilometres when it's over 40 degrees. I think he almost died. Martha.", "Before 1926, a lot of women tried to swim the cold water of the English Channel from England to France, but they all failed. But in 1926, Gertrude Ederle, an Olympic gold medal swimmer, arrived on an English beach after 14 hours and 31 minutes. She returned to her home in New York a hero. How about that? Mark."]]}, "99": {"u": "Unit 10", "audio": "../assets/p099.mp3", "title": "Statues around the world", "arts": [["There are many wonderful statues all over the world.", "Many of them help us to remember the lives of great people.", "Rosa Parks", "One day in 1965, a bus driver in Alabama in the US asked Rosa Parks to give a man her seat because he was white and she was black.", "She said no and the police decided to take her away.", "It was a very important moment in the history of black people's rights in the US.", "The statue shows Rosa sitting on a rock wearing the same clothes as that day in 1965.", "Franz Kafka", "Franz Kafka was a writer from Prague.", "He was born in 1883.", "His books were in German.", "In his life, he was not very famous, but now he is.", "Many of his stories were very strange.", "There's a very unusual statue of him in Prague.", "He's sitting on the shoulders of an empty suit.", "Os Candango", "The Candango were men who travelled from all over Brazil between 1956 and 1960 to build the new capital city of Brazil, Brasilia.", "In 1956, 256 men arrived, but before long there were 30,000 who worked hard to build the city.", "Brasilia opened in 1960 and this 8 meter high statue to remember the Candango is in the 3 powers square.", "The two figures are holding digging tools.", "Suzanne Lenglen", "At the Roland Garros tennis centre in Paris, there is a court called Suzanne Lenglen.", "Lenglen was a famous French tennis player who played from 1914 to 1926.", "She was the number one player for many years.", "In front of the court is this statue.", "Lenglen is jumping with a racket in her hand and she is wearing her famous white dress and headband."]]}, "102": {"u": "Unit 11", "audio": "../assets/p102.mp3", "title": "Dolphins to the rescue", "arts": [["Everyone knows that dolphins are very intelligent animals.", "But did you know that many scientists believe there is a special connection between dolphins and humans?", "There are lots of stories about dolphins helping humans who are in danger.", "Here are two of our favourites.", "14-year-old Davide Cecchi was in his father's boat off the southeast coast of Italy when he had an accident and fell into the water.", "Davide didn't know how to swim, and his father didn't see him fall, so he didn't stop the boat.", "He shouted, but his dad didn't hear him.", "Davide got very worried.", "Then, very quickly, a dolphin came to help him.", "It gave Davide a push back up to the top of the water, and the boy got on to the dolphin's back.", "The dolphin took him back to the boat.", "When Davide's father saw his son, he pulled him from the water.", "The dolphin saved Davide's life.", "In 2016, Adam Walker went to New Zealand to swim across the Cook Strait between the North and South Islands.", "He was swimming when he saw a large dark shape below him.", "He knew that it was a great white shark and his life was in danger.", "Adam knew he didn't have a lot of time.", "A few seconds later, a group of ten dolphins joined him and swam in a circle between him and the shark.", "The circle of dolphins kept Adam safe.", "After half an hour, the shark left, but the dolphins swam with him for another hour."]]}, "105": {"u": "Unit 11", "audio": "../assets/p105.mp3", "title": "Josh's holiday", "arts": [["Hey Josh, did you have a good holiday?", "Hi Mandy, yes it was great.", "Where did you go?", "The Pantanal, it's in the east of Brazil. It's a really big wetland.", "Oh right, so why did you go there?", "Because there are amazing animals and birds there.", "We all love animals in my family, especially my dad.", "He's a bird watcher.", "Really? I didn't know that.", "Yes, he loves birds.", "So are you a big bird watcher too?", "Well I like them and we saw some really beautiful parrots and toucans, but I prefer the other animals.", "Did you see anything special?", "Yes, loads of stuff.", "There were lots of Cayman.", "Cayman? What are they?", "They're like small crocodiles.", "Cool, what else did you see?", "We saw an anaconda, you know one of those really big snakes, and then one night we heard a jaguar but we didn't see it.", "Wow, were you scared?", "No, it was exciting, especially because it was so near our tent.", "Tent? Did you go camping?", "Yes, but just for a few nights. Most of the time we were in small hotels.", "So how did you travel around? Did you have a guide?", "Yes, we did.", "His name was Sergio.", "He knew where to find all the animals.", "Did he speak English?", "Yes, he did. His English was good which was lucky because no one in my family can speak Portuguese.", "It sounds like you had a great time.", "We did. It was fantastic."]]}, "106": {"u": "Unit 11", "audio": "../assets/p106.mp3", "title": "Extinct animals", "arts": [["1.", "The Great Auk", "The Great Auk was a large seabird that lived in the North Atlantic.", "It was a bird but it couldn't fly.", "It could swim underwater really well.", "It caught and ate fish when it dived under the water.", "Its feathers were very soft and people used them to make pillows for their beds.", "Because of this people killed the birds.", "The last Great Auk died on the island of Eldey in 1835.", "2.", "The Tasmanian Tiger", "The Tasmanian Tiger was only found in Australia, Tasmania and New Guinea.", "It got its name because it had stripes like a tiger but it was not a member of the cat family.", "Farmers believed Tasmanian Tigers killed their sheep so they paid people to kill them.", "Many of the tigers died after getting ill from diseases they caught from other animals.", "The last Tasmanian Tiger died in Hobart Zoo in 1936.", "3.", "Steller's Sea Cow", "Steller's Sea Cow was a large animal that lived in the cold Arctic waters around Alaska.", "It grew up to nine metres long.", "Because it was so big it couldn't go under the water.", "It ate the plants on top of the sea.", "It wasn't a very dangerous animal.", "It was quite friendly.", "Because of this it was very easy to kill.", "Europeans first found the sea cow in 1741.", "27 years later they killed the last one."]]}, "108": {"u": "Unit 11", "audio": "../assets/p108.mp3", "title": "Sequencing a story", "arts": [["Hey Nathan, how are you? Did you have a good weekend?", "Well, sort of. I mean, it was okay.", "You don't sound very sure. What happened?", "Yeah, come on, tell us.", "Alright, well on Sundays we usually go for a walk, my family and I, but yesterday I went alone.", "Where did you go?", "I went to the forest, you know, outside town. It's really nice there.", "And I started walking when suddenly...", "Yes, suddenly what?", "Well, in front of me there was a snake.", "Are there snakes in the forest? Are you sure?", "Yes, I'm sure. It was on the path. I stopped. I didn't do anything. Then it just went away. I was afraid.", "Poor you. I hate snakes too.", "Why were you afraid? It's just a snake. A snake can't kill you.", "Some snakes can. Anyway, it's okay to be afraid sometimes.", "Thanks Lena. Anyway, that's why my weekend was just okay."]]}};Object.keys(BOOK_EXTRA).forEach(function(k){ BOOK[k]=BOOK_EXTRA[k]; });

  ID("rateBtn").onclick=function(){ RI=(RI+1)%3; state.rate=RATES[RI]; audio.playbackRate=state.rate; ID("rateBtn").textContent=state.rate+"x"; toast("播放速度 "+state.rate+"x"); };
  ID("loopBtn").onclick=function(){ var N=[1,2,3,5], I=N.indexOf(state.loopN); state.loopN=N[(I+1)%4]; state.loopLeft=state.loopN-1; ID("loopBtn").textContent="↻"+state.loopN; toast(state.loopN>1?("循环 "+state.loopN+" 次（跟读=每句，聆听=整篇）"):"循环关闭"); };
  var t0=Date.now(); setInterval(function(){ var s=Math.floor((Date.now()-t0)/1000); ID("timerChip").textContent=("0"+Math.floor(s/60)).slice(-2)+":"+("0"+s%60).slice(-2); },1000);
  build(); paint();
    /* 本环节无答题板绑定 */
  ID("openDir").addEventListener("click",function(e){ e.stopPropagation(); openDir(); });
  ID("curTab").addEventListener("click",openDir);
  ID("curTab").addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();openDir();} });
  ID("dirClose").addEventListener("click",closeDir);
  ID("dir").addEventListener("click",function(e){ if(e.target.id==="dir")closeDir(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape")closeDir(); });
  /* 暴露给宿主脚本复用（头部类型标注） */
  window.paint=paint; window.meta=meta; window.TYPES=TYPES;
  window.currentUnit=function(){ return unitOf(state.pg); };
});
})();
</script>
