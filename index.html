<!DOCTYPE html>

<title>学而思学习平板 · 课文三步流程 · L7 Unit 7</title>
<link rel="stylesheet" href="ui.css">

<style>/* ============ AppleOS 扁平设计系统 ============ */
:root{
  --bg:#f2f2f7; --bg-soft:#f7f7fa; --bg-2:#e5e5ea;
  --card:#ffffff;
  --ink:#1c1c1e; --ink-2:#3c3c43; --ink-3:#8e8e93; --ink-4:#aeaeb2;
  --blue:#0a84ff; --blue-bg:#e8f1ff; --blue-deep:#0b6ce0;
  --green:#34c759; --green-bg:#e6f7ea; --green-deep:#1f9a45;
  --orange:#ff9f0a; --orange-bg:#fff3e0;
  --red:#ff453a; --red-bg:#ffe9e7;
  --line:rgba(60,60,67,.14); --line-soft:rgba(60,60,67,.08);
  --rad:16px; --rad-lg:22px; --rad-sm:10px;
  --glass:rgba(255,255,255,.72);
  --font:"-apple-system","SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",system-ui,sans-serif;
  --font-num:"SF Mono",ui-monospace,"Menlo",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);overflow:hidden;background:var(--bg);user-select:none;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
/* ---------- 顶部玻璃栏 ---------- */
/* ---------- 流程步骤条 ---------- */
.steps{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line-soft);border-radius:30px;padding:6px 12px}
.step{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:20px;transition:.2s}
.step b{width:22px;height:22px;border-radius:50%;background:var(--bg-2);color:var(--ink-3);font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--font-num)}
.step span{font-size:13px;font-weight:600;color:var(--ink-3)}
.step.on{background:var(--blue-bg)}
.step.on b{background:var(--blue);color:#fff}
.step.on span{color:var(--blue-deep)}
.step.done b{background:var(--green);color:#fff}
.step.done span{color:var(--green-deep)}
/* ---------- 主区 ---------- */
/* —— 对话按人物排版（p69 听力对话） —— */
/* ---------- 沉浸跟读 · 一屏一句字幕巨幕 ---------- */
/* 第2步：整篇信纸式滚动字幕 */
@keyframes fsring{0%{transform:rotate(0) scale(.96);opacity:.72}50%{transform:rotate(180deg) scale(1.05);opacity:1}100%{transform:rotate(360deg) scale(.96);opacity:.72}}
/* ---------- 听写面板 ---------- */
/* ---------- 听写方式选择 ---------- */
/* ---------- 聆听全文循环遍次 ---------- */
@keyframes gapfill{from{width:100%}to{width:0}}
/* 跟读环节禁用译文开关 */
.chip.off{opacity:.4;pointer-events:none}
/* ---------- 底部 dock ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.15s}
.chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue-deep)}
/* 播放条内嵌：译文 + 跟读遍数（三个流程常驻） */
/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:128px;transform:translateX(-50%) translateY(12px);background:rgba(28,28,30,.9);color:#fff;font-size:13px;padding:9px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- 分组目录面板 ---------- */
@keyframes dirIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* ============ 书架首页 / 单元页（迁自 学生端.html，作用域 #shelfRoot） ============ */
#shelfRoot{position:fixed;inset:0;z-index:1300;display:block;overflow-y:auto;overflow-x:hidden;background:var(--bg);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#shelfRoot.off{display:none}
/* 书架内的提示浮层需盖过书架本身 */
.toast{z-index:1400}
#shelfRoot .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#shelfRoot .bg span{position:absolute;border-radius:50%;filter:blur(80px)}
#shelfRoot .bg .b1{width:520px;height:520px;left:2%;top:4%;background:#7C3AED;opacity:.42}
#shelfRoot .bg .b2{width:460px;height:460px;right:6%;top:6%;background:#EC4899;opacity:.38}
#shelfRoot .bg .b3{width:540px;height:540px;left:12%;bottom:4%;background:#06B6D4;opacity:.34}
#shelfRoot .bg .b4{width:480px;height:480px;right:10%;bottom:6%;background:#F97316;opacity:.32}
#shelfRoot .bg .b5{width:380px;height:380px;left:44%;top:38%;background:#FACC15;opacity:.24}
#shelfRoot .wrap{position:relative;z-index:1;max-width:1300px;width:100%;margin:0 auto;padding:0 28px}
/* 顶栏 */
#shelfRoot header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 0 18px;flex-wrap:wrap}
#shelfRoot .logo{display:inline-flex;align-items:baseline;gap:14px;flex:none;flex-wrap:wrap}
#shelfRoot .think{display:inline-block;font-weight:900;font-size:40px;letter-spacing:-.055em;line-height:1;
  background:var(--noise),linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(124,58,237,.45))}
#shelfRoot .bang{display:inline-block;position:relative;width:.22em;height:.78em;margin:0 .045em;vertical-align:-.04em}
#shelfRoot .bang::before,#shelfRoot .bang::after{content:"";position:absolute;left:0;width:100%;background:linear-gradient(180deg,#A78BFA,#EC4899)}
#shelfRoot .bang::before{top:0;height:.60em}
#shelfRoot .bang::after{bottom:0;height:.15em}
#shelfRoot .foundation{display:inline-block;font-weight:800;font-size:40px;letter-spacing:-.035em;line-height:1;
  background:var(--noise),linear-gradient(135deg,#312e81 0%,#4c1d95 60%,#0e7490 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 12px rgba(76,29,149,.4));padding-bottom:3px}
#shelfRoot .edition{font-size:9px;font-weight:700;letter-spacing:.16em;color:rgba(30,27,75,.5);padding-bottom:8px;white-space:nowrap}
#shelfRoot .nav-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#shelfRoot .chip{appearance:none;display:inline-flex;align-items:center;gap:6px;height:auto;line-height:1.2;
  border:1.5px solid rgba(124,58,237,.28);background:linear-gradient(135deg,rgba(124,58,237,.10),rgba(236,72,153,.08));
  color:#4c1d95;font-family:inherit;font-size:13.5px;font-weight:800;padding:9px 16px;border-radius:var(--r-pill);
  cursor:pointer;transition:all .25s}
#shelfRoot .chip:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(124,58,237,.5);border-color:rgba(124,58,237,.45)}
/* 书架 */
#shelfRoot .shelf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:14px;row-gap:26px;padding:8px 0 48px}
#shelfRoot .book{--h:200;position:relative;display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;isolation:isolate;
  cursor:pointer;appearance:none;-webkit-appearance:none;margin:0;padding:0;width:100%;font:inherit;text-align:inherit;
  border:1px solid rgba(0,0,0,.06);background:linear-gradient(170deg,rgba(255,255,255,.96),rgba(255,255,255,.74) 55%,rgba(255,255,255,.92));
  box-shadow:var(--sh-card);transition:transform .35s cubic-bezier(.19,1,.22,1),opacity .28s ease,border-color .28s ease,box-shadow .35s;
  min-height:180px}
#shelfRoot .cover{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:16px 14px;overflow:hidden;text-align:center;
  background:radial-gradient(62% 52% at 28% 26%,hsl(var(--h) 92% 60%/.38) 0%,transparent 72%),
            radial-gradient(52% 48% at 76% 70%,hsl(var(--h) 88% 58%/.26) 0%,transparent 72%),
            linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.1))}
#shelfRoot .num{position:relative;z-index:1;font-weight:900;line-height:1;letter-spacing:-.06em;
  background:linear-gradient(180deg,hsl(var(--h) 84% 36%),hsl(var(--h) 90% 54%));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 16px hsl(var(--h) 90% 60%/.38));font-size:clamp(38px,3.4vw,50px)}
#shelfRoot .cover h3{position:relative;z-index:1;width:100%;margin:6px 0 0;font-size:clamp(12px,1.05vw,14px);font-weight:700;
  line-height:1.25;color:rgba(0,0,0,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shelfRoot .tag{position:absolute;top:10px;left:10px;z-index:2;font-size:10.5px;font-weight:800;letter-spacing:.03em;
  padding:3px 8px;border-radius:var(--r-pill);background:rgba(15,23,42,.06);color:rgba(15,23,42,.55)}
#shelfRoot .book.live .tag{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
#shelfRoot .done-mark{position:absolute;top:12px;right:12px;z-index:3;width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);
  border:1.5px solid rgba(15,23,42,.1);color:transparent;font-size:12px;font-weight:900;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
#shelfRoot .book.live .done-mark{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#16a34a;color:#fff;
  box-shadow:0 4px 14px -3px rgba(34,197,94,.7)}
@media (hover:hover) and (pointer:fine){#shelfRoot .book:hover{transform:translateY(-5px);border-color:hsl(var(--h) 88% 55%/.42);box-shadow:0 30px 56px -22px rgba(31,41,55,.34)}}
@media (max-width:1100px){#shelfRoot .shelf{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:720px){#shelfRoot .shelf{grid-template-columns:repeat(3,minmax(0,1fr))}
#shelfRoot .wrap{padding:0 18px}}
@media (max-width:520px){#shelfRoot .shelf{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* 单元页 */
#shelfRoot .crumb{display:inline-flex;align-items:center;gap:8px;padding:12px 0 4px;font-size:13px;font-weight:700;color:#64748b}
#shelfRoot .crumb button{appearance:none;border:none;background:none;cursor:pointer;color:#7C3AED;font-weight:800;font-family:inherit;font-size:13px;padding:4px 8px;border-radius:var(--r-xs)}
#shelfRoot .crumb button:hover{background:rgba(124,58,237,.08)}
#shelfRoot .unit-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:6px 0 18px}
#shelfRoot .unit-title{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
#shelfRoot .unit-num{font-weight:900;font-size:30px;line-height:1;letter-spacing:-.04em;background:linear-gradient(135deg,#312e81,#7C3AED);-webkit-background-clip:text;background-clip:text;color:transparent}
#shelfRoot .unit-name{font-weight:900;font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;color:#1d1d1f}

#shelfRoot .sec{margin:20px 0 8px;display:flex;align-items:center;gap:10px}
#shelfRoot .sec-h{font-size:16px;font-weight:900;letter-spacing:-.01em;color:#1e1b4b}
#shelfRoot .sec-n{font-size:10.5px;font-weight:800;letter-spacing:.03em;color:#7C3AED;background:rgba(124,58,237,.1);padding:3px 8px;border-radius:var(--r-pill)}
/* 主题词汇入口卡（点进独立词汇页，与篇章卡同构的跳转模式） */
#shelfRoot .tv{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 20px;
  background:linear-gradient(170deg,rgba(255,255,255,.97),rgba(255,255,255,.84));border:1px solid var(--line);
  border-left:4px solid #7C3AED;border-radius:var(--r-lg);box-shadow:var(--sh-card);cursor:pointer;
  transition:transform .25s cubic-bezier(.19,1,.22,1),box-shadow .25s,border-color .25s;margin-bottom:12px}
#shelfRoot .tv:hover{transform:translateY(-3px);border-color:rgba(124,58,237,.4);box-shadow:var(--sh-card-hover)}
#shelfRoot .tv .tv-ic{flex:none;width:52px;height:52px;border-radius:var(--r-md);display:grid;place-items:center;
  font-size:24px;color:#fff;background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
#shelfRoot .tv .tv-bd{flex:1;min-width:200px}
#shelfRoot .tv .tv-t{font-weight:900;font-size:16px;letter-spacing:-.01em;color:#1e1b4b}
#shelfRoot .tv .tv-s{margin-top:3px;font-size:12.5px;font-weight:700;color:#64748b}

#shelfRoot .tv .tv-go{flex:none;appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:900;font-size:13.5px;

#shelfRoot .tv:hover .tv-go{transform:translateY(-1px);box-shadow:var(--sh-btn-v-hover)}

@media(max-width:560px){#shelfRoot .pg-grid{grid-template-columns:1fr}}

function report(name, unit, type, itemId, action){
  if(!name) return;
  var R = loadJ(RKEY, {});
  (R[name] = R[name] || {})[unit] = (R[name][unit] || {});
  var su = R[name][unit];
  (su[type] = su[type] || {})[itemId] = (su[type][itemId] || {});
  var rec = su[type][itemId];
  if(action==='start' && !rec.startedAt){ rec.startedAt = nowTs(); }
  if(action==='done'){ rec.doneAt = nowTs(); }
  if(action==='undone'){ delete rec.doneAt; }
  try{ localStorage.setItem(RKEY, JSON.stringify(R)); }catch(e){}
}

  var d={total:0,done:0,pct:0,has:false};
  try{

    if(!raw) return d;
    var obj=JSON.parse(raw), karr=Object.keys(obj);
    d.total=karr.length; d.has=karr.length>0;
    var c=0; karr.forEach(function(k2){ var s=obj[k2]&&obj[k2].status; if(s==='known'||s==='mastered') c++; });
    d.done=c; d.pct=d.total?Math.round(c/d.total*100):0;
    return d;
  }catch(e){ return d; }
}

  if(s.visited.indexOf(key)===-1){ s.visited.push(key); saveState(s); }
  currentUnitKey = key;
  $('unitNum').textContent = 'Unit ' + u.n;
  $('unitName').textContent = u.title;
  $('unitSub').textContent = u.sub;
  $('unitCrumb').textContent = 'Unit ' + u.n + ' · ' + u.title;
  renderThemeVocab(key);
  renderPassages(key);
  renderTaskZone(key);
  showView('unit');
}

/* 单元主题词汇：入口卡 → 跳转独立词汇诊断页（与篇章词汇同一套三步流程）
   页面键 theme_u<单元号>，进度存 theme_u<单元号>_records_v2，任务区据此自动判定完成 */
function themeKey(unitKey){ return 'theme_u' + unitKey; }
function themeProgress(unitKey){ return vocabProgress(themeKey(unitKey)); }
function openThemeVocabEngine(unitKey){
  var words = THEME[unitKey] || [];
  if(!words.length){ toast('该单元主题词汇尚未整理'); return; }
  window.open('00_主题词汇/词汇诊断_' + themeKey(unitKey) + '.html','_blank');
}

function renderThemeVocab(key){
  var N = (THEME[key] || []).length;
  $('vwCount').textContent = N + ' 词';
  var vp = themeProgress(key);
  var pct = vp.pct;
  var done = vp.has && pct >= 100;
  $('vwEntry').innerHTML = '<div class="tv'+(done?' done':'')+'" id="tvCard" tabindex="0" role="button" aria-label="进入单元主题词汇学习">'
    + '<span class="tv-ic">'+ICON('book')+'</span>'
    + '<div class="tv-bd">'
    +   '<div class="tv-t">'+esc(THEME_TITLE[key]||'单元主题词汇')+'</div>'
    +   '<div class="tv-s">'+N+' 词 · 预习 · 复习 · 测试'+(vp.has?' · 已掌握 <b>'+vp.done+' / '+N+'</b>':'')+'</div>'
    +   '<div class="tv-bar"><i style="width:'+pct+'%"></i></div>'
    + '</div>'
    + '<button class="tv-go" type="button">'+(done?'重新巩固':'开始学习')+' '+ICON('right','sm')+'</button>'
    + '</div>';
  var card = $('tvCard');
  var go = function(){ openThemeVocabEngine(key); };
  card.addEventListener('click', go);
  card.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
}

function renderPassages(key){
  var list = PASSAGES[key] || [];
  $('pgCount').textContent = list.length + ' 篇';
  var grid = $('pgGrid');
  grid.innerHTML = list.map(function(p){
    return '<div class="pg" data-key="'+p.key+'">'
      + '<span class="kind">'+esc(p.kind)+'</span>'
      + '<div class="pt">'+esc(p.title)+'</div>'
      + '<div class="pps">'+p.p+' · '+esc(p.intro)+'</div>'
      + '<div class="acts">'
      + '<div class="act" data-act="vocab"><span class="a-name">'+ICON('book','sm')+' 篇章词汇</span><span class="a-more">'+ICON('right','sm')+'</span></div>'
      + '<div class="act" data-act="follow"><span class="a-name">'+ICON('sound','sm')+' 篇章文段</span><span class="a-more">'+ICON('right','sm')+'</span></div>'
      + '</div>'
      + '</div>';
  }).join('');
  grid.querySelectorAll('.pg').forEach(function(card){
    card.addEventListener('click', function(e){
      var act = e.target.closest('[data-act]');
      var key2 = card.dataset.key;
      if(act){ openPassageAction(key2, act.dataset.act); return; }
      openPassage(key2);
    });
  });
}

function findPassage(key){
  for(var uk in PASSAGES){ var f = PASSAGES[uk].find(function(p){return p.key===key;}); if(f) return { u:uk, p:f }; }
  return null;
}

/* ═══════════ 篇章页 ═══════════ */
var currentUnit = null, currentPg = null;
function openPassage(key){
  var found = findPassage(key); if(!found) return;
  currentUnit = found.u; currentPg = found.p;
  var u = UNITS.find(function(x){return x.key===currentUnit;});
  $('pgTitle').textContent = currentPg.title;
  $('pgSub').textContent = 'Unit '+u.n+' · '+u.title+' · '+currentPg.kind+' · '+currentPg.p;
  renderFlow();
  showView('passage');
}

function actBtn(action, label, cls){
  return '<button class="btn'+(cls?' '+cls:'')+'" data-action="'+action+'">'+label+'</button>';
}

/* 引擎可用性（2026-10-15 定案，替代硬编码 u7_/u12_ 前缀白名单）：
   词汇 = 诊断页已生成的单元（U7–U12 均已产出 词汇诊断/词汇诊断_<key>.html）
   跟读 = 篇章页三页已生成（FOLLOW_FILES[pg]={listen,follow,dictate} 由 _gen_follow_v2.py 维护） */
var LIVE_VOCAB_RE = /^u(7|8|9|10|11|12)_/;
function vocabLive(key){ var k=String(key||''); return LIVE_VOCAB_RE.test(k); }
function followLive(p){
  var pg = parseInt(String(p).replace(/^p/,''), 10);
  return !!(window.FOLLOW_FILES && FOLLOW_FILES[pg]);
}

function renderFlow(){
  var el = $('flow'); var p = currentPg;
  var vLive = vocabLive(p.key), fLive = followLive(p.p);
  var pgN = parseInt(String(p.p).replace(/^p/,''), 10);
  var fm = (window.FOLLOW_META && FOLLOW_META[pgN]) || {};
  var metaBits = [];
  if(fm.s) metaBits.push(fm.s + ' 句 · 句级时间轴');
  metaBits.push(fm.v ? '生词诊断 ✓' : '生词诊断未建');
  var metaRow = '<div class="fm-meta" style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px">'
    + metaBits.map(function(x){ return '<span style="background:#eef2fb;color:#3a5ccc;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700">'+x+'</span>'; }).join("")
    + '</div>';
  var vocabBtn = vLive
    ? actBtn('open-vocab', '开始篇章词汇学习 '+ICON('right','sm'), '')
    : actBtn('soon-vocab', '词汇词卡建设中', 'ghost');
  /* 篇章文段三卡（2026-10-16 拆页）：预习（聆听）/ 复习（跟读）/ 听写，各自数据条 + 打开链接 */
  function fmMeta(bits){
    return '<div class="fm-meta" style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px">'
      + bits.map(function(x){ return '<span style="background:#eef2fb;color:#3a5ccc;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700">'+x+'</span>'; }).join("")
      + '</div>';
  }
  function stageCard(action, ico, title, desc, bits, btnLabel){
    return '<div class="flow-card">'
      + '<div class="fc-ico">'+ICON(ico)+'</div><h4>'+title+'</h4>'
      + '<div class="fc-desc">'+desc+'</div>'
      + (fLive ? fmMeta(bits) : '')
      + (fLive ? actBtn(action, btnLabel+' '+ICON('right','sm'), '')
               : actBtn('soon-follow', '跟读组件建设中', 'ghost'))
      + '</div>';
  }
  var listenBits = [];
  if(fm.s) listenBits.push(fm.s + ' 句 · 句级时间轴');
  listenBits.push(fm.v ? '生词诊断 ✓' : '生词诊断未建');
  var dictateBits = ['随机抽 5/10/15 句 · 或按段落', '逐词标对错 · 提交后显示中文'];
  el.innerHTML = metaRow +
    '<div class="flow-card">'
    + '<div class="fc-ico">'+ICON('book')+'</div><h4>篇章词汇</h4>'
    + '<div class="fc-desc">为这一篇的词汇做「预习 · 复习 · 测试」三步。不认识的一个个学起来，测试达标即完成本篇预习。</div>'
    + '<div class="steps">'
    +   '<div class="step"><span class="s-num">1</span>筛选：认出会/不会的词</div>'
    +   '<div class="step"><span class="s-num">2</span>学习：先回忆再揭示，掌握发音与释义</div>'
    +   '<div class="step"><span class="s-num">3</span>测试：按状态分层自测，答对连续两次才升级</div>'
    + '</div>'
    + vocabBtn
    + '</div>'
    + stageCard('open-stage-listen', 'ear', '逐句听',
        '逐句播放整篇，文本随句显示；中文默认关闭，想看再开。播完全篇自动记完成。',
        listenBits, '开始逐句听')
    + stageCard('open-stage-dictate', 'clipboard', '逐句听写',
        '随机抽 5/10/15 句或按段落选择，听本句音频（可反复、0.75× 慢速），键盘输入后逐词标对错并显示中文。',
        dictateBits, '开始逐句听写');

  el.querySelectorAll('[data-action]').forEach(function(b){
    b.addEventListener('click', function(){
      switch(b.dataset.action){
        case 'open-vocab': openVocabEngine(); break;
        case 'open-stage-listen': openStageEngine('listen'); break;
        case 'open-stage-dictate': openStageEngine('dictate'); break;
        case 'soon-vocab': toast('「'+ currentPg.title +'」篇章词汇词表正在生成'); break;
        case 'soon-follow': toast('「'+ currentPg.title +'」读写组件正在接入'); break;
      }
    });
  });
}

function openPassageAction(key, act){
  var found = findPassage(key); if(!found) return;
  currentUnit = found.u; currentPg = found.p;
  if(act==='vocab'){ openVocabEngine(); return; }
  if(act==='follow'){ openStageEngine('listen'); return; }
}
function el_query(sel){ return document.querySelector(sel); }

/* 引擎接入：独立词汇诊断页（按篇章 key 隔离存储） / 本页点读引擎跟读 */
function openVocabEngine(){
  var key = currentPg.key;
  if(!vocabLive(key)){ toast('「'+currentPg.title+'」词汇词表建设中'); return; }
  window.open('词汇诊断/词汇诊断_'+key+'.html','_blank');
}
function openStageEngine(stage){
  var pg = parseInt(String(currentPg.p).replace(/^p/,''), 10);
  var f = window.FOLLOW_FILES && FOLLOW_FILES[pg];
  if(!f || !f.page){ toast('「'+currentPg.title+'」读写页生成中，稍后开放'); return; }
  window.open('篇章页/' + f.page + '?flow=' + (stage||'listen'), '_blank');
}

/* ── 任务面板入口直接打开引擎 ── */
function launchTaskMaterial(unit, type, it){
  var name = getStudent();
  if(it.id==='theme'){
    report(name, unit, type, 'theme', 'start');
    openThemeVocabEngine(unit);
    toast('已开始：'+(type==='preview'?'预习':'复习')+' · 单元主题词汇');
    return;
  }
  var meta = findPassageMeta(it.passageKey);
  var pg = meta ? parseInt(String(meta.p).replace(/^p/,''), 10) : NaN;
  if(it.mode==='vocab'){
    if(!vocabLive(it.passageKey)){ toast('「'+ (meta?meta.title:it.passageKey) +'」词汇词表建设中'); return; }
    report(name, unit, type, it.passageKey, 'start');
    window.open('词汇诊断/词汇诊断_'+it.passageKey+'.html','_blank');
  } else if(it.mode==='follow'){
    var ff = (!isNaN(pg)) && window.FOLLOW_FILES && FOLLOW_FILES[pg];
    if(!ff || !ff.page){ toast('「'+ (meta?meta.title:it.passageKey) +'」读写页生成中'); return; }
    report(name, unit, type, it.passageKey, 'start');
    /* 预习任务开流程①逐句听，复习任务开流程②逐句听写 */
    var flow = (type==='preview') ? 'listen' : 'dictate';
    window.open('篇章页/' + ff.page + '?flow=' + flow, '_blank');
  }
}

/* ── 单元任务面板（教师工作台发放的预习/复习） ── */
function renderTaskZone(unitKey){
  var zone = $('taskzone');
  var A = loadJ(AKEY, {});
  var u = A[unitKey];
  var name = getStudent();
  function isDone(it, type){
    var id = it.id || (it.kind==='theme' ? 'theme' : it.passageKey);
    if(getReport(name, unitKey, type, id).doneAt) return true;
    if(it.kind==='theme'){ var t=themeProgress(unitKey); if(t.has && t.pct>=100) return true; }
    if(it.kind==='passage' && it.engines.indexOf('follow')!==-1){
      var sp = stageProg(pgOfKey(it.passageKey));
      if(type==='preview' && sp.listen) return true;
      if(type==='review' && sp.dictate) return true;
    }
    if(it.kind==='passage' && it.engines.indexOf('vocab')!==-1){ var v=vocabProgress(it.passageKey); if(v.has && v.pct>=100) return true; }
    return false;
  }
  var P=(u&&u.preview)||{}, R=(u&&u.review)||{};
  var pI=(P.items)||[], rI=(R.items)||[];
  if(!pI.length && !rI.length){
    /* 无任务时整块隐藏（2026-10-19 用户令：删除「本单元暂无任务」空态框） */
    zone.innerHTML = '';
    zone.style.display = 'none';
    return;
  }
  zone.style.display = '';
  var groups = [
    { type:'preview', items:pI, dl:P.deadline||'' },
    { type:'review', items:rI, dl:R.deadline||'' }
  ];
  var totItems=0, totDone=0;
  groups.forEach(function(g){ totItems+=g.items.length; totDone+=g.items.filter(function(it){return isDone(it,g.type);}).length; });
  var totPct = totItems ? Math.round(totDone/totItems*100) : 0;
  var allDone = totItems>0 && totDone>=totItems;
  var preDone = groups[0].items.length>0 && groups[0].items.every(function(it){return isDone(it,'preview');});
  var revDone = groups[1].items.length>0 && groups[1].items.every(function(it){return isDone(it,'review');});
  var today=new Date();
  var dateTxt=(today.getMonth()+1)+'月'+today.getDate()+'日 · '+['周日','周一','周二','周三','周四','周五','周六'][today.getDay()];
  var ringTxt = totPct>=100 ? '100%' : totPct+'%';

  function stage(g){
    if(!g.items.length) return '';
    var dlTs = g.dl ? new Date(g.dl.replace('T',' ')).getTime() : 0;
    var late = dlTs && nowTs()>dlTs;
    var done = g.items.filter(function(it){ return isDone(it,g.type); }).length;
    var pct = Math.round(done/g.items.length*100);
    var chip = g.dl
      ? (late ? '<span class="tz-chip late">'+ICON('calendar','sm')+' 已过 · '+esc(g.dl.replace('T',' '))+'</span>' : '<span class="tz-chip">'+ICON('calendar','sm')+' 截止 '+esc(g.dl.replace('T',' '))+'</span>')
      : '';
    var isPre = g.type==='preview';
    var rows='';
    g.items.forEach(function(it){
      var doneThis = isDone(it,g.type);
      var id = it.id || (it.kind==='theme' ? 'theme' : it.passageKey);
      var mark = '<button class="tz-mark'+(doneThis?' done':'')+'" data-u="'+unitKey+'" data-t="'+g.type+'" data-id="'+id+'" data-mark="1" title="标记完成">'+ICON('check','sm')+'</button>';
      if(it.kind==='theme'){
        var tw = (THEME[unitKey]||[]).length;
        var tv = themeProgress(unitKey);
        var tvx = (tv.has && tv.done) ? '<b> 已掌握 '+tv.done+'/'+tw+'</b>' : '';
        rows += '<div class="tz-row'+(doneThis?' done':'')+'" data-u="'+unitKey+'" data-t="'+g.type+'">'
          + '<span class="i-ic">'+ICON('folder')+'</span>'
          + '<span class="i-bd"><span class="i-tl">'+esc(THEME_TITLE[unitKey]||'单元主题词汇')+'<span class="m">主题</span></span><span class="i-st">'+tw+' 词 · 预习 → 复习 → 测试'+tvx+'</span></span>'
          + '<span class="i-cta">'+(doneThis?'已完成':'开始 '+ICON('play','sm'))+'</span>'
          + mark + '</div>';
        return;
      }
      var meta = findPassageMeta(it.passageKey);
      var title = meta ? (meta.kind+' · '+meta.title) : it.passageKey;
      var wants=[];
      if(it.engines.indexOf('vocab')!==-1)  wants.push({mode:'vocab',  ico:ICON('book','sm'), lab:'词汇 · 诊断学习'});
      if(it.engines.indexOf('follow')!==-1) wants.push({mode:'follow', ico:ICON('sound','sm'), lab:'跟读 · 听读写'});
      wants.forEach(function(w){
        var vp = w.mode==='vocab' ? vocabProgress(it.passageKey) : null;
        var fp = w.mode==='follow' ? followProg(pgOfKey(it.passageKey)) : null;
        var extra='';
        if(vp && vp.has) extra='<b> 词·已掌握 '+vp.done+'/'+vp.total+'</b>';
        if(fp && fp.follow) extra='<b> 跟读·已完成</b>';
        rows += '<div class="tz-row'+(doneThis?' done':'')+'" data-u="'+unitKey+'" data-t="'+g.type+'" data-id="'+id+'" data-mode="'+w.mode+'" data-kind="passage">'
          + '<span class="i-ic">'+w.ico+'</span>'
          + '<span class="i-bd"><span class="i-tl">'+esc(title)+'<span class="m">'+(w.mode==='vocab'?'词汇':'跟读')+'</span></span><span class="i-st">'+esc(w.lab)+extra+'</span></span>'
          + '<span class="i-cta">'+(doneThis?'已完成':'开始 '+ICON('play','sm'))+'</span>'
          + mark + '</div>';
      });
    });
    return '<div class="tz-stage '+(isPre?'tre':'trev')+'"'+(isPre?'':' id="tzReview"')+'>'
      + '<div class="tz-sh"><span class="ico-box">'+ICON(isPre?'book':'loop')+'</span>'
      + '<span class="tz-sh-t"><b>'+(isPre?('预习任务'+(preDone?' · 已完成':'')):'复习任务')+'</b><span>'+(isPre?'上课前 · 认识生词、初听原文':'课后 · 测试掌握、练熟跟读')+'</span></span>'
      + chip + '</div>'
      + '<div class="tz-bar"><i style="width:'+pct+'%"></i></div>'
      + '<div class="tz-rows">'+rows+'</div></div>';
  }

  /* 预习全部完成：有复习任务 → 全屏引导；无复习任务 → 轻提示条 */
  var bridge='', guideOn=false;
  if(preDone && !revDone){
    if(groups[1].items.length){
      var seen=false; try{ seen=!!sessionStorage.getItem('tf_guide_'+unitKey); }catch(e){}
      guideOn=!seen;
    } else {
      bridge='<div class="bridge"><span class="b-ic">'+ICON('star')+'</span><span class="b-t"><b>预习任务已完成！</b><span>本单元老师暂未布置复习任务，可以自由巩固下方材料。</span></span></div>';
    }
  }

  zone.innerHTML =
    '<div class="tz-hero"><div class="tz-hero-in">'
    + '<div class="tz-day"><div class="tz-kicker">TH!NK · 今日学习</div>'
    + '<div class="tz-title">'+(allDone?'全部完成 '+ICON('star','sm'):'预习 · 复习')+'</div>'
    + '<div class="tz-sub">'+esc(dateTxt)+' · 本单元布置的任务</div></div>'
    + '<div class="tz-ring"><svg width="86" height="86" viewBox="0 0 92 92">'
    + '<circle cx="46" cy="46" r="34" class="rp" stroke="rgba(255,255,255,.18)"/>'
    + '<circle cx="46" cy="46" r="34" class="rp" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="'+(213.6*(1-totPct/100)).toFixed(1)+'" transform="rotate(-90 46 46)"/>'
    + '<text x="46" y="51" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" stroke="none">'+ringTxt+'</text>'
    + '<text x="46" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,.85)" stroke="none">'+totDone+'/'+totItems+'</text>'
    + '</svg></div>'
    + '<div class="tz-msg">'+(allDone?'所有预习与复习任务都完成了，很棒！':'完成预习与复习任务，跟着提示一步步学，打开材料即自动记录。')+'</div>'
    + '</div></div>'
    + bridge
    + stage(groups[0])
    + stage(groups[1]);

  /* 全屏引导：挂在书架容器内（样式作用域与 z-index 都依赖 #shelfRoot） */
  if(guideOn && !$('tzGuide')){
    var gEl=document.createElement('div');
    gEl.className='guide'; gEl.id='tzGuide';
    gEl.innerHTML='<div class="guide-card"><div class="guide-in">'
      + '<div class="guide-badge">'+ICON('star')+'</div>'
      + '<div class="guide-kicker">PREVIEW COMPLETE · 预习通关</div>'
      + '<div class="guide-title">预习任务已完成！</div>'
      + '<div class="guide-sub">生词与初读都过关了。趁热打铁进入复习，测一测真正掌握了多少。</div>'
      + '<div class="guide-steps"><span class="guide-step ok">'+ICON('book','sm')+' 预习 '+ICON('check','sm')+'</span><span class="guide-arrow">'+ICON('right','sm')+'</span><span class="guide-step">'+ICON('loop','sm')+' 复习</span></div>'
      + '<div class="guide-btns"><button class="guide-go" id="tzGuideGo">进入复习任务 '+ICON('right','sm')+'</button><button class="guide-later" id="tzGuideLater">稍后再说</button></div>'
      + '</div></div>';
    shelfRoot.appendChild(gEl);
    requestAnimationFrame(function(){ gEl.classList.add('on'); });
    var onEsc=function(e){ if(e.key==='Escape') closeG(); };
    var closeG=function(){
      document.removeEventListener('keydown', onEsc);
      try{ sessionStorage.setItem('tf_guide_'+unitKey,'1'); }catch(e){}
      gEl.classList.remove('on');
      setTimeout(function(){ if(gEl.parentNode) gEl.parentNode.removeChild(gEl); }, 320);
    };
    var gGo=$('tzGuideGo'), gLater=$('tzGuideLater');
    if(gGo) gGo.addEventListener('click', function(){
      closeG();
      var rv=zone.querySelector('#tzReview');
      if(rv){ rv.scrollIntoView({behavior:'smooth', block:'center'}); rv.classList.add('jump'); setTimeout(function(){ rv.classList.remove('jump'); }, 3400); }
    });
    if(gLater) gLater.addEventListener('click', closeG);
    gEl.addEventListener('click', function(e){ if(e.target===gEl) closeG(); });
    document.addEventListener('keydown', onEsc);
  }

  zone.querySelectorAll('.tz-row[data-mode]').forEach(function(row){
    row.addEventListener('click', function(e){
      if(e.target.closest('.tz-mark')) return;
      launchTaskMaterial(row.dataset.u, row.dataset.t, { id:row.dataset.id, passageKey:row.dataset.id, mode:row.dataset.mode, kind:row.dataset.kind||'passage' });
    });
  });
  zone.querySelectorAll('.tz-row').forEach(function(row){
    if(row.dataset.mode) return;
    row.addEventListener('click', function(e){
      if(e.target.closest('.tz-mark')) return;
      launchTaskMaterial(unitKey, row.dataset.t, { id:'theme', passageKey:'theme', mode:'theme', kind:'theme' });
    });
  });
  zone.querySelectorAll('.tz-mark').forEach(function(m){
    m.addEventListener('click', function(e){
      e.stopPropagation();
      var name2 = getStudent(); if(!name2){ showNameGate(); return; }
      var rec = getReport(name2, m.dataset.u, m.dataset.t, m.dataset.id);
      if(rec.doneAt){ report(name2, m.dataset.u, m.dataset.t, m.dataset.id, 'undone'); toast('已取消完成标记'); }
      else { report(name2, m.dataset.u, m.dataset.t, m.dataset.id, 'done'); toast('已标记完成'); }
      renderTaskZone(m.dataset.u);
    });
  });
}

/* ═══════════ 身份 ═══════════ */
var whoBtn=$('whoBtn'), whoName=$('whoName'), nameGate=$('nameGate');
function refreshWho(){
  var n = getStudent();
  if(n){ whoName.textContent = n; whoBtn.classList.remove('req'); whoBtn.title='当前学生，点击切换'; }
  else { whoName.textContent = '填写姓名'; whoBtn.classList.add('req'); whoBtn.title='请先填写姓名'; }
}
function showNameGate(){
  nameGate.classList.remove('hide');
  $('gateHint').textContent = getStudent()
    ? '切换为另一位同学学习。输入新姓名后，进度将按新姓名记录。'
    : '请输入你的姓名，用于在本机记录预习 / 复习进度。';
  var inp = $('nameInput'); inp.value=''; $('nameErr').textContent='';
  setTimeout(function(){ inp.focus(); }, 60);
}
function hideNameGate(){ nameGate.classList.add('hide'); }
function setStudent(n){ try{ localStorage.setItem(STUKEY, n); }catch(e){} }
function confirmName(){
  var v = $('nameInput').value.trim();
  if(!v){ $('nameErr').textContent='请输入姓名'; return; }
  setStudent(v); hideNameGate(); refreshWho();
  toast(v+' 同学，开始学习吧');
}
whoBtn.addEventListener('click', function(){ showNameGate(); });
$('nameOk').addEventListener('click', confirmName);
$('nameInput').addEventListener('keydown', function(e){ if(e.key==='Enter') confirmName(); });

/* ═══════════ 返回 / 入口 ═══════════ */
$('unitBack').addEventListener('click', function(){ showView('home'); });
$('pgBack').addEventListener('click', function(){ if(currentUnit) openUnit(currentUnit); else showView('home'); });
$('welcomeBtn').addEventListener('click', function(){
  var s = loadState(); if(!s.welcome){ s.welcome=true; saveState(s); }
  toast('Welcome 入门单元正在筹备中');
});

/* 点读引擎顶栏「书架」按钮：随时回到书架首页 */
var mapBtn = $('mapBtn');
if(mapBtn) mapBtn.addEventListener('click', function(){ openShelf(); showView('home'); });

/* ═══════════ 启动 ═══════════ */
/* 词汇页在另一标签页学习完回来时，刷新单元页的进度显示与任务完成度 */
function refreshUnit(){
  if(!currentUnitKey || shelfRoot.classList.contains('off')) return;
  renderThemeVocab(currentUnitKey);
  renderTaskZone(currentUnitKey);
}
window.addEventListener('focus', refreshUnit);
window.addEventListener('storage', function(e){
  if(!e.key || /_records_v2$/.test(e.key) || /^tf_stage_/.test(e.key) || e.key==='tf_reports' || e.key==='tf_assignments') refreshUnit();
});
/* 教师任务：学生端无登录，直接匿名只读全局任务（全班共见的数据）；
   服务器不可达（如纯静态托管）时静默降级，任务区显示空态。 */
function applyAssignments(v){
  v = v || '';
  if(v === (localStorage.getItem(AKEY) || '')) return false;
  try{ localStorage.setItem(AKEY, v); }catch(e){}
  return true;
}
function pullAssignments(){
  return fetch('/api/assignments', { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(res){ if(res && res.ok && applyAssignments(res.value)) refreshUnit(); })
    .catch(function(){ return false; });
}

function boot(){
  refreshWho();
  renderShelf();
  pullAssignments();                                   /* 首次拉取全班任务 */
  setInterval(function(){ if(!document.hidden) pullAssignments(); }, 30000);
  /* ?pg= 深链已由页首路由 script 直跳跟读听写单文件 */
  var q = location.search || '';
  var um = q.match(/[?&]unit=(\d+)/);
  openShelf();
  showView('home');
  if(um){
    var u = UNITS.find(function(x){ return x.key===um[1]; });
    if(u && u.live){
      openUnit(um[1]);
    }
  }
  /* 未填姓名时引导填写，保证预习/复习进度可记录 */
  if(!getStudent()) setTimeout(showNameGate, 300);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
</body></html>
