var FUNCTION={}; [
  "a","an","the","this","that","these","those","some","any","every","each","no","another","other","others",
  "of","to","in","on","at","by","for","with","from","into","onto","about","over","under","across","before","after","without","between","through","around","along","above",
  "and","but","or","so","because","if","then","than","when","while","as","although","until","since","nor","yet",
  "i","you","he","she","it","we","they","me","him","her","us","them","my","your","his","its","our","their",
  "mine","yours","hers","ours","theirs","who","what","whose","whom","which","someone","everyone","nobody","anyone","anybody","everybody","somebody","nothing",
  "am","is","are","was","were","be","been","being","have","has","had","do","does","did","can","could","will","would","shall","should","may","might","must",
  "not","don't","doesn't","didn't","can't","couldn't","won't","wouldn't","isn't","aren't","wasn't","weren't","haven't","hasn't","hadn't","i'm","you're","we're","they're","he's","she's","it's","that's","what's","who's","there's","here's","i've","you've","we've","they've","i'll","you'll","he'll","she'll","we'll","they'll","let's","need","needs",
  "very","really","so","too","also","still","only","just","here","there","then","now","again","never","often","always","already","sometimes","once","twice","ever","even",
  "up","down","out","off","back","on","away"
].forEach(function(w){ FUNCTION[w]=1; });
var NUMB={}; ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety","hundred","thousand"].forEach(function(w){NUMB[w]=1;});
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function splitSent(s){
  var parts=[], re=/([A-Za-z']+|\d+)|([^A-Za-z'0-9]+)/g, m;
  while((m=re.exec(s))){ if(m[1]!==undefined) parts.push({w:m[1]}); else parts.push({p:m[2]}); }
  var out=[], i=0;
  while(i<parts.length){
    var it=parts[i];
    if(it.p!==undefined){
      if(/^(?:-+|\u2013+)$/.test(it.p) && !/\s/.test(it.p) && out.length && i+1<parts.length &&
         out[out.length-1].w!==undefined && parts[i+1].w!==undefined){
        out[out.length-1].w += "-" + parts[i+1].w; i+=2; continue;
      }
      out.push({p:it.p}); i++; continue;
    }
    out.push({w:it.w}); i++;
  }
  return out;
}
function dtBlankByDensity(lo){
  var d=DT.density;
  if(d==="easy") return BASE[lo]===1;        // 全员：基础高频词
  if(d==="mid")  return TOPIC[lo]===1;       // 中：主题核心词
  return TOPIC[lo]===1 || TRAP[lo]===1;      // 中强：主题 ∪ 拼写难点词
}
function dtBuild(s, pg){
  var toks=splitSent(s), words=[], wmap=[];
  toks.forEach(function(t,i){ if(t.w!==undefined){wmap[i]=words.length; words.push(t.w);} else wmap[i]=-1; });
  var n=words.length, used=new Array(n).fill(false), entT=new Array(n).fill(""), entS=new Array(n).fill(0);
  var cs=ENTITYMULTI[pg]||[];
  for(var k=0;k<cs.length;k++){
    var ts=cs[k][0], meta=cs[k][1], L=ts.length;
    for(var i=0;i+L<=n;i++){
      var ok=true;
      for(var u=0;u<L;u++){ if(used[i+u] || words[i+u].toLowerCase().replace(/'+$/,'')!==ts[u]){ok=false;break;} }
      if(ok){ for(var u=0;u<L;u++){ used[i+u]=true; entT[i+u]=meta.t; entS[i+u]=meta.s; } }
    }
  }
  var sing=ENTITY[pg]||{};
  for(var i=0;i<n;i++){ if(!used[i]){ var lo=words[i].toLowerCase().replace(/'+$/,''); if(sing[lo]){ used[i]=true; entT[i]=sing[lo].t; entS[i]=sing[lo].s; } } }
  var wds=[];
  for(var i=0;i<n;i++){
    var w=words[i], lo=w.toLowerCase();
    var kind;
    if(used[i]) kind = (DT.spell && entS[i]) ? "blankE" : "anchor";
    else if(/^\d/.test(lo) || NUMB[lo]) kind="hint";
    else if(FUNCTION[lo]) kind="hint";
    else kind = dtBlankByDensity(lo) ? "blank" : "hint";
    wds.push({w:w, full:lo, kind:kind, etype:entT[i], espell:entS[i], wi:i});
  }
  var cells=[], wi=-1;
  toks.forEach(function(t){
    if(t.w!==undefined){ wi++; cells.push({kind:"wd", o:wds[wi]}); }
    else cells.push({kind:"sep", s:t.p});
  });
  return {wds:wds, cells:cells};
}
function dtGroups(rec){
  var blanks=[];
  rec.wds.forEach(function(x){ if(x.kind==="blank"||x.kind==="blankE") blanks.push(x); });
  if(DT.density==="hard"){
    var gs=[]; for(var i=0;i<blanks.length;i+=2) gs.push(blanks.slice(i,i+2)); return gs.length?gs:[[]];
  }
  if(blanks.length<=6) return [blanks.slice()];
  var h=Math.ceil(blanks.length/2); return [blanks.slice(0,h), blanks.slice(h)];
}
function renderDictatePass(p){
  if(!(DT.list && DT.list.length)) return;
  DT.qi=Math.max(0, Math.min(DT.qi, DT.list.length-1));
  DT.pass=p;
  var i=DT.list[DT.qi]; state.idx=i;
  var P=PASS[p];
  DT.density=P.d; DT.spell=P.spell; DT.hint=P.hint; DT.rate=P.rate;
  dtRenderSentence(i);
  $("dt-pass").textContent="第 "+(p+1)+"/4 遍 · "+P.label;
  replayCurrentSentence();   // 每遍都播整句(按当前语速)
}
function nextDictatePass(){ if(DT.pass<3){ renderDictatePass(DT.pass+1); } }
function dtRenderSentence(i){
  var s=SEGS[i]; if(!s) return;
  var rec=dtBuild(s, state.pg);
  DT.rec=rec; DT.groups=dtGroups(rec); DT.g=0; DT.playEnd=null;
  audio.pause(); setPlayIc(false);
  var sheet=$("dt-sheet"); sheet.innerHTML="";
  var groupOf={}; rec.wds.forEach(function(x){ groupOf[x.wi]=-1; });
  DT.groups.forEach(function(g, gi){ g.forEach(function(b){ b.gi=gi; groupOf[b.wi]=gi; }); });
  var starts={}; DT.groups.forEach(function(g, gi){ for(var b of g){ if(!(b.wi in starts)) starts[b.wi]=gi; } });
  rec.cells.forEach(function(c){
    if(c.kind==="sep"){ var t=c.s.replace(/\s/g,""); if(t) sheet.appendChild(document.createTextNode(t)); return; }
    var o=c.o;
    var wrap=document.createElement("span");
    if(o.kind==="anchor"){ wrap.className="dt-w dt-anchor"; wrap.title="免写锚词 · 实体已给出"; wrap.textContent=o.w; sheet.appendChild(wrap); return; }
    if(o.kind==="hint"){ wrap.className="dt-w dt-hint"; wrap.textContent=o.w; sheet.appendChild(wrap); return; }
    if((o.wi in starts) && DT.groups.length>1 && starts[o.wi]>0){
      var sep=document.createElement("span"); sep.className="dt-gsep"; sep.textContent="\u23d0"; sheet.appendChild(sep);
    }
    if(DT.way==="paper"){
      var pp=document.createElement("span"); pp.className="dt-w dt-blank paper";
      var pf=(DT.hint && o.full.length>1) ? o.full[0] : "";
      var n=Math.max(o.full.length-pf.length,3);
      var pb = pf ? '<b class="fst">'+esc(pf)+'</b>' : "";
      pp.innerHTML = pb + '<span class="ul">'+new Array(n+1).join("_")+'</span>';
      pp.dataset.full=o.full; pp.dataset.wi=o.wi;
      sheet.appendChild(pp); return;
    }
    var bl=document.createElement("span"); bl.className="dt-w dt-blank";
    var first = (DT.hint && o.full.length>1) ? o.full[0] : "";
    o.fst=first; o.gi=starts[o.wi];
    var body = first ? '<b class="fst">'+esc(first)+'</b>' : "";
    var rest = o.full.slice(first.length);
    var il=Math.max(rest.length,3);
    body += '<input class="dt-in" size="'+il+'" maxlength="'+il+'" autocomplete="off" autocapitalize="off" spellcheck="false" value="">';
    bl.innerHTML=body;
    bl.dataset.full=o.full; bl.dataset.gi=o.gi; bl.dataset.wi=o.wi;
    sheet.appendChild(bl);
  });
  document.querySelectorAll("#dt-sheet .dt-blank").forEach(function(el){
    var gi=+el.dataset.gi;
    var inp=el.querySelector("input"); if(inp) inp.disabled = gi!==DT.g;
    el.classList.toggle("is-on", gi===DT.g);
  });
  DT.blankEls=[].slice.call(document.querySelectorAll("#dt-sheet .dt-blank"));
  DT.blankEls.forEach(bindBlank);
  $("dt-count").textContent="第 "+(DT.qi+1)+" / "+DT.list.length+" 句 · 遍 "+(DT.pass+1)+"/4 · 挖空 "+rec.wds.filter(function(x){return x.kind==="blank"||x.kind==="blankE";}).length+" 词 · 分 "+DT.groups.length+" 段";
  $("dt-zh").textContent=ZH[s]||""; $("dt-zh").classList.toggle("hide", !state.cn);
  $("dt-desc").textContent = DT.way==="paper"
    ? "稿纸听写：下划线处用你自己的纸笔听写，写完点下方「核对答案」对照。"
    : "绿色词＝已给出(免写锚词)；灰词＝提示词已给出；下划线＝本段要写的词，写完本段自动判分。";
  $("dt-diag").classList.remove("on"); $("dt-diag").innerHTML="";
  $("dt-score").textContent="";
  var inp0=DT.blankEls[0]&&DT.blankEls[0].querySelector("input");
  if(DT.way==="key"&&inp0&&!inp0.disabled) setTimeout(function(){ try{inp0.focus();}catch(e){} },80);
  // 本遍无填空：整句试听，直接给推进入口
  if(!DT.blankEls.length){
    $("dt-score").textContent="本句无填空词 · 完整试听";
    var nb = DT.pass<3
      ? '<button class="cta" onclick="nextDictatePass()">进入第 '+(DT.pass+2)+' 遍 · '+PASS[DT.pass+1].label+' →</button>'
      : '<button class="cta" onclick="dictNext()">下一句 →</button>';
    $("dt-diag").innerHTML='<div class="ddq-row" style="margin-bottom:12px">本句没有需要填空的词，先完整听一遍。</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+nb+'</div>';
    $("dt-diag").classList.add("on");
  } else if(DT.way==="paper"){
    $("dt-diag").innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" onclick="dtRelisten()">重听本句</button><button class="cta" onclick="dtCheckAnswer()">核对答案</button></div>';
    $("dt-diag").classList.add("on");
    $("dt-score").textContent="";
  }
}
function dtCheckAnswer(){
  document.querySelectorAll('#dt-sheet .dt-blank.paper').forEach(function(el){
    el.classList.add("revealed");
    var ul=el.querySelector(".ul"); if(ul) ul.outerHTML='<span class="ans">'+esc(el.dataset.full)+'</span>';
  });
  var nb = DT.pass<3
    ? '<button class="cta" onclick="nextDictatePass()">进入第 '+(DT.pass+2)+' 遍 · '+PASS[DT.pass+1].label+' →</button>'
    : '<button class="cta" onclick="dictNext()">下一句 →</button>';
  $("dt-diag").innerHTML='<div class="ddq-row" style="margin-bottom:12px">已展示答案，对照你纸上的写法查漏补缺。</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" onclick="dtRelisten()">重听本句</button>'+nb+'</div>';
  DT.g=1; toast("已核对答案");
}
function bindBlank(el){
  var inp=el.querySelector("input"); if(!inp) return;
  var full=el.dataset.full, gi=+el.dataset.gi, wi=+el.dataset.wi;
  var fst=(el.querySelector(".fst")||{}).textContent||"";
  var rest=full.length-fst.length;
  inp.addEventListener("input", function(){
    if(inp.value.length<rest) return;
    var grp=DT.groups[gi];
    var idx=grp.findIndex(function(b){return b.wi===wi;});
    if(idx<grp.length-1){ focusBlank(grp[idx+1]); }
    else dtSubmitGroup(gi);
  });
  inp.addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); dtSubmitGroup(gi); }
    else if(e.key==="Tab"){ e.preventDefault(); nxtToBlank(el,1,gi); }
  });
}
function focusBlank(b){
  var inp=document.querySelector('#dt-sheet [data-wi="'+b.wi+'"] input');
  if(inp&&!inp.disabled){ try{inp.focus();}catch(e){} }
}
function nxtToBlank(el,dir,gi){
  var grp=DT.groups[gi], i=grp.findIndex(function(b){return b.wi===+el.dataset.wi;});
  if(i<0) return;
  var j=i+dir;
  if(j>=0 && j<grp.length) focusBlank(grp[j]);
}
function dtSubmitGroup(gi){
  if(gi!==DT.g) return;
  var grp=DT.groups[gi], judge=(DT.pass>=3);   // 仅第4遍末判分
  grp.forEach(function(b){
    var el=document.querySelector('#dt-sheet [data-wi="'+b.wi+'"]'); if(!el) return;
    var inp=el.querySelector("input"); if(!inp) return;
    var fst=(el.querySelector(".fst")||{}).textContent||"";
    var typed=(fst+inp.value).trim().toLowerCase();
    if(!judge){ b.typed=typed; return; }        // 前3遍只记不判
    var ok=typed===b.full;
    var html= ok ? '<b class="dt-r-ok">'+esc(b.full)+'</b>'
                 : '<b class="dt-r-bad">'+esc(b.full)+'</b><span class="dt-r-tip">你写: '+esc(typed||"—")+'</span>';
    el.innerHTML=html;
    b.ok=ok; b.typed=typed;
  });
  DT.g++;
  if(DT.g>=DT.groups.length){
    if(judge){ dtFinish(); return; }
    nextDictatePass(); return;                  // 慢速试写两遍不计分 → 自动进下一遍
  }
  DT.groups[DT.g].forEach(function(b){
    var el=document.querySelector('#dt-sheet [data-wi="'+b.wi+'"]');
    var inp=el&&el.querySelector("input"); if(inp){ inp.disabled=false; }
  });
  focusBlank(DT.groups[DT.g][0]);
  audio.pause(); setPlayIc(false);
}
function dtFinish(){                            // 仅第4遍(末遍)调用
  var tot=0,cor=0,wrong=[];
  DT.groups.forEach(function(g){ g.forEach(function(b){ tot++; if(b.ok)cor++; else wrong.push(b); }); });
  var first=wrong.length===0;
  $("dt-score").textContent=cor+"/"+tot+" 词正确"+(first?"　太棒了！":"");
  var diag=$("dt-diag");
  var h='<div class="ddq-row"><span class="lbl">末尾校验结果：</span><b>'+cor+'</b> / '+tot+' 词正确</div>';
  if(wrong.length){
    h+='<div class="ddq-row" style="margin-top:6px"><span class="lbl">看看正确的拼写：</span></div>';
    wrong.forEach(function(b){ h+='<div class="ddq-row"><span class="em1">'+esc(b.full)+'</span>　你写：'+esc(b.typed||"—")+'</div>'; });
  } else {
    h+='<div class="ddq-row">末遍全对，真棒！</div>';
  }
  h+='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="chip" onclick="dtRelisten()">重听本句</button><button class="cta" onclick="dictNext()">下一句 →</button></div>';
  diag.innerHTML=h; diag.classList.add("on");
  audio.pause(); setPlayIc(false);
  toast(first?"末遍全对，继续加油！":"末遍听写完成，看看需要巩固的词吧");
}

 cu:{n:"文化",c:"#8a5cd8",ic:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 21v-5h6v5"/><line x1="8" y1="7" x2="16" y2="7"/></svg>'},
 dv:{n:"纪录片",c:"#1f9d9b",ic:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="14" height="14" rx="2"/></svg>'},
 pd:{n:"播客",c:"#d8567a",ic:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="5.5" y2="12"/><line x1="7.5" y1="8" x2="7.5" y2="16"/><line x1="10.5" y1="5" x2="10.5" y2="19"/><line x1="13.5" y1="8" x2="13.5" y2="16"/><line x1="16.5" y1="4" x2="16.5" y2="20"/><line x1="19" y1="9" x2="19" y2="15"/><line x1="21" y1="11.5" x2="21" y2="12.5"/></svg>'}
};
/* 单元目录配置：按单元分组，组内按页码数字升序；新增篇章只需在此追加 [pg, 类型key, 题名] */
var UNIT_GROUPS={
 7:{label:"Unit 7", items:[[66,"dv","LIVING FOR SPORT"],[67,"rt","SPORT WONDERS!"],[69,"ls","Dialogue: Planning a Bike Ride"],[70,"rt","An Amazing Last Four Minutes"],[72,"sp","Rainy Day: Nina & Dave"],[73,"pd","Stay Positive"]]},
 12:{label:"Unit 12", items:[[110,"dv","Moving About"],[111,"rt","The Great Race"],[113,"ls","At the Train Station"],[114,"rt","My Favourite Journey"],[117,"cu","Transport Around the World"],[202,"cu","Ways to Get Around"]]}
};
function unitOf(pg){ return (pg===110||pg===111||pg===113||pg===114||pg===117||pg===202)?12:7; }
function meta(pg){
  var items=UNIT_GROUPS[unitOf(pg)].items;
  for(var i=0;i<items.length;i++)
    if(items[i][0]===pg)return {pg:pg,ty:items[i][1],tt:items[i][2]};
  return null;
}
function paint(){
  var cur=meta(state.pg)||meta(67); if(!cur)return;
  var ty=TYPES[cur.ty];
  var tty=ID("curTty"); tty.textContent=ty.n; tty.style.background=ty.c+"1a"; tty.style.color=ty.c;
  ID("curTitle").textContent=cur.tt;
  ID("curTab").title="当前："+cur.tt;
}
function build(){
  var g=UNIT_GROUPS[unitOf(state.pg)];
  var body=ID("dirGroups"); body.innerHTML="";
  ID("dirUnit").textContent=g.label;
  var lab=document.createElement("div"); lab.className="grp-label"; lab.textContent=g.label; body.appendChild(lab);
  if(!g.items.length){ var e=document.createElement("div"); e.className="grp-empty"; e.textContent="（本单元暂无）"; body.appendChild(e); }
  g.items.forEach(function(it){
    var ty=TYPES[it[1]];
    var b=document.createElement("button"); b.type="button"; b.className="grp-item"; b.dataset.pg=String(it[0]);
    b.innerHTML='<span class="gi-ic" style="background:'+ty.c+'1a;color:'+ty.c+'">'+ty.ic+'</span>'
      +'<span class="gi-t"><span class="gi-pg">'+("000"+it[0]).slice(-3)+'</span>'
      +'<span class="gi-tt">'+ty.n+' · '+it[2]+'</span></span>';
    b.addEventListener("click",function(){ switchDir(+this.dataset.pg); });
    body.appendChild(b);
  });
}
function markOn(){
  var items=ID("dirGroups").querySelectorAll(".grp-item");
  for(var i=0;i<items.length;i++){
    var on=items[i].dataset.pg===String(state.pg);
    items[i].classList.toggle("on",on);
    if(on)items[i].scrollIntoView({block:"nearest"});
  }
}
function openDir(){ build(); ID("dir").classList.add("on"); markOn(); }
function closeDir(){ ID("dir").classList.remove("on"); }
function switchDir(pg){
  if(String(pg)===String(state.pg)){ closeDir(); return; }
  cancelGap(); render(pg); paint(); closeDir();
}
document.addEventListener("DOMContentLoaded",function(){
  build(); paint();
  ID("openDir").addEventListener("click",function(e){ e.stopPropagation(); openDir(); });
  ID("curTab").addEventListener("click",openDir);
  ID("curTab").addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();openDir();} });
  ID("dirClose").addEventListener("click",closeDir);
  ID("dir").addEventListener("click",function(e){ if(e.target.id==="dir")closeDir(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape")closeDir(); });
  /* 暴露给单元地图脚本复用（篇章切换 + 头部类型标注） */
  window.switchDir=switchDir; window.paint=paint; window.meta=meta; window.TYPES=TYPES;
  window.currentUnit=function(){ return unitOf(state.pg); };
});
})();
</script>

<script>
/* ============ 学习之旅：Apple OS 分组列表首页（单元 → 词汇 + 篇章） ============ */
(function(){
var $=id=>document.getElementById(id);
/* 已收录内容的单元；ph:1 为骨架占位（内容待制作），点击仅提示 */
var MAP_BOOKS={
 1:{lab:"Unit 1",ph:1,pages:[[1001,"dv","开启本单元"],[1002,"rt","Reading A"],[1003,"rt","Reading B"],[1004,"ls","精听练习"],[1005,"sp","开口练一练"],[1006,"pd","视频逐句"]]},
 3:{lab:"Unit 3",ph:1,pages:[[3001,"dv","开启本单元"],[3002,"rt","Reading A"],[3003,"rt","Reading B"],[3004,"ls","精听练习"],[3005,"sp","开口练一练"],[3006,"pd","视频逐句"]]},
 5:{lab:"Unit 5",ph:1,pages:[[5001,"dv","开启本单元"],[5002,"rt","Reading A"],[5003,"rt","Reading B"],[5004,"ls","精听练习"],[5005,"sp","开口练一练"],[5006,"pd","视频逐句"]]},
 7:{lab:"Unit 7",pages:[[66,"dv","LIVING FOR SPORT"],[67,"rt","SPORT WONDERS!"],[69,"ls","Planning a Bike Ride"],[70,"rt","An Amazing Last Four Minutes"],[72,"sp","Rainy Day: Nina & Dave"],[73,"pd","Stay Positive"]]},
 9:{lab:"Unit 9",ph:1,pages:[[9001,"dv","开启本单元"],[9002,"rt","Reading A"],[9003,"rt","Reading B"],[9004,"ls","精听练习"],[9005,"sp","开口练一练"],[9006,"pd","视频逐句"]]},
 11:{lab:"Unit 11",ph:1,pages:[[11001,"dv","开启本单元"],[11002,"rt","Reading A"],[11003,"rt","Reading B"],[11004,"ls","精听练习"],[11005,"sp","开口练一练"],[11006,"pd","视频逐句"]]},
 12:{lab:"Unit 12",pages:[[110,"dv","Documentary: Moving About"],[111,"rt","The Great Race"],[113,"ls","At the Train Station"],[114,"rt","My Favourite Journey"],[117,"cu","Transport Around the World"],[202,"cu","Ways to Get Around"]]}
};
var TOTAL=12, CHIP_N=14;
var _words={}, _expand={};

function isReady(u){ var b=MAP_BOOKS[u]; return !!b && !b.ph; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* 归集单元词汇：从各篇课文文本归集纯词，按 难点/主题 → PET/超纲 分层排序 */
function unitWords(u){
  if(_words[u]) return _words[u];
  var mb=MAP_BOOKS[u], seen={}, list=[];
  if(mb) mb.pages.forEach(function(p){
    var pg=p[0]; if(pg>=1000) return;
    var B=BOOK[pg]; if(!B||!B.arts) return;
    B.arts.forEach(function(ar){ ar.forEach(function(s){
      String(s).toLowerCase().split(/[^a-z']+/).forEach(function(w){
        w=w.replace(/^'+|'+$/g,""); if(!w||w.length<2) return;
        if(seen[w]) return; seen[w]=1;
        var lv=DB.LEVEL[w]||"", r;
        if(DB.TRAP[w]) r=0; else if(DB.TOPIC[w]) r=1;
        else if(lv==="P"||lv==="X") r=2; else if(!lv) r=3; else r=4;
        list.push({w:w,lc:w,pg:pg,st:0,en:0,r:r});
      });
    });});
  });
  list.sort(function(a,b){ return a.r-b.r || a.lc.localeCompare(b.lc); });
  return (_words[u]={list:list});
}
function renderProg(){
  var ok=0, pages=0, u;
  for(u=1;u<=TOTAL;u++) if(isReady(u)){ ok++; pages+=MAP_BOOKS[u].pages.length; }
  var pct=Math.round(ok*100/TOTAL);
  $("homeProg").innerHTML=
    '<div class="hp-top"><span class="hp-k">单元进度</span><span class="hp-v">'+ok+' <em>/ '+TOTAL+'</em></span></div>'
   +'<div class="hp-bar"><i style="width:'+pct+'%"></i></div>'
   +'<div class="hp-note">已收录 '+pages+' 篇课文 · 词汇随单元自动归集</div>';
  $("homeSub").textContent=TOTAL+' 个单元 · 已收录 '+ok+' 个';
}

function unitCard(u, cu){
  var mb=MAP_BOOKS[u], ok=isReady(u), ph=!!(mb&&mb.ph), d=document.createElement("section");
  d.className="u-card"+(ok?"":" u-locked")+(u===cu&&ok?" u-current":"");
  var head='<div class="u-hd"><span class="u-badge">'+u+'</span><span class="u-name">Unit '+u+'</span>'
    +(u===cu&&ok?'<span class="u-pill u-pill-cur">当前</span>':'')
    +(ok?'<span class="u-pill u-pill-ok">已收录</span>':(ph?'<span class="u-pill">制作中</span>':'<span class="u-pill">待解锁</span>'))
    +'</div>';
  if(!ok){
    d.innerHTML=head+'<div class="u-empty">'+(ph?"内容制作中，敬请期待":"完成前面的单元后解锁")+'</div>';
    return d;
  }
  var uw=unitWords(u), show=_expand[u]||CHIP_N;
  var chips=uw.list.slice(0,show).map(function(x){
    return '<button type="button" class="w-chip" data-pg="'+x.pg+'" title="跳到该篇阅读">'+esc(x.w)+'</button>';
  }).join("");
  if(!chips) chips='<span class="u-empty" style="padding-left:0">本篇暂无词汇数据</span>';
  var more=uw.list.length>show
    ? '<button type="button" class="w-more" data-u="'+u+'">展开其余 '+(uw.list.length-show)+' 词</button>' : "";
  var rows=mb.pages.map(function(p){
    var t=TYPES[p[1]]||TYPES.rt, pg=p[0], pp=pg>=1000;
    return '<button type="button" class="p-row" data-pg="'+pg+'"'+(pp?' disabled aria-disabled="true"':"")+'>'
      +'<span class="p-ic" style="background:'+t.c+'1a;color:'+t.c+'">'+t.ic+'</span>'
      +'<span class="p-tx"><span class="p-tt">'+esc(p[2])+'</span><span class="p-meta">'+t.n+' · '+("000"+pg).slice(-3)+'</span></span>'
      +(pp?'<span class="p-badge">制作中</span>':'<span class="p-go">›</span>')+'</button>';
  }).join("");
  d.innerHTML=head
    +'<div class="u-sec"><span class="u-sec-t">词汇</span><span class="u-sec-n">'+uw.list.length+' 词</span></div>'
    +'<div class="w-chips">'+chips+more+'</div>'
    +'<div class="u-sec"><span class="u-sec-t">篇章</span><span class="u-sec-n">'+mb.pages.length+' 篇</span></div>'
    +'<div class="p-list">'+rows+'</div>';
  return d;
}

/* 未解锁单元折叠成一行紧凑 chip，避免首屏被空卡占满 */
function todoCard(list){
  var d=document.createElement("section");
  d.className="u-card u-locked u-todo";
  d.innerHTML='<div class="u-hd"><span class="u-name">其他单元</span><span class="u-pill">制作中 / 待解锁</span></div>'
    +'<div class="w-chips" style="margin-top:11px">'
    +list.map(function(u){
      var ph=!!(MAP_BOOKS[u]&&MAP_BOOKS[u].ph);
      return '<button type="button" class="w-chip w-chip-off" disabled aria-disabled="true">Unit '+u+'<em>'+(ph?"制作中":"待解锁")+'</em></button>';
    }).join("")
    +'</div>';
  return d;
}
function renderHome(){
  var cu=window.currentUnit?window.currentUnit():7, u, ready=[], todo=[];
  for(u=1;u<=TOTAL;u++) (isReady(u)?ready:todo).push(u);
  var host=$("homeUnits"), frag=document.createDocumentFragment();
  ready.forEach(function(x){ frag.appendChild(unitCard(x,cu)); });
  if(todo.length) frag.appendChild(todoCard(todo));
  host.innerHTML=""; host.appendChild(frag);
  renderProg();
}

function onHomeClick(e){
  var w=e.target.closest(".w-chip");
  if(w){ onPick(+w.dataset.pg); return; }
  var m=e.target.closest(".w-more");
  if(m){ _expand[+m.dataset.u]=1e9; renderHome(); return; }
  var p=e.target.closest(".p-row");
  if(p && !p.disabled){ onPick(+p.dataset.pg); }
}
function onPick(pg){
  if(pg>=1000){ toast("这个单元的内容还在制作中，先学已收录的课文吧！"); return; }
  closeHome(); switchDir(pg);
}
function openHome(){ $("map").classList.add("on"); $("map").setAttribute("aria-hidden","false"); renderHome(); }
function closeHome(){ $("map").classList.remove("on"); $("map").setAttribute("aria-hidden","true");
  var mb=$("mapBtn"); if(mb) try{ mb.focus({preventScroll:true}); }catch(e){} }
window.openHome=openHome; window.closeHome=closeHome;

function boot(){
  openHome();                                   /* 首页默认学习之旅 */
  $("mapBtn").addEventListener("click",function(){ cancelGap(); openHome(); });
  $("mapClose").addEventListener("click",closeHome);
  $("homeUnits").addEventListener("click",onHomeClick);
  $("map").addEventListener("click",function(e){ if(e.target===$("map")) closeHome(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&$("map").classList.contains("on")) closeHome(); });
  /* 篇章跟读深链：学生端以 index.html?pg=111 直达某篇 */
  var m=(location.search||"").match(/[?&]pg=(\d+)/);
  var qp=m?+m[1]:0;
  if(qp && BOOK[qp]){ closeHome(); render(qp); paint(); }
}
document.addEventListener("DOMContentLoaded",boot);
})();
</script>
