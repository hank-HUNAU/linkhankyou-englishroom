<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TH!NK · 前往学生书架</title>
<link rel="stylesheet" href="ui.css">
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#eef1f8;
       font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#1e1b4b}
  .box{text-align:center;padding:34px 30px;background:#fff;border:1px solid rgba(0,0,0,.08);
       border-radius:var(--r-xl);box-shadow:0 30px 60px -28px rgba(124,58,237,.45)}
  .box b{display:block;font-size:19px;font-weight:900;margin-bottom:8px}
  .box p{margin:0 0 4px;font-size:13px;font-weight:600;color:#64748b;line-height:1.8}
  .box a{color:#7C3AED;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <b>书架已并入 index.html</b>
  <p>单元页（词汇卡 + 篇章 + 任务区）现在是学生首页。</p>
  <p>正在跳转… 若未自动跳转，请点 <a id="go" href="index.html">进入书架</a></p>
</div>
<script>
/* 兼容旧链接：学生端.html[?unit=N] → index.html[?unit=N] */
(function(){
  var q = location.search || '';
  var m = q.match(/[?&]unit=(\d+)/);
  location.replace('index.html' + (m ? '?unit=' + m[1] : ''));
})();
</script>
</body></html>
