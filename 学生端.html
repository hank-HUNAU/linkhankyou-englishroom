<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TH!NK Foundation · 学习端</title>
<meta name="description" content="TH!NK Foundation Second Edition 学习端：书架 → 单元 → 篇章 词汇与跟读学习。">
<meta name="theme-color" content="#eef1f8">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237C3AED'/><text x='50' y='70' font-size='58' font-family='Inter,sans-serif' font-weight='900' fill='white' text-anchor='middle'>0</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<script src="ui.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  /* 设计令牌（颜色/圆角/阴影/字体/噪点）统一由 ui.css 提供，此处不再重复定义 */

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg span { position: absolute; border-radius: 50%; filter: blur(80px); }
  .bg .b1 { width: 520px; height: 520px; left: 2%;  top: 4%;    background: #7C3AED; opacity: .42; }
  .bg .b2 { width: 460px; height: 460px; right: 6%; top: 6%;    background: #EC4899; opacity: .38; }
  .bg .b3 { width: 540px; height: 540px; left: 12%; bottom: 4%; background: #06B6D4; opacity: .34; }
  .bg .b4 { width: 480px; height: 480px; right: 10%; bottom: 6%; background: #F97316; opacity: .32; }
  .bg .b5 { width: 380px; height: 380px; left: 44%; top: 38%;   background: #FACC15; opacity: .24; }

  body::after {
    content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: .018;
    background-image: var(--noise);
  }

  .wrap { position: relative; z-index: 1; max-width: 1300px; width: 100%; margin: 0 auto; padding: 0 28px; }

  /* ── 顶栏 ── */
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 26px 0 18px; flex-wrap: wrap; }
  .logo { display: inline-flex; align-items: baseline; gap: 14px; flex: none; flex-wrap: wrap; }
  .think { display: inline-block; font-weight: 900; font-size: 40px; letter-spacing: -.055em; line-height: 1;
    background: var(--noise), linear-gradient(135deg,#1e1b4b 0%,#312e81 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(124,58,237,.45)); }
  .bang { display: inline-block; position: relative; width: .22em; height: .78em; margin: 0 .045em; vertical-align: -.04em; }
  .bang::before, .bang::after { content:""; position:absolute; left:0; width:100%; background:linear-gradient(180deg,#A78BFA,#EC4899); }
  .bang::before { top:0; height:.60em; } .bang::after { bottom:0; height:.15em; }
  .foundation { display: inline-block; font-weight: 800; font-size: 40px; letter-spacing: -.035em; line-height: 1;
    background: var(--noise), linear-gradient(135deg,#312e81 0%,#4c1d95 60%,#0e7490 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 12px rgba(76,29,149,.4)); padding-bottom: 3px; }
  .edition { font-size: 9px; font-weight: 700; letter-spacing: .16em; color: rgba(30,27,75,.5); padding-bottom: 8px; white-space: nowrap; }

  .nav-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .chip { appearance:none; border:none; cursor:pointer; font-family:inherit; padding:9px 16px; border-radius:var(--r-pill);
    border:1.5px solid rgba(124,58,237,.28); background:linear-gradient(135deg,rgba(124,58,237,.10),rgba(236,72,153,.08));
    color:#4c1d95; font-size:13.5px; font-weight:800; transition:all .25s; }
  .chip:hover { transform:translateY(-1px); box-shadow:0 8px 18px -8px rgba(124,58,237,.5); border-color:rgba(124,58,237,.45); }

  /* ── 书架 ── */
  .shelf { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); column-gap:14px; row-gap:26px; padding:8px 0 48px; }
  .book { --h:200; position:relative; display:flex; flex-direction:column; border-radius:var(--r-lg); overflow:hidden; isolation:isolate;
    cursor:pointer; appearance:none; -webkit-appearance:none; margin:0; padding:0; width:100%; font:inherit; text-align:inherit;
    background:none; border:1px solid rgba(0,0,0,.06);
    background:linear-gradient(170deg,rgba(255,255,255,.96),rgba(255,255,255,.74) 55%,rgba(255,255,255,.92));
    box-shadow:var(--sh-card);
    transition:transform .35s cubic-bezier(.19,1,.22,1),opacity .28s ease,border-color .28s ease,box-shadow .35s;
    min-height:180px; }
  .cover { position:relative; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:16px 14px; overflow:hidden; text-align:center;
    background:radial-gradient(62% 52% at 28% 26%,hsl(var(--h) 92% 60%/.38) 0%,transparent 72%),
              radial-gradient(52% 48% at 76% 70%,hsl(var(--h) 88% 58%/.26) 0%,transparent 72%),
              linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.1)); }
  .num { position:relative; z-index:1; font-weight:900; line-height:1; letter-spacing:-.06em;
    background:linear-gradient(180deg,hsl(var(--h) 84% 36%),hsl(var(--h) 90% 54%));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 16px hsl(var(--h) 90% 60%/.38)); font-size:clamp(38px,3.4vw,50px); }
  .cover h3 { position:relative; z-index:1; width:100%; margin:6px 0 0; font-size:clamp(12px,1.05vw,14px); font-weight:700;
    line-height:1.25; color:rgba(0,0,0,.78); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag { position:absolute; top:10px; left:10px; z-index:2; font-size:10.5px; font-weight:800; letter-spacing:.03em;
    padding:3px 8px; border-radius:var(--r-pill); background:rgba(15,23,42,.06); color:rgba(15,23,42,.55); }
  .book.live .tag { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; }
  .done-mark { position:absolute; top:12px; right:12px; z-index:3; width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.55);
    border:1.5px solid rgba(15,23,42,.1); color:transparent; font-size:12px; font-weight:900;
    transition:all .4s cubic-bezier(.34,1.56,.64,1); }
  .book.live .done-mark { background:linear-gradient(135deg,#22c55e,#16a34a); border-color:#16a34a; color:#fff;
    box-shadow:0 4px 14px -3px rgba(34,197,94,.7); }
  @media (hover:hover) and (pointer:fine) { .book:hover { transform:translateY(-5px); border-color:hsl(var(--h) 88% 55%/.42); box-shadow:0 30px 56px -22px rgba(31,41,55,.34); } }
  @media (max-width:1100px){ .shelf{grid-template-columns:repeat(4,minmax(0,1fr));} }
  @media (max-width:720px){ .shelf{grid-template-columns:repeat(3,minmax(0,1fr));} .wrap{padding:0 18px;} }
  @media (max-width:520px){ .shelf{grid-template-columns:repeat(2,minmax(0,1fr));} }

  /* ── 单元页 ── */
  .crumb { display:inline-flex; align-items:center; gap:8px; padding:12px 0 4px; font-size:13px; font-weight:700; color:#64748b; }
  .crumb button { appearance:none; border:none; background:none; cursor:pointer; color:#7C3AED; font-weight:800; font-family:inherit; font-size:13px; padding:4px 8px; border-radius:var(--r-xs); }
  .crumb button:hover { background:rgba(124,58,237,.08); }
  .unit-head { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; padding:6px 0 18px; }
  .unit-title { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .unit-num { font-weight:900; font-size:30px; line-height:1; letter-spacing:-.04em; background:linear-gradient(135deg,#312e81,#7C3AED); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .unit-name { font-weight:900; font-size:clamp(22px,3vw,30px); letter-spacing:-.02em; color:#1d1d1f; }
  .unit-sub { font-size:13px; font-weight:700; color:#64748b; }

  .sec { margin:20px 0 8px; display:flex; align-items:center; gap:10px; }
  .sec-h { font-size:16px; font-weight:900; letter-spacing:-.01em; color:#1e1b4b; }
  .sec-n { font-size:10.5px; font-weight:800; letter-spacing:.03em; color:#7C3AED; background:rgba(124,58,237,.1); padding:3px 8px; border-radius:var(--r-pill); }

  /* 主题词卡 */
  .vw-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  @media(max-width:1100px){ .vw-grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media(max-width:720px){ .vw-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .vw { background:linear-gradient(170deg,rgba(255,255,255,.96),rgba(255,255,255,.78)); border:1px solid rgba(0,0,0,.06);
    border-radius:var(--r-md); padding:14px 15px; cursor:pointer; transition:transform .25s cubic-bezier(.19,1,.22,1),box-shadow .25s,background .25s;
    box-shadow:var(--sh-card); }
  .vw:hover { transform:translateY(-3px); box-shadow:var(--sh-card-hover); }
  .vw .top { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .vw .w { font-weight:900; font-size:18px; letter-spacing:-.02em; color:#1e1b4b; line-height:1.15; }
  .vw .ipa { font-size:12.5px; color:#7c3aed; font-weight:700; }
  .vw .pos { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:#94a3b8; }
  .vw .def { margin-top:7px; font-size:13px; line-height:1.5; color:#475569; font-weight:600; }
  .vw .ex { margin-top:5px; font-size:12px; line-height:1.45; color:#94a3b8; font-style:italic; }
  .vw .hidden-def { margin-top:7px; font-size:13px; color:#7c3aed; font-weight:700; display:none; }
  .vw.show .hidden-def { display:block; }
  .vw.show .def { color:transparent; user-select:none; }

  /* 篇章卡 */
  .pg-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; padding-bottom:48px; }
  @media(max-width:900px){ .pg-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media(max-width:560px){ .pg-grid{grid-template-columns:1fr;} }
  .pg { background:linear-gradient(170deg,rgba(255,255,255,.96),rgba(255,255,255,.8)); border:1px solid rgba(0,0,0,.06);
    border-radius:var(--r-lg); padding:16px 16px 14px; cursor:pointer; transition:all .28s cubic-bezier(.19,1,.22,1);
    box-shadow:var(--sh-card); }
  .pg:hover { transform:translateY(-3px); border-color:rgba(124,58,237,.4); box-shadow:var(--sh-card-hover); }
  .pg .kind { display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.03em; padding:3px 8px; border-radius:var(--r-pill);
    background:rgba(124,58,237,.1); color:#7C3AED; }
  .pg .pt { margin-top:10px; font-weight:900; font-size:16.5px; letter-spacing:-.01em; color:#1e1b4b; line-height:1.3; }
  .pg .pps { margin-top:3px; font-size:11.5px; font-weight:700; color:#94a3b8; }
  .pg .acts { margin-top:13px; display:flex; flex-direction:column; gap:7px; }
  .pg .act { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 11px; border-radius:var(--r-sm);
    font-size:12.5px; font-weight:800; color:#4338ca; background:rgba(124,58,237,.07); border:1px solid transparent; transition:all .2s; }
  .pg .act:hover { background:rgba(124,58,237,.14); }
  .pg .act .a-name { display:flex; align-items:center; gap:7px; }
  .pg .act .a-more { color:#7c3aed; font-weight:900; }
  .pg .act.wip { color:#94a3b8; background:rgba(15,23,42,.04); }
  .pg .act.wip .a-more { color:#cbd5e1; }

  /* 锁定样式 */
  .pg.pending { opacity:.72; }
  .lock-note { font-size:11px; font-weight:700; color:#94a3b8; margin-top:10px; }

  /* ── 篇章页 ── */
  .pg-page-head { padding:8px 0 14px; }
  .pg-page-title { font-weight:900; font-size:26px; letter-spacing:-.02em; color:#1e1b4b; line-height:1.25; }
  .pg-page-sub { font-size:13px; font-weight:700; color:#7C3AED; margin-top:4px; }
  .flow { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; padding:8px 0 60px; }
  @media(max-width:720px){ .flow{grid-template-columns:1fr;} }
  .flow-card { background:linear-gradient(170deg,rgba(255,255,255,.97),rgba(255,255,255,.84)); border:1px solid rgba(0,0,0,.06);
    border-radius:var(--r-lg); padding:20px; box-shadow:var(--sh-card); }
  .flow-card .fc-ico { font-size:26px; }
  .flow-card h4 { margin:8px 0 4px; font-size:17px; font-weight:900; color:#1e1b4b; }
  .flow-card .fc-desc { font-size:12.5px; line-height:1.6; color:#64748b; font-weight:600; margin-bottom:14px; }
  .flow-card .steps { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .flow-card .step { display:flex; gap:10px; align-items:flex-start; font-size:13px; font-weight:700; color:#334155; line-height:1.5; }
  .flow-card .step .s-num { flex:none; width:20px; height:20px; border-radius:var(--r-xs); background:rgba(124,58,237,.12); color:#7C3AED;
    font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .btn { appearance:none; border:none; cursor:pointer; font-family:inherit; width:100%; padding:12px 16px; border-radius:var(--r-sm);
    font-size:14px; font-weight:900; color:#fff; background:var(--grad-p);
    box-shadow:var(--sh-btn); transition:all .25s cubic-bezier(.19,1,.22,1); }
  .btn:hover { transform:translateY(-1px); box-shadow:var(--sh-btn-hover); }
  .btn.ghost { background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(236,72,153,.07)); color:#7C3AED; border:1.5px solid rgba(124,58,237,.3); box-shadow:none; }

  /* toast */
  #toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px); z-index:10000;
    background:rgba(15,23,42,.86); color:#fff; padding:12px 20px; border-radius:var(--r-sm); font-size:13.5px; font-weight:700;
    opacity:0; pointer-events:none; transition:all .35s cubic-bezier(.19,1,.22,1); backdrop-filter:blur(10px);
    box-shadow:0 14px 30px -8px rgba(15,23,42,.5); max-width:86vw; text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* 视图切换 */
  .view { display:none; }
  .view.on { display:block; animation:fade .4s ease; }
  @keyframes fade { from{opacity:0;transform:translateY(8px);} }

  /* ── 学生身份 ── */
  .who { display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:var(--r-pill);
    background:linear-gradient(135deg,rgba(16,185,129,.14),rgba(16,185,129,.06)); border:1.5px solid rgba(16,185,129,.35);
    color:#047857; font-size:13px; font-weight:800; cursor:pointer; transition:all .22s; }
  .who:hover { transform:translateY(-1px); box-shadow:0 8px 16px -8px rgba(16,185,129,.5); }
  .who .w-sm { content:""; width:12px; height:12px; border-radius:50%; background:linear-gradient(135deg,#10B981,#7C3AED); display:inline-block; }
  .who.req { background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(236,72,153,.08)); border-color:rgba(124,58,237,.4); color:#6d28d9; }
  .who.req .w-sm { background:linear-gradient(135deg,#7C3AED,#EC4899); }

  /* ── 姓名弹窗 ── */
  #nameGate { position:fixed; inset:0; z-index:10001; display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(233,236,245,.72); backdrop-filter:blur(10px); }
  #nameGate.hide { display:none; }
  .gate-card { width:100%; max-width:400px; background:#fff; border-radius:var(--r-xl); padding:34px 28px; text-align:center;
    box-shadow:var(--sh-2); border:1px solid rgba(0,0,0,.08); }
  .gate-card .gb { font-weight:900; font-size:25px; letter-spacing:-.03em; margin-bottom:6px;
    background:var(--noise),linear-gradient(135deg,#1e1b4b,#7C3AED); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .gate-card p { font-size:12.5px; color:#64748b; font-weight:600; margin:6px 0 16px; line-height:1.7; }
  .gate-card input[type=text] { width:100%; font-family:inherit; font-size:16px; font-weight:800; color:#1e1b4b; text-align:center;
    padding:13px 14px; border-radius:var(--r-sm); border:1.5px solid rgba(0,0,0,.12); margin-bottom:14px; outline:none; }
  .gate-card input:focus { border-color:var(--p); box-shadow:var(--ring); }
  .gate-card .btn { width:100%; }
  .err { color:#be185d; font-size:12px; font-weight:800; margin-top:10px; min-height:16px; }

  /* ── 单元任务面板 ── */
  .taskzone { margin:6px 0 22px; display:flex; flex-direction:column; gap:14px; }
  .task-card { border-radius:var(--r-lg); padding:18px 20px; }
  .task-card.t-pre { background:linear-gradient(170deg,rgba(16,185,129,.14),rgba(16,185,129,.04)); border:1.5px solid rgba(16,185,129,.30); }
  .task-card.t-rev { background:linear-gradient(170deg,rgba(236,72,153,.12),rgba(236,72,153,.04)); border:1.5px solid rgba(236,72,153,.26); }
  .task-card .t-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .task-card .t-badge { font-weight:900; font-size:14px; }
  .t-pre .t-badge { color:#047857; } .t-rev .t-badge { color:#be185d; }
  .task-card .t-deadline { font-size:12px; font-weight:800; color:#64748b; margin-left:auto; }
  .task-card .t-deadline.late { color:#be185d; }
  .task-card .t-items { display:flex; flex-wrap:wrap; gap:9px; margin-top:13px; }
  .t-item { display:inline-flex; align-items:center; gap:8px; padding:9px 13px; border-radius:var(--r-sm); background:#fff;
    border:1.5px solid rgba(0,0,0,.07); cursor:pointer; transition:all .2s; }
  .t-item:hover { transform:translateY(-2px); border-color:#7C3AED; box-shadow:0 10px 20px -12px rgba(124,58,237,.5); }
  .t-item .ti-ico { font-size:16px; }
  .t-item .ti-body { display:flex; flex-direction:column; }
  .t-item .ti-title { font-weight:800; font-size:13px; color:#1e1b4b; line-height:1.25; }
  .t-item .ti-sub { font-size:10.5px; font-weight:700; color:#94a3b8; }
  .t-item .ti-mk { appearance:none; border:none; cursor:pointer; margin-left:2px; width:24px; height:24px; border-radius:50%;
    background:rgba(15,23,42,.06); color:transparent; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; transition:all .3s; }
  .t-item.done .ti-mk { background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; box-shadow:0 4px 12px -3px rgba(34,197,94,.6); }
  .t-item .ti-mk:hover { transform:scale(1.08); }
  .t-item .ti-voc { font-size:10px; font-weight:800; color:#16a34a; }
  .task-meta { font-size:11.5px; color:#94a3b8; font-weight:700; margin-top:11px; }
  .task-none { font-size:12px; color:#94a3b8; font-weight:700; padding:2px 4px; }

  /* ── 沉浸式任务流 ── */
  .tz-hero{ position:relative; overflow:hidden; border-radius:var(--r-lg); padding:20px 20px 16px; color:#fff;
    background:linear-gradient(135deg,#312e81 0%,#4c1d95 46%,#0e7490 100%); border:1px solid rgba(255,255,255,.12);
    box-shadow:0 22px 44px -24px rgba(49,46,129,.75); }
  .tz-hero::before{ content:""; position:absolute; right:-70px; top:-70px; width:240px;height:240px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), transparent 70%); }
  .tz-hero::after{ content:""; position:absolute; left:-40px; bottom:-70px; width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle at 60% 40%, rgba(124,58,237,.55), transparent 70%); }
  .tz-hero-in{ position:relative; z-index:1; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .tz-day{ flex:1; min-width:190px; }
  .tz-kicker{ font-size:11px; letter-spacing:.18em; font-weight:800; color:#c4b5fd; }
  .tz-title{ font-size:22px; font-weight:900; margin:3px 0 2px; letter-spacing:-.02em; text-shadow:0 2px 8px rgba(0,0,0,.2); }
  .tz-sub{ font-size:12.5px; color:#d9d2f7; font-weight:600; }
  .tz-ring{ flex:none; width:86px; height:86px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.25)); }

  /* 上报：name / unit / type(preview|review) / itemId / 'start'|'done'
     itemId 约定：主题词='theme'，篇章='<passageKey>'；词汇项自动读取词汇 records 判定 */
  function report(name, unit, type, itemId, action){
    if(!name) return;
    var R = loadJ(RKEY, {});
    (R[name] = R[name] || {})[unit] = (R[name][unit] || {});
    var su = R[name][unit];
    (su[type] = su[type] || {})[itemId] = (su[type][itemId] || {});
    var rec = su[type][itemId];
    if(action==='start' && !rec.startedAt){ rec.startedAt = nowTs(); }
    if(action==='done'){ rec.doneAt = nowTs(); }
    if(action==='undone'){ delete rec.doneAt; }
    try{ localStorage.setItem(RKEY, JSON.stringify(R)); }catch(e){}
  }
  function getReport(name, unit, type, itemId){
    var R = loadJ(RKEY, {});
    var st = (R[name] && R[name][unit] && R[name][unit][type] && R[name][unit][type][itemId]) || {};
    return st;
  }
  /* 词汇完成度：读 `<passageKey>_records_v2`，known/mastered 判掌握 */
  function vocabProgress(key){
    var d={total:0,done:0,pct:0,has:false};
    try{
      var raw=localStorage.getItem(key+'_records_v2')||localStorage.getItem(key+'_records_v1');
      if(!raw) return d;
      var obj=JSON.parse(raw), karr=Object.keys(obj);
      d.total=karr.length; d.has=karr.length>0;
      var c=0; karr.forEach(function(k2){ var s=obj[k2]&&obj[k2].status; if(s==='known'||s==='mastered') c++; });
      d.done=c; d.pct=d.total?Math.round(c/d.total*100):0;
      return d;
    }catch(e){ return d; }
  }
  function findPassageMeta(key){ for(var u in PASSAGES){ var f=PASSAGES[u].find(function(p){return p.key===key;}); if(f) return f; } return null; }

    if(!wants.length) return '';
    var vp = it.engines.indexOf('vocab')!==-1 ? vocabProgress(it.passageKey) : null;
    var vocTxt = (vp && vp.has) ? '<span class="ti-voc" style="margin-left:2px;">词·已掌握 '+vp.done+'/'+vp.total+'</span>' : '';
    var fp = followProg(pgOfKey(it.passageKey));

  /* ── 单元任务面板（教师工作台发放的预习/复习） ── */
  function renderTaskZone(unitKey){
    var zone = document.getElementById('taskzone');
    var A = loadJ(AKEY, {});
    var u = A[unitKey];
    var name = getStudent();
    function isDone(it, type){
      var id = it.id || (it.kind==='theme' ? 'theme' : it.passageKey);
      if(getReport(name, unitKey, type, id).doneAt) return true;
      if(it.kind==='passage' && it.engines.indexOf('follow')!==-1 && followProg(pgOfKey(it.passageKey)).follow) return true;
      if(it.kind==='passage' && it.engines.indexOf('vocab')!==-1){ var v=vocabProgress(it.passageKey); if(v.has && v.pct>=100) return true; }
      return false;
    }
    var P=(u&&u.preview)||{}, R=(u&&u.review)||{};
    var pI=(P.items)||[], rI=(R.items)||[];
    if(!pI.length && !rI.length){
      zone.innerHTML = '<div class="tz-empty"><span class="ic">'+ICON('inbox')+'</span>本单元暂无任务<span>老师还没有为本单元发放预习 / 复习任务，你可以自由浏览下方材料。</span></div>';
      return;
    }
    var groups = [
      { type:'preview', items:pI, dl:P.deadline||'' },
      { type:'review', items:rI, dl:R.deadline||'' }
    ];
    var totItems=0, totDone=0;
    groups.forEach(function(g){ totItems+=g.items.length; totDone+=g.items.filter(function(it){return isDone(it,g.type);}).length; });
    var totPct = totItems ? Math.round(totDone/totItems*100) : 0;
    var allDone = totItems>0 && totDone>=totItems;
    var preDone = groups[0].items.length>0 && groups[0].items.every(function(it){return isDone(it,'preview');});
    var revDone = groups[1].items.length>0 && groups[1].items.every(function(it){return isDone(it,'review');});
    var today=new Date();
    var dateTxt=(today.getMonth()+1)+'月'+today.getDate()+'日 · '+['周日','周一','周二','周三','周四','周五','周六'][today.getDay()];
    var ringTxt = totPct>=100 ? '100%' : totPct+'%';

    function stage(g){
      if(!g.items.length) return '';
      var dlTs = g.dl ? new Date(g.dl.replace('T',' ')).getTime() : 0;
      var late = dlTs && nowTs()>dlTs;
      var done = g.items.filter(function(it){ return isDone(it,g.type); }).length;
      var pct = Math.round(done/g.items.length*100);
      var chip = g.dl
        ? (late ? '<span class="tz-chip late">'+ICON('calendar','sm')+' 已过 · '+esc(g.dl.replace('T',' '))+'</span>' : '<span class="tz-chip">'+ICON('calendar','sm')+' 截止 '+esc(g.dl.replace('T',' '))+'</span>')
        : '';
      var isPre = g.type==='preview';
      var rows='';
      g.items.forEach(function(it){
        var doneThis = isDone(it,g.type);
        var id = it.id || (it.kind==='theme' ? 'theme' : it.passageKey);
        var mark = '<button class="tz-mark'+(doneThis?' done':'')+'" data-u="'+unitKey+'" data-t="'+g.type+'" data-id="'+id+'" data-mark="1" title="标记完成">'+ICON('check','sm')+'</button>';
        if(it.kind==='theme'){
          rows += '<div class="tz-row'+(doneThis?' done':'')+'" data-u="'+unitKey+'" data-t="'+g.type+'">'
            + '<span class="i-ic">'+ICON('folder')+'</span>'
            + '<span class="i-bd"><span class="i-tl">'+esc(THEME_TITLE[unitKey]||'单元主题词汇')+'<span class="m">主题</span></span><span class="i-st">词汇卡片 · 发音 · 释义</span></span>'
            + '<span class="i-cta">'+(doneThis?'已完成':'开始 '+ICON('play','sm'))+'</span>'
            + mark + '</div>';
          return;
        }
        var meta = findPassageMeta(it.passageKey);
        var title = meta ? (meta.kind+' · '+meta.title) : it.passageKey;
        var wants=[];
        if(it.engines.indexOf('vocab')!==-1)  wants.push({mode:'vocab',  ico:ICON('book','sm'), lab:'词汇 · 诊断学习'});
        if(it.engines.indexOf('follow')!==-1) wants.push({mode:'follow', ico:ICON('sound','sm'), lab:'跟读 · 听读写'});
        wants.forEach(function(w){
          var vp = w.mode==='vocab' ? vocabProgress(it.passageKey) : null;
          var fp = w.mode==='follow' ? followProg(pgOfKey(it.passageKey)) : null;
          var extra='';
          if(vp && vp.has) extra='<b> 词·已掌握 '+vp.done+'/'+vp.total+'</b>';
          if(fp && fp.follow) extra='<b> 跟读·已完成</b>';
          rows += '<div class="tz-row'+(doneThis?' done':'')+'" data-u="'+unitKey+'" data-t="'+g.type+'" data-id="'+id+'" data-mode="'+w.mode+'" data-kind="passage">'
            + '<span class="i-ic">'+w.ico+'</span>'
            + '<span class="i-bd"><span class="i-tl">'+esc(title)+'<span class="m">'+(w.mode==='vocab'?'词汇':'跟读')+'</span></span><span class="i-st">'+esc(w.lab)+extra+'</span></span>'
            + '<span class="i-cta">'+(doneThis?'已完成':'开始 '+ICON('play','sm'))+'</span>'
            + mark + '</div>';
        });
      });
      return '<div class="tz-stage '+(isPre?'tre':'trev')+'"'+(isPre?'':' id="tzReview"')+'>'
        + '<div class="tz-sh"><span class="ico-box">'+ICON(isPre?'book':'loop')+'</span>'
        + '<span class="tz-sh-t"><b>'+(isPre?('预习任务'+(preDone?' · 已完成':'')):'复习任务')+'</b><span>'+(isPre?'上课前 · 认识生词、初听原文':'课后 · 测试掌握、练熟跟读')+'</span></span>'
        + chip + '</div>'
        + '<div class="tz-bar"><i style="width:'+pct+'%"></i></div>'
        + '<div class="tz-rows">'+rows+'</div></div>';
    }

    /* 预习全部完成：有复习任务 → 全屏引导；无复习任务 → 轻提示条 */
    var bridge='', guideOn=false;
    if(preDone && !revDone){
      if(groups[1].items.length){
        var seen=false; try{ seen=!!sessionStorage.getItem('tf_guide_'+unitKey); }catch(e){}
        guideOn=!seen;
      } else {
        bridge='<div class="bridge"><span class="b-ic">'+ICON('star')+'</span><span class="b-t"><b>预习任务已完成！</b><span>本单元老师暂未布置复习任务，可以自由巩固下方材料。</span></span></div>';
      }
    }

    zone.innerHTML =
      '<div class="tz-hero"><div class="tz-hero-in">'
      + '<div class="tz-day"><div class="tz-kicker">TH!NK · 今日学习</div>'
      + '<div class="tz-title">'+(allDone?'全部完成 '+ICON('star','sm'):'预习 · 复习')+'</div>'
      + '<div class="tz-sub">'+esc(dateTxt)+' · 本单元布置的任务</div></div>'
      + '<div class="tz-ring"><svg width="86" height="86" viewBox="0 0 92 92">'
      + '<circle cx="46" cy="46" r="34" class="rp" stroke="rgba(255,255,255,.18)"/>'
      + '<circle cx="46" cy="46" r="34" class="rp" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="'+(213.6*(1-totPct/100)).toFixed(1)+'" transform="rotate(-90 46 46)"/>'
      + '<text x="46" y="51" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" stroke="none">'+ringTxt+'</text>'
      + '<text x="46" y="66" text-anchor="middle" font-size="10" font-weight="700" fill="rgba(255,255,255,.85)" stroke="none">'+totDone+'/'+totItems+'</text>'
      + '</svg></div>'
      + '<div class="tz-msg">'+(allDone?'所有预习与复习任务都完成了，很棒！':'完成预习与复习任务，跟着提示一步步学，打开材料即自动记录。')+'</div>'
      + '</div></div>'
      + bridge
      + stage(groups[0])
      + stage(groups[1]);

    /* 全屏引导：仅在尚未展示时创建，避免重复渲染重播动画 */
    if(guideOn && !document.getElementById('tzGuide')){
      var gEl=document.createElement('div');
      gEl.className='guide'; gEl.id='tzGuide';
      gEl.innerHTML='<div class="guide-card"><div class="guide-in">'
        + '<div class="guide-badge">'+ICON('star')+'</div>'
        + '<div class="guide-kicker">PREVIEW COMPLETE · 预习通关</div>'
        + '<div class="guide-title">预习任务已完成！</div>'
        + '<div class="guide-sub">生词与初读都过关了。趁热打铁进入复习，测一测真正掌握了多少。</div>'
        + '<div class="guide-steps"><span class="guide-step ok">'+ICON('book','sm')+' 预习 '+ICON('check','sm')+'</span><span class="guide-arrow">'+ICON('right','sm')+'</span><span class="guide-step">'+ICON('loop','sm')+' 复习</span></div>'
        + '<div class="guide-btns"><button class="guide-go" id="tzGuideGo">进入复习任务 '+ICON('right','sm')+'</button><button class="guide-later" id="tzGuideLater">稍后再说</button></div>'
        + '</div></div>';
      document.body.appendChild(gEl);
      requestAnimationFrame(function(){ gEl.classList.add('on'); });
      var onEsc=function(e){ if(e.key==='Escape') closeG(); };
      var closeG=function(){
        document.removeEventListener('keydown', onEsc);
        try{ sessionStorage.setItem('tf_guide_'+unitKey,'1'); }catch(e){}
        gEl.classList.remove('on');
        setTimeout(function(){ if(gEl.parentNode) gEl.parentNode.removeChild(gEl); }, 320);
      };
      var gGo=document.getElementById('tzGuideGo'), gLater=document.getElementById('tzGuideLater');
      if(gGo) gGo.addEventListener('click', function(){
        closeG();
        var rv=zone.querySelector('#tzReview');
        if(rv){ rv.scrollIntoView({behavior:'smooth', block:'center'}); rv.classList.add('jump'); setTimeout(function(){ rv.classList.remove('jump'); }, 3400); }
      });
      if(gLater) gLater.addEventListener('click', closeG);
      gEl.addEventListener('click', function(e){ if(e.target===gEl) closeG(); });
      document.addEventListener('keydown', onEsc);
    }

    zone.querySelectorAll('.tz-row[data-mode]').forEach(function(row){
      row.addEventListener('click', function(e){
        if(e.target.closest('.tz-mark')) return;
        launchTaskMaterial(row.dataset.u, row.dataset.t, { id:row.dataset.id, passageKey:row.dataset.id, mode:row.dataset.mode, kind:row.dataset.kind||'passage' });
      });
    });
    zone.querySelectorAll('.tz-row').forEach(function(row){
      if(row.dataset.mode) return;
      row.addEventListener('click', function(e){
        if(e.target.closest('.tz-mark')) return;
        launchTaskMaterial(unitKey, row.dataset.t, { id:'theme', passageKey:'theme', mode:'theme', kind:'theme' });
      });
    });
    zone.querySelectorAll('.tz-mark').forEach(function(m){
      m.addEventListener('click', function(e){
        e.stopPropagation();
        var name2 = getStudent(); if(!name2){ showNameGate(); return; }
        var rec = getReport(name2, m.dataset.u, m.dataset.t, m.dataset.id);
        if(rec.doneAt){ report(name2, m.dataset.u, m.dataset.t, m.dataset.id, 'undone'); toast('已取消完成标记'); }
        else { report(name2, m.dataset.u, m.dataset.t, m.dataset.id, 'done'); toast('已标记完成'); }
        renderTaskZone(m.dataset.u);
      });
    });
  }

  /* ── 身份 ── */
  var whoBtn=document.getElementById('whoBtn'), whoName=document.getElementById('whoName'), nameGate=document.getElementById('nameGate');
  function refreshWho(){
    var n = getStudent();
    if(n){ whoName.textContent = n; whoBtn.classList.remove('req'); whoBtn.title='当前学生，点击切换'; }
    else { whoName.textContent = '填写姓名'; whoBtn.classList.add('req'); whoBtn.title='请先填写姓名'; }
  }
  function showNameGate(){
    nameGate.classList.remove('hide');
    document.getElementById('gateHint').textContent = getStudent()
      ? '切换为另一位同学学习。输入新姓名后，进度将按新姓名记录。'
      : '请输入你的姓名，用于记录预习 / 复习进度。老师可在教师工作台查看你的完成情况。';
    var inp = document.getElementById('nameInput'); inp.value=''; document.getElementById('nameErr').textContent='';
    setTimeout(function(){ inp.focus(); }, 60);
  }
  function hideNameGate(){ nameGate.classList.add('hide'); }
  function confirmName(){
    var v = document.getElementById('nameInput').value.trim();
    if(!v){ document.getElementById('nameErr').textContent='请输入姓名'; return; }
    setStudent(v); hideNameGate(); refreshWho();
    toast(v+' 同学，开始学习吧');
  }
  var setStudent = function(n){ try{ localStorage.setItem(STUKEY, n); }catch(e){} };
  whoBtn.addEventListener('click', function(){
    if(!getStudent()){ showNameGate(); return; }
    if(confirm('退出当前账号并返回登录页？')) logout();
  });
  document.getElementById('nameOk').addEventListener('click', confirmName);
  document.getElementById('nameInput').addEventListener('keydown', function(e){ if(e.key==='Enter') confirmName(); });

  /* ── 返回 ── */
  document.getElementById('unitBack').addEventListener('click', function(){ showView('home'); });
  document.getElementById('pgBack').addEventListener('click', function(){ if(currentUnit) openUnit(currentUnit); else showView('home'); });
  function findUnitPage(key){ return key; }
  document.getElementById('welcomeBtn').addEventListener('click', function(){
    var s = loadState(); if(!s.welcome){ s.welcome=true; saveState(s); }
    toast('Welcome 入门单元正在筹备中');
  });
  document.getElementById('teacherLink').addEventListener('click', function(){ window.open('教师端.html','_blank'); });

  refreshWho();
  renderShelf();
  showView('home');
  autoOpenUnit();
  if(!localStorage.getItem('tf_token')){
    setTimeout(function(){ location.href='/login.html'; }, 350);
  } else if(!accountName()){
    setTimeout(showNameGate, 300);
  }
})();
</script>
<script src="/store.js"></script></body>
</html>
